<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24강 요소별 글자 크기·자간 조절</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slide-style.css?v=20260811redesign4">
<style id="tune"></style>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',sans-serif;background:#0c0c0f;color:#eee;-webkit-font-smoothing:antialiased;display:flex;height:100vh;overflow:hidden}

  .sidebar{width:352px;flex-shrink:0;height:100vh;overflow-y:auto;background:#111;border-right:1px solid #222;padding:14px 14px 60px}
  .sidebar h1{font-size:14px;font-weight:800;margin-bottom:4px}
  .sidebar h1 span{color:#FF6B3D}
  .sidebar .note{font-size:11px;color:#888;line-height:1.5;margin-bottom:10px}
  .grp{font-size:11px;font-weight:800;color:#FF6B3D;letter-spacing:.04em;margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid #2a2a2a}
  .sl{display:flex;align-items:center;gap:8px;font-size:12px;color:#ccc;margin-bottom:5px}
  .sl label{width:92px;flex-shrink:0;color:#bbb;font-size:11.5px}
  .sl input[type=range]{flex:1;min-width:56px}
  .sl .v{width:48px;text-align:right;font-weight:700;color:#FF6B3D;font-size:11px}
  .bar{position:sticky;top:0;background:#111;padding-bottom:8px;z-index:2;border-bottom:1px solid #222}
  .modes{display:flex;gap:6px;margin:8px 0 6px}
  .sbtn{background:#1e1e1e;border:1px solid #333;border-radius:7px;padding:6px 12px;font-size:11.5px;color:#eee;font-family:inherit;cursor:pointer}
  .sbtn:hover{background:#2a2a2a}
  .sbtn.active{background:#fff;color:#111;font-weight:800}
  .gls{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#ccc;margin-top:4px}
  .gls label{width:92px;color:#bbb}
  .gls .v{width:48px;text-align:right;font-weight:700;color:#7fd1ff}
  #dump{font-size:10.5px;color:#888;margin-top:8px;word-break:break-all;line-height:1.5}

  .stage{flex:1;height:100vh;overflow-y:auto;padding:22px 24px 90px}
  .frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;margin-bottom:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);background:#000}
  .frame > .slide{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;transform:scale(var(--s,0.5))}
  .flabel{font-size:12px;color:#8a8a8a;margin:2px 2px 6px}
</style>
</head>
<body>

<div class="sidebar">
  <div class="bar">
    <h1><span>24강</span> 요소별 크기·자간</h1>
    <div class="note">모드를 고르면 아래 요소 슬라이더가 그 값을 조절해요. 원하는 값 알려주시면 반영할게요.</div>
    <div class="modes"><button class="sbtn active" data-m="size">글자 크기</button><button class="sbtn" data-m="ls">자간</button>
      <button class="sbtn" id="reset" style="margin-left:auto">초기값</button></div>
    <div class="gls"><label>전역 자간</label><input type="range" id="gls" min="-150" max="50" step="5"><span class="v" id="glsv"></span></div>
    <div id="dump"></div>
  </div>
  <div id="sliders"></div>
</div>

<div class="stage" id="stage"></div>

<script src="slide-render.js?v=20260811redesign4"></script>
<script src="_preview_fontsize_data.js"></script>
<script>
  const D=window.PREVIEW_DATA, root=document.documentElement, s=D.design, setv=(k,v)=>root.style.setProperty(k,v);
  setv('--navy',s.navy);setv('--red',s.red);setv('--bg',s.bg);setv('--slide-bg',s.slideBg);setv('--row-bg',s.rowBg);setv('--text',s.text);
  setv('--label',s.navy);setv('--accent',s.red);setv('--ink',s.text);
  setv('--think-guide-color',s.thinkGuideColor||'#6b675e');setv('--badge-color',s.badgeColor||'#27384F');
  const lh=s.lineHeights||{};setv('--lh-body',lh.body??1.6);setv('--lh-label',lh.label??1.6);setv('--lh-obj',lh.obj??2);setv('--lh-question',lh.think??1.6);setv('--lh-think-guide',lh.thinkGuide??1.6);
  let gLs=(s.letterSpacing??-5)/100; setv('--ls-global',gLs+'em'); setv('--tw-global',(s.textWidth??95)/100);
  const F=Object.assign({bodyMission:s.fonts.body},s.fonts);
  setv('--fs-slide-title',F.title+'px');setv('--fs-body',F.body+'px');setv('--fs-body-mission',F.bodyMission+'px');
  setv('--fs-label',F.label+'px');setv('--fs-obj',F.obj+'px');setv('--fs-cover-title',F.cover+'px');
  setv('--fs-cover-tagline',F.coverTagline+'px');setv('--fs-cover-meta',F.coverMeta+'px');setv('--fs-question',F.think+'px');setv('--fs-think-guide',F.thinkGuide+'px');

  const LESSON=D.content.lesson, slides=SlideRender.buildSlidesFromData(D.content), stage=document.getElementById('stage');
  const TL={cover:'표지',chosung:'초성 퀴즈',dive:'Opening Question',objectives:'학습 목표',concept:'개념 Check',mission:'미션 Check',think:'생각 Check',image:'이미지',fullimage:'전면 이미지',video:'영상'};
  slides.forEach((sl,i)=>{ const w=document.createElement('div');
    w.innerHTML=`<div class="flabel">${i+1}. ${TL[sl.type]||sl.type}</div><div class="frame">${SlideRender.renderSlideHTML(sl,LESSON)}</div>`;
    stage.appendChild(w); w.querySelector('.slide').dataset.type=sl.type; });
  document.body.dataset.mode='complete';

  const SPECS=[
    ['표지',[['필기체','.cover-script'],['태그라인','.cover-tagline'],['제목','.cover-title'],['강 숫자','.cover-num'],['단원·쪽','.cover-meta']]],
    ['Opening Question',[['배지','[data-type=dive] .check-badge'],['kicker','.dive-kicker'],['질문','.dive-q'],['안내','.dive-guide']]],
    ['학습 목표',[['제목','.slide-objectives .slide-title'],['번호','.slide-objectives .obj-num'],['텍스트','.slide-objectives .obj-text']]],
    ['초성 퀴즈',[['제목','.slide-chosung .slide-title'],['번호','.slide-chosung .obj-num'],['텍스트','.slide-chosung .obj-text']]],
    ['개념 Check',[['배지','[data-type=concept] .check-badge'],['제목','[data-type=concept] .slide-title'],['라벨','[data-type=concept] .row-label'],['본문','[data-type=concept] .row-content p']]],
    ['미션 Check',[['배지','[data-type=mission] .check-badge'],['제목','[data-type=mission] .slide-title'],['라벨','[data-type=mission] .row-label'],['본문','[data-type=mission] .row-content p']]],
    ['연표·비교·사료·플로우',[['연표 연도','.tl-year, .tlv-memo'],['연표 텍스트','.tl-text, .tlv-content p'],['비교 헤더','.cmp-head'],['비교 본문','.cmp-body p'],['사료 소제목','.qt-subtitle'],['사료 본문','.qt-text'],['사료 출처','.qt-src'],['플로우 라벨','.fl-stage-label'],['플로우 본문','.fl-stage-text'],['이미지 캡션','.grid-img-caption, .clayout-caption']]],
    ['생각 Check',[['질문','.think-question'],['안내','.think-guide']]],
  ];

  let mode='size';
  const sizeOv={}, lsOv={}; // sel -> px , sel -> em
  const rows=[]; // {sel, cur, range, vspan}

  function scoped(sel){ return sel.split(',').map(x=>'.frame '+x.trim()).join(','); }
  function buildTune(){
    const sels=new Set([...Object.keys(sizeOv),...Object.keys(lsOv)]);
    let css='';
    sels.forEach(sel=>{ const p=[];
      if(sel in sizeOv) p.push(`font-size:${sizeOv[sel]}px !important`);
      if(sel in lsOv)   p.push(`letter-spacing:${lsOv[sel]}em !important`);
      css+=scoped(sel)+`{${p.join(';')}}\n`; });
    document.getElementById('tune').textContent=css;
  }
  function fmt(sel){ const p=[]; if(sel in sizeOv)p.push(sizeOv[sel]+'px'); if(sel in lsOv)p.push(lsOv[sel]+'em'); return p.join('/'); }
  function updateDump(){ const f=[]; SPECS.forEach(([g,it])=>it.forEach(([lab,sel])=>{ if(sel in sizeOv||sel in lsOv) f.push(lab+' '+fmt(sel)); }));
    document.getElementById('dump').textContent=f.length?('바뀜 — '+f.join(', ')):'(변경 없음)'; }

  const slidersEl=document.getElementById('sliders');
  SPECS.forEach(([group,items])=>{
    const found=items.filter(([lab,sel])=>stage.querySelector(sel.split(',')[0].trim()));
    if(!found.length)return;
    const h=document.createElement('div');h.className='grp';h.textContent=group;slidersEl.appendChild(h);
    found.forEach(([lab,sel])=>{
      const el=stage.querySelector(sel.split(',')[0].trim());
      const cur=Math.round(parseFloat(getComputedStyle(el).fontSize));
      const row=document.createElement('div');row.className='sl';
      row.innerHTML=`<label title="${sel}">${lab}</label><input type="range"><span class="v"></span>`;
      const range=row.querySelector('input'),vspan=row.querySelector('.v');
      const R={sel,cur,range,vspan}; rows.push(R);
      range.addEventListener('input',()=>{
        if(mode==='size'){ sizeOv[sel]=+range.value; vspan.textContent=range.value+'px'; }
        else{ const em=+range.value/1000; lsOv[sel]=em; vspan.textContent=em.toFixed(3)+'em'; }
        buildTune(); updateDump();
      });
      slidersEl.appendChild(row);
    });
  });
  function syncRows(){
    rows.forEach(R=>{
      if(mode==='size'){ R.range.min=8; R.range.max=Math.max(120,R.cur*2); R.range.step=1;
        const v=(R.sel in sizeOv)?sizeOv[R.sel]:R.cur; R.range.value=v; R.vspan.textContent=v+'px'; }
      else{ R.range.min=-150; R.range.max=50; R.range.step=5;
        const em=(R.sel in lsOv)?lsOv[R.sel]:gLs; R.range.value=Math.round(em*1000); R.vspan.textContent=em.toFixed(3)+'em'; }
    });
  }
  syncRows(); updateDump();

  document.querySelectorAll('.modes .sbtn[data-m]').forEach(b=>b.addEventListener('click',()=>{
    mode=b.dataset.m; document.querySelectorAll('.modes .sbtn[data-m]').forEach(x=>x.classList.toggle('active',x===b)); syncRows();
  }));
  const gls=document.getElementById('gls'),glsv=document.getElementById('glsv');
  gls.value=Math.round(gLs*1000); glsv.textContent=gLs.toFixed(3)+'em';
  gls.addEventListener('input',()=>{ gLs=+gls.value/1000; setv('--ls-global',gLs+'em'); glsv.textContent=gLs.toFixed(3)+'em'; if(mode==='ls') syncRows(); });

  document.getElementById('reset').addEventListener('click',()=>{
    for(const k in sizeOv)delete sizeOv[k]; for(const k in lsOv)delete lsOv[k]; buildTune(); syncRows(); updateDump();
  });

  function rescale(){ const w=stage.clientWidth-48; setv('--s',(w/1920).toFixed(4)); }
  rescale(); window.addEventListener('resize',rescale);
</script>
</body>
</html>
