<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표지 무빙포스터 — E4 레터 스플릿</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Sacramento&family=Caveat:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-style:normal;}
  @font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-style:normal;}

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#12151C; --fg:#F4F1E8; --accent:#FF6B3D; --script:#F4F1E8;
    --script-font:'Great Vibes', cursive; --script-op:0.12;
  }
  html,body{font-family:'Pretendard',-apple-system,sans-serif;background:#0c0c0f;color:#eee;-webkit-font-smoothing:antialiased}

  .ctrl{position:sticky;top:0;z-index:50;background:#111;color:#fff;padding:12px 18px;box-shadow:0 2px 14px rgba(0,0,0,.5)}
  .ctrl h1{font-size:14px;font-weight:800;margin-bottom:10px;letter-spacing:.3px}
  .ctrl h1 span{color:#FF6B3D}
  .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
  .row .rlabel{font-size:12px;color:#bbb;width:56px;flex-shrink:0;font-weight:700}
  .pick{width:24px;height:24px;border-radius:50%;cursor:pointer;position:relative;border:2px solid #222;transition:transform .1s}
  .pick:hover{transform:scale(1.14)}
  .pick.sel{border-color:#fff;box-shadow:0 0 0 2px #111 inset,0 0 0 3px #fff}
  .pick.sel::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;text-shadow:0 0 3px rgba(0,0,0,.9)}
  .sbtn{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:6px 11px;font-size:12px;color:#eee;font-family:inherit;cursor:pointer;transition:.15s}
  .sbtn:hover{background:#2a2a2a}
  .sbtn.active{background:#fff;color:#111;font-weight:700}
  .opts{display:flex;gap:16px;align-items:center;font-size:12px;color:#ccc;margin-top:4px;flex-wrap:wrap}
  .opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
  .cur{font-size:11px;color:#888;margin-left:auto}

  .stage{max-width:1080px;margin:0 auto;padding:30px 20px 90px}

  /* ══════════ 표지 ══════════ */
  .poster{
    position:relative;container-type:inline-size;aspect-ratio:16/9;width:100%;
    overflow:hidden;border-radius:16px;isolation:isolate;color:var(--fg);
    background:radial-gradient(120% 120% at 50% 40%, color-mix(in srgb, var(--bg) 88%, #fff 4%) 0%, var(--bg) 55%, color-mix(in srgb, var(--bg) 70%, #000) 100%);
    box-shadow:0 18px 55px rgba(0,0,0,.5);
  }
  .poster::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(130% 130% at 50% 50%, transparent 56%, rgba(0,0,0,.42) 100%)}

  /* 정중앙 필기체 — 여러 줄로 화면 가득 */
  .script{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-family:var(--script-font);color:var(--script);opacity:var(--script-op);
    white-space:nowrap;text-align:center;pointer-events:none;user-select:none;z-index:0;font-weight:400;
  }
  .poster.lines2 .script{font-size:24cqw;line-height:.92}
  .poster.lines3 .script{font-size:20cqw;line-height:1}

  .sweep{position:absolute;inset:-25% -45%;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.55;
    background:radial-gradient(closest-side, color-mix(in srgb, var(--accent) 45%, transparent) 0%, transparent 72%);
    animation:sweep 8s ease-in-out infinite}
  @keyframes sweep{0%{transform:translate(-42%,-8%)}50%{transform:translate(45%,10%)}100%{transform:translate(-42%,-8%)}}

  .fg{position:absolute;inset:0;padding:6cqw 8cqw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:3}
  .tagline{font-family:'Gowun Batang',serif;font-size:2.4cqw;letter-spacing:.04em;opacity:.7;margin-bottom:2cqw}
  .title{font-family:'Paperlogy';font-weight:900;font-size:11cqw;line-height:1.04;letter-spacing:-.015em;position:relative}
  .title em{font-style:normal;color:var(--accent)}
  .meta{font-family:'Gowun Batang',serif;font-size:2.1cqw;opacity:.56;margin-top:2.4cqw}
  .meta b{opacity:.85;font-weight:700}
  /* 강 숫자 — "29강" 한 덩어리, 크기 통일 */
  .num{position:absolute;top:5cqw;right:6cqw;z-index:3;font-family:'Paperlogy';font-weight:900;
    font-size:5cqw;line-height:1;color:var(--accent);letter-spacing:-.03em}

  /* ═════ E4. 레터 스플릿 — 대기: 제목 보임(뒤 반짝임만). →1회: 스플릿 재생, →2회: 다음 페이지 ═════ */
  /* 대기(기본): 제목 두 줄이 중앙에 그대로 노출 */
  .title .t1{display:block;transform:translateX(0);opacity:1}
  .title .t2{display:block;transform:translateX(0);opacity:1}
  /* play: 좌·우에서 밀려들어와 중앙에서 다시 합쳐지는 연출 재생 */
  .poster.play .t1{animation:inLeft .95s cubic-bezier(.16,.85,.3,1)}
  .poster.play .t2{animation:inRight .95s cubic-bezier(.16,.85,.3,1)}
  @keyframes inLeft{0%{transform:translateX(-120%);opacity:0}100%{transform:translateX(0);opacity:1}}
  @keyframes inRight{0%{transform:translateX(120%);opacity:0}100%{transform:translateX(0);opacity:1}}
  /* advance: 다음 페이지로 넘어가는 순간 살짝 미끄러지며 사라짐 */
  .poster.advance .fg{animation:leave .45s ease-in forwards}
  @keyframes leave{to{transform:translateX(-8cqw);opacity:0}}

  .hint{max-width:1080px;margin:14px auto 0;font-size:13px;color:#9a9a9a;text-align:center;line-height:1.6}
  .hint b{color:#ddd}
  .stepbtns{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;
    background:rgba(0,0,0,.6);color:#fff;font-size:2.2cqw;font-weight:700;padding:1cqw 2.4cqw;border-radius:100px;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .poster.advance .toast{opacity:1}

  body.nomotion .sweep{animation:none}
</style>
</head>
<body>

<div class="ctrl">
  <h1>표지 <span>E4 레터 스플릿</span> — 필기체 정중앙 가득 + 제목 두 줄이 좌·우에서 합쳐짐</h1>
  <div class="row" id="rowBg"><span class="rlabel">배경</span></div>
  <div class="row" id="rowFg"><span class="rlabel">글자</span></div>
  <div class="row" id="rowAccent"><span class="rlabel">강조·숫자</span></div>
  <div class="row" id="rowScript"><span class="rlabel">필기체</span></div>
  <div class="row" id="rowFont"><span class="rlabel">필기서체</span>
    <button class="sbtn" data-f="'Great Vibes', cursive">Great Vibes</button>
    <button class="sbtn" data-f="'Dancing Script', cursive">Dancing Script</button>
    <button class="sbtn" data-f="'Sacramento', cursive">Sacramento</button>
    <button class="sbtn" data-f="'Caveat', cursive">Caveat</button>
  </div>
  <div class="opts">
    <label>필기체 줄수
      <button class="sbtn" id="l2" data-n="2">2줄</button>
      <button class="sbtn" id="l3" data-n="3">3줄</button>
    </label>
    <label><input type="checkbox" id="mo"> 모션 정지</label>
    <label>필기체 진하기 <input type="range" id="op" min="4" max="30" value="12" style="width:120px"></label>
    <span class="cur" id="cur"></span>
  </div>
</div>

<div class="stage">
  <div class="poster lines2" id="poster"></div>
  <div class="hint">화살표(→) · Space · 클릭 &nbsp;→&nbsp; <b>1번째: 제목 등장 연출</b> &nbsp;·&nbsp; <b>2번째: 다음 페이지</b></div>
  <div class="stepbtns">
    <button class="sbtn" id="stepBtn">▶ 진행</button>
    <button class="sbtn" id="resetBtn">↺ 처음으로</button>
  </div>
</div>

<script>
  const PALETTE = [
    {name:'딥네이비',   hex:'#12151C'},
    {name:'슬레이트',   hex:'#1E293B'},
    {name:'잉크블랙',   hex:'#1B1A17'},
    {name:'딥그린',     hex:'#0F2A24'},
    {name:'다크플럼',   hex:'#2A1E2E'},
    {name:'에스프레소', hex:'#3A2417'},
    {name:'버밀리온',   hex:'#FF4A1C'},
    {name:'오렌지',     hex:'#FF6B3D'},
    {name:'앰버',       hex:'#E6AE55'},
    {name:'라임',       hex:'#C6FF00'},
    {name:'로즈',       hex:'#E11D48'},
    {name:'틸',         hex:'#2F8F83'},
    {name:'뮤지엄블루', hex:'#5B8DB8'},
    {name:'오프화이트', hex:'#F4F1E8'},
    {name:'크림',       hex:'#EFE7D6'},
    {name:'화이트',     hex:'#FFFFFF'},
  ];

  const D = { tagline:'생각하고 활동하고 질문하는 역사 수업', title2:['붕당 정치와','<em>탕평책</em>'], num:'29강', unit:'Ⅱ. 조선 사회의 변동', page:'교과서 96~103쪽' };
  const SCRIPT2 = 'Dive into<br>History';
  const SCRIPT3 = 'Dive<br>into<br>History';

  const poster = document.getElementById('poster');
  let lineN = 2;
  function render(){
    poster.classList.toggle('lines2', lineN===2);
    poster.classList.toggle('lines3', lineN===3);
    poster.innerHTML = `
      <div class="script">${lineN===2?SCRIPT2:SCRIPT3}</div>
      <div class="sweep"></div>
      <div class="num">${D.num}</div>
      <div class="toast">다음 페이지로 →</div>
      <div class="fg">
        <div class="tagline">${D.tagline}</div>
        <div class="title"><span class="t1">${D.title2[0]}</span><span class="t2">${D.title2[1]}</span></div>
        <div class="meta"><b>${D.unit}</b> &nbsp;|&nbsp; ${D.page}</div>
      </div>`;
  }
  render();

  // ── 진행: 대기(제목 보임) → 1회 스플릿 재생 → 2회 다음 페이지 ──
  let st = 'ready';
  function reset(){ poster.classList.remove('play','advance'); void poster.offsetWidth; st='ready'; }
  function step(){
    if(st==='ready'){ poster.classList.remove('play'); void poster.offsetWidth; poster.classList.add('play'); st='played'; }
    else if(st==='played'){ poster.classList.add('advance'); st='next'; setTimeout(reset, 900); }
  }
  poster.addEventListener('click', step);
  document.getElementById('stepBtn').addEventListener('click', step);
  document.getElementById('resetBtn').addEventListener('click', reset);
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); step(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); reset(); }
  });

  const root = document.documentElement;
  const state = { '--bg':'#12151C', '--fg':'#F4F1E8', '--accent':'#FF6B3D', '--script':'#F4F1E8' };
  const rows = { '--bg':'rowBg', '--fg':'rowFg', '--accent':'rowAccent', '--script':'rowScript' };
  const cur = document.getElementById('cur');
  function nameOf(hex){const m=PALETTE.find(c=>c.hex.toLowerCase()===hex.toLowerCase());return m?m.name:hex}
  function apply(){ for(const k in state) root.style.setProperty(k, state[k]);
    cur.textContent=`배경 ${nameOf(state['--bg'])} · 글자 ${nameOf(state['--fg'])} · 강조 ${nameOf(state['--accent'])} · 필기체 ${nameOf(state['--script'])}`; }
  function buildRow(v){ const row=document.getElementById(rows[v]);
    PALETTE.forEach(c=>{ const d=document.createElement('div'); d.className='pick'; d.style.background=c.hex; d.title=c.name+' '+c.hex; d.dataset.hex=c.hex;
      d.addEventListener('click',()=>{state[v]=c.hex;markSel();apply();}); row.appendChild(d); }); }
  function markSel(){ for(const k in rows) document.querySelectorAll('#'+rows[k]+' .pick').forEach(p=>p.classList.toggle('sel', p.dataset.hex.toLowerCase()===state[k].toLowerCase())); }
  Object.keys(rows).forEach(buildRow); markSel(); apply();

  const fbtns=document.querySelectorAll('#rowFont .sbtn');
  fbtns.forEach(b=>b.addEventListener('click',()=>{ root.style.setProperty('--script-font', b.dataset.f); fbtns.forEach(x=>x.classList.toggle('active', x===b)); }));
  fbtns[0].classList.add('active');

  const l2=document.getElementById('l2'), l3=document.getElementById('l3');
  function setLines(n){ lineN=n; l2.classList.toggle('active',n===2); l3.classList.toggle('active',n===3); render(); reset(); }
  l2.addEventListener('click',()=>setLines(2)); l3.addEventListener('click',()=>setLines(3));
  setLines(2);

  document.getElementById('mo').addEventListener('change', e=>document.body.classList.toggle('nomotion', e.target.checked));
  document.getElementById('op').addEventListener('input', e=>root.style.setProperty('--script-op', (e.target.value/100).toFixed(2)));
</script>
</body>
</html>
