<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초성퀴즈 · 학습목표 프리뷰 (L2)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Sacramento&family=Caveat:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-style:normal;}
  @font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-style:normal;}

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#12151C; --fg:#F4F1E8; --accent:#FF6B3D; --wm:#F4F1E8;
    --wm-font:'Great Vibes', cursive; --wm-op:0.10;
  }
  html,body{font-family:'Pretendard',-apple-system,sans-serif;background:#0c0c0f;color:#eee;-webkit-font-smoothing:antialiased}

  .ctrl{position:sticky;top:0;z-index:50;background:#111;color:#fff;padding:12px 18px;box-shadow:0 2px 14px rgba(0,0,0,.5)}
  .ctrl h1{font-size:14px;font-weight:800;margin-bottom:10px;letter-spacing:.3px}
  .ctrl h1 span{color:#FF6B3D}
  .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
  .row .rlabel{font-size:12px;color:#bbb;width:56px;flex-shrink:0;font-weight:700}
  .pick{width:24px;height:24px;border-radius:50%;cursor:pointer;position:relative;border:2px solid #222;transition:transform .1s}
  .pick:hover{transform:scale(1.14)}
  .pick.sel{border-color:#fff;box-shadow:0 0 0 2px #111 inset,0 0 0 3px #fff}
  .pick.sel::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;text-shadow:0 0 3px rgba(0,0,0,.9)}
  .sbtn{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:6px 11px;font-size:12px;color:#eee;font-family:inherit;cursor:pointer;transition:.15s}
  .sbtn:hover{background:#2a2a2a}
  .sbtn.active{background:#fff;color:#111;font-weight:700}
  .opts{display:flex;gap:16px;align-items:center;font-size:12px;color:#ccc;margin-top:4px;flex-wrap:wrap}
  .opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
  .cur{font-size:11px;color:#888;margin-left:auto}

  .stage{max-width:1000px;margin:0 auto;padding:26px 20px 90px}
  .variant{margin-bottom:34px}
  .vhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
  .vname{font-size:16px;font-weight:800;color:#fff}
  .vdesc{font-size:12.5px;color:#8a8a8a;line-height:1.5}

  /* ══════════ 슬라이드 공통 (다크 포스터 톤) ══════════ */
  .slide{
    position:relative;container-type:inline-size;aspect-ratio:16/9;width:100%;
    overflow:hidden;border-radius:14px;isolation:isolate;color:var(--fg);
    background:radial-gradient(120% 120% at 50% 40%, color-mix(in srgb, var(--bg) 88%, #fff 4%) 0%, var(--bg) 55%, color-mix(in srgb, var(--bg) 70%, #000) 100%);
    box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  .slide::after{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(130% 130% at 50% 50%, transparent 60%, rgba(0,0,0,.38) 100%)}
  .sweep{position:absolute;inset:-25% -45%;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.4;
    background:radial-gradient(closest-side, color-mix(in srgb, var(--accent) 38%, transparent) 0%, transparent 72%);
    animation:sweep 9s ease-in-out infinite}
  @keyframes sweep{0%{transform:translate(-42%,-8%)}50%{transform:translate(45%,10%)}100%{transform:translate(-42%,-8%)}}

  .dhead{position:absolute;top:4.5cqw;left:6cqw;right:6cqw;z-index:4;display:flex;align-items:center;gap:1.4cqw}
  .badge{font-family:'Paperlogy';font-weight:800;font-size:2.1cqw;color:var(--accent);letter-spacing:-.01em}
  .badge b{color:var(--fg);font-weight:800}
  .kicker{font-family:'Paperlogy';font-weight:800;font-size:2.1cqw;color:var(--fg)}
  .kicker::before{content:':';margin:0 .5cqw 0 .1cqw;opacity:.5}

  .wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--wm-font);
    font-size:30cqw;font-weight:400;color:var(--wm);opacity:var(--wm-op);z-index:0;white-space:nowrap;line-height:.85;pointer-events:none}

  /* 목록 (L2 빅넘버 스택) */
  .list{position:absolute;left:6cqw;right:6cqw;top:11cqw;bottom:5cqw;z-index:4;
    display:flex;flex-direction:column;justify-content:center}
  .oi{display:flex;align-items:flex-start;gap:2.8cqw;padding:2.4cqw 0;border-top:1px solid color-mix(in srgb,var(--fg) 15%,transparent)}
  .oi:first-child{border-top:none}
  .on{flex-shrink:0;font-family:'Paperlogy';font-weight:900;color:var(--accent);line-height:.9;font-size:7cqw;width:2.6ch;text-align:center}
  .ot{font-family:'Paperlogy';font-weight:600;line-height:1.5;color:var(--fg);word-break:keep-all}
  .ot em{font-style:normal;color:var(--accent);font-weight:900}
  /* 초성 빈칸 — 강조색 + 밑줄 */
  .bk{color:var(--accent);font-weight:900;letter-spacing:.12em;border-bottom:.16cqw solid var(--accent);padding-bottom:.06cqw;white-space:nowrap;margin:0 .05em}

  /* 내용별 크기: 학습목표=크게 여유, 초성=문단이라 살짝 작게 */
  .content-obj .oi{align-items:center}
  .content-obj .ot{font-size:3.1cqw}
  .content-cho .ot{font-size:2.6cqw}

  body.nomotion .sweep{animation:none}
</style>
</head>
<body>

<div class="ctrl">
  <h1><span>초성퀴즈 · 학습목표</span> — L2 빅넘버 스택 (다크 포스터 톤)</h1>
  <div class="row" id="rowContent"><span class="rlabel">내용</span>
    <button class="sbtn" data-c="obj">학습 목표</button>
    <button class="sbtn" data-c="cho">초성 퀴즈</button>
    <button class="sbtn" data-c="both">둘 다 보기</button>
  </div>
  <div class="row" id="rowBg"><span class="rlabel">배경</span></div>
  <div class="row" id="rowFg"><span class="rlabel">글자</span></div>
  <div class="row" id="rowAccent"><span class="rlabel">강조·번호</span></div>
  <div class="row" id="rowWm"><span class="rlabel">워터마크</span></div>
  <div class="row" id="rowFont"><span class="rlabel">필기서체</span>
    <button class="sbtn" data-f="'Great Vibes', cursive">Great Vibes</button>
    <button class="sbtn" data-f="'Dancing Script', cursive">Dancing Script</button>
    <button class="sbtn" data-f="'Sacramento', cursive">Sacramento</button>
    <button class="sbtn" data-f="'Caveat', cursive">Caveat</button>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="wmOn"> 워터마크 켜기</label>
    <label><input type="checkbox" id="mo"> 모션 정지</label>
    <label>워터마크 진하기 <input type="range" id="op" min="3" max="24" value="9" style="width:120px"></label>
    <span class="cur" id="cur"></span>
  </div>
</div>

<div class="stage" id="stage"></div>

<script>
  const PALETTE = [
    {name:'딥네이비',   hex:'#12151C'},{name:'슬레이트',   hex:'#1E293B'},
    {name:'잉크블랙',   hex:'#1B1A17'},{name:'딥그린',     hex:'#0F2A24'},
    {name:'다크플럼',   hex:'#2A1E2E'},{name:'에스프레소', hex:'#3A2417'},
    {name:'버밀리온',   hex:'#FF4A1C'},{name:'오렌지',     hex:'#FF6B3D'},
    {name:'앰버',       hex:'#E6AE55'},{name:'라임',       hex:'#C6FF00'},
    {name:'로즈',       hex:'#E11D48'},{name:'틸',         hex:'#2F8F83'},
    {name:'뮤지엄블루', hex:'#5B8DB8'},{name:'오프화이트', hex:'#F4F1E8'},
    {name:'크림',       hex:'#EFE7D6'},{name:'화이트',     hex:'#FFFFFF'},
  ];

  // {..}는 초성 빈칸으로 강조
  const CONTENT = {
    obj:{ kicker:'학습 목표', items:[
      '붕당 정치의 전개 과정을 시기별로 <em>설명</em>할 수 있다.',
      '탕평책이 등장한 배경과 그 <em>한계</em>를 파악할 수 있다.',
      '붕당 정치가 조선 후기 사회에 끼친 영향을 <em>평가</em>할 수 있다.',
    ]},
    cho:{ kicker:'지난 수업 시간에는?', items:[
      '고려 전기에는 과거와 음서를 통해 여러 대에 걸쳐 고위 관직을 차지한 {ㅁㅂ}이 형성되었다. 그 중 {ㅇㅈㄱ}은 딸들을 왕비로 들여 최고 권력을 누렸다. 위협을 느낀 인종이 자신을 제거하려 들자 난을 일으켰다가 진압당했다.',
      '정치적 혼란 속에서 개혁을 위해 등장한 {ㅁㅊ} 등 {ㅅㄱ} 출신 세력들은 수도를 {ㅅㄱ}으로 옮기고 {ㅊㅈ ㄱㅇ}을 하자고 건의하였다. 이러한 주장이 받아들여지지 않자 반란을 일으켰다.',
    ]},
  };

  function parse(t){ return t.replace(/\{([^}]+)\}/g, (_,i)=>`<span class="bk">${i}</span>`); }
  function slideHTML(which, wmOn){
    const c = CONTENT[which];
    const wm = wmOn ? `<div class="wm">${which==='obj'?'Goals':'Review'}</div>` : '';
    const list = c.items.map((t,i)=>`<div class="oi"><span class="on">${i+1}</span><p class="ot">${parse(t)}</p></div>`).join('');
    return `
      <div class="slide content-${which}">
        ${wm}<div class="sweep"></div>
        <div class="dhead"><span class="badge">Dive into <b>HISTORY</b></span><span class="kicker">${c.kicker}</span></div>
        <div class="list">${list}</div>
      </div>`;
  }

  const stage=document.getElementById('stage');
  let view='cho';
  function renderAll(){
    const wmOn = document.getElementById('wmOn').checked;
    const which = view==='both' ? ['obj','cho'] : [view];
    stage.innerHTML = which.map(w=>`<div class="variant">${slideHTML(w, wmOn)}</div>`).join('');
  }

  const root=document.documentElement;
  const state={ '--bg':'#12151C','--fg':'#F4F1E8','--accent':'#FF6B3D','--wm':'#F4F1E8' };
  const rows={ '--bg':'rowBg','--fg':'rowFg','--accent':'rowAccent','--wm':'rowWm' };
  const cur=document.getElementById('cur');
  function nameOf(hex){const m=PALETTE.find(c=>c.hex.toLowerCase()===hex.toLowerCase());return m?m.name:hex}
  function apply(){ for(const k in state) root.style.setProperty(k,state[k]);
    cur.textContent=`배경 ${nameOf(state['--bg'])} · 글자 ${nameOf(state['--fg'])} · 강조 ${nameOf(state['--accent'])} · 워터마크 ${nameOf(state['--wm'])}`; }
  function buildRow(v){ const row=document.getElementById(rows[v]);
    PALETTE.forEach(c=>{ const d=document.createElement('div'); d.className='pick'; d.style.background=c.hex; d.title=c.name+' '+c.hex; d.dataset.hex=c.hex;
      d.addEventListener('click',()=>{state[v]=c.hex;markSel();apply();}); row.appendChild(d); }); }
  function markSel(){ for(const k in rows) document.querySelectorAll('#'+rows[k]+' .pick').forEach(p=>p.classList.toggle('sel', p.dataset.hex.toLowerCase()===state[k].toLowerCase())); }
  Object.keys(rows).forEach(buildRow); markSel(); apply();

  const cbtns=document.querySelectorAll('#rowContent .sbtn');
  cbtns.forEach(b=>b.addEventListener('click',()=>{ view=b.dataset.c; cbtns.forEach(x=>x.classList.toggle('active',x===b)); renderAll(); }));
  document.querySelector('#rowContent .sbtn[data-c="cho"]').classList.add('active');

  const fbtns=document.querySelectorAll('#rowFont .sbtn');
  fbtns.forEach(b=>b.addEventListener('click',()=>{ root.style.setProperty('--wm-font', b.dataset.f); fbtns.forEach(x=>x.classList.toggle('active', x===b)); }));
  fbtns[0].classList.add('active');
  document.getElementById('wmOn').addEventListener('change', renderAll);
  document.getElementById('mo').addEventListener('change', e=>document.body.classList.toggle('nomotion', e.target.checked));
  document.getElementById('op').addEventListener('input', e=>root.style.setProperty('--wm-op', (e.target.value/100).toFixed(2)));

  renderAll();
</script>
</body>
</html>
