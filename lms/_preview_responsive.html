<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS 반응형 미리보기 (PC + 모바일)</title>
<style>
  :root{ --bg:#11131a; --panel:#1b1e27; --line:#2c303c; --text:#e8eaf0; --sub:#9aa0b0; --accent:#E11D48; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Pretendard',system-ui,sans-serif;display:flex;flex-direction:column}
  header.bar{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar-title{font-weight:800;font-size:15px;letter-spacing:.2px}
  .bar-title span{font-weight:600;font-size:12px;color:var(--sub);margin-left:6px}
  .seg{display:flex;gap:2px;background:#0d0f15;border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{background:none;border:none;color:var(--sub);font-family:inherit;font-size:13px;font-weight:700;padding:5px 12px;border-radius:6px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .path{background:#0d0f15;border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:6px 10px;width:200px}
  .path::placeholder{color:#5b6070}
  .fld{font-size:12px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:5px}
  .fld select{background:#0d0f15;border:1px solid var(--line);border-radius:7px;color:var(--text);font-family:inherit;font-size:13px;padding:5px 6px}
  .btn{background:var(--accent);border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:800;padding:7px 14px;border-radius:8px;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .chk{font-size:12px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:5px;cursor:pointer}
  main.row{flex:1;min-height:0;display:flex;gap:18px;padding:16px;align-items:flex-start}
  .pane{display:flex;flex-direction:column;min-width:0;height:100%}
  #panePc{flex:1;min-width:0}
  .head{flex:none;font-size:12px;font-weight:800;color:var(--sub);padding:0 2px 8px;height:30px;display:flex;align-items:center;gap:6px}
  .head b{color:var(--text);font-weight:800}
  .wrap{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .wrap.phone{border-radius:26px}
  .wrap iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;background:#fff}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-title">LMS 미리보기<span>PC + 모바일 동시 · 편집 후 ↻ 누르면 둘 다 갱신</span></div>
  <div class="seg" id="pages">
    <button data-page="index.html" class="on">로그인</button>
    <button data-page="admin.html">어드민</button>
    <button data-page="lecture.html?num=24">강의</button>
  </div>
  <input id="customPath" class="path" placeholder="직접 경로 (예: index.html)">
  <label class="fld">모바일
    <select id="moW"><option value="360">360</option><option value="390" selected>390</option><option value="414">414</option></select>
  </label>
  <label class="fld">PC
    <select id="pcW"><option value="1280" selected>1280</option><option value="1440">1440</option><option value="1024">1024</option></select>
  </label>
  <button id="reload" class="btn">↻ 새로고침</button>
  <label class="chk"><input type="checkbox" id="sync" checked> 🔗 동시 입력</label>
  <label class="chk"><input type="checkbox" id="auto"> 자동 새로고침(2초)</label>
</header>

<main class="row" id="row">
  <section class="pane" id="panePc">
    <div class="head">💻 PC <b id="pcDim"></b></div>
    <div class="wrap" id="pcWrap"><iframe id="pcFrame" title="PC 미리보기"></iframe></div>
  </section>
  <section class="pane" id="paneMo">
    <div class="head">📱 모바일 <b id="moDim"></b></div>
    <div class="wrap phone" id="moWrap"><iframe id="moFrame" title="모바일 미리보기"></iframe></div>
  </section>
</main>

<script>
(function(){
  const $ = s => document.querySelector(s);
  let page = 'index.html';

  function currentPage(){ return $('#customPath').value.trim() || page; }

  function load(){
    const p = currentPage();
    // 캐시 무시용 타임스탬프는 붙이지 않는다(서버가 no-store). 해시/쿼리는 그대로 유지.
    $('#pcFrame').src = p;
    $('#moFrame').src = p;
  }

  document.querySelectorAll('#pages button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#pages button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      page = b.dataset.page;
      $('#customPath').value = '';
      load();
    });
  });
  $('#customPath').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
  $('#reload').addEventListener('click', load);

  function setFrame(fr, wrap, w, h, scale){
    fr.style.width = w + 'px';
    fr.style.height = h + 'px';
    fr.style.transform = 'scale(' + scale + ')';
    wrap.style.width  = Math.round(w * scale) + 'px';
    wrap.style.height = Math.round(h * scale) + 'px';
  }

  function layout(){
    const rowH = $('#row').clientHeight;
    const rowW = $('#row').clientWidth;
    const gap = 18, headH = 30;
    const frameH = Math.max(200, rowH - headH);

    // 모바일: 기기 비율(가로 x 844)을 유지한 채 세로에 맞춰 축소
    const deviceW = +$('#moW').value, deviceH = 844;
    const scaleMo = Math.min(1, frameH / deviceH);
    const moScaledW = Math.round(deviceW * scaleMo);
    setFrame($('#moFrame'), $('#moWrap'), deviceW, deviceH, scaleMo);
    $('#paneMo').style.width = moScaledW + 'px';
    $('#paneMo').style.flex = '0 0 ' + moScaledW + 'px';
    $('#moDim').textContent = deviceW + '×' + deviceH;

    // PC: 남은 가로폭을 채우도록 논리폭을 축소
    const pcAvailW = Math.max(320, rowW - moScaledW - gap);
    const pcLogicalW = +$('#pcW').value;
    const scalePc = Math.min(1, pcAvailW / pcLogicalW);
    const pcLogicalH = Math.round(frameH / scalePc);
    setFrame($('#pcFrame'), $('#pcWrap'), pcLogicalW, pcLogicalH, scalePc);
    $('#pcDim').textContent = pcLogicalW + 'px · ' + Math.round(scalePc * 100) + '%';
  }

  $('#moW').addEventListener('change', layout);
  $('#pcW').addEventListener('change', layout);
  window.addEventListener('resize', layout);

  let timer = null;
  $('#auto').addEventListener('change', e => {
    clearInterval(timer);
    if (e.target.checked) timer = setInterval(load, 2000);
  });

  /* ── 두 프레임 동시 입력 동기화 ──
     같은 출처(localhost)라 부모가 iframe 내부에 접근 가능.
     한쪽의 입력/클릭/스크롤을 반대쪽 같은 위치 요소에 복제한다. */
  let applying = false;                       // 되돌이 이벤트 방지 플래그
  const syncOn = () => $('#sync').checked;

  function pathOf(el){
    const path = [];
    const root = el.ownerDocument.documentElement;
    while (el && el.nodeType === 1 && el !== root){
      const parent = el.parentNode;
      if (!parent) break;
      path.unshift(Array.prototype.indexOf.call(parent.children, el));
      el = parent;
    }
    return path;
  }
  function elAt(doc, path){
    let el = doc.documentElement;
    for (const idx of path){ if (!el) return null; el = el.children[idx]; }
    return el;
  }
  function otherDoc(otherFrame){
    try { return otherFrame.contentDocument; } catch(_) { return null; }
  }
  function fire(el, type){
    el.dispatchEvent(new el.ownerDocument.defaultView.Event(type, { bubbles: true }));
  }

  function attach(selfFrame, otherFrame){
    const doc = otherDoc(selfFrame);
    if (!doc || doc.__syncAttached) return;
    doc.__syncAttached = true;

    doc.addEventListener('input', e => {
      if (!syncOn() || applying) return;
      const other = otherDoc(otherFrame); if (!other) return;
      const t = elAt(other, pathOf(e.target)); if (!t) return;
      applying = true;
      try {
        if ('value' in t) t.value = e.target.value;
        if ('checked' in t && e.target.type && /checkbox|radio/.test(e.target.type)) t.checked = e.target.checked;
        fire(t, 'input');
      } finally { applying = false; }
    }, true);

    doc.addEventListener('change', e => {
      if (!syncOn() || applying) return;
      const other = otherDoc(otherFrame); if (!other) return;
      const t = elAt(other, pathOf(e.target)); if (!t) return;
      applying = true;
      try {
        if ('checked' in t) t.checked = e.target.checked;
        if ('value' in t) t.value = e.target.value;
        fire(t, 'change');
      } finally { applying = false; }
    }, true);

    doc.addEventListener('click', e => {
      if (!syncOn() || applying) return;
      const other = otherDoc(otherFrame); if (!other) return;
      const t = elAt(other, pathOf(e.target)); if (!t) return;
      applying = true;
      try { t.click(); } finally { applying = false; }
    }, true);

    doc.addEventListener('keydown', e => {
      if (!syncOn() || applying) return;
      if (e.key !== 'Enter') return;
      const other = otherDoc(otherFrame); if (!other) return;
      const t = elAt(other, pathOf(e.target)); if (!t) return;
      applying = true;
      try { t.dispatchEvent(new other.defaultView.KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); }
      finally { applying = false; }
    }, true);

    const win = doc.defaultView;
    win.addEventListener('scroll', () => {
      if (!syncOn() || applying) return;
      const other = otherDoc(otherFrame); if (!other) return;
      applying = true;
      try { other.defaultView.scrollTo(win.scrollX, win.scrollY); } finally { applying = false; }
    }, true);
  }

  $('#pcFrame').addEventListener('load', () => attach($('#pcFrame'), $('#moFrame')));
  $('#moFrame').addEventListener('load', () => attach($('#moFrame'), $('#pcFrame')));

  load();
  layout();
})();
</script>
</body>
</html>
