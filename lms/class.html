<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 열기 : LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="index.css?v=20260825b">
<style>
  /* 수업 런처: 허브 디자인(카드·타일)을 그대로 쓰되, 4단 그리드 대신 개념 한 장만 넓게 중앙 배치 */
  .class-body{flex:1;width:100%;max-width:900px;margin:0 auto;padding:30px 20px 70px;--accent:var(--rose)}
  @media(max-width:768px){ .class-body{padding:20px 14px 60px} }
</style>
</head>
<body>
<div id="mainHub" style="display:flex">
  <header class="hub-header">
    <div class="hub-logo-wrap">
      <div class="hub-logo">DIVE INTO HISTORY</div>
      <div class="hub-logo-sub">수업 열기</div>
    </div>
  </header>
  <div class="class-body">
    <div class="hub-welcome">함께 볼 개념 Check 수업을 선택하세요.</div>
    <div class="sec-card s-concept" id="secClass"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { blockPaste } from "../shared/textLimit.js";

// 학생 화면 복사/붙여넣기·우클릭 차단(부정행위 방지)
blockPaste(document);

const app = initializeApp({
  apiKey: "AIzaSyDAc5S87JK-LtXzk5-iTR9rt7RnHWnUXTQ",
  authDomain: "ho0911seong-56638.firebaseapp.com",
  databaseURL: "https://ho0911seong-56638-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ho0911seong-56638",
  storageBucket: "ho0911seong-56638.firebasestorage.app",
  messagingSenderId: "994509567071",
  appId: "1:994509567071:web:8b33bb03a3d8f3a9f557ea"
});
const db = getFirestore(app);

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stripEmph(t){ return String(t||'').replace(/\*\*/g,'').replace(/[{}]/g,''); }
function stripLecNum(t){ const s=stripEmph(t); return s.replace(/^\s*\d+\s*강\.?\s*/,'').trim() || s; }

const card = document.getElementById('secClass');

// 강의 클릭 → 로그인·어드민과 무관하게 슬라이드 뷰어를 연다(sid 없음 → 출석·XP·랭킹 기록 안 됨).
card.addEventListener('click', e => {
  const it = e.target.closest('.icon-item[data-num]');
  if (it) location.href = `lecture.html?num=${encodeURIComponent(it.dataset.num)}`;
});

function render(items){
  let body;
  if (items === null) {
    body = '<div class="sec-body"><div class="icon-empty">불러오는 중…</div></div>';
  } else if (!items.length) {
    body = '<div class="sec-body"><div class="icon-empty">공개된 개념 Check 수업이 아직 없어요.</div></div>';
  } else {
    body = `<div class="sec-body"><div class="icon-grid">${items.map(l => {
      const iconStr = String(l.num == null ? '?' : l.num).trim();
      const sizeClass = iconStr.length <= 2 ? 'size-md' : iconStr.length <= 3 ? 'size-sm' : iconStr.length <= 5 ? 'size-lg' : 'size-xl';
      return `<button class="icon-item" data-num="${esc(iconStr)}">
        <div class="icon-box ${sizeClass}">${esc(iconStr)}</div>
        <div class="icon-label">${esc(stripLecNum(l.title))}</div>
      </button>`;
    }).join('')}</div></div>`;
  }
  card.innerHTML = `<div class="sec-head"><div class="sec-name">개념 Check</div></div><hr class="sec-divider">${body}`;
}
render(null);

// 어드민에서 공개(isOpen !== false)한 개념 강의만 노출. 큰 번호(최신)가 위로 — 학생 인덱스와 동일한 순서.
onSnapshot(query(collection(db, 'class_lessons'), orderBy('order', 'desc')), snap => {
  const items = snap.docs.map(d => d.data())
    .filter(l => l.isOpen !== false)
    .map(l => ({ num: l.num, title: l.title || '' }));
  render(items);
}, err => {
  card.innerHTML = `<div class="sec-head"><div class="sec-name">개념 Check</div></div><hr class="sec-divider"><div class="sec-body"><div class="icon-empty">불러오기 실패: ${esc(err.message)}</div></div>`;
});
</script>
</body>
</html>
