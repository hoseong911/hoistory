<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>감사편지 트리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="xmas.css">
  <style>
    body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent }
    .xm-stage { padding-top: 18px; padding-bottom: 20px }

    /* 전시용이라 제목을 조금 더 크게 */
    .xm-treetitle {
      text-align: center;
      font-size: 26px; font-weight: 800; letter-spacing: -.6px;
      margin: 0 0 4px;
    }
    .xm-treesub { text-align: center; color: var(--hi-text-muted); font-size: 14px; margin: 0 0 12px }

    /* 선생님 모드 알림 띠 */
    .xm-minebar {
      display: none;
      align-items: center; justify-content: center; gap: 12px;
      flex-wrap: wrap;
      background: var(--hi-accent-soft);
      border: 1px solid var(--hi-border-faint);
      border-radius: 999px;
      padding: 10px 18px;
      margin: 0 auto 12px;
      font-size: 14px; font-weight: 700; color: var(--hi-accent);
      max-width: max-content;
    }
    .xm-minebar.on { display: flex }

    .xm-corner {
      position: fixed; right: 16px; bottom: 16px; z-index: 5;
      opacity: .45; transition: opacity .2s ease;
    }
    .xm-corner:hover, .xm-corner:focus-within { opacity: 1 }

    /* 트리가 아직 비었을 때 */
    .xm-treeempty {
      position: absolute; left: 0; right: 0; top: 46%;
      text-align: center; font-size: 15px; color: var(--hi-text-muted);
      line-height: 1.8; pointer-events: none;
    }
  </style>
</head>
<body class="hi-preset-xmas xm-body">
  <div class="xm-sky"></div>
  <div class="xm-stars"></div>
  <canvas class="xm-snow" id="snow"></canvas>

  <main class="xm-stage xm-stage-wide">
    <h1 class="xm-treetitle" id="title">감사편지 트리</h1>
    <p class="xm-treesub" id="sub">마음을 적어 트리에 달아 주세요</p>

    <div class="xm-minebar" id="minebar">
      <span id="mineLabel"></span>
      <button class="xm-btn xm-btn-ghost xm-btn-sm" id="mineOff" type="button">트리 전체 보기</button>
    </div>

    <div class="xm-treewrap" id="wrap">
      <svg viewBox="0 0 100 130" preserveAspectRatio="xMidYMid meet" aria-label="크리스마스트리">
        <!-- 바닥에 쌓인 눈 -->
        <path d="M0 127Q14 119 27 123T52 121 76 124 100 120V130H0Z" fill="#dceaf7" opacity=".10"/>
        <ellipse cx="50" cy="121" rx="30" ry="5" fill="#dceaf7" opacity=".07"/>
        <!-- 기둥 -->
        <rect x="45" y="104" width="10" height="17" rx="2.5" fill="#5b4029"/>
        <!-- 가지 세 단 (아래부터 그려 위 단이 덮게 한다) -->
        <path d="M50 50 L13 112 Q50 122 87 112 Z" fill="#1b4e3b"/>
        <path d="M50 26 L22 84 Q50 93 78 84 Z" fill="#236048"/>
        <path d="M50 6  L31 52 Q50 59 69 52 Z" fill="#2b7152"/>
        <!-- 가지에 걸린 작은 전구 줄 -->
        <g fill="#f7d479" opacity=".55">
          <circle cx="40" cy="40" r=".9"/><circle cx="57" cy="44" r=".9"/>
          <circle cx="31" cy="68" r=".9"/><circle cx="48" cy="73" r=".9"/><circle cx="66" cy="69" r=".9"/>
          <circle cx="23" cy="97" r=".9"/><circle cx="41" cy="103" r=".9"/>
          <circle cx="60" cy="101" r=".9"/><circle cx="76" cy="96" r=".9"/>
        </g>
        <!-- 꼭대기 별 -->
        <path id="topStar" fill="#f0c457"/>
      </svg>
      <div class="xm-orns" id="orns"></div>
      <div class="xm-treeempty" id="treeEmpty" hidden>아직 달린 편지가 없어요.<br>첫 번째 마음을 달아 주세요.</div>
    </div>

    <div class="xm-treefoot" id="foot">불러오는 중…</div>
  </main>

  <div class="xm-corner">
    <a class="xm-btn xm-btn-ghost xm-btn-sm" href="teacher.html">선생님 전용</a>
  </div>

<script type="module">
import { collection, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, C_ORNAMENTS, watchConfig, esc, mountSnow } from "./xmas-core.js";
import { ornamentSVG } from "./ornaments.js";
import { layout, TREE } from "./tree-layout.js";

const $ = s => document.querySelector(s);

mountSnow($('#snow'), 90);

// 꼭대기 별 — ornaments.js와 같은 계산을 쓰지 않고 여기서 한 번만 그린다
(function drawTopStar() {
  const cx = 50, cy = 8, ro = 7.6, ri = 3.2, pts = [];
  for (let i = 0; i < 5; i++) {
    const ao = (-90 + i * 72) * Math.PI / 180;
    const ai = (-54 + i * 72) * Math.PI / 180;
    pts.push(`${(cx + ro * Math.cos(ao)).toFixed(2)} ${(cy + ro * Math.sin(ao)).toFixed(2)}`);
    pts.push(`${(cx + ri * Math.cos(ai)).toFixed(2)} ${(cy + ri * Math.sin(ai)).toFixed(2)}`);
  }
  $('#topStar').setAttribute('d', `M${pts.join('L')}Z`);
})();

watchConfig(c => {
  $('#title').textContent = c.title;
  $('#sub').textContent = c.sub;
  document.title = c.title;
});

/* ── 선생님 모드 ───────────────────────────────────────────────
   teacher.html에서 네 자리 번호를 확인한 뒤 같은 탭으로 넘어오면
   sessionStorage에 자기 편지 id 목록이 들어 있다. 트리는 그것만 빛나게 한다.
   학생이 보는 보통의 트리에는 이 정보가 전혀 없다(그냥 오너먼트뿐). */
let mineIds = null;
try {
  const raw = sessionStorage.getItem('xmas_mine');
  if (raw) {
    const m = JSON.parse(raw);
    if (m && Array.isArray(m.ids)) {
      mineIds = new Set(m.ids);
      $('#minebar').classList.add('on');
      $('#mineLabel').textContent = `${m.name || ''} 선생님께 온 편지 ${m.ids.length}통이 빛나고 있어요`;
      $('#orns').classList.add('mine');
    }
  }
} catch { mineIds = null; }

$('#mineOff').addEventListener('click', () => {
  sessionStorage.removeItem('xmas_mine');
  mineIds = null;
  $('#minebar').classList.remove('on');
  $('#orns').classList.remove('mine');
  render();
});

// ── 오너먼트 걸기 ─────────────────────────────────────────────
let items = [];                 // [{id, ornament}] 걸린 순서
const nodes = new Map();        // id → 화면 요소
let firstPaint = true;

function render(freshIds = new Set()) {
  const wrap = $('#orns');
  const placed = layout(items.map(it => it.id));
  const byId = new Map(items.map(it => [it.id, it]));

  // 사라진 것 치우기(어드민에서 숨긴 편지)
  for (const [id, el] of nodes) {
    if (!byId.has(id)) { el.remove(); nodes.delete(id); }
  }

  for (const p of placed) {
    let el = nodes.get(p.id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'xm-hang';
      el.innerHTML = `<span class="xm-sway">${ornamentSVG(byId.get(p.id).ornament, 64)}</span>`;
      // 같은 모양이라도 흔들리는 박자를 다르게 해야 한 몸처럼 움직이지 않는다
      el.querySelector('.xm-sway').style.animationDelay = `-${(Math.random() * 5).toFixed(2)}s`;
      if (!firstPaint && freshIds.has(p.id)) {
        el.classList.add('fresh');
        setTimeout(() => el.classList.remove('fresh'), 1400);
      }
      wrap.appendChild(el);
      nodes.set(p.id, el);
    }
    el.classList.toggle('mine', !!(mineIds && mineIds.has(p.id)));
    el.style.left  = p.x + '%';
    el.style.top   = (p.y / TREE.vbH * 100) + '%';
    el.style.width = p.w + '%';
  }

  $('#treeEmpty').hidden = items.length > 0;
  $('#foot').innerHTML = items.length
    ? `지금까지 <b>${items.length}</b>통의 마음이 모였어요`
    : '';
  firstPaint = false;
}

/* 오너먼트 문서에는 모양과 시각뿐이다 — 누가 누구에게 썼는지는 들어 있지 않다.
   트리를 아무리 들여다봐도 편지의 주인을 알 수 없는 까닭이다. */
onSnapshot(query(collection(db, C_ORNAMENTS), orderBy('createdAt')),
  snap => {
    const fresh = new Set();
    snap.docChanges().forEach(ch => { if (ch.type === 'added') fresh.add(ch.doc.id); });
    items = snap.docs.map(d => ({ id: d.id, ornament: d.data().ornament }));
    render(fresh);
  },
  err => {
    console.error(err);
    $('#foot').textContent = '트리를 불러오지 못했어요. 새로고침해 주세요.';
  });
</script>
</body>
</html>
