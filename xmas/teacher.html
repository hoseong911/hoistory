<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>감사편지 트리 - 선생님</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="xmas.css">
  <style>
    /* 네 자리 번호 칸 — 가운데 크게 */
    .xm-pin {
      width: 190px;
      margin: 0 auto;
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 12px;
      text-indent: 12px;      /* 자간 때문에 오른쪽으로 쏠리는 것을 되돌린다 */
      min-height: 68px;
    }
    /* 세로로 긴 화면에서 위쪽에만 몰리지 않게 */
    .xm-step { width: 100% }
    .xm-step.on:not(#stepRead) { margin: auto 0 }
    #stepName .xm-panel, #stepPin .xm-panel, #stepSealed { max-width: 720px; margin-left: auto; margin-right: auto }
    #stepName .xm-title, #stepName .xm-sub, #stepPin .xm-title, #stepPin .xm-sub { max-width: 720px; margin-left: auto; margin-right: auto }

    .xm-who {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.4px;
      margin-bottom: 18px;
    }
    .xm-who span { color: var(--hi-accent) }

    .xm-readhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .xm-readhead h2 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; margin: 0 }
    .xm-readhead h2 small { display: block; font-size: 13px; font-weight: 600; color: var(--hi-text-muted); margin-top: 4px }
    .xm-readtools { display: flex; gap: 8px; flex-wrap: wrap }
  </style>
</head>
<body class="hi-preset-xmas xm-body">
  <div class="xm-sky"></div>
  <div class="xm-stars"></div>
  <canvas class="xm-snow" id="snow"></canvas>

  <main class="xm-stage xm-stage-wide">
    <div class="xm-top">
      <div class="xm-brand"><span data-icon="mail" data-icon-size="20"></span>선생님 전용</div>
      <a class="xm-btn xm-btn-ghost xm-btn-sm" href="tree.html">트리 보기</a>
    </div>

    <!-- 1단계 — 이름 고르기 -->
    <section class="xm-step on" id="stepName">
      <h1 class="xm-title">선생님, 어서 오세요</h1>
      <p class="xm-sub">성함을 골라 주세요</p>
      <div class="xm-panel">
        <div class="xm-tsearch">
          <input class="xm-input" id="tq" type="text" placeholder="이름 찾기" autocomplete="off">
        </div>
        <div class="xm-tgrid" id="tgrid"><div class="xm-empty">불러오는 중…</div></div>
      </div>
    </section>

    <!-- 2단계 — 네 자리 번호 -->
    <section class="xm-step" id="stepPin">
      <h1 class="xm-title">확인 번호</h1>
      <p class="xm-sub">받으신 네 자리 번호를 넣어 주세요</p>
      <div class="xm-panel">
        <div class="xm-who" id="whoLabel"></div>
        <input class="xm-input xm-pin" id="pin" type="password" inputmode="numeric"
               maxlength="4" autocomplete="off" enterkeyhint="go">
        <div class="xm-err" id="pinErr" style="text-align:center"></div>
        <div class="xm-actions">
          <button class="xm-btn xm-btn-ghost" id="pinBack" type="button">이전</button>
          <button class="xm-btn" id="pinGo" type="button" disabled>편지 열기</button>
        </div>
        <p class="xm-hint" style="text-align:center;margin-top:16px">
          번호가 기억나지 않으시면 김호성 선생님께 말씀해 주세요.
        </p>
      </div>
    </section>

    <!-- 3단계 — 아직 열리지 않았을 때 -->
    <section class="xm-step" id="stepSealed">
      <div class="xm-panel xm-sealed">
        <span data-icon="lock" data-icon-size="54" class="xm-seal-ic"></span>
        <div class="xm-bigcount" id="sealCount">0</div>
        <h3 id="sealTitle">통의 편지가 도착했어요</h3>
        <p id="sealWhen"></p>
        <div class="xm-actions">
          <button class="xm-btn xm-btn-ghost" id="sealOut" type="button">나가기</button>
          <button class="xm-btn" id="sealTree" type="button">트리에서 내 편지 보기</button>
        </div>
      </div>
    </section>

    <!-- 4단계 — 편지 읽기 -->
    <section class="xm-step" id="stepRead">
      <div class="xm-readhead">
        <h2 id="readTitle">받은 편지<small id="readSub"></small></h2>
        <div class="xm-readtools">
          <button class="xm-btn xm-btn-ghost xm-btn-sm" id="readTree" type="button">트리에서 보기</button>
          <button class="xm-btn xm-btn-ghost xm-btn-sm" id="readOut" type="button">나가기</button>
        </div>
      </div>
      <div class="xm-letters" id="letters"></div>
      <div class="xm-empty" id="readEmpty" hidden>아직 도착한 편지가 없어요.</div>
    </section>
  </main>

<script type="module">
import { collection, getDocs, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db, C_TEACHERS, XMAS_FN_URL, loadConfig, openAtLabel, esc, nl2br, studentIdLabel, fmtDateTime, mountSnow }
  from "./xmas-core.js";
import { ornamentSVG } from "./ornaments.js";
import { icon } from "../shared/icons.js";

const $ = s => document.querySelector(s);

mountSnow($('#snow'), 60);
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = icon(el.dataset.icon, el.dataset.iconSize ? +el.dataset.iconSize : 24);
});

let cfg = await loadConfig();
let teachers = [];
let picked = null;

function show(id) {
  document.querySelectorAll('.xm-step').forEach(el => el.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── 이름 고르기 ───────────────────────────────────────────────
(async function loadTeachers() {
  try {
    const snap = await getDocs(query(collection(db, C_TEACHERS), orderBy('order')));
    teachers = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.name);
  } catch {
    try {
      const snap = await getDocs(collection(db, C_TEACHERS));
      teachers = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.name)
        .sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
    } catch { teachers = []; }
  }
  renderTeachers();
})();

function renderTeachers() {
  const q = $('#tq').value.trim();
  const list = q ? teachers.filter(t =>
    String(t.name).includes(q) || String(t.subject || '').includes(q)) : teachers;
  if (!teachers.length) {
    $('#tgrid').innerHTML = '<div class="xm-empty">아직 등록된 선생님이 없어요.</div>';
    return;
  }
  $('#tgrid').innerHTML = list.length
    ? list.map(t => `<button class="xm-tcard" type="button" data-id="${esc(t.id)}">
         <b>${esc(t.name)} 선생님</b>${t.subject ? `<span>${esc(t.subject)}</span>` : ''}
       </button>`).join('')
    : '<div class="xm-empty">찾는 이름이 없어요.</div>';
}
$('#tq').addEventListener('input', renderTeachers);
$('#tgrid').addEventListener('click', e => {
  const btn = e.target.closest('.xm-tcard');
  if (!btn) return;
  picked = teachers.find(t => t.id === btn.dataset.id);
  if (!picked) return;
  $('#whoLabel').innerHTML = `<span>${esc(picked.name)}</span> 선생님`;
  $('#pin').value = '';
  $('#pinErr').textContent = '';
  $('#pinGo').disabled = true;
  show('#stepPin');
  $('#pin').focus();
});

// ── 네 자리 번호 ──────────────────────────────────────────────
$('#pin').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  $('#pinErr').textContent = '';
  $('#pinGo').disabled = e.target.value.length !== 4;
});
$('#pin').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !$('#pinGo').disabled) $('#pinGo').click();
});
$('#pinBack').addEventListener('click', () => { picked = null; show('#stepName'); });
$('#pinGo').addEventListener('click', openLetters);

async function openLetters() {
  if (!picked) return;
  const pin = $('#pin').value.trim();
  $('#pinGo').disabled = true;
  $('#pinGo').textContent = '여는 중…';
  $('#pinErr').textContent = '';
  try {
    /* 편지 본문은 Firestore에서 직접 읽을 수 없다(규칙이 막는다).
       번호를 확인해 줄 수 있는 것은 서버뿐이라 Cloud Function을 거친다. */
    const res = await fetch(XMAS_FN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teacherId: picked.id, pin }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      $('#pinErr').textContent = data.message || '번호가 맞지 않아요.';
      $('#pin').value = '';
      return;
    }
    cfg = await loadConfig();
    if (data.locked) renderSealed(data);
    else renderLetters(data);
  } catch (e) {
    console.error(e);
    $('#pinErr').textContent = '지금은 열 수 없어요. 잠시 뒤 다시 해 주세요.';
  } finally {
    $('#pinGo').textContent = '편지 열기';
    $('#pinGo').disabled = $('#pin').value.length !== 4;
  }
}

/** 트리로 넘어갈 때 내 편지 id를 같은 탭에만 남긴다(트리 화면이 그것만 빛나게 한다) */
function goTree(ids) {
  sessionStorage.setItem('xmas_mine', JSON.stringify({ name: picked.name, ids }));
  location.href = 'tree.html';
}

// ── 아직 열리지 않았을 때 ─────────────────────────────────────
function renderSealed(data) {
  const n = data.count || 0;
  const when = openAtLabel(cfg);
  $('#sealCount').hidden = !n;
  $('#sealCount').textContent = n;
  if (n) {
    $('#sealTitle').textContent = '통의 편지가 도착했어요';
    $('#sealWhen').textContent = when ? `${when}에 열어 볼 수 있어요.` : '곧 열어 볼 수 있어요.';
  } else {
    $('#sealTitle').textContent = '아직 도착한 편지가 없어요';
    $('#sealWhen').textContent = when ? `편지는 ${when}부터 읽을 수 있어요.` : '';
  }
  $('#sealTree').hidden = !n;
  $('#sealTree').onclick = () => goTree(data.letterIds || []);
  show('#stepSealed');
}
$('#sealOut').addEventListener('click', signOut);

// ── 편지 읽기 ─────────────────────────────────────────────────
function renderLetters(data) {
  const list = data.letters || [];
  $('#readTitle').innerHTML =
    `${esc(picked.name)} 선생님께 온 편지 ${list.length}통` +
    `<small>학생들이 직접 쓴 글이에요</small>`;
  $('#readTree').hidden = !list.length;
  $('#readTree').onclick = () => goTree(list.map(l => l.id));
  $('#readEmpty').hidden = list.length > 0;
  $('#letters').innerHTML = list.map(l => `
    <article class="xm-letter">
      <div class="xm-letter-head">
        ${ornamentSVG(l.ornament, 34)}
        <div class="xm-letter-who">
          ${esc(l.studentName)}
          <small>${esc(studentIdLabel(l.studentId))}</small>
        </div>
      </div>
      <div class="xm-letter-body">${nl2br(l.body)}</div>
      <div class="xm-letter-foot"><span>${esc(fmtDateTime(l.createdAt))}</span></div>
    </article>`).join('');
  show('#stepRead');
}
$('#readOut').addEventListener('click', signOut);

function signOut() {
  picked = null;
  $('#pin').value = '';
  $('#letters').innerHTML = '';
  $('#tq').value = '';
  sessionStorage.removeItem('xmas_mine');
  renderTeachers();
  show('#stepName');
}
</script>
</body>
</html>
