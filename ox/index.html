<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>역사 OX 퀴즈</title>

<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  @font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap}
</style>

<link rel="stylesheet" href="../shared/theme.css?v=20260914">

<style>
/* ════════════════════════════════════════════════════════════
   역사 OX 퀴즈 — hismile(hi-preset-lms)과 같은 톤을 쓰되,
   알약 버튼 없이 각진 최소 구성으로 간다. 색은 전부 --hi-* 토큰만 쓴다.
   ════════════════════════════════════════════════════════════ */

/* 스크롤 막대 숨김 (hismile과 동일) */
html, body { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { width: 0; height: 0; display: none; }

/* ── 미니멀: theme.css의 .hi-btn 기본 반경이 알약(9999px)이라 이 앱에서만 각지게 덮어쓴다 ── */
.hi-btn { border-radius: var(--hi-r-input); letter-spacing: -0.2px; }
.hi-btn-primary { box-shadow: none; }

.hi-page { max-width: 560px; margin: 0 auto; padding: 14px 16px 48px; }

/* ── 상단 바 ── */
.ox-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 16px; min-height: 34px;
}
.ox-title {
  font-family: 'Paperlogy', sans-serif;
  font-size: 20px; font-weight: 900; letter-spacing: -0.8px;
  color: var(--hi-text); margin: 0;
}
.ox-title span { color: var(--hi-accent); }
.ox-top-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: none; border: 1px solid var(--hi-border);
  border-radius: var(--hi-r-small); padding: 6px 11px;
  font-family: inherit; font-size: 12px; font-weight: 700;
  color: var(--hi-text-muted); cursor: pointer; transition: .15s;
  white-space: nowrap;
}
.ox-top-btn:hover { border-color: var(--hi-text-muted); color: var(--hi-text); }

/* ── 오늘 포인트 줄 ── */
.ox-today {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; padding: 12px 14px; margin-bottom: 16px;
  background: var(--hi-bg-surface);
  border: 1px solid var(--hi-border);
  border-radius: var(--hi-r-input);
}
.ox-today-l { font-size: 12px; font-weight: 700; color: var(--hi-text-muted); letter-spacing: -0.2px; }
.ox-today-v { font-size: 14px; font-weight: 800; color: var(--hi-text-muted); font-feature-settings: 'tnum'; white-space: nowrap; }
.ox-today-v b { color: var(--hi-accent); font-size: 20px; }
.ox-today-bar { height: 3px; background: var(--hi-bg-mid); border-radius: 2px; overflow: hidden; margin-top: 9px; }
.ox-today-bar i { display: block; height: 100%; background: var(--hi-accent); width: 0; transition: width .5s ease; }

/* ── 섹션 제목 ── */
.ox-sec {
  font-size: 11px; font-weight: 800; letter-spacing: 1.4px;
  color: var(--hi-text-muted); text-transform: uppercase;
  margin: 0 2px 10px;
}

/* ── 강의 목록 ── */
.ox-lec-list { display: flex; flex-direction: column; gap: 8px; }
.ox-lec {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  background: var(--hi-bg-surface);
  border: 1px solid var(--hi-border);
  border-radius: var(--hi-r-input);
  padding: 14px 15px;
  font-family: inherit; cursor: pointer; transition: .15s;
}
.ox-lec:hover { border-color: var(--hi-accent); }
.ox-lec-num {
  flex: 0 0 auto; min-width: 44px; text-align: center;
  font-size: 15px; font-weight: 900; color: var(--hi-accent);
  font-feature-settings: 'tnum'; letter-spacing: -0.5px;
}
.ox-lec-body { flex: 1 1 auto; min-width: 0; }
.ox-lec-title {
  display: block;
  font-size: 15px; font-weight: 700; color: var(--hi-text);
  letter-spacing: -0.3px; margin-bottom: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ox-lec-meta { display: block; font-size: 12px; color: var(--hi-text-muted); font-weight: 600; }
.ox-lec-flag {
  flex: 0 0 auto; font-size: 11px; font-weight: 700;
  color: var(--hi-text-muted); background: var(--hi-bg-mid);
  border-radius: var(--hi-r-small); padding: 4px 8px; white-space: nowrap;
}
.ox-lec-flag.done { color: var(--hi-accent); background: var(--hi-accent-soft); }

/* ── 퀴즈 화면 ── */
.ox-prog { margin-bottom: 18px; }
.ox-prog-top {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: 12px; font-weight: 700; color: var(--hi-text-muted);
  margin-bottom: 7px; font-feature-settings: 'tnum';
}
.ox-prog-top b { color: var(--hi-text); font-size: 14px; }
.ox-prog-bar { height: 3px; background: var(--hi-bg-mid); border-radius: 2px; overflow: hidden; }
.ox-prog-bar i { display: block; height: 100%; background: var(--hi-accent); width: 0; transition: width .3s ease; }

.ox-q {
  background: var(--hi-bg-surface);
  border: 1px solid var(--hi-border);
  border-radius: var(--hi-r-card);
  padding: 30px 22px;
  min-height: 150px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.ox-q-text {
  font-size: 19px; font-weight: 700; line-height: 1.6;
  color: var(--hi-text); text-align: center; letter-spacing: -0.4px;
  word-break: keep-all; white-space: pre-wrap;
}

/* O / X 답 버튼 — 알약 대신 큼직한 각진 두 칸 */
.ox-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ox-choice button {
  padding: 22px 0;
  font-family: inherit; font-size: 34px; font-weight: 900;
  background: var(--hi-bg-surface);
  border: 1.5px solid var(--hi-border);
  border-radius: var(--hi-r-input);
  color: var(--hi-text); cursor: pointer; transition: .12s;
  line-height: 1;
}
.ox-choice button:hover:not(:disabled) { border-color: var(--hi-accent); color: var(--hi-accent); }
.ox-choice button:active:not(:disabled) { transform: scale(0.98); }
.ox-choice button:disabled { cursor: default; opacity: .4; }
.ox-choice button.is-answer { border-color: var(--hi-accent); background: var(--hi-accent-soft); color: var(--hi-accent); opacity: 1; }
.ox-choice button.is-wrong  { border-color: var(--hi-negative); background: rgba(220,38,38,0.08); color: var(--hi-negative); opacity: 1; }

/* 판정 + 해설 */
.ox-judge {
  margin-top: 14px; padding: 16px;
  background: var(--hi-bg-surface);
  border: 1px solid var(--hi-border);
  border-radius: var(--hi-r-input);
}
.ox-judge-head {
  display: flex; align-items: center; gap: 7px;
  font-size: 15px; font-weight: 800; letter-spacing: -0.3px;
}
.ox-judge-head.ok { color: var(--hi-accent); }
.ox-judge-head.no { color: var(--hi-negative); }
.ox-judge-body {
  font-size: 14px; line-height: 1.65; color: var(--hi-text-soft);
  word-break: keep-all; margin-top: 8px; white-space: pre-wrap;
}
.ox-judge .hi-btn { margin-top: 14px; }

/* ── 결과 화면 ── */
.ox-score {
  background: var(--hi-bg-surface);
  border: 1px solid var(--hi-border);
  border-radius: var(--hi-r-card);
  padding: 26px 20px 22px; text-align: center; margin-bottom: 16px;
}
.ox-score-lec { font-size: 13px; font-weight: 700; color: var(--hi-text-muted); margin-bottom: 12px; letter-spacing: -0.2px; }
.ox-score-num {
  display: flex; align-items: baseline; justify-content: center; gap: 6px;
  font-feature-settings: 'tnum';
}
.ox-score-num .n { font-size: 48px; font-weight: 900; color: var(--hi-accent); line-height: 1; letter-spacing: -2px; }
.ox-score-num .d { font-size: 19px; font-weight: 800; color: var(--hi-text-muted); }
.ox-score-rate { font-size: 13px; font-weight: 700; color: var(--hi-text-muted); margin-top: 9px; }
.ox-score-pt {
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hi-border);
  font-size: 14px; font-weight: 700; color: var(--hi-text); line-height: 1.6;
}
.ox-score-pt b { color: var(--hi-accent); font-size: 18px; }
.ox-score-pt .why { display: block; font-size: 12px; font-weight: 600; color: var(--hi-text-muted); margin-top: 5px; word-break: keep-all; }

.ox-review { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.ox-review-item {
  background: var(--hi-bg-surface);
  border: 1px solid var(--hi-border);
  border-radius: var(--hi-r-input);
  padding: 13px 15px;
}
.ox-review-q { font-size: 14px; font-weight: 700; color: var(--hi-text); line-height: 1.55; word-break: keep-all; white-space: pre-wrap; }
.ox-review-a { font-size: 12px; font-weight: 700; color: var(--hi-text-muted); margin-top: 6px; }
.ox-review-a em { font-style: normal; color: var(--hi-accent); }
.ox-review-e { font-size: 13px; line-height: 1.6; color: var(--hi-text-soft); margin-top: 7px; word-break: keep-all; white-space: pre-wrap; }

.ox-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── 안내 / 빈 상태 ── */
.ox-note {
  background: var(--hi-bg-mid);
  border-radius: var(--hi-r-input);
  padding: 13px 15px; margin-bottom: 18px;
  font-size: 13px; line-height: 1.65; color: var(--hi-text-soft);
  word-break: keep-all;
}
.ox-note b { color: var(--hi-text); }
.ox-empty {
  text-align: center; padding: 54px 20px;
  color: var(--hi-text-muted); font-size: 14px; font-weight: 600;
}
.ox-empty .hi-ic { display: block; margin: 0 auto 12px; opacity: .45; }

/* ── LMS 밖에서 열었을 때 ── */
.ox-block { max-width: 420px; margin: 70px auto 0; text-align: center; }
.ox-block h2 {
  font-family: 'Paperlogy', sans-serif;
  font-size: 22px; font-weight: 900; color: var(--hi-text);
  margin: 0 0 12px; letter-spacing: -0.6px;
}
.ox-block p { font-size: 14px; line-height: 1.7; color: var(--hi-text-muted); margin: 0 0 22px; word-break: keep-all; }

.hi-hidden { display: none !important; }

@media (max-width: 600px) {
  .ox-q-text { font-size: 17px; }
  .ox-choice button { font-size: 30px; padding: 20px 0; }
}
</style>
<script src="/hoistory/pwa.js"></script>
</head>
<body class="hi-preset-lms">

<div class="hi-page">

  <!-- ════════ LMS를 거치지 않고 들어온 경우 ════════ -->
  <div id="screen-blocked" class="hi-hidden">
    <div class="ox-block">
      <h2>수업 홈에서 열어 주세요</h2>
      <p>이 퀴즈는 수업 홈(LMS)에 로그인한 뒤 각종 콘텐츠에서 열어야 합니다.
         주소를 직접 치고 들어오면 누가 푼 기록인지 알 수 없어 포인트가 쌓이지 않습니다.</p>
      <button class="hi-btn hi-btn-primary" id="go-lms">수업 홈으로 가기</button>
    </div>
  </div>

  <!-- ════════ 강의 선택 ════════ -->
  <div id="screen-pick" class="hi-hidden">
    <div class="ox-top">
      <h1 class="ox-title">역사 <span>OX 퀴즈</span></h1>
      <button class="ox-top-btn" id="pick-home"><span data-ic="home" data-ic-size="15"></span>수업 홈</button>
    </div>

    <div class="ox-today">
      <div style="flex:1;min-width:0">
        <div class="ox-today-l">오늘 받은 포인트</div>
        <div class="ox-today-bar"><i id="today-bar"></i></div>
      </div>
      <div class="ox-today-v"><b id="today-earned">0</b> / <span id="today-max">30</span> pt</div>
    </div>

    <div class="ox-note" id="pick-note"></div>

    <div class="ox-sec">강의 선택</div>
    <div class="ox-lec-list" id="lec-list"></div>
  </div>

  <!-- ════════ 문제 풀이 ════════ -->
  <div id="screen-quiz" class="hi-hidden">
    <div class="ox-top">
      <h1 class="ox-title" id="quiz-lec-title">강의</h1>
      <button class="ox-top-btn" id="quiz-quit">그만두기</button>
    </div>

    <div class="ox-prog">
      <div class="ox-prog-top">
        <span><b id="q-idx">1</b> / <span id="q-total">0</span></span>
        <span id="q-correct">맞힌 문제 0개</span>
      </div>
      <div class="ox-prog-bar"><i id="q-bar"></i></div>
    </div>

    <div class="ox-q"><div class="ox-q-text" id="q-text"></div></div>

    <div class="ox-choice">
      <button type="button" id="btn-o" data-v="O">O</button>
      <button type="button" id="btn-x" data-v="X">X</button>
    </div>

    <div class="ox-judge hi-hidden" id="judge">
      <div class="ox-judge-head" id="judge-head"></div>
      <div class="ox-judge-body" id="judge-body"></div>
      <button class="hi-btn hi-btn-primary hi-btn-block" id="btn-next">다음 문제</button>
    </div>
  </div>

  <!-- ════════ 결과 ════════ -->
  <div id="screen-result" class="hi-hidden">
    <div class="ox-top">
      <h1 class="ox-title">퀴즈 <span>결과</span></h1>
      <button class="ox-top-btn" id="result-home"><span data-ic="home" data-ic-size="15"></span>수업 홈</button>
    </div>

    <div class="ox-score">
      <div class="ox-score-lec" id="res-lec"></div>
      <div class="ox-score-num">
        <span class="n" id="res-correct">0</span>
        <span class="d">/ <span id="res-total">0</span></span>
      </div>
      <div class="ox-score-rate" id="res-rate"></div>
      <div class="ox-score-pt" id="res-pt"></div>
    </div>

    <div id="res-review-wrap" class="hi-hidden">
      <div class="ox-sec">틀린 문제 다시 보기</div>
      <div class="ox-review" id="res-review"></div>
    </div>

    <div class="ox-actions">
      <button class="hi-btn hi-btn-outline" id="res-retry">이 강의 다시 풀기</button>
      <button class="hi-btn hi-btn-primary" id="res-other">다른 강의 풀기</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, getDoc, setDoc, addDoc, doc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getDatabase, ref, get, set, push, update, onValue, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "../shared/firebase-config.js";
import { icon } from "../shared/icons.js";
import { initXP, addOxQuizXP, getOxQuizToday } from "../shared/xp.js";
import { showToast, showCelebration } from "../shared/toast.js";
import "../shared/offline.js";

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const rtdb = getDatabase(app);

/* 정적 마크업의 data-ic 자리를 SVG로 채운다(화면에 이모지를 쓰지 않는다는 공통 규칙). */
document.querySelectorAll('[data-ic]').forEach(el => {
  el.innerHTML = icon(el.dataset.ic, +el.dataset.icSize || 18);
});

/* ══════════ 누구인지 ══════════
   LMS 허브에서 같은 창으로 넘어오므로 로그인 화면을 따로 두지 않는다.
   sessionStorage는 같은 탭에서 이동하면 그대로 남고, localStorage(자동 로그인)는
   탭을 닫았다 다시 열어도 남는다 — 둘 중 하나만 있으면 통과(apps/j_sahwa와 같은 방식). */
const ME = (() => {
  const g = (store, k) => { try { return store.getItem(k) || ''; } catch (e) { return ''; } };
  return {
    sid:  String(g(sessionStorage, 'lms_sid')   || g(localStorage, 'lms_autosave_sid')   || '').trim(),
    name: String(g(sessionStorage, 'lms_sname') || g(localStorage, 'lms_autosave_sname') || '').trim(),
  };
})();
const LMS_HOME = '../lms/index.html';
function classNumOf(sid) {
  const n = parseInt(String(sid).slice(1, 3), 10);
  return Number.isFinite(n) ? n : null;
}

/* ══════════ 화면 전환 ══════════ */
const SCREENS = ['blocked', 'pick', 'quiz', 'result'];
function show(name) {
  SCREENS.forEach(s => document.getElementById('screen-' + s).classList.toggle('hi-hidden', s !== name));
  window.scrollTo(0, 0);
}

/* ══════════ 상태 ══════════ */
const S = {
  lessons: [],   // [{ num, title, order, list }]
  today:   { enabled: true, earned: 0, dailyMax: 30, lessonsDone: new Set() },
  quiz:    null, // { num, title, list, idx, correct, wrong, answered }
};

/* ══════════ 부팅 ══════════ */
document.getElementById('go-lms').addEventListener('click',      () => { location.href = LMS_HOME; });
document.getElementById('pick-home').addEventListener('click',   () => { location.href = LMS_HOME; });
document.getElementById('result-home').addEventListener('click', () => { location.href = LMS_HOME; });

if (!ME.sid || !ME.name) show('blocked');
else boot();

async function boot() {
  show('pick');
  document.getElementById('lec-list').innerHTML = '<div class="ox-empty">문제를 불러오는 중입니다</div>';
  await initXP(rtdb, ME.sid, ME.name, { ref, get, set, push, update, onValue, runTransaction });
  await Promise.all([loadToday(), loadLessons()]);
  renderPick();
}

async function loadToday() {
  try { S.today = await getOxQuizToday(); } catch (e) { /* 못 읽으면 기본값을 그대로 쓴다 */ }
}

/* 문제는 강의 번호(class_lessons.num)로 묶여 있다. 제목은 LMS 강의 목록에서 끌어오되,
   강의가 아직 없거나 지워졌으면 번호만으로 보여 준다(문제가 사라지지는 않게). */
async function loadLessons() {
  const [qSnap, lSnap] = await Promise.all([
    getDocs(collection(db, 'ox_questions')),
    getDocs(collection(db, 'class_lessons')).catch(() => ({ docs: [] })),
  ]);

  const titles = {}, orders = {};
  lSnap.docs.forEach(d => {
    const v = d.data() || {};
    const num = String(v.num == null ? '' : v.num).trim();
    if (!num) return;
    titles[num] = v.title || '';
    orders[num] = Number(v.order || 0);
  });

  const byLesson = {};
  qSnap.docs.forEach(d => {
    const v = d.data() || {};
    const num = String(v.lessonNum == null ? '' : v.lessonNum).trim();
    if (!num || !v.text) return;
    (byLesson[num] = byLesson[num] || []).push({ id: d.id, ...v });
  });

  S.lessons = Object.keys(byLesson).map(num => ({
    num,
    title: titles[num] || '',
    order: orders[num] != null ? orders[num] : (/^\d+$/.test(num) ? parseInt(num, 10) : -1),
    list:  byLesson[num],
  })).sort((a, b) => b.order - a.order); // 최신 강의가 위 — LMS 강의 목록과 같은 기준
}

/* ══════════ 강의 선택 화면 ══════════ */
function renderPick() {
  const { earned, dailyMax, enabled } = S.today;
  document.getElementById('today-earned').textContent = earned;
  document.getElementById('today-max').textContent    = dailyMax;
  document.getElementById('today-bar').style.width    = dailyMax ? Math.min(100, earned / dailyMax * 100) + '%' : '0%';

  const note = document.getElementById('pick-note');
  if (!enabled) {
    note.innerHTML = '지금은 OX 퀴즈 포인트 지급이 꺼져 있습니다. 풀이 기록은 그대로 남습니다.';
  } else if (earned >= dailyMax) {
    note.innerHTML = '오늘 받을 수 있는 <b>' + dailyMax + 'pt</b>를 모두 받았습니다. 더 풀어도 포인트는 오르지 않지만 기록은 남습니다.';
  } else {
    note.innerHTML = '맞힌 문제 하나가 <b>1pt</b>, 하루 최대 <b>' + dailyMax + 'pt</b>까지 받습니다. 같은 강의로는 하루에 한 번만 받을 수 있어요.';
  }

  const wrap = document.getElementById('lec-list');
  if (!S.lessons.length) {
    wrap.innerHTML = '<div class="ox-empty">' + icon('circle-help', 34) + '아직 등록된 문제가 없습니다</div>';
    return;
  }
  wrap.innerHTML = '';
  S.lessons.forEach(L => {
    const done = S.today.lessonsDone.has(L.num);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ox-lec';
    b.innerHTML =
      '<span class="ox-lec-num">' + esc(lecLabel(L.num)) + '</span>' +
      '<span class="ox-lec-body">' +
        '<span class="ox-lec-title">' + esc(L.title || '제목 없는 강의') + '</span>' +
        '<span class="ox-lec-meta">' + L.list.length + '문제</span>' +
      '</span>' +
      (done ? '<span class="ox-lec-flag done">오늘 받음</span>' : '');
    b.addEventListener('click', () => startQuiz(L));
    wrap.appendChild(b);
  });
}

function lecLabel(num) { return /^\d+$/.test(num) ? num + '강' : num; }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ══════════ 퀴즈 ══════════ */
function startQuiz(L) {
  // 그 강의에 등록된 문제를 전부 풀되 순서만 섞는다.
  const list = shuffle(L.list.slice());
  S.quiz = { num: L.num, title: L.title, list, idx: 0, correct: 0, wrong: [], answered: false };
  document.getElementById('quiz-lec-title').innerHTML = esc(lecLabel(L.num)) + ' <span>OX</span>';
  document.getElementById('q-total').textContent = list.length;
  show('quiz');
  renderQuestion();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function renderQuestion() {
  const q = S.quiz.list[S.quiz.idx];
  S.quiz.answered = false;
  document.getElementById('q-idx').textContent     = S.quiz.idx + 1;
  document.getElementById('q-correct').textContent = '맞힌 문제 ' + S.quiz.correct + '개';
  document.getElementById('q-bar').style.width     = (S.quiz.idx / S.quiz.list.length * 100) + '%';
  document.getElementById('q-text').textContent    = q.text || '';
  document.getElementById('judge').classList.add('hi-hidden');
  ['btn-o', 'btn-x'].forEach(id => {
    const b = document.getElementById(id);
    b.disabled = false;
    b.className = '';
  });
}

['btn-o', 'btn-x'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => answer(e.currentTarget.dataset.v));
});

function answer(pick) {
  if (!S.quiz || S.quiz.answered) return;
  S.quiz.answered = true;
  const q  = S.quiz.list[S.quiz.idx];
  const ans = String(q.answer || '').toUpperCase();
  const ok  = ans === pick;
  if (ok) S.quiz.correct++;
  else    S.quiz.wrong.push({ text: q.text, answer: ans, explain: q.explain || '', picked: pick });

  const bo = document.getElementById('btn-o'), bx = document.getElementById('btn-x');
  bo.disabled = true; bx.disabled = true;
  (ans === 'O' ? bo : bx).classList.add('is-answer');
  if (!ok) (pick === 'O' ? bo : bx).classList.add('is-wrong');

  const head = document.getElementById('judge-head');
  head.className = 'ox-judge-head ' + (ok ? 'ok' : 'no');
  head.innerHTML = (ok ? icon('check', 19) : icon('x', 19)) +
                   '<span>' + (ok ? '정답입니다' : '아쉬워요, 정답은 ' + esc(ans) + '입니다') + '</span>';

  const body = document.getElementById('judge-body');
  body.textContent   = q.explain || '';
  body.style.display = q.explain ? '' : 'none';

  const last = S.quiz.idx >= S.quiz.list.length - 1;
  document.getElementById('btn-next').textContent   = last ? '결과 보기' : '다음 문제';
  document.getElementById('q-correct').textContent  = '맞힌 문제 ' + S.quiz.correct + '개';
  document.getElementById('judge').classList.remove('hi-hidden');
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (S.quiz.idx >= S.quiz.list.length - 1) finishQuiz();
  else { S.quiz.idx++; renderQuestion(); }
});

document.getElementById('quiz-quit').addEventListener('click', () => {
  // 중간에 그만두면 기록도 포인트도 남지 않는다 — 끝까지 푼 것만 센다.
  if (!confirm('그만두면 이번 풀이 기록은 남지 않습니다. 나가시겠어요?')) return;
  S.quiz = null;
  renderPick();
  show('pick');
});

/* ══════════ 결과 ══════════ */
async function finishQuiz() {
  const Q = S.quiz;
  const total = Q.list.length, correct = Q.correct;
  const rate  = total ? Math.round(correct / total * 100) : 0;

  document.getElementById('res-lec').textContent     = lecLabel(Q.num) + (Q.title ? ' ' + Q.title : '');
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-total').textContent   = total;
  document.getElementById('res-rate').textContent    = '정답률 ' + rate + '%';
  document.getElementById('res-pt').innerHTML        = '포인트를 계산하는 중입니다';

  const wrap = document.getElementById('res-review-wrap');
  const list = document.getElementById('res-review');
  if (Q.wrong.length) {
    list.innerHTML = Q.wrong.map(w =>
      '<div class="ox-review-item">' +
        '<div class="ox-review-q">' + esc(w.text) + '</div>' +
        '<div class="ox-review-a">내 답 ' + esc(w.picked) + ' / 정답 <em>' + esc(w.answer) + '</em></div>' +
        (w.explain ? '<div class="ox-review-e">' + esc(w.explain) + '</div>' : '') +
      '</div>').join('');
    wrap.classList.remove('hi-hidden');
  } else {
    wrap.classList.add('hi-hidden');
  }
  show('result');

  // 포인트 지급 — 상한 판정은 전부 addOxQuizXP의 트랜잭션이 한다.
  let res = null;
  try { res = await addOxQuizXP(Q.num, correct); } catch (e) { console.error(e); }
  renderPoint(res, correct);

  // 기록 저장은 포인트와 별개다. 상한에 걸려 포인트를 못 받아도 참여는 남는다.
  saveRecord(Q, correct, total, rate, (res && res.pt) || 0).catch(e => {
    console.error(e);
    showToast('기록을 저장하지 못했습니다', 'error');
  });

  await loadToday();
  if (res && res.pt) {
    if (res.levelUp) showCelebration({ icon: icon('trophy', 46), title: '레벨 ' + res.newLevel + ' 달성', message: 'OX 퀴즈로 ' + res.pt + 'pt를 받았어요' });
    else             showToast(res.pt + 'pt를 받았어요');
  }
}

function renderPoint(res, correct) {
  const el = document.getElementById('res-pt');
  const zero = function (why) {
    el.innerHTML = '포인트 <b>0pt</b><span class="why">' + why + '</span>';
  };
  if (res && res.pt) {
    el.innerHTML = '이번 퀴즈로 <b>' + res.pt + 'pt</b> 획득' +
                   '<span class="why">오늘 누적 ' + res.earnedToday + ' / ' + res.dailyMax + ' pt</span>';
  } else if (res && res.blocked === 'lesson') {
    zero('이 강의는 오늘 이미 포인트를 받았습니다. 다른 강의를 풀면 더 받을 수 있어요.');
  } else if (res && res.blocked === 'daily') {
    zero('오늘 받을 수 있는 ' + res.dailyMax + 'pt를 모두 채웠습니다.');
  } else if (correct === 0) {
    zero('맞힌 문제가 없어요. 해설을 보고 다시 풀어 보세요.');
  } else {
    zero('지금은 OX 퀴즈 포인트 지급이 꺼져 있습니다.');
  }
}

/* 누적 요약(ox_records/{학번}) + 이번 풀이 한 건(ox_sessions).
   어드민 ANSWER 탭은 목록을 만들 때 요약만 읽고, 세션은 학생을 펼칠 때만 읽는다 —
   세션을 전량 조회하면 학기가 갈수록 읽기가 눈덩이처럼 불어난다. */
async function saveRecord(Q, correct, total, rate, pt) {
  const recRef = doc(db, 'ox_records', ME.sid);
  let prev = {};
  try {
    const snap = await getDoc(recRef);
    if (snap.exists()) prev = snap.data() || {};
  } catch (e) { /* 못 읽으면 새로 만든다 */ }

  const lessons = Object.assign({}, prev.lessons || {});
  const L = lessons[Q.num] || { attempts: 0, correct: 0, total: 0, bestRate: 0 };
  lessons[Q.num] = {
    attempts: (L.attempts || 0) + 1,
    correct:  (L.correct  || 0) + correct,
    total:    (L.total    || 0) + total,
    bestRate: Math.max(L.bestRate || 0, rate),
    lastRate: rate,
    lastAt:   Date.now(),
  };

  await setDoc(recRef, {
    sid: ME.sid, name: ME.name, classNum: classNumOf(ME.sid),
    sessions: (prev.sessions || 0) + 1,
    correct:  (prev.correct  || 0) + correct,
    total:    (prev.total    || 0) + total,
    points:   (prev.points   || 0) + pt,
    lessons,
    lastAt: serverTimestamp(),
  }, { merge: true });

  await addDoc(collection(db, 'ox_sessions'), {
    sid: ME.sid, name: ME.name, classNum: classNumOf(ME.sid),
    lessonNum: Q.num, lessonTitle: Q.title || '',
    correct, total, rate, pt,
    at: serverTimestamp(),
  });
}

document.getElementById('res-retry').addEventListener('click', () => {
  const L = S.lessons.find(x => x.num === S.quiz.num);
  if (L) startQuiz(L);
});
document.getElementById('res-other').addEventListener('click', () => { renderPick(); show('pick'); });
</script>
