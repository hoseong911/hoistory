<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영정조 뇌구조도 - 관리자 모드</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<link rel="stylesheet" href="../../shared/admin-base.css">
<script>if(window.self!==window.top){document.documentElement.classList.add('in-iframe');document.documentElement.classList.add('has-own-back');}</script>
<style>
/* 앱 어드민끼리 톤을 맞춘다 — 다른 미션 앱과 같은 오렌지 주 + 네이비 보조.
   --hi-* 를 끌어다 쓰는 값이 있어 :root 가 아니라 body 에 둔다(학생 화면과 같은 이유). */
body{
  --bp-primary:#FF6B3D;--bp-primary-soft:rgba(255,107,61,.12);--bp-primary-deep:#E24E1B;
  --bp-accent:#27384F;--bp-accent-deep:#172554;--bp-accent-l:rgba(39,56,79,.12);
  --bp-pass:#22c55e;--bp-pass-l:rgba(34,197,94,.12);
  --bp-fail:var(--hi-negative);--bp-fail-l:rgba(243,114,127,.1);
  /* 뇌구조도 미리보기(brain.js)가 읽는 값. 학생 화면과 같은 색을 쓴다. */
  --bm-yeongjo:#2F5D62;
  --bm-jeongjo:#8B2F3F;
  --bm-fill:#FFFFFF;
  --bm-need:var(--hi-border-light);
  --bm-ink:var(--hi-text);
  --bm-chip-bg:rgba(255,255,255,.75);
  --bm-chip-sel:rgba(255,107,61,.2);
  --bm-ok:#166534;
  --bm-no:#B91C1C;
}
.section-card{background:var(--hi-bg-surface);border-radius:14px;padding:22px;margin-bottom:16px;border:1px solid var(--hi-border)}
.section-title{font-weight:700;font-size:var(--adm-title);color:var(--hi-text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-desc{font-size:12px;color:var(--hi-text-muted);line-height:1.6;margin-bottom:14px}

.btn{padding:9px 18px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--bp-primary);color:#fff}.btn-primary:hover{background:var(--bp-primary-deep)}
.btn-ghost{background:none;border:1.5px solid var(--hi-border);color:var(--hi-text-muted)}.btn-ghost:hover{border-color:var(--hi-border-light);color:var(--hi-text)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:7px}

/* SETTING — 키워드 표 */
#kw-editor{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:760px){#kw-editor{grid-template-columns:1fr}}
.kw-row{display:flex;gap:8px;align-items:center;background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:10px;padding:8px 10px}
.kw-label{flex:1;min-width:0}
.kw-side{flex-shrink:0;width:118px}
.meta-input{padding:7px 9px;border:1px solid var(--hi-border);border-radius:7px;font-family:inherit;font-size:14px;color:var(--hi-text);background:var(--hi-bg-mid);outline:none;width:100%;box-sizing:border-box}
.meta-input:focus{border-color:var(--hi-border-light)}
.icon-btn{width:28px;height:28px;flex-shrink:0;border-radius:7px;border:1px solid var(--hi-border);background:var(--hi-bg-mid);cursor:pointer;color:var(--hi-text-muted);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--hi-text);border-color:var(--hi-border-light)}
.kw-sum{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.kw-sum span{background:var(--hi-bg-mid);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--hi-text-muted)}
.rule-row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}
.rule-box{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--hi-text-muted)}
.rule-box .meta-input{width:72px;text-align:center}
.save-msg{text-align:center;font-size:12px;color:var(--hi-text-muted);min-height:16px;margin-top:10px}
.save-msg.ok{color:var(--bp-pass);font-weight:700}

/* ANSWER — 머리줄 */
.ans-head{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;margin-bottom:16px}
.ans-head .class-filter,.ans-head .stats-row{margin-bottom:0}
.ans-head .class-filter{flex:0 1 auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.ans-head .class-filter::-webkit-scrollbar{display:none}
.ans-head .class-filter .cf-btn{flex:0 0 auto}
.ans-head .stats-row{flex:0 0 auto;flex-wrap:nowrap}
@media(max-width:640px){.ans-head{flex-wrap:wrap}}
.stats-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:16px}
.stat-chip{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:12px;padding:10px 16px;font-size:14px;color:var(--hi-text-muted);min-width:80px;text-align:center;white-space:nowrap;flex-shrink:0}
.stat-combo{display:inline-flex;align-items:baseline;justify-content:center;gap:6px}
.stat-combo .thc-o,.stat-combo .thc-g,.stat-combo .thc-r,.thc-avg{display:inline-block;min-width:2.6ch;text-align:center;font-variant-numeric:tabular-nums}
.stat-combo .thc-o{font-size:18px;font-weight:800;color:var(--bp-primary)}
.stat-combo .thc-g{font-size:18px;font-weight:800;color:#0E9F6E}
.stat-combo .thc-r{font-size:18px;font-weight:800;color:#DC2626}
.stat-combo .thc-sep{font-size:16px;font-weight:700;color:var(--hi-border)}
.stat-avg{display:inline-flex;align-items:center;gap:6px}
.stat-avg .thc-avg{font-size:18px;font-weight:800;color:var(--hi-text);min-width:4ch}
.adm-action-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.adm-action-row::-webkit-scrollbar{display:none}
.adm-action-row>*,.ans-right-group>*{flex-shrink:0}
.adm-action-row .btn,.adm-action-row .sort-btn{white-space:nowrap}
.ans-right-group{display:flex;align-items:center;gap:8px;margin-left:auto}
.thr-box{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hi-text-muted);font-weight:700;white-space:nowrap}
.thr-in{width:56px;padding:6px 8px;border:1px solid var(--hi-border);border-radius:7px;font-family:inherit;font-size:14px;background:var(--hi-bg-mid);color:var(--hi-text);text-align:center}

/* ANSWER — 학생 카드 */
.std-card-head{display:flex;align-items:center;gap:10px;padding:11px 14px 9px;cursor:pointer}
.std-who{flex-shrink:0;display:flex;align-items:baseline;gap:6px}
.std-who .std-sid{font-size:11px;font-weight:700;color:var(--hi-text-muted);letter-spacing:.3px}
.std-who .std-name{font-size:14px;font-weight:700;color:var(--hi-text);white-space:nowrap}
.std-status{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.std-meta-time{font-size:11px;color:var(--hi-text-muted)}
.status-badge{flex-shrink:0;padding:4px 10px;border-radius:7px;font-size:12px;font-weight:800}
.sb-pending{background:var(--hi-bg-mid);color:var(--hi-text-muted);border:1px solid var(--hi-border)}
.sb-pass{background:var(--bp-pass-l);color:var(--bp-pass)}
.sb-fail{background:var(--bp-fail-l);color:var(--bp-fail)}
.score-pill{flex-shrink:0;padding:3px 9px;border-radius:6px;background:var(--bp-primary-soft);color:var(--bp-primary);font-size:12px;font-weight:800}
.card-body-open{display:none;padding:12px 14px 6px;border-top:1px solid var(--hi-border);margin-top:8px}
.std-card.open .card-body-open{display:block}
.score-btns{display:flex;gap:6px;justify-content:center;margin:10px 0 6px}
.ssb{padding:6px 16px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;border:1.5px solid transparent;cursor:pointer}
.ssb-pass{background:var(--bp-pass-l);color:var(--bp-pass);border-color:rgba(22,163,74,.2)}.ssb-pass.active,.ssb-pass:hover{background:var(--bp-pass);color:#fff}
.ssb-fail{background:var(--bp-fail-l);color:var(--bp-fail);border-color:rgba(220,38,38,.2)}.ssb-fail.active,.ssb-fail:hover{background:var(--bp-fail);color:#fff}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* 채점은 목록을 훑는 일이라 미리보기가 학생 화면만큼 클 이유가 없다. */
.pair .bm-stage{max-width:290px}
@media(max-width:640px){.pair{grid-template-columns:1fr}}
.pair-col-h{text-align:center;font-size:13px;font-weight:800;margin-bottom:4px}
.pair-col-h[data-side="yeongjo"]{color:var(--bm-yeongjo)}
.pair-col-h[data-side="jeongjo"]{color:var(--bm-jeongjo)}
.note-list{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.note-item{background:var(--hi-bg-mid);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.6;color:var(--hi-text-soft)}
.note-item b{color:var(--hi-text);font-weight:800}
.note-item .nm{font-weight:800;margin-left:4px}
.note-item .nm-ok{color:var(--bm-ok)}
.note-item .nm-no{color:var(--bm-no)}
.legend{text-align:center;font-size:11px;color:var(--hi-text-muted);margin-top:10px}
.no-data{text-align:center;padding:40px 20px;color:var(--hi-text-muted);font-size:14px}
</style>
<script src="/hoistory/pwa.js"></script>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-title">영정조 뇌구조도</div>
    <div class="login-sub">관리자 모드</div>
    <div class="field-group" style="text-align:left;margin:14px 0">
      <label class="form-label">이메일</label>
      <input type="email" class="hi-input" id="gate-email" placeholder="이메일">
    </div>
    <div class="field-group" style="text-align:left;margin-bottom:14px">
      <label class="form-label">비밀번호</label>
      <input type="password" class="hi-input" id="gate-pw" placeholder="비밀번호">
    </div>
    <div class="login-err" id="gate-err"></div>
    <button class="login-btn" id="gate-login-btn">접속하기</button>
  </div>
</div>

<!-- 어드민 -->
<div id="adminApp">
  <header class="adm-header">
    <div class="adm-logo">영정조 뇌구조도<span class="adm-badge">관리자 모드</span></div>
    <div class="adm-tabs">
      <button class="adm-tab active" data-tab="setting">SETTING</button>
      <button class="adm-tab" data-tab="answer">ANSWER</button>
    </div>
    <button class="adm-logout" id="logout-btn">로그아웃</button>
    <button class="adm-back" onclick="window.parent.closeAppAdmin&&window.parent.closeAppAdmin()">목록으로</button>
  </header>

  <div class="adm-body">
  <div class="admin-container">

    <!-- SETTING -->
    <div class="tab-panel active" id="tab-setting">
      <div class="section-card">
        <div class="section-title">키워드 풀
          <button class="btn btn-primary btn-sm" id="save-kw-btn" style="margin-left:auto">저장</button>
        </div>
        <div class="section-desc">학생 화면에 보기로 뜨는 목록입니다. 순서는 학번마다 다르게 섞이므로 여기서 맞출 필요가 없어요. "함정"은 다른 임금의 일이라 어디에 넣어도 틀린 것으로 셉니다.</div>
        <div class="kw-sum" id="kw-sum"></div>
        <div id="kw-editor"></div>
        <div style="display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn-ghost" id="add-kw-btn">키워드 추가</button>
          <button class="btn btn-ghost" id="reset-kw-btn">기본값으로 되돌리기</button>
        </div>
        <div class="save-msg" id="kw-msg"></div>
      </div>

      <div class="section-card">
        <div class="section-title">활동 규칙
          <button class="btn btn-primary btn-sm" id="save-rule-btn" style="margin-left:auto">저장</button>
        </div>
        <div class="section-desc">한 임금의 머릿속에 넣을 수 있는 칸 수와 까닭 한 줄의 길이입니다.</div>
        <div class="rule-row">
          <div class="rule-box">최대 <input type="number" class="meta-input" id="rule-max" min="1" max="10">칸</div>
          <div class="rule-box">제출하려면 최소 <input type="number" class="meta-input" id="rule-min" min="1" max="10">칸</div>
          <div class="rule-box">까닭 <input type="number" class="meta-input" id="rule-note" min="10" max="200">자</div>
        </div>
        <div class="save-msg" id="rule-msg"></div>
      </div>
    </div>

    <!-- ANSWER -->
    <div class="tab-panel" id="tab-answer">
      <div class="ans-head">
        <div class="class-filter" id="class-filter"></div>
        <div class="stats-row">
          <div class="stat-chip stat-combo" title="전체 / 제출 / 통과 / 미흡">
            <span class="thc-o" id="s-total">0</span><span class="thc-sep">/</span><span class="thc-o" id="s-sub">0</span><span class="thc-sep">/</span><span class="thc-g" id="s-pass">0</span><span class="thc-sep">/</span><span class="thc-r" id="s-fail">0</span>
          </div>
          <div class="stat-chip stat-avg" title="정답 키워드 평균 비율"><span class="thc-avg" id="s-avg">0%</span></div>
        </div>
      </div>
      <div class="adm-action-row">
        <button class="btn btn-primary btn-sm" id="autoscore-btn">자동 채점</button>
        <div class="thr-box">정답 키워드 <input type="number" class="thr-in" id="thr-rate" value="70" min="0" max="100">% 이상이고 함정이 없으면 통과</div>
        <div class="ans-right-group">
          <div class="sort-box">
            <button class="sort-btn active" id="sort-newest">최신순</button>
            <button class="sort-btn" id="sort-sid">학번순</button>
          </div>
        </div>
      </div>
      <div id="result-list"></div>
      <div class="legend" id="legend"></div>
    </div>

  </div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteField,collection,onSnapshot,writeBatch}
  from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "../../shared/firebase-config.js";
import { icon } from "../../shared/icons.js";
import { renderBrain, mergeConfig, DEFAULT_KEYWORDS, DEFAULT_CONFIG, SIDES, judge } from "./brain.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const rtdb = getDatabase(app);

const SIDE_OPTS = [
  { v:'yeongjo', t:'영조' },
  { v:'jeongjo', t:'정조' },
  { v:'both',    t:'둘 다 맞음' },
  { v:'trap',    t:'함정' }
];

let CFG = mergeConfig(null);
let KW = [];                 // 편집 중인 키워드 (저장 전에는 여기만 바뀐다)
let roster = [], works = [];
let currentFilter = '전체';
let answerSort = 'newest';
let worksUnsub = null;
const isEmbedded = window.self !== window.top;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function classNumOf(sid){ sid = String(sid || ''); if (sid.length < 3) return null; const c = parseInt(sid.slice(1,3),10); return isNaN(c) ? null : c; }
function kwById(id){ return CFG.keywords.find(k => k.id === id); }

/* ── 진입 ── */
async function initAdmin(){
  $('loginScreen').style.display = 'none';
  $('adminApp').classList.add('show');
  await Promise.all([loadConfig(), loadRoster()]);
  startListener();
}
if (isEmbedded){ document.documentElement.classList.add('has-own-back'); initAdmin(); }
else{
  onAuthStateChanged(auth, user => {
    if (user) initAdmin();
    else{
      $('loginScreen').style.display = '';
      $('adminApp').classList.remove('show');
      if (worksUnsub){ worksUnsub(); worksUnsub = null; }
    }
  });
}
$('gate-login-btn').addEventListener('click', async () => {
  const email = $('gate-email').value.trim(), pw = $('gate-pw').value;
  const errEl = $('gate-err'); errEl.classList.remove('show');
  try{ await signInWithEmailAndPassword(auth, email, pw); }
  catch(e){ errEl.textContent = '이메일 또는 비밀번호를 확인해 주세요.'; errEl.classList.add('show'); }
});
$('gate-pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('gate-login-btn').click(); });
$('logout-btn').addEventListener('click', () => signOut(auth));

document.querySelectorAll('.adm-tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.adm-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  $('tab-' + btn.dataset.tab).classList.add('active');
}));

/* ── 설정 읽기 ── */
async function loadConfig(){
  try{
    const snap = await getDoc(doc(db,'settings','j_brain_config'));
    CFG = mergeConfig(snap.exists() ? snap.data() : null);
  }catch(e){ CFG = mergeConfig(null); }
  KW = CFG.keywords.map(k => ({ ...k }));
  renderKw(); renderRules();
}
async function loadRoster(){
  try{
    const snap = await get(ref(rtdb,'students'));
    const d = snap.val() || {};
    roster = Object.values(d).filter(Boolean)
      .map(s => ({ studentId: String(s.studentId || s.id || '').trim(), name: s.name || '' }))
      .filter(s => s.studentId)
      .map(s => ({ ...s, classNum: classNumOf(s.studentId) }))
      .filter(s => s.classNum !== 0);
  }catch(e){ roster = []; }
}

/* ════════ SETTING ════════ */
function renderKw(){
  const count = v => KW.filter(k => k.side === v).length;
  $('kw-sum').innerHTML = SIDE_OPTS.map(o => `<span>${o.t} ${count(o.v)}</span>`).join('');
  $('kw-editor').innerHTML = KW.map((k, i) => `
    <div class="kw-row">
      <div class="kw-label"><input class="meta-input" data-i="${i}" data-f="label" value="${esc(k.label)}" placeholder="키워드"></div>
      <div class="kw-side">
        <select class="meta-input" data-i="${i}" data-f="side">
          ${SIDE_OPTS.map(o => `<option value="${o.v}"${k.side === o.v ? ' selected' : ''}>${o.t}</option>`).join('')}
        </select>
      </div>
      <button class="icon-btn" data-del="${i}" title="삭제"><span data-icon="x" data-icon-size="14"></span></button>
    </div>`).join('');

  $('kw-editor').querySelectorAll('input[data-f],select[data-f]').forEach(el => {
    el.addEventListener('input', () => {
      KW[+el.dataset.i][el.dataset.f] = el.value;
      if (el.dataset.f === 'side') renderKw();
      $('kw-msg').textContent = ''; $('kw-msg').classList.remove('ok');
    });
  });
  $('kw-editor').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    KW.splice(+b.dataset.del, 1); renderKw();
  }));
  injectIcons($('kw-editor'));
}

$('add-kw-btn').addEventListener('click', () => {
  KW.push({ id: 'k' + Date.now().toString(36), label: '', side: 'yeongjo' });
  renderKw();
});
$('reset-kw-btn').addEventListener('click', () => {
  if (!confirm('키워드 풀을 기본값으로 되돌릴까요? 저장을 눌러야 실제로 바뀝니다.')) return;
  KW = DEFAULT_KEYWORDS.map(k => ({ ...k }));
  renderKw();
});
$('save-kw-btn').addEventListener('click', async () => {
  const clean = KW.map(k => ({ id: k.id, label: String(k.label || '').trim(), side: k.side }))
                  .filter(k => k.label);
  if (!clean.length){ msg('kw-msg', '키워드가 하나도 없어요', false); return; }
  try{
    await setDoc(doc(db,'settings','j_brain_config'), { keywords: clean }, { merge: true });
    CFG.keywords = clean;
    KW = clean.map(k => ({ ...k }));
    renderKw();
    msg('kw-msg', '저장했습니다', true);
    renderResults();   // 채점 보조 표시가 새 기준을 따르게 한다
  }catch(e){ msg('kw-msg', '저장하지 못했어요', false); }
});

function renderRules(){
  $('rule-max').value = CFG.maxChips;
  $('rule-min').value = CFG.minChips;
  $('rule-note').value = CFG.noteMax;
}
$('save-rule-btn').addEventListener('click', async () => {
  const maxChips = Math.max(1, +$('rule-max').value || DEFAULT_CONFIG.maxChips);
  const minChips = Math.min(maxChips, Math.max(1, +$('rule-min').value || DEFAULT_CONFIG.minChips));
  const noteMax = Math.max(10, +$('rule-note').value || DEFAULT_CONFIG.noteMax);
  try{
    await setDoc(doc(db,'settings','j_brain_config'), { maxChips, minChips, noteMax }, { merge: true });
    CFG.maxChips = maxChips; CFG.minChips = minChips; CFG.noteMax = noteMax;
    renderRules();
    msg('rule-msg', '저장했습니다', true);
  }catch(e){ msg('rule-msg', '저장하지 못했어요', false); }
});

function msg(id, text, ok){
  const el = $(id);
  el.textContent = text;
  el.classList.toggle('ok', !!ok);
  if (ok) setTimeout(() => { el.textContent = ''; el.classList.remove('ok'); }, 2500);
}

/* ════════ ANSWER ════════ */
function startListener(){
  if (worksUnsub) worksUnsub();
  worksUnsub = onSnapshot(collection(db,'j_brain_works'), snap => {
    works = [];
    snap.forEach(d => { const v = d.data(); if (v.submittedAt) works.push({ id: d.id, ...v }); });
    renderClassFilter(); renderResults();
  });
}

function classList(){
  const set = new Set();
  roster.forEach(s => { if (s.classNum) set.add(s.classNum); });
  works.forEach(w => { const c = w.classNum || classNumOf(w.studentId); if (c) set.add(c); });
  return [...set].sort((a,b) => a - b);
}
function renderClassFilter(){
  const list = ['전체', ...classList().map(c => c + '반')];
  $('class-filter').innerHTML = list.map(c =>
    `<button class="cf-btn${c === currentFilter ? ' active' : ''}" data-c="${c}">${c}</button>`).join('');
  $('class-filter').querySelectorAll('.cf-btn').forEach(b => b.addEventListener('click', () => {
    currentFilter = b.dataset.c; renderClassFilter(); renderResults();
  }));
}
$('sort-newest').addEventListener('click', () => { answerSort = 'newest'; markSort(); renderResults(); });
$('sort-sid').addEventListener('click', () => { answerSort = 'sid'; markSort(); renderResults(); });
function markSort(){
  $('sort-newest').classList.toggle('active', answerSort === 'newest');
  $('sort-sid').classList.toggle('active', answerSort === 'sid');
}

function inFilter(w){
  if (currentFilter === '전체') return true;
  const c = w.classNum || classNumOf(w.studentId);
  return (c + '반') === currentFilter;
}
function chipsOf(w, side){ return Array.isArray(w[side]) ? w[side] : []; }

/* 정답 비율과 함정 개수. 채점 보조와 통계가 같은 셈을 쓴다. */
function tally(w){
  let ok = 0, total = 0, trap = 0;
  SIDES.forEach(s => chipsOf(w, s.key).forEach(c => {
    total++;
    const v = judge(kwById(c.k), s.key);
    if (v === 'ok') ok++;
    else if (v === 'trap') trap++;
  }));
  return { ok, total, trap, rate: total ? Math.round(ok / total * 100) : 0 };
}
function reviewSets(w, side){
  const ok = new Set(), trap = new Set();
  chipsOf(w, side).forEach(c => {
    const v = judge(kwById(c.k), side);
    if (v === 'ok') ok.add(c.k);
    else if (v === 'trap') trap.add(c.k);
  });
  return { ok, trap };
}
function timeOf(w){
  const t = w.submittedAt;
  if (!t) return 0;
  if (typeof t.toMillis === 'function') return t.toMillis();
  if (t.seconds) return t.seconds * 1000;
  return 0;
}
function timeText(w){
  const ms = timeOf(w);
  if (!ms) return '';
  const d = new Date(ms);
  const p = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderResults(){
  const list = works.filter(inFilter).slice();
  list.sort((a,b) => answerSort === 'sid'
    ? String(a.studentId).localeCompare(String(b.studentId))
    : timeOf(b) - timeOf(a));

  const totalStudents = currentFilter === '전체'
    ? roster.length
    : roster.filter(s => (s.classNum + '반') === currentFilter).length;
  const pass = list.filter(w => w.status === 'pass').length;
  const fail = list.filter(w => w.status === 'fail').length;
  const avg = list.length ? Math.round(list.reduce((s,w) => s + tally(w).rate, 0) / list.length) : 0;
  $('s-total').textContent = totalStudents || list.length;
  $('s-sub').textContent = list.length;
  $('s-pass').textContent = pass;
  $('s-fail').textContent = fail;
  $('s-avg').textContent = avg + '%';
  $('legend').textContent = list.length ? '초록은 맞게 넣은 것, 빨강은 그 임금의 일이 아닌 것, 줄이 그어진 것은 함정입니다.' : '';

  if (!list.length){
    $('result-list').innerHTML = '<div class="no-data">아직 낸 학생이 없어요</div>';
    return;
  }

  $('result-list').innerHTML = list.map(w => {
    const t = tally(w);
    const badge = w.status === 'pass' ? '<span class="status-badge sb-pass">통과</span>'
                : w.status === 'fail' ? '<span class="status-badge sb-fail">미흡</span>'
                : '<span class="status-badge sb-pending">미채점</span>';
    return `
    <div class="std-card" data-sid="${esc(w.studentId)}">
      <div class="std-card-head">
        <div class="std-who"><span class="std-sid">${esc(w.studentId)}</span><span class="std-name">${esc(w.name)}</span></div>
        <div class="std-status">
          <span class="std-meta-time">${timeText(w)}</span>
          <span class="score-pill">${t.ok}/${t.total}</span>
          ${t.trap ? `<span class="status-badge sb-fail">함정 ${t.trap}</span>` : ''}
          ${badge}
        </div>
      </div>
      <div class="card-body-open">
        <div class="pair">
          ${SIDES.map(s => `
            <div>
              <div class="pair-col-h" data-side="${s.key}">${s.name}</div>
              <div data-brain="${esc(w.studentId)}-${s.key}"></div>
              <div class="note-list">${chipsOf(w, s.key).map(c => {
                const v = judge(kwById(c.k), s.key);
                const mark = v === 'ok' ? '<span class="nm nm-ok">맞음</span>'
                           : v === 'trap' ? '<span class="nm nm-no">함정</span>'
                           : '<span class="nm nm-no">다름</span>';
                return `<div class="note-item"><b>${esc(c.label)}</b>${mark} <span style="opacity:.55">${c.w}칸</span><br>${esc(c.note || '')}</div>`;
              }).join('')}</div>
            </div>`).join('')}
        </div>
        <div class="score-btns">
          <button class="ssb ssb-pass${w.status === 'pass' ? ' active' : ''}" data-mark="pass" data-sid="${esc(w.studentId)}">통과</button>
          <button class="ssb ssb-fail${w.status === 'fail' ? ' active' : ''}" data-mark="fail" data-sid="${esc(w.studentId)}">미흡</button>
        </div>
      </div>
    </div>`;
  }).join('');

  /* 펼친 카드만 그림을 그린다 — 한 반이 30장이면 미리보기 60개를 미리 그릴 이유가 없다. */
  $('result-list').querySelectorAll('.std-card-head').forEach(h => h.addEventListener('click', () => {
    const card = h.parentElement;
    const open = card.classList.toggle('open');
    if (open) drawCard(card);
  }));
  $('result-list').querySelectorAll('[data-mark]').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    const sid = b.dataset.sid, want = b.dataset.mark;
    const w = works.find(x => x.studentId === sid);
    const next = (w && w.status === want) ? null : want;   // 같은 것을 다시 누르면 미채점으로
    try{
      await updateDoc(doc(db,'j_brain_works', sid), { status: next === null ? deleteField() : next });
    }catch(err){}
  }));
}

function drawCard(card){
  const sid = card.dataset.sid;
  const w = works.find(x => x.studentId === sid);
  if (!w) return;
  SIDES.forEach(s => {
    const box = card.querySelector(`[data-brain="${CSS.escape(sid + '-' + s.key)}"]`);
    if (box && !box.firstChild) renderBrain(box, { side: s.key, chips: chipsOf(w, s.key), review: reviewSets(w, s.key) });
  });
}

/* 자동 채점 — 아직 손대지 않은(미채점) 학생만 매긴다.
   선생님이 이미 눌러 둔 판정을 뒤집지 않는 것이 규칙이다. */
$('autoscore-btn').addEventListener('click', async () => {
  const need = Math.max(0, Math.min(100, +$('thr-rate').value || 0));
  const targets = works.filter(inFilter).filter(w => w.status !== 'pass' && w.status !== 'fail');
  if (!targets.length){ alert('채점할 학생이 없어요.'); return; }
  const batch = writeBatch(db);
  targets.forEach(w => {
    const t = tally(w);
    const allNoted = SIDES.every(s => chipsOf(w, s.key).every(c => String(c.note || '').trim().length >= 2));
    const pass = t.trap === 0 && t.rate >= need && allNoted && t.total > 0;
    batch.update(doc(db,'j_brain_works', w.studentId), { status: pass ? 'pass' : 'fail' });
  });
  try{ await batch.commit(); }
  catch(e){ alert('채점을 저장하지 못했어요.'); }
});

/* 정적 HTML에 박힌 아이콘 주입 */
function injectIcons(root = document){
  root.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = icon(el.dataset.icon, el.dataset.iconSize ? +el.dataset.iconSize : 24);
  });
}
injectIcons();
</script>
