<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영조와 정조의 머릿속을 들여다보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
/* 두 임금을 색으로 갈라 둔다. 갤러리에서 두 머리가 나란히 서므로 색이 곧 이름표다.
   프리셋(hi-preset-paper)이 --hi-* 를 body 에서 정하므로 이 묶음도 body 에 둔다 —
   :root 에 두면 --hi-text 가 프리셋 이전의 기본값(흰색)으로 굳어 글자가 안 보인다.
   프리셋의 누런 금색(#b8860b)은 머리 그림이 흰 바탕이라 종이째 바랜 것처럼 보였다.
   같은 프리셋을 쓰는 다른 앱은 건드리지 않고 이 앱에서만 먹빛 남색으로 갈아 끼운다. */
body{
  --hi-bg-base:#EFF1F5;
  --hi-bg-surface:rgba(255,255,255,.62);
  --hi-bg-mid:rgba(255,255,255,.5);
  --hi-bg-card:rgba(255,255,255,.74);
  --hi-bg-elevated:#ffffff;
  --hi-text:#17202C;
  --hi-text-soft:#2E3B4D;
  --hi-text-muted:#6E7C8E;
  --hi-border:rgba(40,60,90,.18);
  --hi-border-light:rgba(40,60,90,.42);
  --hi-border-faint:rgba(40,60,90,.1);
  --hi-accent:#3A5A8C;
  --hi-accent-hover:#2C4670;
  --hi-accent-strong:#24406B;
  --hi-accent-soft:rgba(58,90,140,.12);

  --bm-yeongjo:#2F5D62;
  --bm-jeongjo:#8B2F3F;
  --bm-ink:var(--hi-text);
  --bm-ok:#166534;
  --bm-no:#B91C1C;
}
body{background:var(--hi-bg-base);color:var(--hi-text);font-family:'Pretendard',sans-serif;margin:0;
  min-height:100vh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 40px}
.screen{display:none}
.screen.active{display:block}

/* 머리글 */
.bm-head{text-align:center;margin-bottom:18px}
.bm-title{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:900;margin:0 0 12px;color:var(--hi-text);line-height:1.4;word-break:keep-all}
/* 인트로 — 선생님이 어드민에서 고치는 글. 문단이 여럿이라 가운데 정렬 대신 양끝을 맞춘다. */
.bm-intro{text-align:left;background:var(--hi-bg-surface);border:1px solid var(--hi-border);border-radius:14px;
  padding:16px 16px 4px;margin-bottom:12px}
.bm-intro p{margin:0 0 12px;font-size:13.5px;color:var(--hi-text-soft);line-height:1.85;word-break:keep-all}
.bm-lead{font-size:13.5px;font-weight:700;color:var(--hi-accent-strong);line-height:1.7;word-break:keep-all}

/* 인물 탭 */
.side-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.side-tab{flex:1;max-width:180px;padding:12px 8px;border-radius:12px;border:1.5px solid var(--hi-border);
  background:var(--hi-bg-surface);font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;
  color:var(--hi-text-muted);cursor:pointer;transition:.15s;line-height:1.3}
.side-tab.on{color:#fff;border-color:transparent}
.side-tab.on[data-side="yeongjo"]{background:var(--bm-yeongjo)}
.side-tab.on[data-side="jeongjo"]{background:var(--bm-jeongjo)}
.side-count{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;
  background:var(--hi-accent-soft);color:var(--hi-text-soft);font-family:'Pretendard',sans-serif;font-size:12px;font-weight:800}
.side-tab.on .side-count{background:rgba(255,255,255,.25);color:#fff}

/* 무대 — 머리 그림의 바탕이 흰색이라 상자도 흰색으로 둔다(그림의 네모가 드러나지 않게). */
.stage-box{background:#fff;border:1px solid var(--hi-border-faint);border-radius:16px;padding:8px 6px 10px;margin-bottom:12px}

/* 고른 칩 편집 */
.editor{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:14px;padding:14px;margin-bottom:14px}
.ed-hint{font-size:13px;color:var(--hi-text-muted);text-align:center;line-height:1.7;word-break:keep-all;padding:6px 0}
.ed-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ed-name{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:900;flex:1;min-width:0}
.ed-row{margin-bottom:12px}
.ed-lbl{font-size:12px;font-weight:800;color:var(--hi-text-muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ed-lbl .ed-wname{margin-left:auto;color:var(--hi-accent-strong);font-weight:800}
.ed-range{width:100%;accent-color:var(--hi-accent);height:26px}
/* 눈금 양끝의 뜻을 같이 적어 둔다 — 가운데 이름만 바뀌면 어느 쪽으로 밀어야 큰지 모른다. */
.ed-scale{display:flex;justify-content:space-between;gap:10px;margin-top:-2px;
  font-size:11px;font-weight:700;color:var(--hi-text-muted);word-break:keep-all}
.ed-scale span:last-child{text-align:right}
.ed-note{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--hi-border);border-radius:10px;
  background:var(--hi-bg-elevated);font-family:inherit;font-size:14px;color:var(--hi-text);outline:none;resize:none;
  line-height:1.7;overflow:hidden}
.ed-note:focus{border-color:var(--hi-border-light)}

/* 키워드 서랍 — 오와 열을 맞춘 격자. 알약이 아니라 네모 칸이다. */
.pool-box{margin-bottom:16px}
.pool-title{font-size:12px;font-weight:800;color:var(--hi-text-muted);margin-bottom:8px;text-align:center;letter-spacing:.04em}
.pool{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pool-item{display:flex;align-items:center;justify-content:center;min-height:46px;padding:8px 6px;
  border-radius:9px;border:1.5px solid var(--hi-border);background:var(--hi-bg-surface);
  font-family:inherit;font-size:13px;font-weight:700;color:var(--hi-text-soft);cursor:pointer;transition:.12s;
  text-align:center;line-height:1.35;word-break:keep-all}
.pool-item:hover{border-color:var(--hi-border-light)}
.pool-item.used{opacity:.4;text-decoration:line-through;text-decoration-thickness:1px}
@media(max-width:420px){.pool{grid-template-columns:repeat(3,1fr)}}

/* 아래 버튼 */
.footbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.b{padding:13px 26px;border-radius:12px;border:none;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:.15s}
.b-main{background:var(--hi-accent);color:#fff}
.b-main:hover{background:var(--hi-accent-hover)}
.b-ghost{background:var(--hi-bg-surface);border:1.5px solid var(--hi-border);color:var(--hi-text-soft)}
.b-ghost:hover{border-color:var(--hi-border-light);color:var(--hi-text)}
.b-sm{padding:8px 15px;font-size:13px;border-radius:10px}
.done-note{text-align:center;font-size:12px;color:var(--hi-text-muted);margin-bottom:10px}

/* 제출 완료 */
.done-card{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:18px;
  padding:34px 22px;text-align:center;margin-bottom:16px}
.done-ico{color:var(--hi-accent);margin-bottom:10px;line-height:0}
.done-t{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:900;margin-bottom:8px;word-break:keep-all}
.done-d{font-size:13.5px;color:var(--hi-text-muted);line-height:1.8;word-break:keep-all}
/* 제출 뒤 할 수 있는 일은 세로로 한 줄씩 — 폰에서 가로로 늘어놓으면 글자가 접혀 읽기 나쁘다. */
.done-acts{display:flex;flex-direction:column;gap:9px;max-width:340px;margin:0 auto}
.done-acts .b{width:100%}

/* 갤러리 — 한 사람씩 넘겨 보는 슬라이드. 학번 차례로 늘어선다. */
.gal-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.gal-head .bm-title{margin:0;font-size:22px;flex:1;text-align:left}
.gal-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.gal-arrow{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--hi-border);
  background:var(--hi-bg-surface);color:var(--hi-text-soft);font-size:20px;font-weight:800;line-height:1;cursor:pointer}
.gal-arrow:disabled{opacity:.3;cursor:default}
.gal-who{flex:1;min-width:0;text-align:center}
.gal-name{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:900;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal-me{color:var(--hi-accent-strong)}
.gal-count{font-size:12px;font-weight:700;color:var(--hi-text-muted);margin-top:2px}
.gal-bar{height:3px;border-radius:3px;background:var(--hi-border-faint);overflow:hidden;margin-bottom:14px}
.gal-bar i{display:block;height:100%;background:var(--hi-accent);transition:width .18s}
.gal-empty{text-align:center;padding:50px 20px;color:var(--hi-text-muted);font-size:14px;line-height:1.8}

/* 슬라이드 한 장(임금 하나 = 한 묶음) */
.gal-sec{margin-top:16px}
.gal-sec:first-child{margin-top:0}
.gal-sec-h{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:900;text-align:center;margin-bottom:8px}
.gal-sec-h[data-side="yeongjo"]{color:var(--bm-yeongjo)}
.gal-sec-h[data-side="jeongjo"]{color:var(--bm-jeongjo)}
.gal-sec [data-big]{background:#fff;border:1px solid var(--hi-border-faint);border-radius:14px;padding:6px}
.gal-notes{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.gal-note{background:var(--hi-bg-card);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.6;color:var(--hi-text-soft)}
.gal-note b{color:var(--hi-text);font-weight:800}

/* 로그인 안내 */
.gate{background:var(--hi-bg-surface);border:1px solid var(--hi-border);border-radius:16px;padding:44px 22px;text-align:center}
.gate-t{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:900;margin-bottom:8px}
.gate-d{font-size:13px;color:var(--hi-text-muted);line-height:1.8}

@media(max-width:600px){
  .bm-title{font-size:24px}
}
</style>
<script src="/hoistory/pwa.js"></script>
</head>
<body class="hi-preset-paper">

<div class="wrap">

  <!-- 만들기 -->
  <div class="screen active" id="screen-make">
    <div class="gate" id="gate" style="display:none">
      <div class="gate-t">로그인이 필요해요</div>
      <div class="gate-d">수업 홈에서 로그인한 뒤 이 활동으로 들어와 주세요.</div>
    </div>

    <div id="make-main" style="display:none">
      <div class="bm-head">
        <h1 class="bm-title">영조와 정조의 머릿속을 들여다보기</h1>
        <div class="bm-intro" id="intro"></div>
        <div class="bm-lead">두 임금의 머릿속을 채워 보세요. 크게 넣을수록 그 일에 더 마음을 쏟았다는 뜻입니다.</div>
      </div>

      <div class="side-tabs" id="side-tabs"></div>

      <div class="stage-box"><div id="stage"></div></div>

      <div class="editor" id="editor"></div>

      <div class="pool-box">
        <div class="pool-title">머릿속에 넣을 것 고르기</div>
        <div class="pool" id="pool"></div>
      </div>

      <div class="done-note" id="done-note"></div>
      <div class="footbar">
        <button class="b b-main" id="submit-btn">제출하기</button>
        <button class="b b-ghost" id="reset-btn">배치 초기화</button>
        <button class="b b-ghost" id="gallery-btn" style="display:none">친구들 작품 보기</button>
      </div>
    </div>
  </div>

  <!-- 제출 완료 -->
  <div class="screen" id="screen-done">
    <div class="done-card">
      <div class="done-ico" id="done-ico"></div>
      <div class="done-t">두 임금의 머릿속이 완성됐어요</div>
      <div class="done-d">친구들은 무엇을 크게 그렸는지 보러 가 볼까요.<br>고쳐서 다시 낼 수도 있습니다.</div>
    </div>
    <div class="done-acts">
      <button class="b b-main" id="done-gallery">친구들 작품 보기</button>
      <button class="b b-ghost" id="done-edit">다시 제출하기</button>
      <button class="b b-ghost" id="done-reset">배치 초기화</button>
    </div>
  </div>

  <!-- 갤러리 -->
  <div class="screen" id="screen-gallery">
    <div class="gal-head">
      <h1 class="bm-title">우리 반 뇌구조도</h1>
      <button class="b b-ghost b-sm" id="gal-back">돌아가기</button>
    </div>
    <div id="gal-body"></div>
  </div>

</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp,collection,query,where,getDocs}
  from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import "../../shared/offline.js";
import { firebaseConfig } from "../../shared/firebase-config.js";
import { showToast } from "../../shared/toast.js";
import { containsBadWord } from "../../shared/profanity.js";
import { blockPaste, trimCompact } from "../../shared/textLimit.js?v=20260901";
import { icon } from "../../shared/icons.js";
import { renderBrain, nextSpot, mergeConfig, chipEm, SIDES, sideName, WEIGHTS, NOTE_HARD_CAP } from "./brain.js";

/* 근거는 학생이 직접 쓴 것이어야 한다 — 붙여넣기를 막는다. */
blockPaste(document, { notice: true });

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let CFG = mergeConfig(null);
let student = null;
let side = 'yeongjo';
let data = { yeongjo: [], jeongjo: [] };
let selected = null;
let submittedAt = null;
let stageEl = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chipsOf = s => data[s] || (data[s] = []);
const kwById = id => CFG.keywords.find(k => k.id === id);
function classNumOf(sid){ sid = String(sid || ''); if (sid.length < 3) return null; const c = parseInt(sid.slice(1,3),10); return isNaN(c) ? null : c; }

/* ── 학생 확인 (LMS가 남긴 값을 읽는다, 자체 로그인 없음) ── */
function getStudent(){
  const sid = sessionStorage.getItem('lms_sid') || localStorage.getItem('lms_autosave_sid');
  const nm  = sessionStorage.getItem('lms_sname') || localStorage.getItem('lms_autosave_sname');
  if (!sid || !nm || String(sid).length < 5) return null;
  return { studentId: String(sid), name: nm, classNum: classNumOf(sid) };
}

/* ── 임시 보관 (제출 전에는 이 기기에만 둔다) ── */
const draftKey = () => 'j_brain_draft_' + (student ? student.studentId : 'x');
function saveDraft(){
  try{ localStorage.setItem(draftKey(), JSON.stringify(data)); }catch(e){}
}
function loadDraft(){
  try{
    const raw = localStorage.getItem(draftKey());
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.yeongjo) && Array.isArray(d.jeongjo)) return d;
  }catch(e){}
  return null;
}

/* ── 시작 ── */
async function init(){
  try{
    const snap = await getDoc(doc(db,'settings','j_brain_config'));
    CFG = mergeConfig(snap.exists() ? snap.data() : null);
  }catch(e){ CFG = mergeConfig(null); }

  student = getStudent();
  if (!student){ $('gate').style.display = 'block'; return; }
  $('make-main').style.display = 'block';

  try{
    const snap = await getDoc(doc(db,'j_brain_works',student.studentId));
    if (snap.exists()){
      const d = snap.data();
      data.yeongjo = Array.isArray(d.yeongjo) ? d.yeongjo : [];
      data.jeongjo = Array.isArray(d.jeongjo) ? d.jeongjo : [];
      submittedAt = d.submittedAt || null;
    }
  }catch(e){}

  /* 낸 뒤에 고치던 중이던 것이 있으면 그쪽이 더 최근이다. */
  const draft = loadDraft();
  if (draft && (draft.yeongjo.length || draft.jeongjo.length)) data = draft;

  renderIntro(); renderTabs(); renderStage(); renderEditor(); renderPool(); renderFoot();
}

/* ── 인트로 (어드민에서 고친 글) ── */
function renderIntro(){
  const paras = String(CFG.intro || '').split(/\n\s*\n/).map(t => t.trim()).filter(Boolean);
  $('intro').innerHTML = paras.map(t => `<p>${esc(t).replace(/\n/g,'<br>')}</p>`).join('');
  $('intro').style.display = paras.length ? '' : 'none';
}

/* ── 인물 탭 ── */
function renderTabs(){
  $('side-tabs').innerHTML = SIDES.map(s => `
    <button class="side-tab${s.key === side ? ' on' : ''}" data-side="${s.key}">
      ${s.name}<span class="side-count">${chipsOf(s.key).length}</span>
    </button>`).join('');
  $('side-tabs').querySelectorAll('.side-tab').forEach(b => b.addEventListener('click', () => {
    if (side === b.dataset.side) return;
    side = b.dataset.side; selected = null;
    renderTabs(); renderStage(); renderEditor(); renderPool();
  }));
}

/* ── 머리 ── */
function renderStage(){
  stageEl = renderBrain($('stage'), {
    side, chips: chipsOf(side), selected, live: true,
    emptyText: '아래에서 키워드를 골라 ' + sideName(side) + '의 머릿속을 채워 보세요',
    onPick: k => { selected = (selected === k ? null : k); renderStage(); renderEditor(); },
    onMove: () => saveDraft()
  });
}

/* ── 고른 칩 편집 ── */
function renderEditor(){
  const box = $('editor');
  const chip = chipsOf(side).find(c => c.k === selected);
  if (!chip){
    box.innerHTML = '<div class="ed-hint">머릿속에 넣은 것을 누르면 크기와 그렇게 본 까닭을 적을 수 있어요.</div>';
    return;
  }
  const wname = (WEIGHTS.find(w => w.w === chip.w) || WEIGHTS[1]).label;
  box.innerHTML = `
    <div class="ed-top">
      <div class="ed-name">${esc(chip.label)}</div>
      <button class="b b-ghost b-sm" id="ed-del">빼기</button>
    </div>
    <div class="ed-row">
      <div class="ed-lbl">머릿속에서 차지한 크기<span class="ed-wname" id="ed-wname">${esc(wname)}</span></div>
      <input type="range" class="ed-range" id="ed-range" min="1" max="5" step="1" value="${chip.w}">
      <div class="ed-scale"><span>${esc(WEIGHTS[0].label)}</span><span>${esc(WEIGHTS[WEIGHTS.length-1].label)}</span></div>
    </div>
    <div class="ed-row" style="margin-bottom:0">
      <div class="ed-lbl">그렇게 본 까닭</div>
      <textarea class="ed-note" id="ed-note" rows="3" placeholder="왜 이만큼 마음을 쏟았을까요"></textarea>
    </div>`;

  const noteEl = $('ed-note');
  noteEl.value = chip.note || '';
  /* 글자 수를 세지 않으므로 칸이 글에 맞춰 자란다(길게 써도 스크롤 속에 가려지지 않게). */
  const grow = () => { noteEl.style.height = 'auto'; noteEl.style.height = noteEl.scrollHeight + 'px'; };
  grow();
  noteEl.addEventListener('input', () => {
    chip.note = noteEl.value;
    grow();
    saveDraft();
    /* 글자를 칠 때마다 머리를 다시 그리면 글쓰던 칸에서 커서가 빠져나간다.
       구름 테두리(점선 = 아직 안 씀 / 실선 = 씀)만 갈아 끼운다. */
    const node = stageEl && stageEl.querySelector('.bm-chip[data-k="' + CSS.escape(chip.k) + '"]');
    if (node) node.classList.toggle('bm-open', !chip.note);
  });

  /* 끄는 동안에는 글자 크기만 바로 바꿔 보여 주고, 손을 뗄 때 머리를 다시 그린다.
     커진 글자가 머릿속을 벗어났는지는 상자를 다시 재 봐야 알 수 있는데(renderBrain이
     그려 놓고 재서 밀어 넣는다) 그 일을 손가락이 움직이는 내내 할 필요는 없다. */
  $('ed-range').addEventListener('input', e => {
    chip.w = +e.target.value;
    $('ed-wname').textContent = (WEIGHTS.find(w => w.w === chip.w) || WEIGHTS[1]).label;
    const node = stageEl && stageEl.querySelector('.bm-chip[data-k="' + CSS.escape(chip.k) + '"]');
    if (node) node.style.fontSize = chipEm(chip.w) + 'em';
  });
  $('ed-range').addEventListener('change', () => { renderStage(); saveDraft(); });

  $('ed-del').addEventListener('click', () => {
    data[side] = chipsOf(side).filter(c => c.k !== chip.k);
    selected = null; saveDraft();
    renderTabs(); renderStage(); renderEditor(); renderPool(); renderFoot();
  });
}

/* ── 키워드 서랍 ──
   순서를 섞되 학번으로 섞어 둔다. 새로 고칠 때마다 자리가 바뀌면 찾던 것을 다시 찾아야 한다.
   함정을 눈에 띄지 않게 하려는 것이므로 정답끼리 모여 있지 않게만 하면 된다. */
function shuffled(list, seedStr){
  let seed = 0; String(seedStr || '').split('').forEach(ch => { seed = (seed * 31 + ch.charCodeAt(0)) >>> 0; });
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--){
    seed = (seed * 1103515245 + 12345) >>> 0;
    const j = seed % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function renderPool(){
  const used = new Set(chipsOf(side).map(c => c.k));
  const list = shuffled(CFG.keywords, student ? student.studentId : 'x');
  $('pool').innerHTML = list.map(k =>
    `<button class="pool-item${used.has(k.id) ? ' used' : ''}" data-id="${esc(k.id)}">${esc(k.label)}</button>`).join('');
  $('pool').querySelectorAll('.pool-item').forEach(b => b.addEventListener('click', () => addChip(b.dataset.id)));
}

function addChip(id){
  const kw = kwById(id);
  if (!kw) return;
  const chips = chipsOf(side);
  if (chips.some(c => c.k === id)){
    /* 이미 놓인 것을 다시 누르면 그 칩을 고른 상태로 만든다(빼려는 손이 헤매지 않게). */
    selected = id; renderStage(); renderEditor(); return;
  }
  if (chips.length >= CFG.maxChips){
    showToast(sideName(side) + '의 머릿속은 ' + CFG.maxChips + '칸까지예요', 'info');
    return;
  }
  const p = nextSpot(chips);
  chips.push({ k: id, label: kw.label, w: 3, x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10, note: '' });
  selected = id; saveDraft();
  renderTabs(); renderStage(); renderEditor(); renderPool(); renderFoot();
}

/* ── 아래 버튼 ── */
function renderFoot(){
  $('submit-btn').textContent = submittedAt ? '다시 제출하기' : '제출하기';
  $('gallery-btn').style.display = submittedAt ? '' : 'none';
  $('done-note').textContent = submittedAt ? '이미 한 번 냈어요. 고쳐서 다시 낼 수 있습니다.' : '';
}

function firstGap(){
  for (const s of SIDES){
    const chips = chipsOf(s.key);
    if (chips.length < CFG.minChips) return s.name + '의 머릿속이 아직 덜 찼어요';
    const empty = chips.find(c => trimCompact(c.note).length < 2);
    if (empty) return s.name + '의 "' + empty.label + '"에 까닭을 적어 주세요';
    const bad = chips.find(c => containsBadWord(c.note));
    if (bad) return '바르지 않은 말이 섞여 있어요';
  }
  return null;
}

$('submit-btn').addEventListener('click', async () => {
  const gap = firstGap();
  if (gap){ showToast(gap, 'info'); return; }
  const btn = $('submit-btn');
  btn.disabled = true;
  try{
    const pack = s => ({ chips: chipsOf(s).map(c => ({
      k: c.k, label: c.label, w: c.w,
      x: Math.round(c.x * 10) / 10, y: Math.round(c.y * 10) / 10,
      note: trimCompact(c.note).slice(0, NOTE_HARD_CAP)
    })) });
    await setDoc(doc(db,'j_brain_works',student.studentId), {
      studentId: student.studentId, name: student.name, classNum: student.classNum,
      yeongjo: pack('yeongjo').chips, jeongjo: pack('jeongjo').chips,
      submittedAt: serverTimestamp()
    }, { merge: true });
    submittedAt = true;
    renderFoot();
    /* 낸 뒤에 할 수 있는 일(다시 내기·초기화·친구들 작품)을 한 화면에 모아 둔다.
       잠깐 떴다 사라지는 축하 팝업으로는 그 다음에 무엇을 하면 되는지가 남지 않는다. */
    showScreen('screen-done');
  }catch(e){
    showToast('제출하지 못했어요. 잠시 뒤에 다시 눌러 주세요', 'error');
  }
  btn.disabled = false;
});

/* ── 배치 초기화 ──
   두 임금을 한꺼번에 비운다(한쪽만 비우는 일은 칩을 눌러 [빼기]로 한다).
   되돌릴 수 없으므로 한 번 더 묻는다. 이미 낸 뒤라면 제출한 것은 그대로 두고
   이 기기에서 고치던 것만 지운다 — 다시 내야 서버의 것이 바뀐다. */
function resetAll(){
  const n = chipsOf('yeongjo').length + chipsOf('jeongjo').length;
  if (!n){ showToast('아직 넣은 키워드가 없어요', 'info'); return false; }
  if (!confirm('두 임금의 머릿속에 넣은 키워드 ' + n + '개를 모두 지울까요?\n적어 둔 까닭도 함께 지워지고 되돌릴 수 없어요.')) return false;
  data = { yeongjo: [], jeongjo: [] };
  selected = null;
  saveDraft();
  renderTabs(); renderStage(); renderEditor(); renderPool(); renderFoot();
  showToast('머릿속을 비웠어요', 'info');
  return true;
}
$('reset-btn').addEventListener('click', resetAll);

/* ── 제출 완료 화면 ── */
$('done-ico').innerHTML = icon('crown', 40);
$('done-gallery').addEventListener('click', openGallery);
$('done-edit').addEventListener('click', () => showScreen('screen-make'));
/* 비운 뒤에는 만들기 화면으로 보낸다 — 텅 빈 채로 완료 화면에 남아 있으면
   무엇을 해야 하는지 알 수 없다. 낸 것은 서버에 그대로 있고, 다시 내야 바뀐다. */
$('done-reset').addEventListener('click', () => { if (resetAll()) showScreen('screen-make'); });

/* ── 갤러리 ── */
$('gallery-btn').addEventListener('click', openGallery);
$('gal-back').addEventListener('click', () => showScreen(galFrom));

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

let galWorks = [];
let galAt = 0;
let galFrom = 'screen-make';   // 갤러리에 들어오기 전 화면 — [돌아가기]가 여기로 돌려보낸다
async function openGallery(){
  galFrom = document.querySelector('.screen.active')?.id || 'screen-make';
  showScreen('screen-gallery');
  $('gal-body').innerHTML = '<div class="gal-empty">불러오는 중이에요</div>';
  try{
    const q = query(collection(db,'j_brain_works'), where('classNum','==', student.classNum));
    const snap = await getDocs(q);
    galWorks = [];
    snap.forEach(d => { const v = d.data(); if (v.submittedAt) galWorks.push(v); });
    galWorks.sort((a,b) => String(a.studentId).localeCompare(String(b.studentId)));
  }catch(e){
    $('gal-body').innerHTML = '<div class="gal-empty">작품을 불러오지 못했어요</div>';
    return;
  }
  /* 내 것이 있으면 거기서부터 본다 — 스물몇 장을 처음부터 넘겨 찾게 하지 않는다. */
  const mine = galWorks.findIndex(w => String(w.studentId) === String(student.studentId));
  galAt = mine >= 0 ? mine : 0;
  buildGallery();
}

/* 학번 뒤 두 자리가 번호다(학번 = 학년1 + 반2 + 번호2). 길이가 다르면 번호를 적지 않는다. */
function galNoOf(sid){
  sid = String(sid || '');
  if (sid.length !== 5) return '';
  const n = parseInt(sid.slice(3), 10);
  return isNaN(n) ? '' : n + '번 ';
}

/* 틀은 한 번만 만들고, 넘길 때마다 속(이름·머리·까닭)만 갈아 끼운다. */
function buildGallery(){
  if (!galWorks.length){
    $('gal-body').innerHTML = '<div class="gal-empty">아직 낸 친구가 없어요</div>';
    return;
  }
  $('gal-body').innerHTML = `
    <div class="gal-nav">
      <button class="gal-arrow" id="gal-prev" aria-label="앞 사람">&#8249;</button>
      <div class="gal-who">
        <div class="gal-name" id="gal-name"></div>
        <div class="gal-count" id="gal-count"></div>
      </div>
      <button class="gal-arrow" id="gal-next" aria-label="뒷사람">&#8250;</button>
    </div>
    <div class="gal-bar"><i id="gal-bar"></i></div>
    <div id="gal-slide"></div>`;
  $('gal-prev').addEventListener('click', () => galGo(-1));
  $('gal-next').addEventListener('click', () => galGo(1));
  bindGalSwipe($('gal-slide'));
  renderGalSlide();
}

function galGo(step){
  const at = galAt + step;
  if (at < 0 || at >= galWorks.length) return;
  galAt = at;
  renderGalSlide();
  /* 넘기면 머리 그림이 위에서부터 보이게 한다(까닭을 읽다 넘겼을 때 중간부터 시작하지 않게). */
  $('gal-body').scrollIntoView({ block:'start', behavior:'smooth' });
}

function renderGalSlide(){
  const w = galWorks[galAt];
  const me = String(w.studentId) === String(student.studentId);
  $('gal-name').innerHTML = esc(galNoOf(w.studentId) + w.name) + (me ? ' <span class="gal-me">(나)</span>' : '');
  $('gal-count').textContent = (galAt + 1) + ' / ' + galWorks.length;
  $('gal-bar').style.width = ((galAt + 1) / galWorks.length * 100) + '%';
  $('gal-prev').disabled = galAt === 0;
  $('gal-next').disabled = galAt === galWorks.length - 1;

  $('gal-slide').innerHTML = SIDES.map(s => `
    <div class="gal-sec">
      <div class="gal-sec-h" data-side="${s.key}">${s.name}</div>
      <div data-big="${s.key}"></div>
      <div class="gal-notes">${(w[s.key] || []).map(c =>
        `<div class="gal-note"><b>${esc(c.label)}</b> ${esc(c.note || '')}</div>`).join('')}</div>
    </div>`).join('');
  SIDES.forEach(s => renderBrain($('gal-slide').querySelector('[data-big="'+s.key+'"]'),
    { side: s.key, chips: w[s.key] || [] }));
}

/* 폰에서는 화살표를 누르기보다 밀어 넘긴다. 세로로 긁어 내리는 것과 갈라야 하므로
   가로로 더 많이(그리고 충분히) 움직였을 때만 넘긴다. */
function bindGalSwipe(el){
  let sx = 0, sy = 0, on = false;
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1){ on = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; on = true;
  }, { passive:true });
  el.addEventListener('touchend', e => {
    if (!on) return;
    on = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) galGo(dx < 0 ? 1 : -1);
  }, { passive:true });
}

/* 교실 화면(마우스·키보드)에서는 화살표 키로 넘긴다. */
document.addEventListener('keydown', e => {
  if (!$('screen-gallery').classList.contains('active')) return;
  if (e.key === 'ArrowLeft') galGo(-1);
  else if (e.key === 'ArrowRight') galGo(1);
});

init();
</script>
</body>
</html>
