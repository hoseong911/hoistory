<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사화에서 살아남기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 미니멀 스크롤바: 브라우저 기본 알약형 대신 얇고 은은하게.
     표준 속성(scrollbar-width/color)을 함께 걸면 Chrome 121+가 webkit 규칙을
     통째로 무시해 화살표가 되살아나므로, 표준 속성은 Firefox에만 건다. */
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-button{display:none;width:0;height:0}
  *::-webkit-scrollbar-thumb{background:rgba(90,84,72,.38);border-radius:4px}
  *::-webkit-scrollbar-thumb:hover{background:rgba(90,84,72,.6)}
  *::-webkit-scrollbar-corner{background:transparent}
  @supports (-moz-appearance:none){*{scrollbar-width:thin;scrollbar-color:rgba(90,84,72,.4) transparent}}
  :root{
    --paper:#DDD8C4;
    --paper-panel:#E8E4D4;
    --paper-deep:#CDC7B0;
    --ink:#23201A;
    --ink-soft:#5F594B;
    --ink-faint:#8C8674;
    --rule:#A8322D;
    --seal:#B32B21;
    --dong:#2E4A62;
    --seo:#7A5C1E;
    --serif:'Hahmlet','Nanum Myeongjo',Batang,바탕,serif;
    --sans:'IBM Plex Sans KR','Malgun Gothic',맑은 고딕,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:300;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  /* 지본(紙本) 결 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(35,32,26,.035) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 20% 10%, rgba(120,105,70,.10), transparent 60%),
      radial-gradient(ellipse at 85% 80%, rgba(90,80,55,.09), transparent 55%);
  }
  #app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}

  /* ── 상태 표시줄 ── */
  .bar{
    display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
    padding:.6rem 1.2rem;border-bottom:1.5px solid var(--ink);
    background:var(--paper-panel);
  }
  .bar .yr{font-family:var(--mono);font-size:1.05rem;font-weight:500;letter-spacing:.04em}
  .bar .gan{font-family:var(--serif);font-size:.95rem;color:var(--ink-soft)}
  .bar .ho{font-family:var(--serif);font-weight:600;font-size:1rem}
  .bar .spacer{flex:1}
  .stat{font-family:var(--mono);font-size:.8rem;letter-spacing:.02em;color:var(--ink-soft)}
  .stat b{font-family:var(--sans);font-weight:600;color:var(--ink);font-size:.9rem}
  .tag{
    font-size:.72rem;font-weight:500;letter-spacing:.08em;
    border:1px solid var(--ink);padding:.1rem .45rem;
  }
  .tag.dead{background:var(--seal);border-color:var(--seal);color:var(--paper-panel)}

  /* ── 본문 배치 (사초 세로 기둥은 제거했다 — 본문이 화면을 다 쓴다) ── */
  main{flex:1;display:flex}
  #stage{flex:1;padding:2.4rem 1.5rem 3rem;max-width:46rem;margin:0 auto;width:100%}

  /* ── 활자 ── */
  .eyebrow{
    font-family:var(--mono);font-size:.75rem;letter-spacing:.24em;
    color:var(--rule);text-transform:uppercase;margin-bottom:.7rem;
  }
  h1{
    font-family:var(--serif);font-weight:800;font-size:clamp(2rem,7vw,3.1rem);
    line-height:1.2;letter-spacing:-.01em;margin-bottom:.4rem;
  }
  h2{
    font-family:var(--serif);font-weight:800;font-size:clamp(1.5rem,5vw,2.1rem);
    line-height:1.3;margin-bottom:.9rem;
  }
  h3{font-family:var(--serif);font-weight:600;font-size:1.1rem;margin-bottom:.5rem}
  /* 줄글은 전부 양쪽 정렬 */
  .lede,.situation,.note p,.quiet,.scroll li,.pick button small,.party p,.qs li{
    text-align:justify;
  }
  .lede{font-size:1.02rem;color:var(--ink-soft);margin-bottom:1.8rem;max-width:34rem}
  .situation{
    font-size:1.02rem;border-left:3px solid var(--rule);
    padding:.2rem 0 .2rem 1rem;margin-bottom:1.6rem;max-width:36rem;
  }
  .quiet{color:var(--ink-soft);font-size:.92rem}

  /* ── 선택지 (번호 없이 문장만) ── */
  .choices{display:flex;flex-direction:column;gap:.7rem;max-width:36rem}
  button.choice{
    text-align:left;font-family:var(--sans);font-size:1rem;font-weight:400;
    background:var(--paper-panel);color:var(--ink);
    border:1.5px solid var(--ink);border-radius:0;padding:.95rem 1.15rem;
    cursor:pointer;line-height:1.6;
    transition:background .12s, transform .12s;
  }
  button.choice:hover{background:var(--ink);color:var(--paper);transform:translateX(3px)}
  button.go{
    font-family:var(--serif);font-weight:600;font-size:1rem;letter-spacing:.06em;
    background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);
    padding:.75rem 1.8rem;cursor:pointer;border-radius:0;margin-top:1.6rem;
    transition:opacity .12s;
  }
  button.go:hover{opacity:.82}
  button.ghost{
    background:transparent;color:var(--ink);border:1.5px solid var(--ink);
    font-family:var(--sans);font-size:.88rem;padding:.5rem 1rem;cursor:pointer;
    border-radius:0;margin-top:1rem;
  }
  button.ghost:hover{background:var(--ink);color:var(--paper)}
  :focus-visible{outline:3px solid var(--rule);outline-offset:2px}

  /* ── 입력 ── */
  .field{margin-bottom:1.6rem;max-width:36rem}
  .label{font-size:.82rem;font-weight:600;letter-spacing:.02em;margin-bottom:.5rem;display:block}
  .label span{font-weight:300;color:var(--ink-faint)}
  input[type=text]{
    font-family:var(--serif);font-size:1.4rem;font-weight:600;
    background:transparent;border:none;border-bottom:1.5px solid var(--ink);
    padding:.3rem .2rem;width:min(14rem,100%);color:var(--ink);
  }
  input[type=text]:focus{outline:none;border-bottom-color:var(--rule)}

  /* ── 호 추천 ── */
  .ho-row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-top:.7rem}
  .ho-sug{display:flex;gap:.5rem;flex-wrap:wrap}
  .ho-chip{
    font-family:var(--serif);font-size:1.05rem;font-weight:600;
    background:var(--paper-panel);border:1.5px solid var(--ink);
    padding:.4rem 1rem;cursor:pointer;border-radius:0;color:var(--ink);
    transition:background .12s;
  }
  .ho-chip:hover{background:var(--paper-deep)}
  .ho-chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .ho-again{
    font-family:var(--sans);font-size:.8rem;background:transparent;
    border:1px solid var(--ink-faint);color:var(--ink-soft);
    padding:.35rem .8rem;cursor:pointer;border-radius:0;
  }
  .ho-again:hover{border-color:var(--ink);color:var(--ink)}
  .ho-again[disabled]{opacity:.5;cursor:default}
  .ho-hint{font-size:.8rem;color:var(--ink-faint)}

  .pick{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .pick button{
    text-align:left;background:var(--paper-panel);border:1.5px solid var(--ink);
    padding:.9rem 1rem;cursor:pointer;border-radius:0;font-family:var(--sans);
    color:var(--ink);transition:background .12s;
  }
  .pick button strong{font-family:var(--serif);font-size:1.05rem;display:block;margin-bottom:.35rem}
  .pick button small{color:var(--ink-soft);font-size:.84rem;line-height:1.65;display:block}
  .pick button small b{font-weight:600;color:var(--ink)}
  /* 시작 보너스: 고르기 전에 무엇을 얻는지 눈에 띄게 */
  .pick-start{
    display:inline-block;margin-top:.5rem;font-family:var(--mono);font-size:.74rem;
    letter-spacing:.02em;color:var(--rule);
  }
  .pick button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .pick button[aria-pressed=true] small{color:var(--paper-deep)}
  .pick button[aria-pressed=true] small b{color:var(--paper)}
  .pick button[aria-pressed=true] .pick-start{color:var(--paper-deep)}
  .pick button:hover{background:var(--paper-deep)}
  .pick button[aria-pressed=true]:hover{background:var(--ink)}

  /* ── 선택 패 (갑자사화 등) ── */
  .lots{display:flex;gap:.7rem;margin:1.4rem 0;flex-wrap:wrap}
  .lot{
    width:3.4rem;height:9rem;background:var(--paper-deep);
    border:1.5px solid var(--ink);cursor:pointer;border-radius:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:1.5rem;font-weight:800;
    color:transparent;transition:transform .15s, background .2s;
    background-image:repeating-linear-gradient(to bottom,transparent 0 12px,rgba(35,32,26,.06) 12px 13px);
  }
  .lot:hover:not(.done){transform:translateY(-8px)}
  .lot.done{cursor:default}
  .lot.mine{border-width:3px}
  .lot.hwa{background:var(--seal);color:var(--paper-panel);background-image:none}
  .lot.myeon{color:var(--ink-soft)}

  /* ── 결과 / 사관의 주 ── */
  .verdict{
    font-family:var(--serif);font-weight:800;font-size:clamp(1.6rem,5vw,2.2rem);
    margin-bottom:.7rem;
  }
  .verdict.bad{color:var(--seal)}
  .note{
    background:var(--paper-panel);border:1px solid var(--ink-faint);
    padding:1rem 1.1rem;margin-top:1.6rem;max-width:36rem;
  }
  .note .t{
    font-family:var(--serif);font-weight:600;font-size:.85rem;letter-spacing:.1em;
    color:var(--rule);margin-bottom:.4rem;
  }
  .note p{font-size:.92rem;color:var(--ink-soft)}
  .delta{font-family:var(--mono);font-size:.85rem;margin-top:.8rem;color:var(--ink-soft)}
  .delta b{color:var(--ink)}

  /* ── 인장 ── */
  .seal{
    width:6.2rem;height:6.2rem;background:var(--seal);color:var(--paper);
    font-family:var(--serif);font-weight:800;font-size:1.6rem;
    writing-mode:vertical-rl;letter-spacing:.1em;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-5deg);float:right;margin:0 0 1rem 1rem;
    animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;
    box-shadow:inset 0 0 0 3px rgba(221,216,196,.35);
  }
  @keyframes stamp{
    0%{transform:rotate(-5deg) scale(2.4);opacity:0}
    60%{transform:rotate(-5deg) scale(.93);opacity:1}
    100%{transform:rotate(-5deg) scale(1);opacity:1}
  }

  /* ── 최종 ── */
  .party{border:1.5px solid var(--ink);padding:1.2rem;margin:1.4rem 0;max-width:36rem}
  .party.dong{border-left:10px solid var(--dong)}
  .party.seo{border-left:10px solid var(--seo)}
  .party .nm{font-family:var(--serif);font-weight:800;font-size:1.7rem;margin-bottom:.3rem}
  .party.dong .nm{color:var(--dong)}
  .party.seo .nm{color:var(--seo)}
  .scroll{
    background:var(--paper-panel);border:1px solid var(--ink-faint);
    padding:1.1rem 1.2rem;margin:1.4rem 0;max-width:36rem;
  }
  .scroll li{
    font-family:var(--serif);font-size:.95rem;list-style:none;
    padding:.45rem 0;border-bottom:1px dotted var(--ink-faint);line-height:1.65;
  }
  .scroll li:last-child{border:none}
  .scroll li .y{color:var(--rule);font-weight:800;margin-right:.5rem;font-family:var(--mono);font-size:.85rem}

  @media (max-width:760px){
    #stage{padding:1.6rem 1.1rem 2.4rem}
    .pick{grid-template-columns:1fr}
    .lot{width:2.7rem;height:7rem;font-size:1.2rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }

  /* ── 반별 동시 진행: 로그인 · 대기실 · 관전 ── */
  .gate{max-width:26rem}
  .gate .name-shown{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin-top:.6rem}
  .gate .err{color:var(--seal);font-size:.88rem;margin-top:.5rem;min-height:1.2rem}
  .wait{
    border:1.5px solid var(--ink);background:var(--paper-panel);
    padding:1.4rem 1.5rem;max-width:36rem;margin-top:1.4rem;
  }
  .wait .big{font-family:var(--serif);font-size:1.3rem;font-weight:800;margin-bottom:.4rem}
  .wait .sub{color:var(--ink-soft);font-size:.94rem;text-align:justify}
  .dots::after{content:"";animation:dots 1.4s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}
  .roster{
    display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;font-family:var(--mono);
    font-size:.8rem;color:var(--ink-soft);
  }
  .roster b{color:var(--ink);font-family:var(--sans)}
  .timer{
    font-family:var(--mono);font-size:.85rem;letter-spacing:.06em;
    border:1px solid var(--ink);padding:.1rem .5rem;
  }
  .timer.low{background:var(--seal);border-color:var(--seal);color:var(--paper-panel)}
  .picked{
    border-left:3px solid var(--rule);padding:.2rem 0 .2rem 1rem;
    margin:1rem 0;max-width:36rem;text-align:justify;
  }
  .picked .t{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;color:var(--rule);margin-bottom:.3rem}
  /* 관전 — 죽은 학생이 보는 반 현황 */
  .watch-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(6.2rem,1fr));
    gap:.4rem;margin-top:1rem;max-width:36rem;
  }
  .wp{
    border:1px solid var(--hairline,var(--ink-faint));background:var(--paper-panel);
    padding:.35rem .5rem;font-size:.8rem;display:flex;justify-content:space-between;gap:.4rem;
  }
  .wp.gone{opacity:.45;text-decoration:line-through}
  .wp .h{font-family:var(--serif);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wp .s{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);flex:none}
</style>
  <script src="/hoistory/pwa.js"></script>
</head>
<body>
<div id="app">
  <header class="bar" id="bar"></header>
  <main>
    <section id="stage"></section>
  </main>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════════
   사화에서 살아남기

   진행 방식이 둘이다.
     · 반별 동시 진행(기본) — 학번으로 들어가 자기 반 방에 붙고, 교사가 사건을
       열어야 선택 화면이 뜬다. 죽은 학생은 관전 화면에서 반 상황을 지켜본다.
     · 혼자 하기(?solo=1) — 예전처럼 처음부터 끝까지 혼자 달린다.

   두 방식이 아래 EVENTS 표 하나를 함께 쓴다. 선지마다 key가 있어야 집계가
   맞는다(선지 순서를 매번 섞기 때문에 "몇 번째"로는 셀 수 없다).
   ══════════════════════════════════════════════════════════════════ */

const GAN = {1498:"무오",1504:"갑자",1506:"병인",1519:"기묘",1545:"을사",1575:"을해"};
const PHASE_ORDER = ["1498","1504","1506","1519","1545","1575"];
const PHASE_LABEL = {
  "1498":"제1화 무오사화","1504":"제2화 갑자사화","1506":"제3화 중종반정",
  "1519":"제4화 기묘사화","1545":"제5화 을사사화","1575":"제6화 붕당의 형성"
};

/* 관직(官)·명예(名)의 출발값. 여기서 오르내리며 0 아래로는 내려가지 않는다. */
const BASE = 10;
const ENSHRINE = BASE + 8;

/* ══════════ 인트로 문구 (관리자 화면에서 고칠 수 있다) ══════════ */
const DEFAULT_CONTENT = {
  title: "사화에서\n살아남기",
  paragraphs: [
    "그대는 1498년 조선의 선비다. 갓 벼슬길에 올라 사림(士林)의 한 사람이 되었다. 앞으로 77년 동안 **사화**가 네 번 몰아친다. 사화란 선비들이 무리로 죽임을 당하는 사건을 말한다.",
    "화면마다 그대는 선택을 한다. 옳은 말을 할 것인가, 입을 다물 것인가. 나설 것인가, 물러설 것인가. 정답은 없다. 다만 **사관**이 그대가 한 일을 **사초**에 적어 둘 뿐이다. 사초는 임금도 함부로 못 보는 기록이지만, 한번 적히면 지워지지 않는다. 그 기록이 훗날 그대를 살릴 수도, 죽일 수도 있다.",
    "끝까지 살아남는 것이 목표는 아니다. 살아남은 자와 이름을 남긴 자가 서로 다른 사람이라는 것, 그것이 이 77년이 보여주는 바다."
  ],
  hoLabel: "그대의 호(號)", hoHint: "스스로 지어 붙이는 이름",
  masterLabel: "스승을 고르시오",
  masters: [
    { key:"dong", name:"이황 · 조식",
      desc:"마음가짐을 바르게 하는 공부(敬)를 무엇보다 앞세운다. 벼슬에 나아가는 것보다 물러나 자신을 닦는 것을 귀하게 여겨, 임금이 불러도 사양하고 고향에서 제자를 기르는 일이 잦다. 옳지 않은 자리라면 아예 앉지 않는 것이 선비의 도리라고 가르친다. 주로 **영남**(지금의 경상도)에서 공부한 선비들이다." },
    { key:"seo", name:"이이 · 성혼",
      desc:"잘못된 제도는 뜯어고쳐야 한다(更張)고 말한다. 물러나 앉아 몸만 깨끗이 하는 것으로는 백성의 삶이 나아지지 않으니, 조정에 들어가 세금과 군역을 실제로 바꾸어야 한다고 가르친다. 현실에 발을 딛는 학문이다. 주로 **기호**(지금의 경기도와 충청도)에서 공부한 선비들이다." }
  ],
  baseLabel: "기반을 고르시오",
  bases: [
    { key:"central", name:"중앙 관직형", bonus:"시작할 때 관직 +2",

const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (s)=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function adj(P,k,n){ P[k]=Math.max(0,P[k]+n); }
function note(P,year,text){ P.log.push({year,text}); }
function kill(P,year,cause){ P.alive=false; P.deathYear=year; P.causeOfDeath=cause; }
function classOf(sid){ const c=parseInt(String(sid||"").slice(1,3),10); return isNaN(c)?null:c; }

function makePlayer(){

/* 사건이 끝난 뒤 갈 곳. 죽었으면 결말로 가되, 갑자년의 죽음만은 반정(부활 판정)까지 간다. */
function nextPhase(phase, P){
  const i = PHASE_ORDER.indexOf(phase);
  if(i < 0 || i === PHASE_ORDER.length-1) return null;
  if(!P.alive && phase !== "1504") return null;
  return PHASE_ORDER[i+1];
}

  const res = await fetch(CLAUDE_PROXY_URL, {

    body: JSON.stringify({ model:"claude-haiku-4-5-20251001", max_tokens:100,
      messages:[{role:"user",content:prompt}] })
  });
  if(!res.ok) throw new Error("API "+res.status);
  const data = await res.json();
  let raw = (data.content?.[0]?.text || "[]").replace(/```json|```/g,"").trim();
  const s = raw.indexOf("["), e = raw.indexOf("]", s);
  if(s!==-1 && e!==-1) raw = raw.slice(s, e+1);
  const arr = JSON.parse(raw);
  const ok = arr.filter(x=>/^[가-힣]{2,3}$/.test(String(x).trim())).map(x=>String(x).trim());
  if(!ok.length) throw new Error("빈 응답");
  return ok.slice(0,3);
}
async function loadHoSuggestions(){
  const box = $("#hoSug"), btn = $("#hoAgain"), hint = $("#hoHint");
  if(!box) return;
  btn.disabled = true;
  box.innerHTML = `<span class="ho-hint">호를 지어 보는 중…</span>`;
  let list;
  try { list = await fetchHoSuggestions(); }
  catch(e){ list = shuffle(HO_POOL).slice(0,3); }
  if(!$("#hoSug")) return;
  box.innerHTML = list.map(h=>`<button type="button" class="ho-chip" data-ho="${esc(h)}" aria-pressed="false">${esc(h)}</button>`).join("");
  box.querySelectorAll(".ho-chip").forEach(chip=>{
    chip.onclick = ()=>{
      box.querySelectorAll(".ho-chip").forEach(c=>c.setAttribute("aria-pressed","false"));
      chip.setAttribute("aria-pressed","true");
      $("#ho").value = chip.dataset.ho;
      hint.textContent = "마음에 들지 않으면 직접 고쳐 적어도 된다.";
    };
  });
  btn.disabled = false;
}

function bindSetup(onDone){
  const wire = (sel)=>{
    const box = $(sel); if(!box) return;
    box.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
        b.setAttribute("aria-pressed","true");
      };
    });
  };
  wire("#pickMaster"); wire("#pickBase");
  const again = $("#hoAgain"); if(again) again.onclick = loadHoSuggestions;
  loadHoSuggestions();
  const go = $("#start"); if(!go) return;
  go.onclick = ()=>{
    const ho = $("#ho").value.trim();
    const master = $("#pickMaster [aria-pressed=true]")?.dataset.v;
    const base   = $("#pickBase [aria-pressed=true]")?.dataset.v;
    if(!ho){ $("#ho").focus(); $("#ho").placeholder="호를 지어야 시작한다"; return; }
    if(!master || !base){ alert("스승과 기반을 모두 고르시오."); return; }
    onDone(ho, master, base);
  };
}

function applySetup(P, ho, master, base){
  P.ho = ho; P.master = master; P.base = base;
  if(base==="local"){ adj(P,"fame",2); P.seowon = true; } else adj(P,"rank",2);
  note(P, 0, `${ho}, 사림의 길에 들다. ${base==="local"
    ? "고향에 서원의 터를 보아 두었다." : "한양에 자리를 얻어 3사의 말석에 섰다."}`);
}

/* ══════════════════ 공용 진행기 ══════════════════
   한 사건을 그리고, 학생이 고르면 결과(res)를 만들어 onResolved로 넘긴다.
   solo와 반별 진행이 이 함수를 함께 쓴다. */
function playPhase(phase, P, onResolved){
  const ev = EVENTS[phase];
  P.year = +phase;

  if(ev.kind === "auto"){ const r = ev.apply(P); onResolved(r, r.key); return; }

  if(ev.kind === "lots"){
    drawLots(ev, ev.n, ev.bad, (isBad)=>{
      const res = ev.apply(P, isBad);
      onResolved(res, ev.keyOf(isBad));
    });
    return;
  }

  const order = shuffle(ev.choices);           // 선지 순서는 매번 섞는다
  paint(eventHTML(ev, order));
  $("#ch").querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      const c = order[+b.dataset.i];
      if(c.lot){
        drawLots({ eyebrow:ev.eyebrow, ...c.lot }, c.lot.n, c.lot.bad, (isBad)=>{
          onResolved(c.apply(P, isBad), c.key);
        });
      } else {
        onResolved(c.apply(P), c.key);
      }
    };
  });
}

function drawLots(cfg, n, bad, done){
  const slips = shuffle(Array.from({length:n},(_,i)=> i<bad ? "禍" : "免"));
  paint(lotsHTML(cfg, slips));
  const box = $("#lots");
  box.querySelectorAll(".lot").forEach(el=>{
    el.onclick = ()=>{
      const mine = slips[+el.dataset.i];
      box.querySelectorAll(".lot").forEach((x,i)=>{
        x.classList.add("done"); x.textContent = slips[i];
        x.classList.add(slips[i]==="禍" ? "hwa" : "myeon"); x.onclick = null;
      });
      el.classList.add("mine");
      setTimeout(()=> done(mine==="禍"), 850);
    };
  });
}

/* 화면에 그리는 단 하나의 출구 */
function paint(html, barExtra){
  const bar = $("#bar");
  if(MODE.screen === "setup" || MODE.screen === "login"){ bar.innerHTML=""; bar.style.display="none"; }
  else { bar.style.display=""; bar.innerHTML = barHTML(MODE.P, barExtra); }
  $("#stage").innerHTML = html;
  window.scrollTo(0,0);
}

/* 진행 상태 — 화면 종류와 현재 선비 */
const MODE = { room:false, screen:"setup", P:makePlayer(), cls:null, phase:null, answered:null, lastRes:null };

/* ══════════════════ 혼자 하기 ══════════════════ */
function soloStart(){
  MODE.screen = "setup";
  paint(setupHTML(true));
  bindSetup((ho,master,base)=>{
    applySetup(MODE.P, ho, master, base);
    MODE.screen = "round";
    soloPhase("1498");
  });
}
function soloPhase(phase){
  MODE.screen = "round";
  playPhase(phase, MODE.P, (res)=>{
    const nxt = nextPhase(phase, MODE.P);
    paint(outcomeHTML(res, `<button class="go" id="next">${nxt?"다음":"사초를 덮는다"}</button>`));
    $("#next").onclick = ()=>{
      if(nxt) soloPhase(nxt);
      else { MODE.screen="final"; MODE.P.year=1575;
        if(MODE.P.alive) note(MODE.P,1575,"사림이 두 갈래로 갈라서다. 그대가 배운 학문이 그대의 편을 정했다.");
        paint(finalHTML(MODE.P) + `<button class="go" id="again">처음으로 돌아가기</button>`);
        $("#again").onclick = ()=>{ MODE.P = makePlayer(); soloStart(); };
      }
    };
  });
}

/* ══════════════════ 반별 동시 진행 ══════════════════ */
let ROOM = null;      // 교사가 쓰는 방 상태
let TICK = null;      // 남은 시간 타이머

function loginHTML(){
  return `
  <h1>${esc(CONTENT.title).replace(/\n/g,"<br>")}</h1>
  <p class="lede">${fmt(CONTENT.paragraphs[0])}</p>
  <div class="field gate">
    <label class="label" for="sid">학번 <span>— 다섯 자리</span></label>
    <input type="text" id="sid" maxlength="5" inputmode="numeric" placeholder="30101" autocomplete="off">
    <div class="name-shown" id="sidName"></div>
    <div class="err" id="sidErr"></div>
  </div>
  <button class="go" id="enter">들어가기</button>`;
}

function roomStart(){
  MODE.room = true; MODE.screen = "login";
  paint(loginHTML());
  const input = $("#sid"), nameEl = $("#sidName"), errEl = $("#sidErr");
  const check = ()=>{
    const v = input.value.replace(/\D/g,"");
    if(input.value !== v) input.value = v;
    nameEl.textContent = ""; errEl.textContent = "";
    if(v.length !== 5) return;
    const r = SahwaNet.verifyId(v);
    if(r.ok){ nameEl.textContent = r.name ? r.name : "확인됨"; }
    else errEl.textContent = r.message || "명단에서 찾을 수 없는 학번입니다";
  };
  input.oninput = check;
  input.onkeydown = e=>{ if(e.key==="Enter") $("#enter").click(); };
  $("#enter").onclick = ()=>{
    const sid = input.value.trim();
    const r = SahwaNet.verifyId(sid);
    if(!r.ok){ errEl.textContent = r.message || "학번을 확인해 주세요"; return; }
    const cls = classOf(sid);
    if(!cls){ errEl.textContent = "학번에서 반을 읽을 수 없습니다"; return; }
    MODE.P.id = sid; MODE.P.name = r.name || ""; MODE.cls = cls;
    SahwaNet.loadPlayer(cls, sid).then(saved=>{
      if(saved && saved.ho){ MODE.P = Object.assign(makePlayer(), saved); roomJoin(); }
      else roomSetup();
    });
  };
}

function roomSetup(){
  MODE.screen = "setup";
  paint(setupHTML(false));
  bindSetup((ho,master,base)=>{
    applySetup(MODE.P, ho, master, base);
    SahwaNet.savePlayer(MODE.cls, MODE.P);
    roomJoin();
  });
}

function roomJoin(){
  MODE.screen = "lobby";
  SahwaNet.onRoom(MODE.cls, room=>{
    // 학생이 자기 상태만 쓰면 방 노드가 players만 담은 채로 먼저 되돌아오고, 쓰기가 실패하면
    // 아예 빈 스냅샷이 흘러온다. 둘 다 "선생님이 아직 사건을 안 열었다"는 뜻이 아니므로,
    // 이미 사건을 받아 둔 상태에서는 phase가 없는 스냅샷을 믿지 않는다.
    // 교사의 "방 초기화"는 지운 뒤 phase:"lobby"를 다시 써 주므로 이 무시가 안전하다.
    if(ROOM && ROOM.phase && !(room && room.phase)) return;
    ROOM = room || {};
    roomRender();
  });
  roomRender();
}

function fmtLeft(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}

function roomRender(){
  if(TICK){ clearInterval(TICK); TICK = null; }
  const P = MODE.P, room = ROOM || {};
  const phase = room.phase ? String(room.phase) : null;

  // 결말
  if(phase === "final"){
    MODE.screen = "final"; P.year = 1575;
    if(P.alive && !P.log.some(l=>l.year===1575 && l.text.indexOf("갈라서다")>=0))
      note(P,1575,"사림이 두 갈래로 갈라서다. 그대가 배운 학문이 그대의 편을 정했다.");
    SahwaNet.savePlayer(MODE.cls, P);
    paint(finalHTML(P));
    return;
  }

  // 대기실
  if(!phase || phase === "lobby" || room.state === "waiting"){
    MODE.screen = "lobby";
    paint(`<div class="eyebrow">${esc(MODE.cls)}반</div>
      <h2>${esc(P.ho)}</h2>
      <div class="wait">
        <div class="big">선생님을 기다리는 중<span class="dots"></span></div>
        <div class="sub">${P.alive
          ? "사건이 열리면 이 화면이 바로 바뀐다. 그때까지 조용히 기다리시오."
          : "그대는 이미 졸(卒)했다. 남은 사건은 지켜보게 된다."}</div>
        ${roomRosterHTML(room)}
      </div>`);
    return;
  }

  const ev = EVENTS[phase];
  if(!ev){ paint(`<div class="wait"><div class="big">알 수 없는 사건</div></div>`); return; }

  // 이미 죽은 학생 — 관전
  if(!P.alive){
    MODE.screen = "watch";
    paint(`<div class="eyebrow">${ev.eyebrow} · 관전</div>
      <h2>그대는 지켜본다</h2>
      <div class="situation">${esc(P.ho)}, 그대는 ${P.deathYear}년에 멈추었다. ${esc(P.causeOfDeath)}.
        조정에서 벌어지는 일은 이제 그대의 손을 떠났다.</div>
      ${roomRosterHTML(room, true)}
      <div class="scroll" style="margin-top:1.6rem">
        <h3>${esc(P.ho)}의 사초</h3>
        <ul>${P.log.map(e=>`<li><span class="y">${e.year?e.year:"　　"}</span>${esc(e.text)}</li>`).join("")}</ul>
      </div>`);
    return;
  }

  // 결과 공개
  if(room.state === "revealed"){
    MODE.screen = "round";
    const res = MODE.lastRes;
    if(res){ paint(outcomeHTML(res, `<div class="wait" style="margin-top:1.4rem">
        <div class="big">다음 사건을 기다리는 중<span class="dots"></span></div>
      </div>`)); }
    else paint(`<div class="wait"><div class="big">이번 사건은 건너뛰었다</div>
      <div class="sub">선생님이 다음 사건을 열 때까지 기다리시오.</div></div>`);
    return;
  }

  // 사건 열림 — 아직 안 냈으면 선택, 냈으면 대기
  if(room.state === "open"){
    if(MODE.answered === phase + ":" + (room.round||0)){ paintSubmitted(ev, room); return; }
    MODE.screen = "round"; MODE.autoPicked = false;
    playPhase(phase, P, (res, key)=> submitChoice(phase, room, res, key));
    // playPhase가 그린 뒤에 표시줄의 타이머만 덧붙인다
    $("#bar").innerHTML = barHTML(P, timerHTML(room));
    startTick(room, ()=> autoSubmit(phase, room));
    return;
  }

  paint(`<div class="wait"><div class="big">잠시 기다리시오<span class="dots"></span></div></div>`);
}

/* 고른 것을 서버에 올리고 곧바로 대기 화면으로 (서버 응답을 기다리지 않는다) */
function submitChoice(phase, room, res, key){
  const P = MODE.P, ev = EVENTS[phase];
  MODE.lastRes = res;
  MODE.answered = phase + ":" + (room.round||0);
  MODE.answeredLabel = (ev.choices||[]).find(c=>c.key===key)?.label
    || (ev.shortOf && ev.shortOf[key]) || key;
  SahwaNet.submit(MODE.cls, phase, P.id, key, P, MODE.autoPicked);
  paintSubmitted(ev, ROOM && ROOM.phase ? ROOM : room);
}

/* 시간이 다 되도록 안 골랐으면 "아무것도 하지 않은 것"에 해당하는 선지로 대신 낸다.
   그냥 두면 그 학생만 다음 사건에서 상태가 비어 버린다. */
function autoSubmit(phase, room){
  const P = MODE.P, ev = EVENTS[phase];
  if(!P.alive || MODE.answered === phase + ":" + (room.round||0)) return;
  MODE.autoPicked = true;
  if(ev.kind === "lots"){
    const isBad = Math.random() < ev.bad / ev.n;
    submitChoice(phase, room, ev.apply(P, isBad), ev.keyOf(isBad));
    return;
  }
  const c = (ev.choices||[]).find(x=>x.key===ev.defaultKey) || (ev.choices||[])[0];
  if(!c) return;
  const res = c.lot ? c.apply(P, Math.random() < c.lot.bad / c.lot.n) : c.apply(P);
  submitChoice(phase, room, res, c.key);
}

/* 이미 낸 학생이 보는 화면 */
function paintSubmitted(ev, room){
  MODE.screen = "round";
  paint(`<div class="eyebrow">${ev.eyebrow}</div>
    <h2>${MODE.autoPicked ? "시간이 다 되었다" : "제출했다"}</h2>
    <div class="picked"><div class="t">${MODE.autoPicked ? "고르지 않아 이렇게 기록되었다" : "그대의 선택"}</div>${esc(MODE.answeredLabel||"")}</div>
    <div class="wait"><div class="big">다른 이들을 기다리는 중<span class="dots"></span></div>
      <div class="sub">모두가 고르면 결과가 함께 공개된다.</div>
      ${roomRosterHTML(room)}</div>`, timerHTML(room));
  startTick(room);
}

function timerHTML(room){
  if(!room.endsAt) return "";
  const left = room.endsAt - Date.now();
  return `<span class="timer ${left<15000?"low":""}" id="tmr">${fmtLeft(left)}</span>`;
}
function startTick(room, onExpire){
  if(!room.endsAt) return;
  TICK = setInterval(()=>{
    const el = $("#tmr");
    const left = room.endsAt - Date.now();
    if(el){ el.textContent = fmtLeft(left); el.classList.toggle("low", left < 15000); }
    if(left <= 0){
      clearInterval(TICK); TICK = null;
      if(onExpire) onExpire();
    }
  }, 500);
}

/* 반 현황 — 대기·관전 화면에서 함께 보여 준다 */
function roomRosterHTML(room, full){
  const ps = Object.values(room.players || {});
  if(!ps.length) return "";
  const alive = ps.filter(p=>p.alive).length;
  const dong = ps.filter(p=>p.master==="dong").length;
  const head = `<div class="roster">
      <span>들어온 사람 <b>${ps.length}</b></span>
      <span>생존 <b>${alive}</b></span>
      <span>졸(卒) <b>${ps.length-alive}</b></span>
      <span>동인 <b>${dong}</b> / 서인 <b>${ps.length-dong}</b></span>
    </div>`;
  if(!full) return head;
  const cards = ps.sort((a,b)=>String(a.id).localeCompare(String(b.id)))
    .map(p=>`<div class="wp ${p.alive?"":"gone"}"><span class="h">${esc(p.ho||p.name||"")}</span><span class="s">${p.rank}·${p.fame}</span></div>`).join("");
  return head + `<div class="watch-grid">${cards}</div>`;
}

/* 관리자 화면에서 저장한 인트로 문구를 덮어쓴다(모듈 스크립트가 호출). */
window.applyIntroContent = function(c){
  if(!c || typeof c !== "object") return;
  CONTENT = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONTENT)), c);
  if(MODE.screen === "setup"){ paint(setupHTML(!MODE.room)); bindSetup(MODE.room ? onRoomSetupDone : onSoloSetupDone); }
};
function onSoloSetupDone(ho,m,b){ applySetup(MODE.P,ho,m,b); MODE.screen="round"; soloPhase("1498"); }
function onRoomSetupDone(ho,m,b){ applySetup(MODE.P,ho,m,b); SahwaNet.savePlayer(MODE.cls,MODE.P); roomJoin(); }

/* 네트워크 계층이 준비되면 시작한다(모듈 스크립트가 호출). */
window.startSahwa = function(){
  if(new URLSearchParams(location.search).get("solo") === "1") soloStart();
  else roomStart();
};
</script>

<script type="module">
/* 네트워크 계층 — 명단 조회, 방 구독, 제출.
   게임 로직(일반 스크립트)은 window.SahwaNet만 통해 서버와 이야기한다. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getDatabase, ref, get, set, update, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "../../shared/firebase-config.js";
import { initAuth, loadStudents, verifyStudentId } from "../../shared/auth.js";

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const rtdb = getDatabase(app);
const ROOMS = "sahwa_rooms";

/* 선비 상태를 RTDB에 넣기 좋은 평평한 모양으로 (undefined는 RTDB가 거부한다) */
function slim(P){
  return {
    id:P.id||"", name:P.name||"", ho:P.ho||"", master:P.master||"", base:P.base||"",
    rank:P.rank|0, fame:P.fame|0, alive:!!P.alive, seowon:!!P.seowon,
    deathYear:P.deathYear||null, causeOfDeath:P.causeOfDeath||null,
    log:(P.log||[]).map(e=>({year:e.year|0, text:String(e.text||"")}))
  };
}

window.SahwaNet = {
  verifyId(id){ return verifyStudentId(id); },

  async loadPlayer(cls, sid){
    try{
      const s = await get(ref(rtdb, `${ROOMS}/${cls}/players/${sid}`));
      return s.exists() ? s.val() : null;
    }catch(e){ return null; }
  },

  savePlayer(cls, P){
    if(!cls || !P.id) return Promise.resolve();
    return set(ref(rtdb, `${ROOMS}/${cls}/players/${P.id}`), slim(P)).catch(()=>{});
  },

  submit(cls, phase, sid, key, P, auto){
    const u = {};
    u[`${ROOMS}/${cls}/answers/${phase}/${sid}`] = { choice:String(key||""), at:serverTimestamp(), auto:!!auto };
    u[`${ROOMS}/${cls}/players/${sid}`] = slim(P);
    return update(ref(rtdb), u).catch(()=>{});
  },

  onRoom(cls, cb){
    onValue(ref(rtdb, `${ROOMS}/${cls}`), snap=> cb(snap.exists() ? snap.val() : null));
  }
};

/* 인트로 문구 → 명단 → 게임 시작 */
initAuth(rtdb);
try{
  const snap = await getDoc(doc(db, "settings", "sahwa_content"));
  if(snap.exists()) window.applyIntroContent(snap.data());
