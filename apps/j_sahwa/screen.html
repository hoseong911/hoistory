<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사화에서 살아남기 교실 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  /* ============================================================
     교실 티비에 띄우는 발표 화면.
     학생 모바일(index.html)과 같은 방(RTDB sahwa_rooms/{반})을 보고,
     같은 사건 표(game.js의 EVENTS)로 같은 설명·선택지를 그린다.
     화면 아래에 교사 조작판이 붙는다 — 사건을 열고 공개하는 일을 여기서 한다
     (어드민 RUN에는 반과 기본 제한 시간 같은 밑준비만 남겼다).
     교실 뒤에서도 읽히도록 글자 크기를 화면 폭(vw)에 매어 둔다.
     ============================================================ */
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-button{display:none;width:0;height:0}
  *::-webkit-scrollbar-thumb{background:rgba(90,84,72,.38);border-radius:4px}
  /* 바탕은 옛 한지. 학생 화면(index.html)과 같은 색을 쓴다 — 티비와 손안의
     화면이 다른 종이처럼 보이면 같은 활동으로 안 읽힌다. */
  :root{
    --paper:#E9DEC3; --paper-panel:#F2EAD5; --paper-deep:#D8CBA8;
    --ink:#2A2318; --ink-soft:#645941; --ink-faint:#95896B;
    --rule:#9E362A; --seal:#AE2E20; --dong:#2E4A62; --seo:#7A5C1E;
    --live:#1F6F4A;
    --serif:'Hahmlet','Nanum Myeongjo',Batang,바탕,serif;
    --sans:'IBM Plex Sans KR','Malgun Gothic',맑은 고딕,sans-serif;
    /* 연도·수치·작은 라벨용. 고정폭 대신 프리텐다드를 쓰되, 숫자는 tabular-nums로
       폭을 고정해 타이머와 인원수가 1초마다 흔들리지 않게 한다. */
    --ui:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    /* 본문 기준 크기. 티비 크기가 제각각이라 폭에 비례시키되 위아래를 잠가 둔다.
       교실 뒤에서도 읽히도록 2px 올렸다. 화면의 모든 글자가 이 값에 매여 있다. */
    --fs: clamp(19px, calc(1.35vw + 2px), 32px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;
    line-height:1.7;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  /* 한지 결 — 닥섬유가 세로로 곧게, 사선으로 성기게 눕고 물 자국이 얼룩진다. */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(91deg, rgba(122,98,55,.055) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(83deg, rgba(122,98,55,.038) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(0deg,  rgba(122,98,55,.028) 0 1px, transparent 1px 6px),
      radial-gradient(ellipse at 18% 12%, rgba(163,130,72,.15), transparent 58%),
      radial-gradient(ellipse at 84% 80%, rgba(139,111,58,.13), transparent 55%),
      radial-gradient(ellipse at 52% 46%, rgba(198,172,112,.12), transparent 64%);
  }
  #wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

  /* ── 머리띠 ── 지금 어느 사건의 어느 단계인지, 몇 명이 냈는지 ── */
  .top{
    display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;flex:none;
    padding:.7rem 1.6rem;border-bottom:2px solid var(--ink);background:var(--paper-panel);
    font-size:calc(var(--fs) * .82);
  }
  .top .cls{font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:.06em}
  .top .ph{font-family:var(--serif);font-weight:600;letter-spacing:.03em}
  .top .st{
    font-family:var(--sans);font-weight:600;font-size:calc(var(--fs) * .7);
    padding:.15em .8em;border:1.5px solid var(--ink);letter-spacing:.04em;
  }
  .top .st.open{background:var(--live);border-color:var(--live);color:var(--paper)}
  .top .st.revealed{background:var(--rule);border-color:var(--rule);color:var(--paper)}
  .top .tmr{font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:500;font-size:calc(var(--fs) * 1.15);letter-spacing:.04em}
  .top .tmr.hot{color:var(--seal)}
  .top .cnt{margin-left:auto;font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:500}
  .top .cnt b{font-size:calc(var(--fs) * 1.15);color:var(--rule)}
  .top .cnt .sep{color:var(--ink-faint);margin:0 .55em;font-weight:400}

  /* ── 본문 ── */
  main{flex:1;min-height:0;overflow-y:auto;padding:1.6rem 2.4rem 2.4rem}
  .eyebrow{
    font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:calc(var(--fs) * .72);letter-spacing:.22em;
    color:var(--ink-faint);text-transform:uppercase;margin-bottom:.5rem;
  }
  h1{
    font-family:var(--serif);font-weight:800;line-height:1.25;letter-spacing:-.01em;
    font-size:calc(var(--fs) * 2.1);margin-bottom:1rem;
  }
  h2{font-family:var(--serif);font-weight:600;font-size:calc(var(--fs) * 1.3);margin-bottom:.7rem}
  .situation{
    font-family:var(--serif);font-size:calc(var(--fs) * 1.06);line-height:1.95;
    text-align:justify;max-width:none;
  }
  .situation b{font-weight:800;color:var(--rule)}

  /* 사건 화면은 설명(왼쪽)과 선택지(오른쪽)를 나란히 둔다 — 티비는 가로가 길다. */
  .split{display:grid;grid-template-columns:1.15fr 1fr;gap:2.2rem;align-items:start}
  @media (max-aspect-ratio: 1/1){ .split{grid-template-columns:1fr} }

  .choices{display:flex;flex-direction:column;gap:.7rem}
  .ch{
    display:flex;gap:.9rem;background:var(--paper-panel);border:1.5px solid var(--ink);
    padding:.85rem 1rem;font-size:calc(var(--fs) * .95);line-height:1.7;
  }
  .ch .n{
    flex:none;font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:500;font-size:calc(var(--fs) * .95);
    color:var(--paper);background:var(--ink);width:1.9em;height:1.9em;
    display:flex;align-items:center;justify-content:center;
  }
  /* 공개 뒤에는 몇 명이 골랐는지 막대로 겹쳐 보인다. */
  .ch.res{position:relative;overflow:hidden}
  .ch.res .fill{position:absolute;inset:0 auto 0 0;background:var(--paper-deep);z-index:0;transition:width .5s}
  .ch.res .n,.ch.res .lb,.ch.res .cn{position:relative;z-index:1}
  .ch .lb{flex:1}
  /* 고를 것이 없는 장면(중종반정)과 제비뽑기 장면의 안내 한 줄 */
  .guide{
    margin-top:1.2rem;font-family:var(--serif);font-size:calc(var(--fs) * .95);
    color:var(--ink-soft);background:var(--paper-panel);
    border:1.5px solid var(--ink);padding:.9rem 1.1rem;
  }
  /* 배향 안내는 두 명단 아래에 폭 전체로 둔다. 배향된 사람은 죽은 쪽에도 있으므로
     살아남은 자 칸에만 붙이면 그 칸의 이야기로 읽힌다. */
  .enshrine-note{
    margin-top:1.2rem;background:var(--paper-panel);border:1.5px solid var(--rule);
    padding:.85rem 1.1rem;font-size:calc(var(--fs) * .85);color:var(--ink-soft);
  }
  .enshrine-note b{color:var(--rule);font-weight:800}
  .ch .cn{flex:none;font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:500;align-self:center}

  /* ── 명단 ── 공개 화면의 주인공. 호만 크게 보인다. */
  .lists{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;margin-top:1.4rem}
  @media (max-aspect-ratio: 1/1){ .lists{grid-template-columns:1fr} }
  .lcol{border:2px solid var(--ink);background:var(--paper-panel);padding:1rem 1.1rem;min-height:0}
  .lcol.dead{border-color:var(--seal)}
  .lhead{
    display:flex;align-items:baseline;gap:.7rem;
    border-bottom:1.5px solid var(--ink);padding-bottom:.5rem;margin-bottom:.8rem;
  }
  .lcol.dead .lhead{border-bottom-color:var(--seal)}
  .lhead .t{font-family:var(--serif);font-weight:800;font-size:calc(var(--fs) * 1.25)}
  .lcol.dead .lhead .t{color:var(--seal)}
  .lhead .n{margin-left:auto;font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:500;font-size:calc(var(--fs) * 1.3)}
  .hos{display:flex;flex-wrap:wrap;gap:.4rem .5rem}
  .ho{
    font-family:var(--serif);font-weight:600;font-size:calc(var(--fs) * 1.02);
    padding:.2em .6em;background:var(--paper);border:1px solid var(--ink-faint);
  }
  .ho.fresh{background:var(--seal);border-color:var(--seal);color:var(--paper)}
  .ho.enshrined{border-color:var(--rule);border-width:2px;color:var(--rule)}
  .lnote{margin-top:.8rem;font-size:calc(var(--fs) * .78);color:var(--ink-soft)}

  /* ── 결과 공개의 머리 ── 겪는 동안에는 은유로만 걸어 두었던 사건의 진짜 이름을
     여기서 크게 밝힌다. 이름을 먼저 알려 주면 무슨 일이 벌어질지 알고 고르게 된다. */
  .reveal-name{
    font-family:var(--serif);font-weight:800;letter-spacing:.06em;line-height:1.15;
    font-size:calc(var(--fs) * 3);color:var(--seal);margin-bottom:.2rem;
    /* 등장 효과는 걸지 않는다. 이 화면은 학생이 하나 낼 때마다 다시 그려지므로
       애니메이션을 걸면 이름이 그때마다 다시 튀어 오른다. 중종반정의 극적인
       등장은 화면을 덮는 .name-blast가 따로 맡는다. */
  }
  .reveal-sub{
    font-family:var(--serif);font-size:calc(var(--fs) * 1.15);color:var(--ink-soft);
    margin-bottom:1rem;
  }
  /* 중종반정 전용 — 서원을 두어 조정으로 돌아온 이들 */
  .revive-box{
    margin-top:1.2rem;border:2px solid var(--rule);background:var(--paper-panel);
    padding:1rem 1.1rem;
  }
  .revive-box .rt{
    font-family:var(--serif);font-weight:800;font-size:calc(var(--fs) * 1.25);color:var(--rule);
    border-bottom:1.5px solid var(--rule);padding-bottom:.5rem;margin-bottom:.8rem;
    display:flex;align-items:baseline;gap:.7rem;
  }
  .revive-box .rt .n{margin-left:auto;font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:500}
  .revive-box .rsub{margin-top:.8rem;font-size:calc(var(--fs) * .8);color:var(--ink-soft)}
  .ho.back{border-color:var(--rule);border-width:2px;color:var(--rule);background:var(--paper)}

  /* ── 이름 밝히기 ── 결과를 여는 순간 화면을 덮고 한 글자씩 새긴다. */
  .name-blast{
    position:fixed;inset:0;z-index:60;background:var(--paper);
    display:flex;align-items:center;justify-content:center;gap:min(2vw,2rem);
    /* 걷힐 때는 짧게 — 되살아난 자 명단이 "확" 드러나야 한다. */
    transition:opacity .3s ease;
    /* 조작판을 덮고 있는 동안에도 선생님이 단추를 누를 수 있어야 한다. */
    pointer-events:none;
  }
  .name-blast.out{opacity:0}
  .name-blast span{
    font-family:var(--serif);font-weight:800;color:var(--seal);line-height:1;
    /* 글자 수에 맞춰 폭을 나눠 갖는다 — 네 글자든 여섯 글자든 화면을 꽉 채우되
       옆으로 넘치지 않게(--bfs는 nameBlast가 새겨 넣는다). */
    font-size:var(--bfs, min(20vw, 46vh));letter-spacing:0;
    /* 떨어지는 차례(--d)는 nameBlast가 글자마다 새겨 넣는다. 인라인 style로 직접
       animation-delay를 걸면 깜빡임에도 그 차례가 따라붙어 제각각 깜빡인다. */
    animation:blastIn .55s cubic-bezier(.2,1.5,.35,1) var(--d,0s) both;
  }
  @keyframes blastIn{
    0%{opacity:0;transform:scale(2.6)}
    62%{opacity:1;transform:scale(.94)}
    100%{opacity:1;transform:scale(1)}
  }
  /* 다 떨어진 뒤 몇 번 깜빡인다. 떨어지는 애니메이션은 이미 끝나 있으므로
     여기서 animation을 갈아 끼워도 글자가 제자리에서 튀지 않는다. */
  .name-blast.blink span{animation:blastBlink .34s steps(1,end) 0s 4}
  @keyframes blastBlink{ 0%,49%{opacity:1} 50%,100%{opacity:.12} }
  /* 화면 효과를 줄여 달라고 해 둔 기기에서는 글자를 한꺼번에 세운다. */
  @media (prefers-reduced-motion:reduce){
    .name-blast span{animation:none;opacity:1}
    .name-blast.blink span{animation:none}
  }

  /* ── 대기실 ── */
  .center{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:1rem;
  }
  .center .big{font-family:var(--serif);font-weight:800;font-size:calc(var(--fs) * 2.4)}
  .center .sub{color:var(--ink-soft);font-size:calc(var(--fs) * .95)}
  .dots::after{content:"";animation:dots 1.4s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  /* ── 반 고르기 ── 주소에 ?cls= 를 붙이지 않고 열었을 때 ── */
  .pickcls{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1rem}
  .pickcls button{
    font-family:var(--serif);font-weight:600;font-size:calc(var(--fs) * 1.1);
    background:var(--paper-panel);border:1.5px solid var(--ink);color:var(--ink);
    padding:.5em 1.2em;cursor:pointer;
  }
  .pickcls button:hover{background:var(--ink);color:var(--paper)}

  /* ── 결말 ── */
  .parties{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;margin-top:1.2rem}
  .party{border:2px solid var(--ink);padding:1rem 1.1rem;background:var(--paper-panel)}
  .party.dong{border-color:var(--dong)}
  .party.seo{border-color:var(--seo)}
  .party .t{font-family:var(--serif);font-weight:800;font-size:calc(var(--fs) * 1.3);margin-bottom:.2rem}
  .party.dong .t{color:var(--dong)}
  .party.seo .t{color:var(--seo)}
  .party .w{font-size:calc(var(--fs) * .8);color:var(--ink-soft);margin-bottom:.8rem}

  /* ── 교사 조작판 ──
     예전에는 어드민(RUN)에서 사건을 열고 이 화면은 보여 주기만 했다. 두 화면을
     오가는 것이 번거로워, 여는 단추를 화면 아래로 내렸다. 어드민 RUN에는 반과
     기본 제한 시간 같은 밑준비만 남는다. */
  .ctl{
    flex:none;position:relative;z-index:2;
    border-top:2px solid var(--ink);background:var(--paper-panel);
    display:flex;align-items:center;gap:.5rem;padding:.5rem .9rem;
    font-size:calc(var(--fs) * .8);
  }
  .ctl:empty{display:none}
  .ctl.folded .ctl-in{display:none}
  .ctl-fold{
    font-family:var(--sans);font-size:calc(var(--fs) * .78);line-height:1;flex:none;
    background:transparent;border:1.5px solid var(--ink);color:var(--ink);
    padding:.45em .7em;cursor:pointer;border-radius:0;
  }
  .ctl-fold:hover{background:var(--ink);color:var(--paper)}
  .ctl-in{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;flex:1;min-width:0}
  .ctl-sel,.ctl-btn{
    font-family:var(--sans);font-size:calc(var(--fs) * .8);font-weight:500;
    background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);
    padding:.4em .9em;cursor:pointer;border-radius:0;
  }
  .ctl-btn:hover{background:var(--ink);color:var(--paper)}
  .ctl-btn.go{background:var(--ink);color:var(--paper);font-weight:600}
  .ctl-btn.go:hover{opacity:.85}
  .ctl-btn.warn{border-color:var(--seal);color:var(--seal)}
  .ctl-btn.warn:hover{background:var(--seal);color:var(--paper)}
  /* 지금 누를 수 없는 단추(사건을 아직 안 연 상태의 [결과 공개] 등)는 눌러 둔다. */
  .ctl-btn[disabled]{opacity:.4;cursor:default;background:var(--paper);color:var(--ink)}
  .ctl-btn[disabled]:hover{background:var(--paper);color:var(--ink);opacity:.4}
  .ctl-cnt{
    margin-left:auto;font-family:var(--ui);font-variant-numeric:tabular-nums;
    font-weight:500;white-space:nowrap;
  }
  .ctl-cnt b{font-size:calc(var(--fs) * 1.15);color:var(--rule)}
  .ctl-cnt .sep{color:var(--ink-faint);margin:0 .55em;font-weight:400}
  .ctl-note{color:var(--ink-soft)}

  /* 방을 조작하려면 교사 계정이 필요하다(보여 주기만 하는 것은 누구나 된다). */
  .lock{
    position:fixed;inset:0;z-index:10;background:rgba(42,35,24,.55);
    display:none;align-items:center;justify-content:center;
  }
  .lock.open{display:flex}
  .lock-box{background:var(--paper-panel);border:2px solid var(--ink);padding:1.6rem 1.8rem;width:min(26rem,90vw)}
  .lock-t{font-family:var(--serif);font-weight:800;font-size:calc(var(--fs) * 1.25);margin-bottom:.4rem}
  .lock-s{color:var(--ink-soft);font-size:calc(var(--fs) * .8);line-height:1.7;margin-bottom:1rem;text-align:justify}
  .lock input{
    display:block;width:100%;margin-bottom:.6rem;font-family:var(--sans);
    font-size:calc(var(--fs) * .88);padding:.5em .6em;color:var(--ink);
    background:var(--paper);border:1.5px solid var(--ink);border-radius:0;
  }
  .lock input:focus{outline:none;border-color:var(--rule)}
  .lock-e{color:var(--seal);font-size:calc(var(--fs) * .76);min-height:1.5em}
  .lock-btns{display:flex;gap:.5rem;justify-content:flex-end}
</style>
</head>
<body>
<div id="wrap">
  <header class="top" id="top"></header>
  <main id="stage"></main>
  <footer class="ctl" id="ctl"></footer>
</div>

<div class="lock" id="lock">
  <div class="lock-box">
    <div class="lock-t">교사 로그인</div>
    <div class="lock-s">이 화면에서 사건을 열고 공개하려면 교사 계정으로 들어와야 합니다.
      보여 주기만 할 것이라면 그냥 닫아도 진행 상황은 계속 보입니다.</div>
    <input type="email" id="lk-email" placeholder="이메일" autocomplete="username">
    <input type="password" id="lk-pw" placeholder="비밀번호" autocomplete="current-password">
    <div class="lock-e" id="lk-err"></div>
    <div class="lock-btns">
      <button class="ctl-btn" id="lk-cancel">닫기</button>
      <button class="ctl-btn go" id="lk-go">접속하기</button>
    </div>
  </div>
</div>

<!-- 사건 표와 문구를 학생 화면과 함께 쓴다. 여기서는 그리기에 필요한 것만 꺼내 쓴다. -->
<!-- 학생 화면과 교실 화면이 같은 game.js를 읽어야 사건 설명과 선지가 어긋나지 않는다.
     한쪽만 옛 파일을 캐시에서 꺼내 쓰는 일이 없도록 판 번호를 붙인다. -->
<script src="game.js?v=20260909c"></script>

<script type="module">
/* 방을 구독해 그리기만 한다. 쓰기는 하지 않는다 — 이 화면은 보여 주는 일만 맡는다. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, onValue, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "../../shared/firebase-config.js";

const app  = initializeApp(firebaseConfig);
const rtdb = getDatabase(app);
const auth = getAuth(app);
const ROOMS = "sahwa_rooms";

const PHASES = ["1498","1504","1506","1519","1545","1575"];
const PHASE_NAME = {
  "lobby":"대기실","1498":"제1화 무오사화","1504":"제2화 갑자사화","1506":"제3화 중종반정",
  "1519":"제4화 기묘사화","1545":"제5화 을사사화","1575":"제6화 붕당의 형성","final":"결말"
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const QS = new URLSearchParams(location.search);
let CLS = QS.get("cls") || "";
/* 어드민 RUN에서 넘겨준 기본 제한 시간. 방에 적힌 값보다 이쪽이 우선이다 —
   방금 어드민에서 고르고 넘어온 값이 교사의 최신 뜻이기 때문이다. */
const SECS0 = QS.get("secs");
let ROOM = null;
let TICK = null;
let UNSUB = null;
let ME = null;              // 로그인한 교사 (없으면 보여 주기 전용)
let CLASSES = [];           // 명단에서 뽑은 실제 반 목록
let PICK_TOUCHED = false;   // 교사가 사건 칸을 직접 건드렸는가
let SECS_TOUCHED = false;   // 제한 시간 칸을 직접 건드렸는가

/* 반 목록은 명단(RTDB students)에서 뽑는다. 1~10반을 박아 두면 없는 반이 떠서
   실제 반 수와 어긋난다. 학번 둘째·셋째 자리가 반이다. */
async function loadClasses(){
  try{
    const snap = await get(ref(rtdb, "students"));
    const set = new Set();
    Object.values(snap.val() || {}).forEach(s => {
      const sid = String((s && (s.studentId || s.id)) || "").trim();
      const c = parseInt(sid.slice(1, 3), 10);
      if (!isNaN(c) && c > 0) set.add(c);
    });
    CLASSES = [...set].sort((a, b) => a - b);
  }catch(e){ CLASSES = []; }
  return CLASSES;
}

function fmtLeft(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

/* ── 반 고르기 ── 주소에 반을 안 적고 열면 여기서 고른다. 고르면 주소에 남겨
   새로고침해도 같은 반으로 돌아온다(수업 중 티비를 껐다 켜는 일이 잦다). */
function paintPickClass(){
  $("#top").innerHTML = `<span class="ph">사화에서 살아남기 교실 화면</span>`;
  const ready = CLASSES.length > 0;
  $("#stage").innerHTML = `<div class="center">
    <div class="big">어느 반을 띄울까요</div>
    <div class="sub">${ready ? "고른 반의 진행이 이 화면에 그대로 나타납니다."
                             : "명단에서 반을 읽는 중입니다."}</div>
    <div class="pickcls">${CLASSES.map(n=>`<button data-c="${n}">${n}반</button>`).join("")}</div>
  </div>`;
  $("#stage").querySelectorAll(".pickcls button").forEach(b => b.onclick = () => {
    CLS = b.dataset.c;
    const u = new URL(location.href); u.searchParams.set("cls", CLS);
    history.replaceState(null, "", u);
    subscribe();
  });
}

function subscribe(){
  if (UNSUB) UNSUB();
  $("#stage").innerHTML = `<div class="center"><div class="big">방을 여는 중<span class="dots"></span></div></div>`;
  UNSUB = onValue(ref(rtdb, `${ROOMS}/${CLS}`), snap => { ROOM = snap.exists() ? snap.val() : {}; render(); });
}

/* 선비 목록 — RTDB에 담긴 그대로. 학번순으로 세워야 교사가 눈으로 짚기 좋다. */
function playersOf(room){
  return Object.values(room.players || {}).filter(Boolean)
    .sort((a, b) => String(a.id || "").localeCompare(String(b.id || "")));
}

function hoChip(p, year, showEnshrined){
  // 이번 사건에서 막 죽은 사람은 붉게 세워 눈에 띄게 한다.
  const fresh = !p.alive && year && p.deathYear === year;
  const enshrined = showEnshrined && (p.fame | 0) >= ENSHRINE;
  const cls = "ho" + (fresh ? " fresh" : "") + (enshrined ? " enshrined" : "");
  return `<span class="${cls}">${esc(p.ho || p.name || p.id || "")}</span>`;
}

function listsHTML(room, year){
  const ps = playersOf(room);
  const alive = ps.filter(p => p.alive), dead = ps.filter(p => !p.alive);
  const justDied = year ? dead.filter(p => p.deathYear === year).length : 0;
  return `<div class="lists">
    <div class="lcol">
      <div class="lhead"><span class="t">살아남은 자</span><span class="n">${alive.length}</span></div>
      <div class="hos">${alive.map(p => hoChip(p, year)).join("") || `<span class="ho">—</span>`}</div>
    </div>
    <div class="lcol dead">
      <div class="lhead"><span class="t">졸(卒)한 자</span><span class="n">${dead.length}</span></div>
      <div class="hos">${dead.map(p => hoChip(p, year)).join("") || `<span class="ho">—</span>`}</div>
      ${justDied ? `<div class="lnote">이번 사건에서 ${justDied}명이 붉게 새로 올랐습니다.</div>` : ""}
    </div>
  </div>`;
}

/* ── 이름 새기기 ── 중종반정 전용.
   갑자사화 결과를 보고 [다음 사건]을 누르는 순간, 화면 가득 "중 종 반 정"이
   한 글자씩 두둥 떨어진다. 다 떨어지면 몇 번 깜빡이고, 걷히면서 그 아래
   준비해 둔 되살아난 자 명단이 한꺼번에 드러난다.
   다른 사화에는 걸지 않는다 — 매번 터지면 이 장면의 무게가 사라진다.
   방 스냅샷은 학생이 하나 낼 때마다 오므로 판(phase+round)마다 한 번만 터뜨린다. */
let BLAST_KEY = "";
function nameBlast(ev, room, phase){
  if (ev.kind !== "auto") return;
  const key = phase + ":" + (room.round || 0);
  if (BLAST_KEY === key) return;
  BLAST_KEY = key;
  const chars = [...String(ev.name || "")];
  if (!chars.length) return;
  const old = document.getElementById("blast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.id = "blast";
  el.className = "name-blast";
  // 글자가 많을수록 한 글자에 돌아가는 폭이 좁아진다. 88vw를 나눠 갖는다.
  el.style.setProperty("--bfs", `min(${(88 / chars.length).toFixed(1)}vw, 46vh)`);
  el.innerHTML = chars.map((c, i) =>
    `<span style="--d:${(i * 0.42).toFixed(2)}s">${esc(c)}</span>`).join("");
  document.body.appendChild(el);

  const landed = chars.length * 420 + 550;   // 마지막 글자가 앉는 때
  setTimeout(() => el.classList.add("blink"), landed + 250);
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 320);
  }, landed + 1850);
}

/* 중종반정에서 조정으로 돌아온 이들. 이 장면의 알맹이가 "누가 되살아났는가"라서
   명단 위에 따로 세운다. 판정은 학생 화면과 교사의 대신 처리가 함께 남기는
   답 key로 알아본다(revive = 서원을 두어 다시 불려 온 사람). */
function revivedHTML(room, phase){
  const answers = ((room.answers || {})[phase]) || {};
  const players = room.players || {};
  const back = Object.keys(answers)
    .filter(sid => answers[sid] && answers[sid].choice === "revive")
    .map(sid => players[sid]).filter(Boolean)
    .sort((a, b) => String(a.id || "").localeCompare(String(b.id || "")));
  if (!back.length) {
    return `<div class="revive-box"><div class="rt">되살아난 자 <span class="n">0</span></div>
      <div class="rsub">돌아온 사람이 없습니다. 고향에 서원을 두지 않았다면, 명부에서 지워진 이름을 대신 불러 줄 사람도 없습니다.</div></div>`;
  }
  return `<div class="revive-box">
    <div class="rt">되살아난 자 <span class="n">${back.length}</span></div>
    <div class="hos">${back.map(p => `<span class="ho back">${esc(p.ho || p.name || p.id || "")}</span>`).join("")}</div>
    <div class="rsub">고향의 서원에서 제자들이 스승의 이름을 계속 불렀고, 훈구를 견제할 사람을 찾던 새 조정이 그 이름을 다시 불러들였습니다.</div>
  </div>`;
}

/* 선택지가 없는 장면(중종반정, 갑자사화 제비뽑기)의 공개 화면.
   무엇을 골랐는지가 아니라 어떻게 갈렸는지를 세어 보여 준다. */
function tallyHTML(ev, room, phase){
  const answers = ((room.answers || {})[phase]) || {};
  const tally = {};
  Object.values(answers).forEach(a => { const k = a && a.choice; if (k) tally[k] = (tally[k] || 0) + 1; });
  const keys = Object.keys(tally);
  if (!keys.length) return "";
  const total = keys.reduce((s, k) => s + tally[k], 0) || 1;
  return `<div class="choices">${keys.sort((a, b) => tally[b] - tally[a]).map((k, i) => {
    const n = tally[k], pct = Math.round(n / total * 100);
    const lb = (ev.shortOf && ev.shortOf[k]) || k;
    return `<div class="ch res"><span class="fill" style="width:${pct}%"></span>
      <span class="n">${i + 1}</span><span class="lb">${esc(lb)}</span><span class="cn">${n}명</span></div>`;
  }).join("")}</div>`;
}

/* 선택지 — 열려 있을 때는 글만, 공개된 뒤에는 몇 명이 골랐는지 막대로 함께 보인다. */
function choicesHTML(ev, room, phase, revealed){
  const list = ev.choices || [];
  if (!list.length) return "";
  const answers = ((room.answers || {})[phase]) || {};
  const tally = {};
  Object.values(answers).forEach(a => { const k = a && a.choice; if (k) tally[k] = (tally[k] || 0) + 1; });
  const total = Object.values(tally).reduce((a, b) => a + b, 0) || 1;
  return `<div class="choices">${list.map((c, i) => {
    const n = tally[c.key] || 0;
    const pct = revealed ? Math.round(n / total * 100) : 0;
    return `<div class="ch${revealed ? " res" : ""}">
      ${revealed ? `<span class="fill" style="width:${pct}%"></span>` : ""}
      <span class="n">${i + 1}</span>
      <span class="lb">${revealed ? esc(c.short || c.label) : esc(c.label)}</span>
      ${revealed ? `<span class="cn">${n}명</span>` : ""}
    </div>`;
  }).join("")}</div>`;
}

function render(){
  if (TICK) { clearInterval(TICK); TICK = null; }
  const room = ROOM || {};
  const phase = room.phase ? String(room.phase) : null;
  const state = room.state || "waiting";
  const ps = playersOf(room);
  const ev = phase && EVENTS[phase];

  /* ── 머리띠 ── */
  const answered = Object.keys(((room.answers || {})[phase]) || {}).length;
  const expect = expectOf(room, ps, String(phase || ""));
  const stName = state === "open" ? "선택 중" : state === "revealed" ? "결과 공개" : "대기";
  $("#top").innerHTML = `
    <span class="cls">${esc(CLS)}반</span>
    <span class="ph">${ev ? esc(ev.eyebrow) : phase === "final" ? "결말 붕당의 형성" : "사화에서 살아남기"}</span>
    <span class="st ${state}">${stName}</span>
    <span class="tmr" id="tmr"></span>
    <span class="cnt">들어온 사람 <b>${ps.length}</b>명<span class="sep">|</span>선택 <b>${answered}</b>명 / 생존 <b>${expect}</b>명</span>`;

  if (state === "open" && room.endsAt) {
    const paint = () => {
      const el = document.getElementById("tmr"); if (!el) return;
      const left = room.endsAt - Date.now();
      el.textContent = fmtLeft(left);
      el.classList.toggle("hot", left <= 10000);
    };
    paint(); TICK = setInterval(paint, 250);
  }

  syncCtl();

  /* ── 결말 ── */
  if (phase === "final") { renderFinal(ps); return; }

  /* ── 대기실 ── 아직 사건을 안 열었다 ── */
  if (!phase || phase === "lobby" || state === "waiting" || !ev) {
    $("#stage").innerHTML = `<div class="center">
      <div class="big">선비들이 모이는 중<span class="dots"></span></div>
      <div class="sub">${ps.length}명이 붓을 들었습니다. 선생님이 사건을 열면 이 화면이 바뀝니다.</div>
      ${ps.length ? `<div class="hos" style="justify-content:center;max-width:70vw">${ps.map(p => hoChip(p)).join("")}</div>` : ""}
    </div>`;
    return;
  }

  const year = +phase;

  /* ── 중종반정 ── 고를 것이 없는 장면이라 열리는 순간이 곧 판가름이다.
     선택 분포도, 생존과 졸의 명단도 여기서는 곁가지다. 화면 가득 이름을 새기고
     이야기 아래에 되살아난 이들만 세운다. 사건이 열려 있든 공개했든 같은 화면. */
  if (ev.kind === "auto") {
    $("#stage").innerHTML = `
      <div class="eyebrow">${esc(ev.eyebrow)}</div>
      <div class="reveal-name">${esc(ev.name || "")}</div>
      <div class="reveal-sub">${esc(ev.title || "")}</div>
      <div class="situation">${ev.situation || ""}</div>
      ${revivedHTML(room, phase)}`;
    nameBlast(ev, room, phase);
    return;
  }

  /* ── 결과 공개 ── 명단이 주인공이다 ── */
  if (state === "revealed") {
    $("#stage").innerHTML = `
      <div class="eyebrow">${esc(ev.eyebrow)}</div>
      <div class="reveal-name">${esc(ev.name || ev.title || "")}</div>
      <div class="reveal-sub">${esc(ev.title || "")}</div>
      ${ev.choices ? choicesHTML(ev, room, phase, true) : tallyHTML(ev, room, phase)}
      ${listsHTML(room, year)}`;
    return;
  }

  /* ── 사건 진행 중 ──
     선택지가 있는 장면은 설명과 선택지를 나란히 둔다(티비는 가로가 길다).
     중종반정처럼 고를 것이 없거나 갑자사화처럼 패를 뽑는 장면은 오른쪽에 채울 것이
     없으므로, 빈 칸에 "그대는 어찌하겠는가"만 남기지 말고 설명을 폭 전체로 편다. */
  const hasChoices = !!(ev.choices && ev.choices.length);
  $("#stage").innerHTML = `
    <div class="eyebrow">${esc(ev.eyebrow)}</div>
    <h1>${esc(ev.title || "")}</h1>
    ${hasChoices
      ? `<div class="split">
          <div class="situation">${ev.situation || ""}</div>
          <div>
            <h2>그대는 어찌하겠는가</h2>
            ${choicesHTML(ev, room, phase, false)}
          </div>
        </div>`
      : `<div class="situation">${ev.situation || ""}</div>
         ${ev.guide ? `<p class="guide">${esc(ev.guide)}</p>` : ""}`}`;
}

function renderFinal(ps){
  const dong = ps.filter(p => p.master === "dong");
  const seo  = ps.filter(p => p.master !== "dong");
  const alive = ps.filter(p => p.alive);
  const dead  = ps.filter(p => !p.alive);
  const enshrined = ps.filter(p => (p.fame | 0) >= ENSHRINE);
  const chip = p => hoChip(p, null, true);
  const col = (t, w, list, cls) => `<div class="party ${cls}">
      <div class="t">${t} ${list.length}명</div>
      <div class="w">${w}</div>
      <div class="hos">${list.map(p => chip(p)).join("") || `<span class="ho">—</span>`}</div>
    </div>`;
  $("#stage").innerHTML = `
    <div class="eyebrow">1575 붕당의 형성</div>
    <h1>77년이 지났다</h1>
    <div class="lists">
      <div class="lcol">
        <div class="lhead"><span class="t">살아남은 자</span><span class="n">${alive.length}</span></div>
        <div class="hos">${alive.map(p => chip(p)).join("") || `<span class="ho">—</span>`}</div>
      </div>
      <div class="lcol dead">
        <div class="lhead"><span class="t">졸(卒)한 자</span><span class="n">${dead.length}</span></div>
        <div class="hos">${dead.map(p => chip(p)).join("") || `<span class="ho">—</span>`}</div>
      </div>
    </div>
    ${enshrined.length ? `<div class="enshrine-note">붉은 테두리를 두른 <b>${enshrined.length}명</b>이 서원에 배향되었습니다
      (살아남은 이 ${enshrined.filter(p => p.alive).length}명, 졸한 이 ${enshrined.filter(p => !p.alive).length}명).
      살아남은 것과 이름을 남긴 것은 다릅니다.</div>` : ""}
    <div class="parties">
      ${col("동인(東人)", "이황·조식의 학문을 이은 이들. 김효원의 집이 한양 동쪽에 있었다.", dong, "dong")}
      ${col("서인(西人)", "이이·성혼의 학문을 이은 이들. 심의겸의 집이 한양 서쪽에 있었다.", seo, "seo")}
    </div>`;
}

/* ══════════════════ 교사 조작판 ══════════════════ */
function roomRef(){ return ref(rtdb, `${ROOMS}/${CLS}`); }

/* 이 사건에서 세어야 할 생존자 수.
   학생이 고르는 순간 그 자리에서 생사가 갈려 서버에 올라온다. 그래서 "지금 살아 있는
   사람"을 그대로 세면, 결과를 열기도 전에 교실 화면의 숫자가 줄어들며 누가 죽는
   선택을 했는지가 새어 나간다(중종반정에서는 거꾸로 늘어나며 부활이 새어 나갔다).
   그래서 사건을 열 때 이미 졸했던 사람을 openPhase가 적어 두고, 한 사건 동안은
   그 명단만 빼고 센다 — 사건 안에서는 숫자가 움직이지 않는다.
   적어 둔 것이 없는 옛 방에서는 이번 사건에서 죽은 사람을 도로 더해 되살린다. */
function expectOf(room, ps, phase){
  const raw = (room.deadAt || {})[phase];
  if (typeof raw === "string") {
    const dead = new Set(raw ? raw.split(",") : []);
    return ps.filter(p => !dead.has(String(p.id))).length;
  }
  const y = parseInt(phase, 10);
  return ps.filter(p => p.alive || p.deathYear === y).length;
}
function ctlSecs(){ const el = document.getElementById("c-secs"); return el ? +el.value : 0; }
function openPhase(p){
  const secs = ctlSecs();
  const u = {
    phase: p, state: "open", round: ((ROOM && ROOM.round) || 0) + 1,
    endsAt: secs ? Date.now() + secs * 1000 : null
  };
  /* 사건을 여는 순간 이미 졸(卒)했던 사람의 학번을 적어 둔다. 이것이 이 사건 동안
     생존자 수의 기준이 된다 — 자세한 까닭은 expectOf 참고. 같은 사건을 다시 열어도
     처음 적은 것을 그대로 둔다(그 사이에 죽은 사람이 기준에 섞이면 안 된다). */
  const had = (ROOM && ROOM.deadAt) ? ROOM.deadAt[p] : undefined;
  if (typeof had !== "string") {
    u[`deadAt/${p}`] = playersOf(ROOM || {}).filter(x => !x.alive).map(x => String(x.id)).join(",");
  }
  update(roomRef(), u);
}

/* 끝내 답을 내지 않은 학생을 대신 처리한다. 자리에 있으나 안 누른 학생과 접속이
   끊긴 학생을 똑같이 다뤄, 접속이 나빠 한 사건을 통째로 건너뛰는 일을 막는다.
   규칙은 game.js의 resolveDefaultFor가 쥐고 있다(학생 화면 autoSubmit과 같다).
   방을 새로 읽어 판단하므로 공개·다음을 잇달아 눌러도 두 번 적용되지 않는다. */
async function sweepMissing(phase){
  if(!phase || !EVENTS[phase] || typeof window.resolveDefaultFor !== "function") return;
  let room = {};
  try{ const s = await get(roomRef()); room = s.exists() ? s.val() : {}; }catch(e){ return; }
  const players = room.players || {};
  const answers = (room.answers && room.answers[phase]) || {};
  const u = {};
  Object.keys(players).forEach(sid => {
    if(answers[sid]) return;                              // 이미 낸 학생은 그대로 둔다
    const out = window.resolveDefaultFor(phase, players[sid]);
    if(!out) return;                                      // 죽어 관전인 학생 등 — 대신 낼 것 없음
    u[`players/${sid}`] = out.player;
    u[`answers/${phase}/${sid}`] = { choice: out.key, at: serverTimestamp(), auto: true };
  });
  if(Object.keys(u).length) await update(roomRef(), u);
}

function buildCtl(){
  const el = $("#ctl");
  if (!CLS) { el.innerHTML = ""; return; }
  if (!ME) {
    el.classList.remove("folded");
    el.innerHTML = `<span class="ctl-note">보여 주기 전용입니다. 사건을 열려면 교사 계정으로 들어오십시오.</span>
      <button class="ctl-btn go" id="c-login" style="margin-left:auto">교사 로그인</button>`;
    $("#c-login").onclick = () => openLock();
    return;
  }
  el.innerHTML = `
    <button class="ctl-fold" id="c-fold" title="조작판 접기">접기</button>
    <div class="ctl-in" id="c-in">
      <select class="ctl-sel" id="c-phase">
        ${PHASES.map(p => `<option value="${p}">${PHASE_NAME[p]}</option>`).join("")}
      </select>
      <select class="ctl-sel" id="c-secs">
        <option value="60">60초</option>
        <option value="90" selected>90초</option>
        <option value="120">120초</option>
        <option value="180">180초</option>
        <option value="0">시간 제한 없음</option>
      </select>
      <!-- 진행 중에 가장 자주 누르는 [30초 더]를 드롭다운 바로 옆에 둔다. 그 뒤는
           수업이 흘러가는 차례대로 — 시작, 공개와 다음(한 단추), 결말, 대기실.
           공개와 다음을 한 단추로 합친 것은, [다음 사건]을 먼저 눌러 결과를 안 보고
           넘어가는 일이 잦았기 때문이다. 이제 한 번 누르면 공개, 다시 누르면 다음이다. -->
      <button class="ctl-btn" id="c-more">30초 더</button>
      <button class="ctl-btn go" id="c-open">사건 시작</button>
      <button class="ctl-btn" id="c-step">결과 공개</button>
      <button class="ctl-btn" id="c-final">결말로</button>
      <button class="ctl-btn" id="c-lobby">대기실로</button>
      <span class="ctl-cnt" id="c-cnt"></span>
      <button class="ctl-btn warn" id="c-reset">방 초기화</button>
    </div>`;

  $("#c-fold").onclick = () => {
    el.classList.toggle("folded");
    $("#c-fold").textContent = el.classList.contains("folded") ? "조작판" : "접기";
  };
  // 어드민에서 들고 온 제한 시간이 있으면 그것으로 시작한다.
  if (SECS0 != null && [...$("#c-secs").options].some(o => o.value === String(SECS0))) {
    $("#c-secs").value = String(SECS0);
    SECS_TOUCHED = true;
  }
  $("#c-phase").onchange = () => { PICK_TOUCHED = true; };
  $("#c-secs").onchange  = () => {
    SECS_TOUCHED = true;
    update(roomRef(), { secs: +$("#c-secs").value });   // 어드민 RUN에도 그대로 보인다
  };
  $("#c-open").onclick   = () => { openPhase($("#c-phase").value); PICK_TOUCHED = false; };
  $("#c-more").onclick   = () => update(roomRef(), {
    endsAt: Math.max(Date.now(), (ROOM && ROOM.endsAt) || Date.now()) + 30000
  });
  /* 공개와 다음을 한 단추로 — 한 번 누르면 결과를 열고, 다시 누르면 다음 사건으로
     간다. 결과를 건너뛰고 넘어갈 길이 아예 없으므로 아이들이 자기 판정을 못 보고
     지나가는 일이 생기지 않는다. 지금 무엇을 하는 단추인지는 syncCtl이 새겨 넣는다. */
  $("#c-step").onclick = async () => {
    const room = ROOM || {};
    const cur = String(room.phase || "");
    if (PHASES.indexOf(cur) < 0) return;                      // 대기실이나 결말에서는 할 일이 없다
    if (room.state === "revealed") {                          // 두 번째 누름 = 다음 사건
      const i = PHASES.indexOf(cur);
      const nx = i < PHASES.length - 1 ? PHASES[i + 1] : "final";
      PICK_TOUCHED = false;
      if (nx === "final") update(roomRef(), { phase: "final", state: "revealed", endsAt: null });
      else openPhase(nx);
      return;
    }
    await sweepMissing(cur);                                  // 안 낸 학생을 먼저 대신 처리
    update(roomRef(), { state: "revealed", endsAt: null });
  };
  $("#c-final").onclick = async () => {
    await sweepMissing(String((ROOM && ROOM.phase) || ""));
    update(roomRef(), { phase: "final", state: "revealed", endsAt: null });
  };
  $("#c-lobby").onclick = () => update(roomRef(), { phase: "lobby", state: "waiting", endsAt: null });
  $("#c-reset").onclick = async () => {
    if (!confirm(`${CLS}반 방을 초기화합니다.\n학생들의 진행 상황과 사초가 모두 지워집니다. 되돌릴 수 없습니다.`)) return;
    await remove(roomRef());
    // 학생 화면이 "빈 스냅샷"을 전송 실패로 오해하지 않도록 대기 상태를 다시 써 준다.
    await update(roomRef(), { phase: "lobby", state: "waiting", round: 0, endsAt: null });
  };
  syncCtl();
}

/* 방이 바뀔 때마다 조작판의 숫자와 고른 값을 맞춘다. 교사가 직접 건드린 칸은
   건드리지 않는다 — 다음 사건을 미리 골라 둔 것을 스냅샷이 되돌리면 안 된다. */
function syncCtl(){
  const cnt = document.getElementById("c-cnt");
  const room = ROOM || {};
  if (cnt) {
    const ps = playersOf(room);
    const answered = Object.keys(((room.answers || {})[room.phase]) || {}).length;
    const expect = expectOf(room, ps, String(room.phase || ""));
    cnt.innerHTML = `선택 <b>${answered}</b>명 / 생존 <b>${expect}</b>명<span class="sep">|</span>들어온 사람 ${ps.length}명`;
  }
  /* 합친 단추의 얼굴. 사건이 열려 있으면 [결과 공개], 이미 공개했으면 [다음 사건],
     마지막 사건까지 공개했으면 [결말로]. 그 밖에는 누를 것이 없어 눌러 둔다. */
  const step = document.getElementById("c-step");
  if (step) {
    const cur = String(room.phase || "");
    const i = PHASES.indexOf(cur);
    const revealed = room.state === "revealed";
    step.disabled = i < 0;
    step.textContent = i < 0 ? "결과 공개"
      : revealed ? (i === PHASES.length - 1 ? "결말로" : "다음 사건")
      : "결과 공개";
    step.classList.toggle("go", i >= 0);
  }

  const sel = document.getElementById("c-phase");
  if (sel && !PICK_TOUCHED) {
    const p = String(room.phase || "");
    if (PHASES.indexOf(p) >= 0) sel.value = p;
  }
  const secs = document.getElementById("c-secs");
  if (secs && !SECS_TOUCHED && room.secs != null) {
    const v = String(room.secs | 0);
    if ([...secs.options].some(o => o.value === v)) secs.value = v;
  }
}

/* ── 로그인 ── 어드민에 이미 들어와 있으면 같은 브라우저의 로그인이 그대로 잡혀
   이 창은 뜨지 않는다. 티비를 따로 켠 경우에만 쓴다. */
function openLock(){
  $("#lock").classList.add("open");
  $("#lk-err").textContent = "";
  $("#lk-email").focus();
}
$("#lk-cancel").onclick = () => $("#lock").classList.remove("open");
$("#lk-go").onclick = async () => {
  const err = $("#lk-err");
  err.textContent = "들어가는 중…";
  try {
    await signInWithEmailAndPassword(auth, $("#lk-email").value.trim(), $("#lk-pw").value);
    $("#lock").classList.remove("open");
  } catch (e) { err.textContent = "이메일 또는 비밀번호를 확인해 주세요."; }
};
$("#lk-pw").onkeydown = e => { if (e.key === "Enter") $("#lk-go").click(); };

onAuthStateChanged(auth, u => { ME = u || null; buildCtl(); });

loadClasses().then(() => { if (!CLS) paintPickClass(); });
if (CLS) { subscribe(); buildCtl(); } else paintPickClass();
</script>
</body>
