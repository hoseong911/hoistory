<!DOCTYPE html>
<html lang="ko" class="hi-theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>사화 네컷 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ===== 레트로 필름(인생네컷) 감성: 크림 인화지 + 필름 프레임 + 오렌지레드 + 빈티지 틸 ===== */
:root{
  --cream:#EFE7D6;--paper:#F5EFE1;--film:#1E1B16;--ink:#1E1B16;
  --accent:#E4572E;--accent-deep:#C13D18;--teal:#2F8F83;--teal-deep:#227368;
  --muted:#8A7F6C;--line:#D8CDB6;
  --bubble:#ffffff;--bubble-line:#1E1B16;--panel-bg:#efece3;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:40px}
.screen{display:none}
.screen.active{display:block}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px}

/* ── 이름 게이트 / 카드 ── */
.intro-card{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:32px 22px;box-shadow:8px 8px 0 rgba(30,27,22,.12);text-align:center;margin-top:28px;overflow:hidden}
/* 카드 상단을 가로지르는 얇은 그라데이션 바 (필름 색띠 느낌) */
.intro-card::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--accent) 0%,#E8A33D 38%,var(--teal) 72%,var(--teal-deep) 100%)}
/* 제목은 손글씨체 그대로 두되 항상 한 줄로 앉힌다. 길면 fitIntroTitle()이 줄여 맞춘다. */
.intro-title{font-family:'Gaegu',cursive;font-weight:700;font-size:36px;line-height:1.15;margin-bottom:8px;color:var(--ink);white-space:nowrap;overflow:hidden}
/* 본문은 읽는 글이라 고운 바탕(명조)으로 둔다 — 손글씨 제목과 대비되면서 차분해진다. */
.intro-sub{font-family:'Gowun Batang',serif;color:var(--muted);font-size:15px;line-height:1.8;margin-bottom:22px;white-space:pre-wrap}
.namebox{margin:18px 0}
.namebox label{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.namebox input{font-family:inherit;font-size:16px;text-align:center;padding:12px 14px;width:min(240px,100%);border:2px solid var(--ink);border-radius:10px;background:#fff}
.who{font-family:'Gaegu',cursive;font-size:18px;font-weight:700;background:var(--cream);border:1.5px dashed var(--ink);border-radius:12px;padding:12px;margin:10px 0}
.btn{font-family:inherit;font-weight:700;font-size:16px;border:2px solid var(--ink);border-radius:12px;padding:13px 26px;cursor:pointer;transition:transform .1s,box-shadow .1s;-webkit-tap-highlight-color:transparent;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn-ghost{background:var(--paper);color:var(--ink)}
.btn-block{width:100%}
.btn-lg{font-size:18px;padding:16px 26px}
.btn .hi-ic{vertical-align:-2px}

/* ── 인트로: 사건 고르기 ── */
/* 고르는 부분은 읽기 쉬운 게 먼저라 본문 폰트(프리텐다드)를 쓴다. */
.ev-label{font-family:'Pretendard',-apple-system,sans-serif;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
.ev-pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:22px}
@media(max-width:420px){.ev-pick{grid-template-columns:1fr}}
.ev-btn{font-family:'Pretendard',-apple-system,sans-serif;font-weight:700;font-size:16px;padding:15px 8px 13px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s,box-shadow .1s,background .1s;box-shadow:3px 3px 0 rgba(30,27,22,.16);line-height:1.1}
.ev-btn .ev-no{display:block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.ev-btn.on{background:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.ev-btn.on .ev-no{color:rgba(255,255,255,.8)}

/* ── 상단 바 ── */
.topbar{position:sticky;top:0;z-index:30;background:rgba(239,231,214,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:10px;padding:12px 16px}
.topbar .t{font-family:'Gaegu',cursive;font-weight:700;font-size:22px;flex:1}
.topbar .who-mini{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* 안내 문구는 어드민에서 고칠 수 있고, 줄바꿈한 대로 보인다(항목마다 한 줄). */
.hint{background:#fff;border:1.5px dashed var(--teal);border-radius:12px;padding:12px 15px;font-size:13px;color:var(--teal-deep);margin:16px 0;line-height:1.75;font-weight:600;white-space:pre-line}
.hint b{color:var(--accent-deep)}
/* 컷당 2개 초과 등, 잠깐 떴다 사라지는 안내 */
.warn-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--cream);font-size:14px;font-weight:700;padding:12px 20px;border-radius:100px;box-shadow:0 8px 24px rgba(30,27,22,.35);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px);text-align:center}
.warn-toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ── 편집 무대 ──
   예전엔 편집 중에도 검은 필름 프레임(구멍 뚫린 띠)으로 감쌌는데, 그만큼 그림이 작아졌다.
   필름 모양은 완성 이미지에서만 보여주고(buildExportDOM), 편집할 때는 그림을 폭 가득
   키운다. 높이는 컷의 실제 비율(--cut-ar)이 정하므로 그림이 찌그러지지 않는다. */
.cutstage{margin-top:14px}

/* ── 한 컷씩 보기 ──
   만화는 사건당 이미지 1장이고, 그 1장이 세로로 네 컷 이어져 있다. 대사를 쓸 때는
   그중 한 컷만 창 크기로 키워 보여주고 나머지는 잘라 감춘다 — 컷을 옮기는 건 아래 번호.
   창의 세로 비율(--cut-ar)은 그림이 실제로 뜬 뒤 자연 크기에서 계산해 넣는다. */
/* 테두리는 border 대신 box-shadow로 그린다 — border가 있으면 창의 안쪽 높이가 테두리만큼
   줄어드는데 그림은 바깥 폭에 맞춰 그려져서, 컷을 넘길수록 옆 컷이 몇 px씩 삐져나온다. */
.cutpage{position:relative;width:100%;aspect-ratio:var(--cut-ar,4/3);overflow:hidden;border-radius:4px;background:var(--panel-bg);user-select:none;box-shadow:0 0 0 2.5px var(--ink),6px 6px 0 rgba(30,27,22,.14)}
/* 그림은 네 컷 전체 높이(창의 4배)라, 컷 번호만큼 위로 밀어 해당 컷만 창에 남긴다. */
.cutpage img.bg{position:absolute;left:0;width:100%;height:auto;display:block;pointer-events:none}
.cutpage .noimg{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#b7b2a5;font-size:14px;font-weight:600;text-align:center;padding:20px;line-height:1.7}
/* 컷 번호는 "#1" 꼴로 그림 위에 얹는다(필름 컷 번호처럼). */
.cutpage .zone-num{position:absolute;top:8px;left:11px;z-index:4;font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);pointer-events:none}
/* 그림이 아직 없으면 흰 글씨가 안 보이므로 잉크색으로 뒤집는다 */
.cutpage.empty .zone-num{color:var(--muted);text-shadow:none}

/* ── 컷 이동 ── */
.cutnav{display:flex;align-items:center;gap:10px;margin-top:14px}
.cutnav .btn{padding:11px 14px;font-size:14px;flex-shrink:0}
.cutnav .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}
.cutdots{flex:1;display:flex;justify-content:center;gap:7px}
.cutdot{font-family:var(--mono);font-size:14px;font-weight:700;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.12s;position:relative}
.cutdot.on{background:var(--accent);color:#fff;border-color:var(--ink)}
/* 대사를 하나라도 쓴 컷은 점을 찍어, 어디를 아직 안 채웠는지 한눈에 보이게 한다. */
.cutdot.done::after{content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--teal)}
.cutdot.on.done::after{background:#fff}

/* ── 말풍선 ── */
.bubble{position:absolute;background:var(--bubble);border:2.5px solid var(--bubble-line);display:flex;align-items:center;justify-content:center}
.bubble.speech{border-radius:16px}
.bubble.thought{border-radius:50%}
/* ── 말풍선 꼬리 ──
   네 귀퉁이(좌하 tb-bl, 우하 tb-br, 우상 tb-tr, 좌상 tb-tl)로 갈 수 있고,
   꼬리를 누를 때마다 그 순서로 돈다. 기본은 좌하.
   풍선 전체를 transform으로 반전하면 안의 글씨까지 뒤집히므로, 꼬리 조각의 기준을
   left/bottom에서 right/top으로 바꾸는 방식만 쓴다. 좌우는 삼각형이 대칭이라 자리만
   옮기면 되지만, 위로 올릴 때는 삼각형이 위를 향해야 해서 border-top을 border-bottom
   으로 바꿔 준다. 어드민에서 잡아 둔 방향이 학생 화면 기본값이 된다. */
.bubble .tail{position:absolute;left:26%;bottom:-13px;width:0;height:0}
.bubble.tb-br .tail,.bubble.tb-tr .tail{left:auto;right:26%}
.bubble.tb-tl .tail,.bubble.tb-tr .tail{bottom:auto;top:-13px}
/* 옆 꼬리(ml/mr)는 위아래 테두리가 아니라 좌우 테두리에 붙고, 세로 가운데에 온다. */
.bubble.tb-ml .tail{left:-13px;right:auto;bottom:auto;top:calc(50% - 10px)}
.bubble.tb-mr .tail{left:auto;right:-13px;bottom:auto;top:calc(50% - 10px)}
.bubble.speech .tail{border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid var(--bubble-line)}
.bubble.speech .tail::after{content:"";position:absolute;left:-7px;top:-16px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid var(--bubble)}
/* 위쪽 꼬리: 삼각형을 뒤집어 위를 향하게 한다(안쪽 흰 삼각형도 같이). */
.bubble.speech.tb-tl .tail,.bubble.speech.tb-tr .tail{border-top:0;border-bottom:16px solid var(--bubble-line)}
.bubble.speech.tb-tl .tail::after,.bubble.speech.tb-tr .tail::after{top:auto;bottom:-16px;border-top:0;border-bottom:12px solid var(--bubble)}
/* 옆 꼬리: 삼각형이 옆을 향하도록 투명 테두리와 색 테두리의 축을 맞바꾼다. */
.bubble.speech.tb-ml .tail,.bubble.speech.tb-mr .tail{border-left:0;border-right:0;border-top:10px solid transparent;border-bottom:10px solid transparent}
.bubble.speech.tb-ml .tail{border-right:16px solid var(--bubble-line)}
.bubble.speech.tb-mr .tail{border-left:16px solid var(--bubble-line)}
.bubble.speech.tb-ml .tail::after,.bubble.speech.tb-mr .tail::after{border-left:0;border-right:0;border-top:7px solid transparent;border-bottom:7px solid transparent;top:-7px;bottom:auto}
.bubble.speech.tb-ml .tail::after{left:4px;border-right:12px solid var(--bubble)}
.bubble.speech.tb-mr .tail::after{left:-16px;border-left:12px solid var(--bubble)}
.bubble.thought .tail,.bubble.thought .tail2{position:absolute;background:var(--bubble);border:2.5px solid var(--bubble-line);border-radius:50%}
.bubble.thought .tail{width:14px;height:14px;left:22%;bottom:-16px}
.bubble.thought .tail2{width:8px;height:8px;left:14%;bottom:-28px}
.bubble.thought.tb-br .tail,.bubble.thought.tb-tr .tail{left:auto;right:22%}
.bubble.thought.tb-br .tail2,.bubble.thought.tb-tr .tail2{left:auto;right:14%}
.bubble.thought.tb-tl .tail,.bubble.thought.tb-tr .tail{bottom:auto;top:-16px}
.bubble.thought.tb-tl .tail2,.bubble.thought.tb-tr .tail2{bottom:auto;top:-28px}
/* 생각 풍선의 작은 원은 방향이 없으니 옆으로 늘어놓기만 하면 된다. */
.bubble.thought.tb-ml .tail{left:-16px;right:auto;bottom:auto;top:calc(50% - 7px)}
.bubble.thought.tb-ml .tail2{left:-28px;right:auto;bottom:auto;top:calc(50% - 4px)}
.bubble.thought.tb-mr .tail{left:auto;right:-16px;bottom:auto;top:calc(50% - 7px)}
.bubble.thought.tb-mr .tail2{left:auto;right:-28px;bottom:auto;top:calc(50% - 4px)}
/* 삼각형과 작은 원은 손가락으로 누르기엔 너무 작다. 그 위에 투명한 누를 자리를 덮는다. */
.bubble .tailhit{position:absolute;z-index:6;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:100px}
.bubble.speech .tailhit{left:calc(26% + 10px);transform:translateX(-50%);bottom:-16px;width:36px;height:28px}
.bubble.speech.tb-br .tailhit,.bubble.speech.tb-tr .tailhit{left:auto;right:calc(26% + 10px);transform:translateX(50%)}
.bubble.speech.tb-tl .tailhit,.bubble.speech.tb-tr .tailhit{bottom:auto;top:-16px}
.bubble.thought .tailhit{left:calc(18% + 5px);transform:translateX(-50%);bottom:-32px;width:46px;height:40px}
.bubble.thought.tb-br .tailhit,.bubble.thought.tb-tr .tailhit{left:auto;right:calc(18% + 5px);transform:translateX(50%)}
.bubble.thought.tb-tl .tailhit,.bubble.thought.tb-tr .tailhit{bottom:auto;top:-32px}
.bubble.speech.tb-ml .tailhit{left:-18px;right:auto;transform:none;bottom:auto;top:calc(50% - 18px);width:34px;height:36px}
.bubble.speech.tb-mr .tailhit{left:auto;right:-18px;transform:none;bottom:auto;top:calc(50% - 18px);width:34px;height:36px}
.bubble.thought.tb-ml .tailhit{left:-36px;right:auto;transform:none;bottom:auto;top:calc(50% - 20px);width:46px;height:40px}
.bubble.thought.tb-mr .tailhit{left:auto;right:-36px;transform:none;bottom:auto;top:calc(50% - 20px);width:46px;height:40px}
.bubble .tailhit:active{background:rgba(228,87,46,.18)}
.btext{position:absolute;inset:15% 16%;overflow:hidden;text-align:center;line-height:1.25;font-family:'Gaegu',cursive;font-weight:700;color:#1c1c1c;word-break:break-word;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;width:auto;outline:none}
.bubble.thought .btext{inset:20% 20%}
.btext:empty::before{content:attr(data-ph);color:#b0aca0;font-weight:400}
.bubble.editing{box-shadow:0 0 0 3px rgba(228,87,46,.55)}
/* 손잡이: 글자 입력(contenteditable)과 드래그가 서로 먹히지 않게 이동은 손잡이로만 한다 */
.bhandle,.bdel{position:absolute;z-index:7;width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1;-webkit-tap-highlight-color:transparent}
.bhandle{left:-10px;top:-10px;background:var(--ink);color:#fff;cursor:move;touch-action:none;font-family:var(--mono)}
.bdel{right:-10px;top:-10px;background:var(--accent);color:#fff;cursor:pointer}

/* 말풍선 추가와 사건 바꾸기는 그림 바로 아래 한 줄에 셋으로 나눠 둔다.
   예전엔 추가 버튼이 그림 위에 겹쳐 있어 그림 오른쪽 위를 가렸다. */
.toolbar{display:flex;gap:8px;margin-top:14px}
.toolbar .btn{flex:1;min-width:0;padding:13px 6px;font-size:14px;white-space:nowrap}
/* 좁은 화면에서는 글자를 줄이고, 그래도 모자라면 넘치는 대신 두 줄로 접히게 둔다. */
@media(max-width:400px){.toolbar .btn{font-size:12px;padding:11px 4px;white-space:normal;line-height:1.3}}

/* ── 완성/저장 ── */
.result-img{width:100%;border:3px solid var(--ink);border-radius:6px;display:block;margin:14px 0;box-shadow:6px 6px 0 rgba(30,27,22,.14)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
/* 완성 뒤 갈 곳 세 군데. 가로로 셋을 나누면 글자가 접혀 읽기 어려워 위아래로 쌓는다. */
.result-actions-row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.saving{text-align:center;padding:30px;color:var(--muted)}
.done-msg{text-align:center;font-weight:700;font-size:15px;line-height:1.6;color:var(--teal-deep);background:#fff;border:1.5px dashed var(--teal);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.done-msg.err{color:var(--accent-deep);border-color:var(--accent)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 아카이브 (goryeo_choice 기준 유지) ── */
#archiveView{display:none;position:fixed;inset:0;z-index:900;background:var(--hi-bg-mid,#f4f3ee);flex-direction:column;overflow-y:auto}
#archiveView.show{display:flex}
.arc-hd{background:#fff;border-bottom:1.5px solid var(--hi-border,#e5e4df);position:sticky;top:0;z-index:5}
.arc-hd-inner{max-width:700px;margin:0 auto;padding:14px 16px}
.arc-hd-top{display:flex;align-items:center;gap:10px}
.arc-back{background:none;border:none;cursor:pointer;padding:6px;color:var(--ink)}
.arc-titles{flex:1;text-align:center}
.arc-title{font-family:'Gaegu',cursive;font-weight:700;font-size:22px}
.arc-subtitle{font-size:12px;color:var(--hi-text-muted,#6b7280)}
.arc-body{max-width:700px;margin:0 auto;width:100%;padding:16px}
/* 태그는 사건 한 줄, 학급 한 줄로 딱 두 줄이어야 한다. 좁은 화면에서 접혀 세 줄, 네 줄이
   되지 않도록 줄바꿈을 막고, 그래도 모자라면 그 줄 안에서만 옆으로 밀어 볼 수 있게 한다
   (스크롤 막대는 감춘다). 글자와 여백도 화면이 좁아지면 함께 줄인다. */
.arc-filter{display:flex;gap:6px;flex-wrap:nowrap;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.arc-filter::-webkit-scrollbar{display:none}
.arc-fbtn{flex:0 0 auto;font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:100px;border:1.5px solid var(--hi-border,#d8d7d0);background:#fff;cursor:pointer;color:var(--ink);white-space:nowrap}
@media(max-width:430px){
  .arc-filter{gap:4px}
  .arc-fbtn{font-size:11px;padding:6px 9px}
}
.arc-fbtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.arc-fbtn.ev.active{background:var(--accent);border-color:var(--accent)}
/* 정렬 토글은 반 태그 줄 아래 오른쪽에. */
.arc-sortrow{display:flex;justify-content:flex-end;margin-bottom:12px}
.arc-sort{display:inline-flex;border:1.5px solid var(--hi-border,#d8d7d0);border-radius:100px;overflow:hidden;background:#fff}
.arc-sort button{font-family:inherit;font-size:12px;font-weight:700;padding:6px 15px;border:0;background:none;color:var(--hi-text-muted,#6b7280);cursor:pointer;-webkit-tap-highlight-color:transparent}
.arc-sort button.active{background:var(--ink);color:#fff}
.arc-tip{font-size:13px;font-weight:600;color:var(--teal-deep);background:#fff;border:1.5px dashed var(--teal);border-radius:12px;padding:10px 14px;margin-bottom:14px;text-align:center;line-height:1.6}

/* 작품은 한 번에 하나씩 크게 보여주고 아래 화살표로 넘긴다. */
.work{background:#fff;border:1px solid var(--hi-border,#e5e4df);border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.work img{width:100%;display:block;cursor:zoom-in}
/* 만화 정보는 한 줄로 — 학번, 이름, 사건 배지, 좋아요. 이름이 길면 이름만 줄인다. */
.arc-meta{display:flex;align-items:center;gap:8px;padding:12px 2px 0;font-size:13px;font-weight:700;min-width:0}
.arc-meta .sid{flex-shrink:0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.arc-meta .nm{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arc-meta .like-btn{margin-left:auto}
.evtag{flex-shrink:0;display:inline-block;font-size:11px;font-weight:700;color:var(--accent-deep);background:rgba(228,87,46,.1);border:1px solid rgba(228,87,46,.28);border-radius:100px;padding:2px 8px}

/* 다른 작품으로 넘기는 화살표 */
.arc-nav{display:flex;align-items:center;gap:12px;margin-top:18px}
.arc-navbtn{flex-shrink:0;width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 rgba(30,27,22,.16);-webkit-tap-highlight-color:transparent;transition:transform .1s,box-shadow .1s}
.arc-navbtn:active{transform:translate(3px,3px);box-shadow:none}
.arc-navbtn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none;transform:none}
.arc-pos{flex:1;text-align:center;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.like-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:13px;font-weight:700;padding:5px 11px;border-radius:100px;border:1.5px solid var(--hi-border,#d8d7d0);background:#fff;color:var(--hi-text-muted,#6b7280);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.12s}
.like-btn:disabled{opacity:.5;cursor:default}
.like-btn.liked{background:rgba(228,87,46,.1);border-color:var(--accent);color:var(--accent-deep)}
.like-btn .hi-ic{fill:none}
.like-btn.liked .hi-ic{fill:currentColor}
.arc-empty{text-align:center;color:var(--hi-text-muted,#6b7280);padding:50px 20px}
.lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

<!-- 오프스크린 내보내기 컨테이너 -->
<div id="exportHost" style="position:fixed;left:-99999px;top:0;width:1080px;background:#EFE7D6"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteField,increment,collection,getDocs,query,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{firebaseConfig}from"../../shared/firebase-config.js";
import{icon}from"../../shared/icons.js";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function filmDateStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `'${String(d.getFullYear()).slice(2)}.${p(d.getMonth()+1)}.${p(d.getDate())}`;}

/* 만화 이미지는 "사화 사건 1개당 세로로 이어진 1장".
   file은 레포에 올려 둔 그림 파일 이름이다(apps/j_4cut/1.png 등). */
const EVENTS=[
  {id:"muo",  name:"무오사화", no:"01", file:"1"},
  {id:"gapja",name:"갑자사화", no:"02", file:"2"},
  {id:"gimyo",name:"기묘사화", no:"03", file:"3"},
];
const CUTS=4;                 // 세로 이미지를 높이로 4등분
const MAX_BUBBLES_PER_CUT=2;  // 컷당 말풍선 상한

/* 기본 콘텐츠 (어드민 미설정 시) */
const DEFAULT_CONTENT={
  title:"사화 네컷",
  introTitle:"사화(士禍), 선비들이 화를 입다",
  introBody:"조선의 조정에 새바람을 일으킨 사림.\n하지만 개혁의 길목마다 피바람이 불었습니다.\n무오사화 · 갑자사화 · 기묘사화 —\n세 번의 사화 속 인물이 되어, 그날의 대사를 채워보세요.",
  introBtn:"사건 고르고 시작하기",
  // 편집 화면 안내. 줄바꿈한 대로 학생 화면에 보인다(어드민에서 고칠 수 있다).
  editHint:"컷 아래 [+ 대사 말풍선] [+ 생각 말풍선]으로 말풍선을 올려요. 한 컷에 2개까지 올릴 수 있어요.\n말풍선을 눌러 대사를 쓰면 글자 크기가 저절로 맞춰져요.\n왼쪽 위 손잡이를 끌면 말풍선을 옮길 수 있어요.\n맨 아래 번호로 컷을 넘기고, 마지막 컷에서 완성본 미리보기를 누르면 돼요.",
  events:EVENTS.map(e=>({id:e.id,name:e.name,cuts:emptyCuts()})),
};
function emptyCuts(){return Array.from({length:CUTS},()=>({bubbles:[]}));}

let CONTENT=DEFAULT_CONTENT;
let student=null;         // {studentId, studentName}
let pickedEventId=null;   // 인트로에서 고른 사건
let curEvent=null;        // {id,name,cuts}
let curImage=null;        // 사건 만화 이미지 dataURL
let work=null;            // 작업본: [{bubbles:[{type,x,y,w,h,text}]}] × 4
let editingEl=null;
const imgCache={};        // eventId -> dataURL (사건을 바꿔가며 볼 때 재요청 방지)

/* ── LMS ── */
function getStudentFromLMS(){
  const sid=localStorage.getItem('lms_autosave_sid');
  const sname=localStorage.getItem('lms_autosave_sname');
  if(!sid||!sname||String(sid).length<3)return null;
  return{studentId:sid,studentName:sname};
}
function classNumOf(sid){const s=String(sid||"");if(s.length<3)return null;const n=parseInt(s.slice(1,3),10);return isNaN(n)?null:n;}
/* 좋아요는 1인 1작품 1회. 학번이 있으면 학번을, 이름만 넣고 들어온 경우엔
   이 기기에 저장해 둔 임의 id를 투표자 키로 쓴다(학번 "00000"끼리 겹치는 걸 막는다). */
function likeKey(){
  if(student&&student.studentId&&student.studentId!=="00000")return student.studentId;
  let g=localStorage.getItem('fourcut_guest_uid');
  if(!g){g='g'+Math.random().toString(36).slice(2,10);localStorage.setItem('fourcut_guest_uid',g);}
  return g;
}

/* ── 안내 토스트 ── */
let toastTimer=null;
function warn(msg){
  const t=$("#warnToast");t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ── 콘텐츠 정규화 ──
   예전 형식({cuts:[{img,bubbles}]×4} — 컷마다 그림 1장)도 열리게 받아준다. */
function normalize(d){
  const c={
    title:d.title||DEFAULT_CONTENT.title,
    introTitle:d.introTitle||DEFAULT_CONTENT.introTitle,
    introBody:d.introBody||DEFAULT_CONTENT.introBody,
    introBtn:d.introBtn||DEFAULT_CONTENT.introBtn,
    editHint:d.editHint||DEFAULT_CONTENT.editHint,
    events:null,
  };
  const byId={};
  if(Array.isArray(d.events))d.events.forEach(e=>{if(e&&e.id)byId[e.id]=e;});
  // 예전 형식이면 그때 잡아둔 말풍선 배치를 세 사건의 출발점으로 물려준다.
  const legacy=(!Array.isArray(d.events)&&Array.isArray(d.cuts))
    ? d.cuts.slice(0,CUTS).map(x=>({bubbles:(x&&Array.isArray(x.bubbles)?x.bubbles:[]).slice(0,MAX_BUBBLES_PER_CUT)}))
    : null;
  c.events=EVENTS.map(meta=>{
    const e=byId[meta.id];
    let cuts=e&&Array.isArray(e.cuts)?e.cuts:legacy;
    if(!Array.isArray(cuts))cuts=emptyCuts();
    cuts=Array.from({length:CUTS},(_,i)=>({
      bubbles:(cuts[i]&&Array.isArray(cuts[i].bubbles)?cuts[i].bubbles:[]).slice(0,MAX_BUBBLES_PER_CUT)
    }));
    return{id:meta.id,name:(e&&e.name)||meta.name,cuts};
  });
  return c;
}

/* ── 초기화 ── */
async function init(){
  try{
    const snap=await getDoc(doc(db,'settings','fourcut_content'));
    if(snap.exists())CONTENT=normalize(snap.data());
  }catch(e){}

  $("#gateTitle").textContent=CONTENT.title;
  $("#introTitle").textContent=CONTENT.introTitle;
  $("#introBody").textContent=CONTENT.introBody;
  $("#startBtn").textContent=CONTENT.introBtn;
  $("#barTitle").textContent=CONTENT.title;
  $("#arcTitle").textContent=CONTENT.title;
  $("#editHint").textContent=CONTENT.editHint;
  renderEventPick();
  fitIntroTitle();
  addEventListener('resize',fitIntroTitle);

  student=getStudentFromLMS();
  showScreen(student?'introScreen':'loginGate');
}

/* 인트로 제목은 한 줄로 앉힌다. 제목을 길게 바꿔도 줄이 안 넘어가도록,
   카드 폭에 들어갈 때까지 글자 크기만 낮춘다(기본 36px, 최소 20px). */
function fitIntroTitle(){
  const el=$("#introTitle");
  if(!el||!el.textContent||!el.clientWidth)return; // 숨어 있는 동안은 폭이 0이라 잴 수 없다
  let size=36;
  el.style.fontSize=size+'px';
  while(size>20&&el.scrollWidth>el.clientWidth){size--;el.style.fontSize=size+'px';}
}

/* ── 화면 전환 ── */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $("#"+id).classList.add('active');
  window.scrollTo(0,0);
  if(id==='introScreen')fitIntroTitle(); // 보이는 순간에 재야 폭이 잡힌다
}

/* ── 인트로: 사건 고르기 ── */
function renderEventPick(){
  $("#evPick").innerHTML=CONTENT.events.map((e,i)=>
    `<button class="ev-btn${pickedEventId===e.id?' on':''}" data-ev="${esc(e.id)}"><span class="ev-no">${EVENTS[i]?EVENTS[i].no:''}</span>${esc(e.name)}</button>`
  ).join("");
  $("#evPick").querySelectorAll('.ev-btn').forEach(b=>b.onclick=()=>{
    pickedEventId=b.dataset.ev;renderEventPick();$("#startBtn").disabled=false;
  });
  $("#startBtn").disabled=!pickedEventId;
}

$("#startBtn").onclick=async()=>{
  if(!pickedEventId)return;
  const btn=$("#startBtn");btn.disabled=true;const label=btn.textContent;btn.textContent="만화를 불러오는 중…";
  try{
    curEvent=CONTENT.events.find(e=>e.id===pickedEventId);
    curImage=await loadEventImage(pickedEventId);
    // 어드민이 잡아둔 기본 배치를 작업본으로 복사(학생이 옮기거나 지워도 원본은 그대로)
    work=curEvent.cuts.map(c=>({bubbles:(c.bubbles||[]).slice(0,MAX_BUBBLES_PER_CUT).map(b=>({...b,text:""}))}));
    enterEditor();
  }catch(e){
    warn('만화를 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  }finally{btn.disabled=false;btn.textContent=label;}
};

/* 만화 이미지는 레포에 직접 올린 파일에서 끌어온다(apps/j_4cut/1.png 등).
   Firestore 문서에 base64로 담던 시절엔 1MB 상한 때문에 화질을 계속 깎아야 했다.
   레포 파일은 그런 제약이 없고, 그림을 바꾸려면 파일만 다시 푸시하면 된다.
   확장자는 미리 정하지 않는다(png로 올릴지 jpg로 올릴지는 그때그때) — 후보를 차례로
   시도해 먼저 열리는 것을 쓰고, 한 번 찾은 결과는 캐시한다. */
const IMG_EXTS=['png','jpg','jpeg','webp'];
const _imgUrlCache={};
function resolveEventImage(file,bust){
  if(!file)return Promise.resolve(null);
  if(!bust&&_imgUrlCache[file]!==undefined)return Promise.resolve(_imgUrlCache[file]);
  return new Promise(res=>{
    let i=0;
    const tryNext=()=>{
      if(i>=IMG_EXTS.length){_imgUrlCache[file]=null;res(null);return;}
      const url=file+'.'+IMG_EXTS[i++]+(bust?'?t='+Date.now():'');
      const im=new Image();
      // im.src는 브라우저가 절대 주소로 풀어 준 값이다. 상대 주소를 그대로 들고 다니면
      // html2canvas가 복제 문서에서 그림을 못 찾는 경우가 있어 절대 주소로 캐시한다.
      im.onload=()=>{_imgUrlCache[file]=im.src;res(im.src);};
      im.onerror=tryNext;
      im.src=url;
    };
    tryNext();
  });
}

async function loadEventImage(evId){
  if(imgCache[evId]!==undefined)return imgCache[evId];
  const meta=EVENTS.find(e=>e.id===evId);
  const url=await resolveEventImage(meta&&meta.file);
  imgCache[evId]=url;
  return url;
}

function enterEditor(){
  $("#barWho").textContent=`${student.studentName} (${student.studentId})`;
  curCut=0;
  applyCutAspect();
  renderCutPage();
  showScreen('editScreen');
}
$("#backIntroBtn").onclick=()=>{
  const filled=work&&work.some(c=>c.bubbles.some(b=>b.text&&b.text.trim()));
  if(filled&&!confirm('지금까지 쓴 대사가 사라집니다. 사건을 바꿀까요?'))return;
  showScreen('introScreen');
};

/* ── 한 컷씩 렌더 ──
   그림 한 장에 네 컷이 이어져 있으므로, 지금 보는 컷만큼 그림을 위로 밀어(top: -N00%)
   창에 그 컷만 남긴다. 말풍선 좌표(x/y/w/h)는 예전 컷 영역과 같은 "컷 기준 %"라 그대로 쓴다. */
let curCut=0;
/* 꼬리 방향 여섯 자리. 풍선 둘레를 한 바퀴 도는 순서다 —
   왼쪽 아래에서 시작해 아래를 지나 오른쪽 변, 위쪽, 왼쪽 변으로 돌아온다.
   ml/mr(옆 가운데)은 위아래가 아니라 좌우 테두리에 붙는다.
   좌우만 있던 시절의 값('left'/'right')도 그대로 읽어 준다. */
const TAIL_ORDER=['bl','br','mr','tr','tl','ml'];
const TAIL_TITLE='누를 때마다 꼬리 자리가 바뀌어요 (왼쪽 아래, 오른쪽 아래, 오른쪽 가운데, 오른쪽 위, 왼쪽 위, 왼쪽 가운데)';
function tailOf(b){
  const t=b&&b.tail;
  if(t==='right')return'br';
  if(t==='left')return'bl';
  return TAIL_ORDER.includes(t)?t:'bl';
}
const nextTail=t=>TAIL_ORDER[(TAIL_ORDER.indexOf(t)+1)%TAIL_ORDER.length];

function bubbleHTML(b,ci,bi){
  const st=`left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%`;
  const tail=(b.type==="thought"?`<span class="tail"></span><span class="tail2"></span>`:`<span class="tail"></span>`)
    +`<span class="tailhit" data-act="tail" title="${TAIL_TITLE}"></span>`;
  const ph=b.type==="thought"?"생각을 써요":"대사를 써요";
  return `<div class="bubble ${b.type==="thought"?"thought":"speech"} tb-${tailOf(b)}" data-ci="${ci}" data-bi="${bi}" style="${st}">
      <div class="bhandle" data-act="move">${icon('move',12)}</div><div class="bdel" data-act="del">${icon('x',13)}</div>
      <div class="btext" contenteditable="true" data-ci="${ci}" data-bi="${bi}" data-ph="${ph}">${esc(b.text)}</div>${tail}</div>`;
}
function renderCutPage(){
  const page=$("#cutPage");
  const c=work[curCut];
  const bg=curImage
    ?`<img class="bg" src="${curImage}" alt="${esc(curEvent.name)} #${curCut+1}" style="top:${-curCut*100}%">`
    :`<div class="noimg">${esc(curEvent.name)} 만화가 아직 준비되지 않았어요.<br>선생님께 알려주세요.</div>`;
  page.className='cutpage'+(curImage?'':' empty');
  page.innerHTML=bg
    +`<span class="zone-num">#${curCut+1}</span>`
    +c.bubbles.map((b,bi)=>bubbleHTML(b,curCut,bi)).join("");
  bindCutPage();
  $("#cutPrev").disabled=curCut===0;
  $("#cutNext").disabled=curCut===CUTS-1;
  // 완성본 미리보기는 마지막 컷에서만 — 앞 컷에서 성급히 끝내지 않고 끝까지 채우게 한다.
  $("#doneBtn").style.display=(curCut===CUTS-1)?'':'none';
  renderCutDots();
  requestAnimationFrame(()=>fitAll());
}

/* 아래 번호: 지금 보는 컷은 채워진 원, 대사를 하나라도 쓴 컷은 아래에 점을 찍는다.
   컷을 넘겨 가며 쓰다 보면 어디를 안 채웠는지 잊기 쉬워서 표시가 필요하다. */
function renderCutDots(){
  const dots=$("#cutDots");
  dots.innerHTML=work.map((c,i)=>{
    const done=c.bubbles.some(b=>b.text&&b.text.trim());
    return `<button class="cutdot${i===curCut?' on':''}${done?' done':''}" data-i="${i}">${i+1}</button>`;
  }).join("");
  dots.querySelectorAll('.cutdot').forEach(b=>b.onclick=()=>goCut(+b.dataset.i));
}
function goCut(i){if(i<0||i>=CUTS||i===curCut)return;curCut=i;renderCutPage();}
$("#cutPrev").onclick=()=>goCut(curCut-1);
$("#cutNext").onclick=()=>goCut(curCut+1);

/* 컷 창의 세로 비율은 그림의 자연 크기에서 정한다. 4등분이 아닌 비율로 올라와도
   창 높이가 한 컷과 어긋나지 않는다. 그림이 없으면 CSS 기본값(4/3)을 쓴다. */
function applyCutAspect(){
  const page=$("#cutPage");
  page.style.removeProperty('--cut-ar');
  if(!curImage)return;
  const im=new Image();
  im.onload=()=>{
    if(!im.naturalWidth||!im.naturalHeight)return;
    page.style.setProperty('--cut-ar',`${im.naturalWidth} / ${im.naturalHeight/CUTS}`);
    requestAnimationFrame(fitAll);
  };
  im.src=curImage;
}

/* 말풍선 추가. 예전엔 그림 오른쪽 위에 얹힌 작은 버튼이라 그 자리 그림을 가렸고,
   손가락으로 누르기에도 좁았다. 지금은 그림 아래 버튼 줄에서 부른다. */
function addBubble(type){
  const c=work[curCut];
  if(c.bubbles.length>=MAX_BUBBLES_PER_CUT){
    warn(`말풍선은 한 컷에 ${MAX_BUBBLES_PER_CUT}개까지만 올릴 수 있어요.`);return;
  }
  // 이미 있는 풍선과 겹치지 않게 두 번째는 아래쪽에 놓는다
  const n=c.bubbles.length;
  c.bubbles.push({type,x:n?38:8,y:n?54:10,w:50,h:34,text:""});
  renderCutPage();
}
$("#addSpeechBtn").onclick=()=>addBubble('speech');
$("#addThoughtBtn").onclick=()=>addBubble('thought');

function bindCutPage(){
  const page=$("#cutPage");
  page.querySelectorAll('.bdel').forEach(el=>el.onclick=ev=>{
    ev.stopPropagation();
    const b=el.parentElement;
    work[+b.dataset.ci].bubbles.splice(+b.dataset.bi,1);renderCutPage();
  });
  // 꼬리를 누르면 네 귀퉁이를 돈다. 글씨는 그대로 두고 꼬리 자리만 옮기므로 대사는 안 뒤집힌다.
  page.querySelectorAll('.tailhit').forEach(el=>el.onclick=ev=>{
    ev.stopPropagation();
    const wrap=el.parentElement;
    const b=work[+wrap.dataset.ci].bubbles[+wrap.dataset.bi];
    b.tail=nextTail(tailOf(b));
    TAIL_ORDER.forEach(t=>wrap.classList.toggle('tb-'+t,t===b.tail));
  });
  page.querySelectorAll('.bhandle').forEach(el=>el.addEventListener('pointerdown',ev=>startDrag(ev,el.parentElement)));
  page.querySelectorAll('.btext[contenteditable]').forEach(el=>{
    el.addEventListener('input',()=>{
      work[+el.dataset.ci].bubbles[+el.dataset.bi].text=el.textContent;
      fitText(el);
      renderCutDots();   // 아래 번호의 "쓴 컷" 표시를 바로 갱신 (컷 창 밖이라 입력이 끊기지 않는다)
    });
    el.addEventListener('focus',()=>{editingEl&&editingEl.classList.remove('editing');editingEl=el.parentElement;editingEl.classList.add('editing');});
    el.addEventListener('blur',()=>{el.parentElement.classList.remove('editing');});
  });
}

/* ── 드래그(해당 컷 영역 안에서만 이동) ── */
let drag=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function startDrag(ev,el){
  ev.preventDefault();ev.stopPropagation();
  const ci=+el.dataset.ci,bi=+el.dataset.bi,b=work[ci].bubbles[bi];
  const zone=el.parentElement,rect=zone.getBoundingClientRect();
  drag={el,b,rect,startX:ev.clientX,startY:ev.clientY,ox:b.x,oy:b.y};
  const h=ev.currentTarget;
  h.setPointerCapture(ev.pointerId);
  h.addEventListener('pointermove',onDrag);
  h.addEventListener('pointerup',endDrag);
  h.addEventListener('pointercancel',endDrag);
}
function onDrag(ev){
  if(!drag)return;
  const dxp=(ev.clientX-drag.startX)/drag.rect.width*100;
  const dyp=(ev.clientY-drag.startY)/drag.rect.height*100;
  drag.b.x=clamp(drag.ox+dxp,0,100-drag.b.w);
  drag.b.y=clamp(drag.oy+dyp,0,100-drag.b.h);
  drag.el.style.left=drag.b.x+'%';drag.el.style.top=drag.b.y+'%';
}
function endDrag(ev){
  if(!drag)return;
  const h=ev.currentTarget;
  h.removeEventListener('pointermove',onDrag);
  h.removeEventListener('pointerup',endDrag);
  h.removeEventListener('pointercancel',endDrag);
  drag=null;
}

/* ── 자동 맞춤 ── */
/* 말풍선 글자 크기 맞추기.
   .btext는 세로 가운데 정렬(flex)이라 글이 상자보다 높아지면 위아래로 똑같이 넘치고,
   overflow:hidden이 그 "윗줄"을 잘라 버린다. 더 나쁜 건 가운데 정렬 상태의
   scrollHeight가 위로 넘친 만큼을 세지 않는다는 점이다 — 예전 코드는 그래서
   "아직 안 넘쳤다"고 잘못 읽고 글자 줄이기를 일찍 멈췄다.
   그래서 (1) 재는 동안에는 위 정렬로 바꿔 넘친 높이가 제대로 잡히게 하고,
   (2) 기준도 부모 크기에 어림수를 곱한 값이 아니라 글자 상자 자신의 실제 크기로 잡는다
   (여백은 이미 inset으로 들어가 있다). */
function fitText(el){
  const parent=el.parentElement;
  if(!parent.clientHeight||!el.clientHeight)return;
  el.style.alignItems='flex-start';        // 재는 동안만 위 정렬
  let size=Math.max(10,Math.round(parent.clientHeight*0.32));
  el.style.fontSize=size+'px';
  const over=()=>el.scrollHeight>el.clientHeight||el.scrollWidth>el.clientWidth;
  let guard=0;
  while(size>8&&over()&&guard<60){size--;el.style.fontSize=size+'px';guard++;}
  // 8px까지 줄여도 넘칠 만큼 길게 쓰면 가운데 정렬을 포기한다.
  // 가운데로 두면 첫 줄부터 잘려 무엇을 썼는지조차 안 보인다.
  el.style.alignItems=over()?'flex-start':'center';
}
function fitAll(){document.querySelectorAll('#cutPage .btext').forEach(fitText);}
window.addEventListener('resize',()=>requestAnimationFrame(fitAll));
// 이미지가 늦게 뜨면 컷 창 높이가 바뀌므로 다시 맞춘다
new ResizeObserver(()=>requestAnimationFrame(fitAll)).observe(document.getElementById('cutPage'));

/* ── 완성 → 미리보기 → 제출 ──
   예전엔 [완성! 제출하기] 한 번에 굽고 바로 냈다. 자기 작품을 한 번도 못 보고 제출이
   끝나 버려서, 오타를 발견해도 이미 낸 뒤였다. 지금은 완성본을 먼저 보여주고
   [수정하기] / [제출하기]를 고르게 한다. 제출된 작품은 예외 없이 갤러리에도 올라간다. */
let previewUrl=null;   // 갤러리와 어드민에 올라갈 것(줄인 것)
let fullUrl=null;      // 학생이 내려받을 원본
$("#doneBtn").onclick=async()=>{
  if(!curImage){warn('만화 이미지가 없어 제출할 수 없어요.');return;}
  const filled=work.some(c=>c.bubbles.some(b=>b.text&&b.text.trim()));
  if(!filled){alert('말풍선에 대사를 하나 이상 써주세요.');return;}
  showScreen('previewScreen');
  $("#previewBody").innerHTML=`<div class="saving"><div class="spin"></div>완성한 네컷을 그리는 중이에요…</div>`;
  try{
    const made=await composeImage();
    previewUrl=made.store; fullUrl=made.full;
  }catch(e){
    $("#previewBody").innerHTML=`<div class="saving">이미지 생성에 실패했어요.<br>${esc(e.message||e)}</div>
      <button class="btn btn-ghost btn-block" id="pvBack" style="margin-top:14px">돌아가서 고치기</button>`;
    $("#pvBack").onclick=()=>showScreen('editScreen');
    return;
  }
  renderPreview();
};

function renderPreview(){
  $("#previewBody").innerHTML=`
    <img class="result-img" src="${previewUrl}" alt="완성한 네컷">
    <div class="done-msg">이대로 제출할까요? 낸 작품은 친구들 작품 갤러리에도 올라가요.</div>
    <div class="result-actions">
      <button class="btn btn-primary btn-block btn-lg" id="pvSubmit">제출하기</button>
      <button class="btn btn-ghost btn-block" id="pvEdit">수정하기</button>
    </div>`;
  $("#pvEdit").onclick=()=>showScreen('editScreen');
  $("#pvSubmit").onclick=doSubmit;
}

/* 작품 문서 id는 학번이다 — 1인 1장이라 다시 내면 앞서 낸 것을 덮어쓴다.
   모르고 덮어쓰는 일이 없게 먼저 물어본다(무엇을 냈었는지도 같이 알려준다). */
async function doSubmit(){
  const btn=$("#pvSubmit");
  if(btn){btn.disabled=true;btn.textContent='확인하는 중…';}
  try{
    const prev=await withTimeout(getDoc(doc(db,'fourcut_works',student.studentId)),SUBMIT_TIMEOUT,'네트워크가 느려요. 잠시 뒤 다시 시도해 주세요.');
    if(prev.exists()){
      const pn=prev.data().eventName||'';
      if(!confirm(`이미 제출한 작품이 있어요${pn?` (${pn})`:''}.\n지금 만든 것으로 덮어쓸까요? 앞서 낸 작품은 사라져요.`)){
        if(btn){btn.disabled=false;btn.textContent='제출하기';}
        return;
      }
    }
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='제출하기';}
    alert(e.message||e);return;
  }
  showScreen('doneScreen');
  $("#doneBody").innerHTML=`<div class="saving"><div class="spin"></div>제출하는 중이에요…</div>`;
  let err=null;
  try{await submitWork(previewUrl);}catch(e){err=e;}
  renderDone(previewUrl,err);
}

/* 완성 이미지의 말풍선 꼬리.
   예전엔 편집 화면에만 꼬리가 있고 완성 이미지에는 없어서, 보이는 것과 나오는 것이
   달랐다. 여기서 같은 모양을 인라인 스타일로 다시 그린다(html2canvas가 복제 문서를
   그리므로 클래스 대신 인라인이 안전하다). 완성본은 편집 창보다 크므로 조각도 그만큼
   키운다. 꼬리 방향(b.tail)은 편집에서 정한 그대로 따른다. */
function exportTail(b){
  const t=tailOf(b);
  const sx=(t==='br'||t==='tr'||t==='mr')?'right':'left';
  const side=(t==='ml'||t==='mr');   // 옆 꼬리는 좌우 테두리에 붙고 삼각형도 옆을 향한다
  const sy=(t==='tl'||t==='tr')?'top':'bottom';

  if(b.type==='thought'){
    // 작은 원은 방향이 없으니 자리만 옮긴다.
    const dot=side
      ? (size,off)=>`<div style="position:absolute;${sx}:-${off}px;top:calc(50% - ${size/2}px);width:${size}px;height:${size}px;background:#fff;border:3px solid #1c1c1c;border-radius:50%"></div>`
      : (size,off,pos)=>`<div style="position:absolute;${sx}:${pos};${sy}:-${off}px;width:${size}px;height:${size}px;background:#fff;border:3px solid #1c1c1c;border-radius:50%"></div>`;
    return side ? dot(19,22)+dot(11,38) : dot(19,22,'22%')+dot(11,38,'14%');
  }

  // 대사 꼬리: 삼각형(테두리색) 위에 흰 삼각형을 겹쳐 테두리만 남긴다.
  // 향하는 쪽의 반대편 테두리에 색을 주면 그쪽으로 뾰족해진다.
  if(side){
    const outer=(t==='ml')?'border-right:21px solid #1c1c1c':'border-left:21px solid #1c1c1c';
    const inner=(t==='ml')?'left:5px;border-right:16px solid #fff':'left:-21px;border-left:16px solid #fff';
    return `<div style="position:absolute;${sx}:-21px;top:calc(50% - 13px);width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;${outer}">
        <div style="position:absolute;top:-9px;${inner};width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent"></div>
      </div>`;
  }
  const up=(sy==='top');
  const outer=up?'border-bottom:21px solid #1c1c1c':'border-top:21px solid #1c1c1c';
  const inner=up?'bottom:-21px;border-bottom:16px solid #fff':'top:-21px;border-top:16px solid #fff';
  return `<div style="position:absolute;${sx}:26%;${sy}:-21px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;${outer}">
      <div style="position:absolute;left:-9px;${inner};width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent"></div>
    </div>`;
}

async function buildExportDOM(){
  const host=$("#exportHost");
  const inner=1080-26*2-30*2;   // 외곽 여백 + 필름 프레임 좌우 패딩
  const zones=work.map((c,ci)=>`
    <div style="position:absolute;left:0;width:100%;top:${ci*(100/CUTS)}%;height:${100/CUTS}%">
      ${c.bubbles.map(b=>{
        const round=b.type==="thought"?"50%":"20px";
        const inset=b.type==="thought"?"20% 20%":"15% 16%";
        return `<div class="xb" style="position:absolute;left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%;background:#fff;border:3px solid #1c1c1c;border-radius:${round};display:flex;align-items:center;justify-content:center">
          ${exportTail(b)}
          <div class="xt" style="position:absolute;inset:${inset};overflow:hidden;text-align:center;line-height:1.25;font-family:'Gaegu',cursive;font-weight:700;color:#1c1c1c;word-break:break-word;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center">${esc(b.text)}</div>
        </div>`;
      }).join("")}
    </div>`).join("");
  host.innerHTML=`
    <div style="padding:26px;background:#EFE7D6">
      <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:44px;text-align:center;color:#1E1B16;margin-bottom:4px">${esc(CONTENT.title)}</div>
      <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:30px;text-align:center;color:#C13D18;margin-bottom:14px">${esc(curEvent.name)}</div>
      <div style="background:#1E1B16;border-radius:12px;padding:18px 30px">
        <div style="display:flex;justify-content:space-between;font-family:monospace;font-size:16px;letter-spacing:.12em;margin-bottom:14px"><span style="color:#EFE7D6">4 CUT FILM</span><span style="color:#E4572E">${esc(filmDateStr())}</span></div>
        <div style="position:relative;width:${inner}px;border:4px solid #EFE7D6;border-radius:3px;overflow:hidden;background:#efece3">
          <img src="${curImage}" style="display:block;width:100%;height:auto">
          ${zones}
        </div>
      </div>
      <div style="text-align:right;font-family:'Gaegu',cursive;font-weight:700;font-size:26px;margin-top:12px;color:#1E1B16">${esc(student.studentName)}</div>
    </div>`;
  // 이미지가 실제로 그려져야 컷 영역 높이(=풍선 크기)가 확정된다
  const im=host.querySelector('img');
  if(im&&!im.complete)await new Promise(r=>{im.onload=im.onerror=r;});
  // 폰트 맞춤 — 편집 화면의 fitText()와 같은 규칙을 써야 보이는 대로 나온다.
  host.querySelectorAll('.xb').forEach(bb=>{
    const el=bb.querySelector('.xt');
    el.style.alignItems='flex-start';
    let size=Math.max(12,Math.round(bb.clientHeight*0.32));el.style.fontSize=size+'px';
    const over=()=>el.scrollHeight>el.clientHeight||el.scrollWidth>el.clientWidth;
    let g=0;
    while(size>10&&over()&&g<80){size--;el.style.fontSize=size+'px';g++;}
    el.style.alignItems=over()?'flex-start':'center';
  });
  return host.firstElementChild;
}

/* 완성 그림을 두 벌 만든다.
   full  — 1080px 원본. 학생이 [네컷만화 저장하기]로 내려받는 것.
   store — 800px로 줄이고 품질도 낮춘 것. Firestore에 넣고 갤러리와 어드민이 보는 것.

   원본을 그대로 문서에 넣었더니 작품 하나가 750KB였고, 그 99.8%가 이미지였다. 갤러리나
   어드민을 열면 문서를 통째로 받아오므로 160명이면 117MB를 내려받는 셈이라 눈에 띄게
   느렸다. 화면에서 보는 데는 800px이면 충분하니 저장본만 줄인다(대략 4분의 1). */
async function composeImage(){
  if(document.fonts&&document.fonts.ready){try{await document.fonts.ready;}catch(e){}}
  const node=await buildExportDOM();
  const canvas=await html2canvas(node,{backgroundColor:"#EFE7D6",scale:1,useCORS:true,logging:false});
  const full=canvas.toDataURL('image/jpeg',0.85);
  return {full,store:shrinkDataUrl(canvas,800,0.72)};
}

// 캔버스를 정해진 폭으로 줄여 다시 굽는다. 이미 그보다 좁으면 그대로 쓴다.
function shrinkDataUrl(canvas,maxW,quality){
  if(canvas.width<=maxW)return canvas.toDataURL('image/jpeg',quality);
  const cv=document.createElement('canvas');
  cv.width=maxW;
  cv.height=Math.round(canvas.height*maxW/canvas.width);
  const g=cv.getContext('2d');
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.drawImage(canvas,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',quality);
}

/* 느린 망에서 "제출하는 중"이 영영 멈춘 것처럼 보이지 않게 끊는다. */
const SUBMIT_TIMEOUT=20000;
function withTimeout(pr,ms,msg){
  return Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);
}

/* 문서 id가 곧 학번이다 — 1인 1장이라 다시 만들어 내면 그대로 덮어쓴다.
   다시 낸 경우 받은 좋아요는 남기고 채점 결과(status)만 지운다. 통과를 받은 뒤
   내용을 바꿔치기하지 못하게, 선생님이 새 내용을 다시 보도록 하는 장치다. */
async function submitWork(dataUrl){
  const wref=doc(db,'fourcut_works',student.studentId);
  const cur=await withTimeout(getDoc(wref),SUBMIT_TIMEOUT,'네트워크가 느려 제출하지 못했어요.');
  const payload={
    studentId:student.studentId,studentName:student.studentName,
    classNum:classNumOf(student.studentId),
    eventId:curEvent.id,eventName:curEvent.name,
    image:dataUrl,title:CONTENT.title,
    // 말풍선을 좌표까지 남긴다(수백 바이트). 어드민이 원본 만화 위에 그대로 재현할 수 있다.
    cuts:work.map(c=>({bubbles:c.bubbles.map(b=>({type:b.type,x:b.x,y:b.y,w:b.w,h:b.h,text:b.text||"",tail:tailOf(b)}))})),
    timestamp:Date.now(),updatedAt:serverTimestamp()
  };
  if(cur.exists())payload.status=deleteField();   // 규칙상 다시 낼 땐 status가 남아 있으면 안 된다
  else{payload.likes=0;payload.likedBy={};payload.createdAt=serverTimestamp();}
  await withTimeout(setDoc(wref,payload,{merge:true}),SUBMIT_TIMEOUT,'제출이 오래 걸려요. 잠시 뒤 다시 시도해 주세요.');
  await saveSubmissionMark(cur.exists());
}

// LMS 성적 체크(미션 자동 연동)가 제출 여부만 가볍게 확인할 수 있도록 요약 문서를 남긴다.
// 작품 문서(fourcut_works)는 base64 이미지가 통째로 들어 있어 전량 조회가 너무 무겁다.
// createdAt은 첫 제출 때만 쓴다 — 기한 판정은 처음 낸 시각을 기준으로 하기 때문.
async function saveSubmissionMark(isResubmit){
  try{
    const sref=doc(db,'fourcut_submissions',student.studentId);
    const cur=await getDoc(sref);
    const payload={
      studentId:student.studentId,studentName:student.studentName,
      classNum:classNumOf(student.studentId),lastAt:serverTimestamp()
    };
    if(!cur.exists())payload.createdAt=serverTimestamp();
    // 작품의 채점을 지웠으면 요약도 같이 비운다 — 안 그러면 LMS에만 통과가 남는다.
    if(isResubmit)payload.status=null;
    await setDoc(sref,payload,{merge:true});
  }catch(e){}
}

/* 제출이 끝나면 갈 곳 세 군데를 가로로 나란히 보여준다(셋 다 같은 무게의 선택).
   실패했을 때만 다시 내기와 고치기를 위에 얹는다. */
function renderDone(dataUrl,err){
  $("#doneBody").innerHTML=`
    <img class="result-img" src="${dataUrl}" alt="완성한 네컷" style="margin-top:22px">
    <div class="done-msg${err?' err':''}">${err
      ? '제출하지 못했어요.<br>'+esc(err.message||err)
      : '제출 완료! 친구들 작품 갤러리에도 올라갔어요.'}</div>
    ${err?`<div class="result-actions">
      <button class="btn btn-primary btn-block" id="retryBtn">다시 제출하기</button>
      <button class="btn btn-ghost btn-block" id="backEditBtn">돌아가서 고치기</button>
    </div>`:`<div class="result-actions-row">
      <button class="btn btn-primary" id="dlBtn">네컷만화 저장하기</button>
      <button class="btn btn-ghost" id="galBtn">친구들 작품 둘러보기</button>
      <button class="btn btn-ghost" id="introBtn">인트로 화면으로 이동하기</button>
    </div>`}`;
  // 내려받는 그림은 갤러리에 올라간 것보다 큰 원본이다(fullUrl).
  const dl=$("#dlBtn");
  if(dl)dl.onclick=()=>{
    const a=document.createElement('a');
    a.href=fullUrl||dataUrl;
    a.download='사화네컷_'+curEvent.name+'_'+student.studentName+'.jpg';
    a.click();
  };
  const gal=$("#galBtn");if(gal)gal.onclick=openArchive;
  const intro=$("#introBtn");if(intro)intro.onclick=()=>showScreen('introScreen');
  const be=$("#backEditBtn");if(be)be.onclick=()=>showScreen('editScreen');
  const rb=$("#retryBtn");
  if(rb)rb.onclick=async()=>{
    rb.disabled=true;rb.textContent="다시 제출하는 중…";
    let e2=null;
    try{await submitWork(dataUrl);}catch(e){e2=e;}
    renderDone(dataUrl,e2);
  };
}

/* ── 친구 작품 갤러리 ── */
/* 갤러리는 한 번에 한 작품씩 본다. arcIdx는 지금 보고 있는 작품의 자리(거른 목록 기준).
   arcSort는 학번순(sid) 또는 최신순(new) — 기본은 학번순이라 반 명단 순서대로 넘어간다. */
let arcWorks=[],arcFilter='all',arcEvFilter='all',arcSort='sid',arcIdx=0,likeBusy={};
async function openArchive(){
  $("#archiveView").classList.add('show');
  arcIdx=0;
  $("#arcStage").innerHTML=`<div class="arc-empty">불러오는 중…</div>`;
  try{
    const snap=await getDocs(query(collection(db,'fourcut_works'),orderBy('timestamp','desc')));
    arcWorks=[];snap.forEach(d=>arcWorks.push({id:d.id,...d.data()}));
  }catch(e){
    try{const snap=await getDocs(collection(db,'fourcut_works'));arcWorks=[];snap.forEach(d=>arcWorks.push({id:d.id,...d.data()}));arcWorks.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));}catch(e2){arcWorks=[];}
  }
  renderArcFilter();renderArc();
}
window.closeArchive=()=>$("#archiveView").classList.remove('show');

function renderArcFilter(){
  // 사건 필터: 콘텐츠에 정의된 3종을 늘 보여준다(0건이어도 자리를 지킨다)
  const ef=$("#arcEvFilter");
  ef.innerHTML=[`<button class="arc-fbtn ev ${arcEvFilter==='all'?'active':''}" data-f="all">전체 사건</button>`]
    .concat(CONTENT.events.map(e=>{
      const n=arcWorks.filter(w=>w.eventId===e.id).length;
      return `<button class="arc-fbtn ev ${arcEvFilter===e.id?'active':''}" data-f="${esc(e.id)}">${esc(e.name)} ${n}</button>`;
    })).join("");
  ef.querySelectorAll('.arc-fbtn').forEach(b=>b.onclick=()=>{arcEvFilter=b.dataset.f;arcIdx=0;renderArcFilter();renderArc();});

  const cls=[...new Set(arcWorks.map(w=>w.classNum).filter(n=>n!=null))].sort((a,b)=>a-b);
  const f=$("#arcFilter");
  f.innerHTML=[`<button class="arc-fbtn ${arcFilter==='all'?'active':''}" data-f="all">전체</button>`]
    .concat(cls.map(n=>`<button class="arc-fbtn ${arcFilter==n?'active':''}" data-f="${n}">${n}반</button>`)).join("");
  f.querySelectorAll('.arc-fbtn').forEach(b=>b.onclick=()=>{arcFilter=b.dataset.f==='all'?'all':+b.dataset.f;arcIdx=0;renderArcFilter();renderArc();});

  const s=$("#arcSort");
  s.innerHTML=[['sid','학번순'],['new','최신순']]
    .map(([k,label])=>`<button class="${arcSort===k?'active':''}" data-s="${k}">${label}</button>`).join("");
  s.querySelectorAll('button').forEach(b=>b.onclick=()=>{arcSort=b.dataset.s;arcIdx=0;renderArcFilter();renderArc();});
}
function filteredWorks(){
  const list=arcWorks.filter(w=>
    (arcEvFilter==='all'||w.eventId===arcEvFilter)&&
    (arcFilter==='all'||w.classNum===arcFilter));
  return arcSort==='sid'
    ? list.sort((a,b)=>String(a.studentId||'').localeCompare(String(b.studentId||'')))
    : list.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
}
function renderArc(){
  const list=filteredWorks();
  const stage=$("#arcStage");
  if(!list.length){stage.innerHTML=`<div class="arc-empty">아직 공유된 작품이 없어요.</div>`;return;}
  // 태그를 바꾸면 목록이 짧아질 수 있으니 자리를 범위 안으로 당긴다.
  if(arcIdx>=list.length)arcIdx=list.length-1;
  if(arcIdx<0)arcIdx=0;
  const w=list[arcIdx];
  const liked=!!(w.likedBy&&w.likedBy[likeKey()]);
  stage.innerHTML=`
    <div class="work">
      <img src="${w.image}" alt="${esc(w.studentName)}의 네컷" onclick="showLightbox('${w.id}')">
    </div>
    <div class="arc-meta">
      <span class="sid">${esc(w.studentId||'')}</span>
      <span class="nm">${esc(w.studentName||'')}</span>
      ${w.eventName?`<span class="evtag">${esc(w.eventName)}</span>`:''}
      <button class="like-btn${liked?' liked':''}" data-id="${w.id}">${icon('heart',14)} ${w.likes||0}</button>
    </div>
    <div class="arc-nav">
      <button class="arc-navbtn" id="arcPrev" ${arcIdx===0?'disabled':''} title="이전 작품">${icon('chevron-left',24)}</button>
      <div class="arc-pos">${arcIdx+1} / ${list.length}</div>
      <button class="arc-navbtn" id="arcNext" ${arcIdx===list.length-1?'disabled':''} title="다음 작품">${icon('chevron-right',24)}</button>
    </div>`;
  stage.querySelector('.like-btn').onclick=e=>toggleLike(e.currentTarget.dataset.id,e.currentTarget);
  $("#arcPrev").onclick=()=>{if(arcIdx>0){arcIdx--;renderArc();}};
  $("#arcNext").onclick=()=>{if(arcIdx<list.length-1){arcIdx++;renderArc();}};
}
window.showLightbox=(id)=>{const w=arcWorks.find(x=>x.id===id);if(!w)return;$("#lightboxImg").src=w.image;$("#lightbox").classList.add('show');};

/* 좋아요: 1인 1작품 1회, 다시 누르면 취소되는 토글 */
async function toggleLike(id,btn){
  if(likeBusy[id])return;
  const w=arcWorks.find(x=>x.id===id);if(!w)return;
  const me=likeKey();
  const liked=!!(w.likedBy&&w.likedBy[me]);
  likeBusy[id]=true;btn.disabled=true;
  // 낙관적 갱신 — 실패하면 되돌린다
  const prevLikes=w.likes||0,prevLikedBy={...(w.likedBy||{})};
  w.likes=Math.max(0,prevLikes+(liked?-1:1));
  w.likedBy={...prevLikedBy};
  if(liked)delete w.likedBy[me];else w.likedBy[me]=true;
  renderArc();
  try{
    // 절대값을 쓰면 갤러리를 연 시점의 값을 덮어써서, 둘이 동시에 누를 때 하나가 사라진다.
    await updateDoc(doc(db,'fourcut_works',id),{
      likes:increment(liked?-1:1),
      [`likedBy.${me}`]:liked?deleteField():true
    });
  }catch(e){
    w.likes=prevLikes;w.likedBy=prevLikedBy;renderArc();
    warn('좋아요를 반영하지 못했어요.');
  }finally{delete likeBusy[id];}
}


$("#gateArcBtn").onclick=openArchive;

/* 정적 HTML에 박힌 아이콘 주입 */
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,el.dataset.iconSize?+el.dataset.iconSize:24));

/* URL ?archive=1 로 바로 아카이브 */
init().then(()=>{
  if(new URLSearchParams(location.search).get('archive')==='1')openArchive();
});
</script>
