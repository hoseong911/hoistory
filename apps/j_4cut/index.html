<!DOCTYPE html>
<html lang="ko" class="hi-theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>사화 네컷 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ===== 레트로 필름(인생네컷) 감성: 크림 인화지 + 필름 프레임 + 오렌지레드 + 빈티지 틸 ===== */
:root{
  --cream:#EFE7D6;--paper:#F5EFE1;--film:#1E1B16;--ink:#1E1B16;
  --accent:#E4572E;--accent-deep:#C13D18;--teal:#2F8F83;--teal-deep:#227368;
  --muted:#8A7F6C;--line:#D8CDB6;
  --bubble:#ffffff;--bubble-line:#1E1B16;--panel-bg:#efece3;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:40px}
.screen{display:none}
.screen.active{display:block}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px}

/* ── 이름 게이트 / 카드 ── */
.intro-card{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:32px 22px;box-shadow:8px 8px 0 rgba(30,27,22,.12);text-align:center;margin-top:28px;overflow:hidden}
/* 카드 상단을 가로지르는 얇은 그라데이션 바 (필름 색띠 느낌) */
.intro-card::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--accent) 0%,#E8A33D 38%,var(--teal) 72%,var(--teal-deep) 100%)}
.intro-title{font-family:'Gaegu',cursive;font-weight:700;font-size:36px;line-height:1.15;margin-bottom:8px;color:var(--ink)}
.intro-sub{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:22px;white-space:pre-wrap}
.namebox{margin:18px 0}
.namebox label{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.namebox input{font-family:inherit;font-size:16px;text-align:center;padding:12px 14px;width:min(240px,100%);border:2px solid var(--ink);border-radius:10px;background:#fff}
.who{font-family:'Gaegu',cursive;font-size:18px;font-weight:700;background:var(--cream);border:1.5px dashed var(--ink);border-radius:12px;padding:12px;margin:10px 0}
.btn{font-family:inherit;font-weight:700;font-size:16px;border:2px solid var(--ink);border-radius:12px;padding:13px 26px;cursor:pointer;transition:transform .1s,box-shadow .1s;-webkit-tap-highlight-color:transparent;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn-ghost{background:var(--paper);color:var(--ink)}
.btn-block{width:100%}
.btn-lg{font-size:18px;padding:16px 26px}
.btn .hi-ic{vertical-align:-2px}

/* ── 인트로: 사건 고르기 ── */
.ev-label{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
.ev-pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:22px}
@media(max-width:420px){.ev-pick{grid-template-columns:1fr}}
.ev-btn{font-family:'Gaegu',cursive;font-weight:700;font-size:20px;padding:15px 8px 13px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s,box-shadow .1s,background .1s;box-shadow:3px 3px 0 rgba(30,27,22,.16);line-height:1.1}
.ev-btn .ev-no{display:block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.ev-btn.on{background:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.ev-btn.on .ev-no{color:rgba(255,255,255,.8)}

/* ── 상단 바 ── */
.topbar{position:sticky;top:0;z-index:30;background:rgba(239,231,214,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:10px;padding:12px 16px}
.topbar .t{font-family:'Gaegu',cursive;font-weight:700;font-size:22px;flex:1}
.topbar .who-mini{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hint{background:#fff;border:1.5px dashed var(--teal);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--teal-deep);margin:16px 0;line-height:1.6;font-weight:600}
.hint b{color:var(--accent-deep)}
/* 컷당 2개 초과 등, 잠깐 떴다 사라지는 안내 */
.warn-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--cream);font-size:14px;font-weight:700;padding:12px 20px;border-radius:100px;box-shadow:0 8px 24px rgba(30,27,22,.35);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px);text-align:center}
.warn-toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ── 필름 스트립 ── */
.filmstrip{position:relative;background:var(--film);border-radius:10px;padding:14px 32px;margin-top:14px;box-shadow:0 12px 30px rgba(30,27,22,.28)}
.filmstrip::before,.filmstrip::after{content:'';position:absolute;top:14px;bottom:14px;width:12px;background-image:repeating-linear-gradient(to bottom,var(--cream) 0 11px,transparent 11px 23px);border-radius:3px}
.filmstrip::before{left:9px}
.filmstrip::after{right:9px}
.film-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px;font-family:var(--mono);font-size:12px;letter-spacing:.14em}
.film-brand{color:var(--cream);font-weight:600}
.film-date{color:var(--accent);font-weight:700}
.film-foot{padding:10px 2px 0;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:rgba(239,231,214,.5)}

/* ── 세로 스트립(네 컷이 한 장으로 이어진 만화) ──
   만화는 사건당 이미지 1장이고, 그 1장을 높이로 4등분해 컷1~컷4 영역으로 삼는다.
   화면이 길어지므로 스트립만 따로 세로 스크롤한다. */
.strip-scroll{max-height:min(72vh,900px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:3px;background:var(--panel-bg)}
.strip{position:relative;width:100%;border:3px solid var(--cream);border-radius:3px;overflow:hidden;background:var(--panel-bg);user-select:none}
.strip img.bg{display:block;width:100%;height:auto;pointer-events:none}
.strip .noimg{display:flex;align-items:center;justify-content:center;aspect-ratio:3/8;color:#b7b2a5;font-size:14px;font-weight:600;text-align:center;padding:20px;line-height:1.7}
/* 컷 영역: 이미지 높이의 25%씩. 경계선은 옅게만 보인다. */
.cut-zone{position:absolute;left:0;width:100%;height:25%}
.cut-zone+.cut-zone{border-top:1px dashed rgba(30,27,22,.18)}
.cut-zone .zone-num{position:absolute;top:7px;left:9px;z-index:4;font-family:'Gaegu',cursive;font-weight:700;font-size:17px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);pointer-events:none}
/* 그림이 아직 없으면 흰 글씨가 안 보이므로 잉크색으로 뒤집는다 */
.strip.empty .zone-num{color:var(--muted);text-shadow:none}
.zone-add{position:absolute;top:6px;right:8px;z-index:6;display:flex;gap:5px}
.zone-add button{font-family:inherit;font-size:11px;font-weight:700;padding:5px 9px;border-radius:100px;border:1.5px solid rgba(30,27,22,.5);background:rgba(255,255,255,.9);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(3px)}
.zone-add button:active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── 말풍선 ── */
.bubble{position:absolute;background:var(--bubble);border:2.5px solid var(--bubble-line);display:flex;align-items:center;justify-content:center}
.bubble.speech{border-radius:16px}
.bubble.thought{border-radius:50%}
.bubble .tail{position:absolute;left:26%;bottom:-13px;width:0;height:0}
.bubble.speech .tail{border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid var(--bubble-line)}
.bubble.speech .tail::after{content:"";position:absolute;left:-7px;top:-16px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid var(--bubble)}
.bubble.thought .tail,.bubble.thought .tail2{position:absolute;background:var(--bubble);border:2.5px solid var(--bubble-line);border-radius:50%}
.bubble.thought .tail{width:14px;height:14px;left:22%;bottom:-16px}
.bubble.thought .tail2{width:8px;height:8px;left:14%;bottom:-28px}
.btext{position:absolute;inset:15% 16%;overflow:hidden;text-align:center;line-height:1.25;font-family:'Gaegu',cursive;font-weight:700;color:#1c1c1c;word-break:break-word;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;width:auto;outline:none}
.bubble.thought .btext{inset:20% 20%}
.btext:empty::before{content:attr(data-ph);color:#b0aca0;font-weight:400}
.bubble.editing{box-shadow:0 0 0 3px rgba(228,87,46,.55)}
/* 손잡이: 글자 입력(contenteditable)과 드래그가 서로 먹히지 않게 이동은 손잡이로만 한다 */
.bhandle,.bdel{position:absolute;z-index:7;width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1;-webkit-tap-highlight-color:transparent}
.bhandle{left:-10px;top:-10px;background:var(--ink);color:#fff;cursor:move;touch-action:none;font-family:var(--mono)}
.bdel{right:-10px;top:-10px;background:var(--accent);color:#fff;cursor:pointer}

.toolbar{display:flex;gap:10px;margin-top:20px}
.foot-note{text-align:center;color:var(--muted);font-size:12px;margin-top:14px;line-height:1.7}

/* ── 완성/저장 ── */
.result-img{width:100%;border:3px solid var(--ink);border-radius:6px;display:block;margin:14px 0;box-shadow:6px 6px 0 rgba(30,27,22,.14)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.saving{text-align:center;padding:30px;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 아카이브 (goryeo_choice 기준 유지) ── */
#archiveView{display:none;position:fixed;inset:0;z-index:900;background:var(--hi-bg-mid,#f4f3ee);flex-direction:column;overflow-y:auto}
#archiveView.show{display:flex}
.arc-hd{background:#fff;border-bottom:1.5px solid var(--hi-border,#e5e4df);position:sticky;top:0;z-index:5}
.arc-hd-inner{max-width:700px;margin:0 auto;padding:14px 16px}
.arc-hd-top{display:flex;align-items:center;gap:10px}
.arc-back{background:none;border:none;cursor:pointer;padding:6px;color:var(--ink)}
.arc-titles{flex:1;text-align:center}
.arc-title{font-family:'Gaegu',cursive;font-weight:700;font-size:22px}
.arc-subtitle{font-size:12px;color:var(--hi-text-muted,#6b7280)}
.arc-body{max-width:700px;margin:0 auto;width:100%;padding:16px}
.arc-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.arc-filter:last-of-type{margin-bottom:14px}
.arc-fbtn{font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:100px;border:1.5px solid var(--hi-border,#d8d7d0);background:#fff;cursor:pointer;color:var(--ink)}
.arc-fbtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.arc-fbtn.ev.active{background:var(--accent);border-color:var(--accent)}
.arc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.arc-grid{grid-template-columns:1fr}}
.work{background:#fff;border:1px solid var(--hi-border,#e5e4df);border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.05);display:flex;flex-direction:column}
.work img{width:100%;display:block;cursor:zoom-in}
.work .meta{padding:9px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.work .meta .nm{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.work .meta .cls{color:var(--hi-text-muted,#6b7280);font-size:11px;font-weight:600}
.work .evtag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent-deep);background:rgba(228,87,46,.1);border:1px solid rgba(228,87,46,.28);border-radius:100px;padding:2px 8px;margin:0 12px 9px;align-self:flex-start}
.like-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:13px;font-weight:700;padding:5px 11px;border-radius:100px;border:1.5px solid var(--hi-border,#d8d7d0);background:#fff;color:var(--hi-text-muted,#6b7280);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:.12s}
.like-btn:disabled{opacity:.5;cursor:default}
.like-btn.liked{background:rgba(228,87,46,.1);border-color:var(--accent);color:var(--accent-deep)}
.like-btn .hi-ic{fill:none}
.like-btn.liked .hi-ic{fill:currentColor}
.arc-empty{text-align:center;color:var(--hi-text-muted,#6b7280);padding:50px 20px}
.lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
</style>
  <script src="/hoistory/pwa.js"></script>
</head>
<body>

<!-- ── 이름 입력 게이트 (비로그인 시에만) ── -->
<section id="nameGate" class="screen">
  <div class="wrap">
    <div class="intro-card">
      <div class="intro-title" id="gateTitle">사화 네컷</div>
      <div class="intro-sub" id="gateSub">말풍선을 눌러 대사를 쓰면 글자가 풍선에 딱 맞게 들어가요.</div>
      <div class="namebox"><label>이름을 입력하세요</label><input id="nameInput" maxlength="10" placeholder="예) 홍길동" autocomplete="off"></div>
      <button class="btn btn-primary btn-block" id="nameNextBtn">다음</button>
      <button class="btn btn-ghost btn-block" id="gateArcBtn" style="margin-top:10px">친구들 작품 보기</button>
    </div>
  </div>
</section>

<!-- ── 인트로 (활동 전): 안내 + 사건 고르기 ── -->
<section id="introScreen" class="screen">
  <div class="wrap">
    <div class="intro-card">
      <div class="intro-title" id="introTitle"></div>
      <div class="intro-sub" id="introBody"></div>
      <div class="ev-label">사건 고르기</div>
      <div class="ev-pick" id="evPick"></div>
      <button class="btn btn-primary btn-block btn-lg" id="startBtn" disabled></button>
      <button class="btn btn-ghost btn-block" id="introArcBtn" style="margin-top:10px">친구들 작품 보기</button>
    </div>
  </div>
</section>

<!-- ── 편집 ── -->
<section id="editScreen" class="screen">
  <div class="topbar">
    <div class="t" id="barTitle">사화 네컷</div>
    <div class="who-mini" id="barWho"></div>
  </div>
  <div class="wrap">
    <div class="hint">컷 오른쪽 위 <b>+ 대사 / + 생각</b>으로 말풍선을 올리세요(컷당 2개까지). 풍선을 눌러 대사를 쓰면 글자 크기가 자동으로 맞춰지고, 왼쪽 위 손잡이를 끌어 위치를 옮길 수 있어요.</div>
    <div class="filmstrip">
      <div class="film-top"><span class="film-brand" id="filmBrand">4 CUT FILM</span><span class="film-date" id="filmDate"></span></div>
      <div class="strip-scroll"><div class="strip" id="strip"></div></div>
      <div class="film-foot">위아래로 넘겨 네 컷을 모두 채워보세요</div>
    </div>
    <div class="toolbar">
      <button class="btn btn-ghost" id="backIntroBtn">사건 바꾸기</button>
      <button class="btn btn-primary" style="flex:1" id="doneBtn">완성! 이미지로 저장</button>
    </div>
    <div class="foot-note">완성하면 그림으로 저장되고, 친구들 작품 갤러리에 공유할 수 있어요.</div>
  </div>
</section>

<!-- ── 완성 ── -->
<section id="doneScreen" class="screen">
  <div class="topbar"><div class="t">완성!</div></div>
  <div class="wrap">
    <div id="doneBody"></div>
  </div>
</section>

<!-- ── 아카이브(친구 작품 갤러리) ── -->
<div id="archiveView">
  <div class="arc-hd">
    <div class="arc-hd-inner">
      <div class="arc-hd-top">
        <button class="arc-back" onclick="closeArchive()"><span data-icon="x" data-icon-size="22"></span></button>
        <div class="arc-titles">
          <div class="arc-title" id="arcTitle">사화 네컷</div>
          <div class="arc-subtitle">친구들 작품 갤러리</div>
        </div>
        <div style="width:34px;flex-shrink:0"></div>
      </div>
    </div>
  </div>
  <div class="arc-body">
    <div class="arc-filter" id="arcEvFilter"></div>
    <div class="arc-filter" id="arcFilter"></div>
    <div id="arcGrid" class="arc-grid"></div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lightboxImg" alt=""></div>
<div class="warn-toast" id="warnToast"></div>

<!-- 오프스크린 내보내기 컨테이너 -->
<div id="exportHost" style="position:fixed;left:-99999px;top:0;width:1080px;background:#EFE7D6"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,addDoc,updateDoc,deleteField,collection,getDocs,query,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{firebaseConfig}from"../../shared/firebase-config.js";
import{icon}from"../../shared/icons.js";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function filmDateStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `'${String(d.getFullYear()).slice(2)}.${p(d.getMonth()+1)}.${p(d.getDate())}`;}

/* 만화 이미지는 "사화 사건 1개당 세로로 이어진 1장". 이 상수 3개가 사건 목록이자
   이미지 문서 id(settings/fourcut_img_<id>)이기도 하다. */
const EVENTS=[
  {id:"muo",  name:"무오사화", no:"01"},
  {id:"gapja",name:"갑자사화", no:"02"},
  {id:"gimyo",name:"기묘사화", no:"03"},
];
const CUTS=4;                 // 세로 이미지를 높이로 4등분
const MAX_BUBBLES_PER_CUT=2;  // 컷당 말풍선 상한

/* 기본 콘텐츠 (어드민 미설정 시) */
const DEFAULT_CONTENT={
  title:"사화 네컷",
  intro:"말풍선을 눌러 대사를 쓰면 글자가 풍선에 딱 맞게 들어가요.",

function emptyCuts(){return Array.from({length:CUTS},()=>({bubbles:[]}));}

/* ── LMS ── */
function getStudentFromLMS(){
  const sid=localStorage.getItem('lms_autosave_sid');
  const sname=localStorage.getItem('lms_autosave_sname');
  if(!sid||!sname||String(sid).length<3)return null;
  return{studentId:sid,studentName:sname};
}
function classNumOf(sid){const s=String(sid||"");if(s.length<3)return null;const n=parseInt(s.slice(1,3),10);return isNaN(n)?null:n;}
/* 좋아요는 1인 1작품 1회. 학번이 있으면 학번을, 이름만 넣고 들어온 경우엔
   이 기기에 저장해 둔 임의 id를 투표자 키로 쓴다(학번 "00000"끼리 겹치는 걸 막는다). */
function likeKey(){
  if(student&&student.studentId&&student.studentId!=="00000")return student.studentId;
  let g=localStorage.getItem('fourcut_guest_uid');
  if(!g){g='g'+Math.random().toString(36).slice(2,10);localStorage.setItem('fourcut_guest_uid',g);}
  return g;
}

/* ── 안내 토스트 ── */
let toastTimer=null;
function warn(msg){
  const t=$("#warnToast");t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ── 콘텐츠 정규화 ──
   예전 형식({cuts:[{img,bubbles}]×4} — 컷마다 그림 1장)도 열리게 받아준다. */
function normalize(d){
  const c={
    title:d.title||DEFAULT_CONTENT.title,
    intro:d.intro||DEFAULT_CONTENT.intro,
    introTitle:d.introTitle||DEFAULT_CONTENT.introTitle,
    introBody:d.introBody||DEFAULT_CONTENT.introBody,
    introBtn:d.introBtn||DEFAULT_CONTENT.introBtn,
    events:null,
  };
  const byId={};
  if(Array.isArray(d.events))d.events.forEach(e=>{if(e&&e.id)byId[e.id]=e;});
  // 예전 형식이면 그때 잡아둔 말풍선 배치를 세 사건의 출발점으로 물려준다.
  const legacy=(!Array.isArray(d.events)&&Array.isArray(d.cuts))
    ? d.cuts.slice(0,CUTS).map(x=>({bubbles:(x&&Array.isArray(x.bubbles)?x.bubbles:[]).slice(0,MAX_BUBBLES_PER_CUT)}))
    : null;
  c.events=EVENTS.map(meta=>{
    const e=byId[meta.id];
    let cuts=e&&Array.isArray(e.cuts)?e.cuts:legacy;
    if(!Array.isArray(cuts))cuts=emptyCuts();
    cuts=Array.from({length:CUTS},(_,i)=>({
      bubbles:(cuts[i]&&Array.isArray(cuts[i].bubbles)?cuts[i].bubbles:[]).slice(0,MAX_BUBBLES_PER_CUT)
    }));
    return{id:meta.id,name:(e&&e.name)||meta.name,cuts};
  });
  return c;
}

async function loadEventImage(evId){

/* ── 세로 스트립 렌더 ── */
function bubbleHTML(b,ci,bi){
  const st=`left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%`;
  const tail=b.type==="thought"?`<span class="tail"></span><span class="tail2"></span>`:`<span class="tail"></span>`;
  const ph=b.type==="thought"?"생각을 써요":"대사를 써요";
  return `<div class="bubble ${b.type==="thought"?"thought":"speech"}" data-ci="${ci}" data-bi="${bi}" style="${st}">
      <div class="bhandle" data-act="move">${icon('move',12)}</div><div class="bdel" data-act="del">${icon('x',13)}</div>
      <div class="btext" contenteditable="true" data-ci="${ci}" data-bi="${bi}" data-ph="${ph}">${esc(b.text)}</div>${tail}</div>`;
}
function renderStrip(){
  const strip=$("#strip");
  const bg=curImage
    ?`<img class="bg" src="${curImage}" alt="${esc(curEvent.name)} 네컷 만화">`
    :`<div class="noimg">${esc(curEvent.name)} 만화가 아직 준비되지 않았어요.<br>선생님께 알려주세요.</div>`;
  const zones=work.map((c,ci)=>`
    <div class="cut-zone" data-ci="${ci}" style="top:${ci*(100/CUTS)}%;height:${100/CUTS}%">
      <span class="zone-num">${ci+1}컷</span>
      <div class="zone-add">
        <button data-add="speech" data-ci="${ci}">+ 대사</button>
        <button data-add="thought" data-ci="${ci}">+ 생각</button>
      </div>
      ${c.bubbles.map((b,bi)=>bubbleHTML(b,ci,bi)).join("")}
    </div>`).join("");
  strip.className='strip'+(curImage?'':' empty');
  strip.innerHTML=bg+zones;
  bindStrip();
  requestAnimationFrame(()=>fitAll());
}

function bindStrip(){
  const strip=$("#strip");
  strip.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{
    const ci=+btn.dataset.ci;
    if(work[ci].bubbles.length>=MAX_BUBBLES_PER_CUT){
      warn(`말풍선은 한 컷에 ${MAX_BUBBLES_PER_CUT}개까지만 올릴 수 있어요.`);return;
    }
    // 이미 있는 풍선과 겹치지 않게 두 번째는 아래쪽에 놓는다
    const n=work[ci].bubbles.length;
    work[ci].bubbles.push({type:btn.dataset.add,x:n?38:8,y:n?54:10,w:50,h:34,text:""});
    renderStrip();
  });
  strip.querySelectorAll('.bdel').forEach(el=>el.onclick=ev=>{
    ev.stopPropagation();
    const p=el.parentElement,ci=+p.dataset.ci,bi=+p.dataset.bi;
    work[ci].bubbles.splice(bi,1);renderStrip();
  });
  strip.querySelectorAll('.bhandle').forEach(el=>el.addEventListener('pointerdown',ev=>startDrag(ev,el.parentElement)));
  strip.querySelectorAll('.btext[contenteditable]').forEach(el=>{
    el.addEventListener('input',()=>{
      work[+el.dataset.ci].bubbles[+el.dataset.bi].text=el.textContent;
      fitText(el);
    });
    el.addEventListener('focus',()=>{editingEl&&editingEl.classList.remove('editing');editingEl=el.parentElement;editingEl.classList.add('editing');});
    el.addEventListener('blur',()=>{el.parentElement.classList.remove('editing');});
  });
}

/* ── 드래그(해당 컷 영역 안에서만 이동) ── */
let drag=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function startDrag(ev,el){
  ev.preventDefault();ev.stopPropagation();
  const ci=+el.dataset.ci,bi=+el.dataset.bi,b=work[ci].bubbles[bi];
  const zone=el.parentElement,rect=zone.getBoundingClientRect();
  drag={el,b,rect,startX:ev.clientX,startY:ev.clientY,ox:b.x,oy:b.y};
  const h=ev.currentTarget;
  h.setPointerCapture(ev.pointerId);
  h.addEventListener('pointermove',onDrag);
  h.addEventListener('pointerup',endDrag);
  h.addEventListener('pointercancel',endDrag);
}
function onDrag(ev){
  if(!drag)return;
  const dxp=(ev.clientX-drag.startX)/drag.rect.width*100;
  const dyp=(ev.clientY-drag.startY)/drag.rect.height*100;
  drag.b.x=clamp(drag.ox+dxp,0,100-drag.b.w);
  drag.b.y=clamp(drag.oy+dyp,0,100-drag.b.h);
  drag.el.style.left=drag.b.x+'%';drag.el.style.top=drag.b.y+'%';
}
function endDrag(ev){
  if(!drag)return;
  const h=ev.currentTarget;
  h.removeEventListener('pointermove',onDrag);
  h.removeEventListener('pointerup',endDrag);
  h.removeEventListener('pointercancel',endDrag);
  drag=null;
}

/* ── 자동 맞춤 ── */
function fitText(el){
  const parent=el.parentElement;
  if(!parent.clientHeight)return;
  const maxH=parent.clientHeight*(parent.classList.contains('thought')?0.7:0.72);
  const maxW=parent.clientWidth*(parent.classList.contains('thought')?0.68:0.7);
  let size=Math.max(10,Math.round(parent.clientHeight*0.32));
  el.style.fontSize=size+'px';
  let guard=0;
  while(size>8&&(el.scrollHeight>maxH||el.scrollWidth>maxW)&&guard<60){size--;el.style.fontSize=size+'px';guard++;}
}
function fitAll(){document.querySelectorAll('#strip .btext').forEach(fitText);}
window.addEventListener('resize',()=>requestAnimationFrame(fitAll));
// 이미지가 늦게 뜨면 컷 영역 높이가 바뀌므로 다시 맞춘다
new ResizeObserver(()=>requestAnimationFrame(fitAll)).observe(document.getElementById('strip'));

async function buildExportDOM(){
  const host=$("#exportHost");
  const inner=1080-26*2-30*2;   // 외곽 여백 + 필름 프레임 좌우 패딩
  const zones=work.map((c,ci)=>`
    <div style="position:absolute;left:0;width:100%;top:${ci*(100/CUTS)}%;height:${100/CUTS}%">
      ${c.bubbles.map(b=>{
        const round=b.type==="thought"?"50%":"20px";
        const inset=b.type==="thought"?"20% 20%":"15% 16%";
        return `<div class="xb" style="position:absolute;left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%;background:#fff;border:3px solid #1c1c1c;border-radius:${round};display:flex;align-items:center;justify-content:center">
          <div class="xt" style="position:absolute;inset:${inset};overflow:hidden;text-align:center;line-height:1.25;font-family:'Gaegu',cursive;font-weight:700;color:#1c1c1c;word-break:break-word;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center">${esc(b.text)}</div>
        </div>`;
      }).join("")}
    </div>`).join("");
  host.innerHTML=`
    <div style="padding:26px;background:#EFE7D6">
      <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:44px;text-align:center;color:#1E1B16;margin-bottom:4px">${esc(CONTENT.title)}</div>
      <div style="font-family:'Gaegu',cursive;font-weight:700;font-size:30px;text-align:center;color:#C13D18;margin-bottom:14px">${esc(curEvent.name)}</div>
      <div style="background:#1E1B16;border-radius:12px;padding:18px 30px">
        <div style="display:flex;justify-content:space-between;font-family:monospace;font-size:16px;letter-spacing:.12em;margin-bottom:14px"><span style="color:#EFE7D6">4 CUT FILM</span><span style="color:#E4572E">${esc(filmDateStr())}</span></div>
        <div style="position:relative;width:${inner}px;border:4px solid #EFE7D6;border-radius:3px;overflow:hidden;background:#efece3">
          <img src="${curImage}" style="display:block;width:100%;height:auto">
          ${zones}
        </div>
      </div>
      <div style="text-align:right;font-family:'Gaegu',cursive;font-weight:700;font-size:26px;margin-top:12px;color:#1E1B16">${esc(student.studentName)}</div>
    </div>`;
  // 이미지가 실제로 그려져야 컷 영역 높이(=풍선 크기)가 확정된다
  const im=host.querySelector('img');
  if(im&&!im.complete)await new Promise(r=>{im.onload=im.onerror=r;});
  // 폰트 맞춤
  host.querySelectorAll('.xb').forEach(bb=>{
    const el=bb.querySelector('.xt');const thought=bb.style.borderRadius==="50%";
    const maxH=bb.clientHeight*(thought?0.7:0.72),maxW=bb.clientWidth*(thought?0.68:0.7);
    let size=Math.max(12,Math.round(bb.clientHeight*0.32));el.style.fontSize=size+'px';let g=0;
    while(size>10&&(el.scrollHeight>maxH||el.scrollWidth>maxW)&&g<80){size--;el.style.fontSize=size+'px';g++;}
  });
  return host.firstElementChild;
}

async function composeImage(){
  if(document.fonts&&document.fonts.ready){try{await document.fonts.ready;}catch(e){}}
  const node=await buildExportDOM();
  const canvas=await html2canvas(node,{backgroundColor:"#EFE7D6",scale:1,useCORS:true,logging:false});
  return canvas.toDataURL('image/jpeg',0.85);
}

/* ── 친구 작품 갤러리 ── */
let arcWorks=[],arcFilter='all',arcEvFilter='all',likeBusy={};
async function openArchive(){
  $("#archiveView").classList.add('show');
  $("#arcGrid").innerHTML=`<div class="arc-empty">불러오는 중…</div>`;
  try{
    const snap=await getDocs(query(collection(db,'fourcut_works'),orderBy('timestamp','desc')));
    arcWorks=[];snap.forEach(d=>arcWorks.push({id:d.id,...d.data()}));
  }catch(e){
    try{const snap=await getDocs(collection(db,'fourcut_works'));arcWorks=[];snap.forEach(d=>arcWorks.push({id:d.id,...d.data()}));arcWorks.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));}catch(e2){arcWorks=[];}
  }
  renderArcFilter();renderArc();
}
window.closeArchive=()=>$("#archiveView").classList.remove('show');

function renderArcFilter(){
  // 사건 필터: 콘텐츠에 정의된 3종을 늘 보여준다(0건이어도 자리를 지킨다)
  const ef=$("#arcEvFilter");
  ef.innerHTML=[`<button class="arc-fbtn ev ${arcEvFilter==='all'?'active':''}" data-f="all">전체 사건</button>`]
    .concat(CONTENT.events.map(e=>{
      const n=arcWorks.filter(w=>w.eventId===e.id).length;
      return `<button class="arc-fbtn ev ${arcEvFilter===e.id?'active':''}" data-f="${esc(e.id)}">${esc(e.name)} ${n}</button>`;
    })).join("");
  ef.querySelectorAll('.arc-fbtn').forEach(b=>b.onclick=()=>{arcEvFilter=b.dataset.f;renderArcFilter();renderArc();});

  const cls=[...new Set(arcWorks.map(w=>w.classNum).filter(n=>n!=null))].sort((a,b)=>a-b);
  const f=$("#arcFilter");
  f.innerHTML=[`<button class="arc-fbtn ${arcFilter==='all'?'active':''}" data-f="all">전체 반</button>`]
    .concat(cls.map(n=>`<button class="arc-fbtn ${arcFilter==n?'active':''}" data-f="${n}">${n}반</button>`)).join("");
  f.querySelectorAll('.arc-fbtn').forEach(b=>b.onclick=()=>{arcFilter=b.dataset.f==='all'?'all':+b.dataset.f;renderArcFilter();renderArc();});
}
function filteredWorks(){
  return arcWorks.filter(w=>
    (arcEvFilter==='all'||w.eventId===arcEvFilter)&&
    (arcFilter==='all'||w.classNum===arcFilter));
}
function renderArc(){
  const list=filteredWorks();
  const grid=$("#arcGrid");
  if(!list.length){grid.innerHTML=`<div class="arc-empty">아직 공유된 작품이 없어요.</div>`;return;}
  const me=likeKey();
  grid.innerHTML=list.map(w=>{
    const liked=!!(w.likedBy&&w.likedBy[me]);
    return `<div class="work">
      <img src="${w.image}" alt="${esc(w.studentName)}의 네컷" loading="lazy" onclick="showLightbox('${w.id}')">
      ${w.eventName?`<span class="evtag">${esc(w.eventName)}</span>`:''}
      <div class="meta">
        <span class="nm">${esc(w.studentName)} <span class="cls">${w.classNum?w.classNum+'반':''}</span></span>
        <button class="like-btn${liked?' liked':''}" data-id="${w.id}">${icon('heart',14)} ${w.likes||0}</button>
      </div>
    </div>`;
  }).join("");
  grid.querySelectorAll('.like-btn').forEach(b=>b.onclick=()=>toggleLike(b.dataset.id,b));
}
window.showLightbox=(id)=>{const w=arcWorks.find(x=>x.id===id);if(!w)return;$("#lightboxImg").src=w.image;$("#lightbox").classList.add('show');};

/* 좋아요: 1인 1작품 1회, 다시 누르면 취소되는 토글 */
async function toggleLike(id,btn){
  if(likeBusy[id])return;
  const w=arcWorks.find(x=>x.id===id);if(!w)return;
  const me=likeKey();
  const liked=!!(w.likedBy&&w.likedBy[me]);
  likeBusy[id]=true;btn.disabled=true;
  // 낙관적 갱신 — 실패하면 되돌린다
  const prevLikes=w.likes||0,prevLikedBy={...(w.likedBy||{})};
  w.likes=Math.max(0,prevLikes+(liked?-1:1));
  w.likedBy={...prevLikedBy};
  if(liked)delete w.likedBy[me];else w.likedBy[me]=true;
  renderArc();
  try{
    await updateDoc(doc(db,'fourcut_works',id),{
      likes:w.likes,
      [`likedBy.${me}`]:liked?deleteField():true
    });
  }catch(e){
    w.likes=prevLikes;w.likedBy=prevLikedBy;renderArc();
    warn('좋아요를 반영하지 못했어요.');
  }finally{delete likeBusy[id];}
}

$("#introArcBtn").onclick=openArchive;
$("#gateArcBtn").onclick=openArchive;

/* 정적 HTML에 박힌 아이콘 주입 */
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,el.dataset.iconSize?+el.dataset.iconSize:24));

/* URL ?archive=1 로 바로 아카이브 */
init().then(()=>{
  if(new URLSearchParams(location.search).get('archive')==='1')openArchive();
});
</script>
