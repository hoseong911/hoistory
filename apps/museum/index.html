<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국립중앙박물관 관람 활동지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
/* 청자빛과 먹색. 프리셋 클래스보다 앞서야 하므로 body.hi-preset-paper 로 덮어쓴다(shared/theme.css는 건드리지 않는다). */
body.hi-preset-paper{
  --hi-bg-base:#F4F1EA;
  --hi-bg-surface:#FBFAF6;
  --hi-bg-mid:#EFEAE0;
  --hi-bg-card:#FBFAF6;
  --hi-bg-elevated:#ffffff;
  --hi-text:#1E2B2A;
  --hi-text-soft:#33413F;
  --hi-text-muted:#5E6966;
  --hi-border:#D9D2C2;
  --hi-border-light:#9DB9AE;
  --hi-border-faint:#E7E1D4;
  --hi-accent:#2F5D52;
  --hi-accent-hover:#24493F;
  --hi-accent-strong:#1F3F37;
  --hi-accent-soft:rgba(63,122,104,.14);
  --mu-celadon:#A9CBBE;
  --mu-red:#A8472F;
  --mu-red-soft:rgba(168,71,47,.12);
}
body{background:var(--hi-bg-base);color:var(--hi-text);font-family:'Pretendard',sans-serif;margin:0;
  min-height:100vh;-webkit-tap-highlight-color:transparent;word-break:keep-all}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 120px}
.mu-title{font-family:'Noto Serif KR',serif;font-size:25px;font-weight:900;margin:0 0 4px;line-height:1.35}
.mu-sub{font-size:13px;color:var(--hi-text-muted);margin:0 0 16px}

.gate{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:16px;padding:34px 20px;text-align:center}
.gate-t{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:900;margin-bottom:8px}
.gate-d{font-size:13px;color:var(--hi-text-muted);line-height:1.8}

.card{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:16px;padding:18px;margin:12px 0}
.card h2{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:900;margin:0 0 6px}
.card h3{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:900;margin:6px 0 4px;line-height:1.35}
.muted{font-size:14px;color:var(--hi-text-muted);line-height:1.7;margin:0}

.field{margin-top:16px}
.label{display:block;font-weight:800;font-size:14px;margin-bottom:8px;color:var(--hi-text)}
.req{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--mu-red);background:var(--mu-red-soft);border-radius:6px;padding:1px 6px;vertical-align:1px}
.help{font-size:12.5px;color:var(--hi-text-muted);margin:6px 0 0;line-height:1.6}
.inp{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--hi-text);background:var(--hi-bg-elevated);
  border:1.5px solid var(--hi-border);border-radius:12px;padding:12px 14px;min-height:48px;outline:none}
textarea.inp{resize:vertical;min-height:92px;line-height:1.6}
.inp:focus{border-color:var(--hi-accent)}
.field.err .inp,.field.err .chips,.field.err .photo,.field.err .modes{box-shadow:0 0 0 2px var(--mu-red);border-radius:12px}
.errmsg{color:var(--mu-red);font-size:12.5px;font-weight:800;margin:6px 0 0}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;font:inherit;background:var(--hi-bg-elevated);border:1.5px solid var(--hi-border);border-radius:14px;padding:14px;cursor:pointer;color:var(--hi-text)}
.mode strong{display:block;font-size:16px}
.mode span{display:block;font-size:13px;color:var(--hi-text-muted);margin-top:4px;line-height:1.5}
.mode.on{border-color:var(--hi-accent);background:var(--hi-accent-soft)}
.groupbox{background:var(--hi-bg-mid);border-radius:12px;padding:2px 14px 14px;margin-top:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:15px;background:var(--hi-bg-elevated);color:var(--hi-text);
  border:1.5px solid var(--hi-border);border-radius:10px;padding:9px 13px;min-height:44px;cursor:pointer;text-align:left}
.chip.on{background:var(--hi-accent);border-color:var(--hi-accent);color:#fff}

.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:800;font-size:15px;border-radius:12px;padding:12px 18px;min-height:46px;cursor:pointer;border:1.5px solid transparent}
.b-main{background:var(--hi-accent);color:#fff;width:100%;font-size:16px;min-height:54px;margin-top:20px}
.b-main:hover{background:var(--hi-accent-hover)}
.b-main:disabled{opacity:.6}
.b-ghost{background:var(--hi-bg-elevated);border-color:var(--hi-border);color:var(--hi-text-soft)}
.b-photo{width:100%;background:var(--hi-bg-mid);border:1.5px dashed var(--hi-border-light);color:var(--hi-text);padding:18px}
.link{font:inherit;font-size:13px;font-weight:700;background:none;border:0;color:var(--mu-celadon);text-decoration:underline;cursor:pointer;padding:8px}

.who{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--hi-text);color:#F6F3EC;border-radius:14px;padding:12px 16px}
.who strong{display:block;font-size:16px}
.who span{display:block;font-size:13px;color:#C9D6D1}

.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--hi-bg-base);padding:12px 0}
.tab{font:inherit;background:var(--hi-bg-card);border:1.5px solid var(--hi-border);border-radius:12px;padding:8px 6px;cursor:pointer;color:var(--hi-text)}
.tab-label{display:block;font-weight:800;font-size:16px}
.tab-when{display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--hi-text-muted)}
.tab.on{background:var(--mu-celadon);border-color:var(--hi-accent)}
.tab.on .tab-when{color:var(--hi-text)}
.phase-head{padding:4px 2px 0}
.phase-head h2{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:900;margin:0 0 4px}

.mission.done{border-color:var(--hi-accent)}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:800;border-radius:6px;padding:2px 9px}
.b-must{background:var(--mu-red);color:#FBFAF6}
.b-opt{background:var(--hi-bg-mid);color:var(--hi-text)}
.b-group{background:var(--hi-text);color:#F6F3EC}
.b-solo{background:var(--mu-celadon);color:var(--hi-text)}
.place{font-size:13px;color:var(--hi-text-muted)}
.state{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--hi-accent)}
.note{background:var(--hi-accent-soft);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
.tip{background:var(--hi-bg-mid);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0 0;white-space:pre-line;line-height:1.7}

.photo{display:flex;flex-direction:column;gap:10px}
.thumb{width:100%;max-height:360px;object-fit:contain;background:var(--hi-bg-mid);border-radius:12px}
.photo-acts{display:flex;gap:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.stars{display:flex;align-items:center;gap:2px}
.star{background:none;border:0;color:var(--hi-border);cursor:pointer;padding:6px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.star.on{color:var(--mu-red)}
.star.on svg{fill:currentColor}

.timer{display:flex;align-items:center;gap:14px;margin-top:14px}
.timer-num{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:900}

.submitbar{position:sticky;bottom:0;background:linear-gradient(to top,var(--hi-bg-base) 75%,rgba(244,241,234,0));padding:14px 0 18px;margin-top:8px}
.submitbar .b-main{margin-top:8px}
</style>
<script src="/hoistory/pwa.js"></script>
</head>
<body class="hi-preset-paper">
<div class="wrap">
  <h1 class="mu-title">국립중앙박물관 관람 활동지</h1>
  <p class="mu-sub">중학교 3학년 창의적 체험활동</p>
  <div class="gate" id="gate" style="display:none">
    <div class="gate-t">로그인이 필요해요</div>
    <div class="gate-d">수업 홈에서 로그인한 뒤 이 활동으로 들어와 주세요.</div>
  </div>
  <div id="app"></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}
  from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import "../../shared/offline.js";
import { firebaseConfig } from "../../shared/firebase-config.js";
import { showToast } from "../../shared/toast.js";
import { containsBadWord } from "../../shared/profanity.js";
import { icon } from "../../shared/icons.js";
import { PHASES, ROLES, MODES } from "./missions.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const WORKS = 'museum_works';
const PHOTOS = 'museum_photos';

const $ = id => document.getElementById(id);
function classNumOf(sid){ sid = String(sid || ''); if (sid.length < 3) return null; const c = parseInt(sid.slice(1,3),10); return isNaN(c) ? null : c; }

/* ── 학생 확인 (LMS가 남긴 값을 읽는다, 자체 로그인 없음) ── */
function getStudent(){
  const sid = sessionStorage.getItem('lms_sid') || localStorage.getItem('lms_autosave_sid');
  const nm  = sessionStorage.getItem('lms_sname') || localStorage.getItem('lms_autosave_sname');
  if (!sid || !nm || String(sid).length < 5) return null;
  return { studentId: String(sid), name: nm, classNum: classNumOf(sid) };
}

let student = null;
let state = null;          // { mode, group, members, role, answers, photos, submitted, phase, started }
let firstSubmitted = false;
let errors = new Set();
let submitting = false;

const freshState = () => ({ mode:'', group:'', members:'', role:'', answers:{}, photos:{}, submitted:{}, phase:'pre', started:false });
const draftKey = () => 'museum_draft_' + student.studentId;
let saveTimer = null;
function saveDraft(now){
  clearTimeout(saveTimer);
  const run = () => { try{ localStorage.setItem(draftKey(), JSON.stringify(state)); }catch(e){} };
  if (now) run(); else saveTimer = setTimeout(run, 300);
}
function loadDraft(){
  try{ const d = JSON.parse(localStorage.getItem(draftKey())); return d && typeof d === 'object' ? d : null; }catch(e){ return null; }
}

/* ── 사진: 기기에서 줄여 IndexedDB에 잠깐 둔다(localStorage는 용량이 작다) ── */
const PHOTO_MAX = 1280, PHOTO_Q = 0.72, PHOTO_BYTES = 600000;
async function compressImage(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){
    const url = URL.createObjectURL(file);
    bmp = new Image(); bmp.src = url; await bmp.decode();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const k = Math.min(1, PHOTO_MAX / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  let q = PHOTO_Q, url = cv.toDataURL('image/jpeg', q);
  while (url.length > PHOTO_BYTES && q > 0.35){ q -= 0.1; url = cv.toDataURL('image/jpeg', q); }
  return url;
}
const memPhotos = new Map();
let idbP = null;
function idb(){
  if (idbP) return idbP;
  idbP = new Promise(res => {
    try{
      const r = indexedDB.open('museum-worksheet', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    }catch(e){ res(null); }
  });
  return idbP;
}
function idbDo(mode, fn){
  return idb().then(db => db ? new Promise(res => {
    try{ const t = db.transaction('photos', mode); const rq = fn(t.objectStore('photos'));
      t.oncomplete = () => res(rq ? rq.result : undefined); t.onerror = () => res(undefined); }
    catch(e){ res(undefined); }
  }) : undefined);
}
const photoKey = fid => student.studentId + '_' + fid;
async function photoGet(fid){
  const k = photoKey(fid);
  if (memPhotos.has(k)) return memPhotos.get(k);
  const v = await idbDo('readonly', s => s.get(k));
  if (v) return v;
  /* 다른 기기에서 낸 사진은 서버에서 받아 온다 */
  try{ const snap = await getDoc(doc(db, PHOTOS, k)); if (snap.exists()){ const u = snap.data().image; memPhotos.set(k, u); return u; } }catch(e){}
  return null;
}
async function photoSet(fid, url){ const k = photoKey(fid); memPhotos.set(k, url); await idbDo('readwrite', s => s.put(url, k)); }

/* ── DOM 도우미: 학생이 쓴 글은 textContent로만 넣는다 ── */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;      // 아이콘 SVG 전용
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const ic = (name, size) => h('span', { html: icon(name, size || 16), style:'display:inline-flex;line-height:0' });

/* ── 보이기 규칙 ── */
const modeOk = x => !x.modes || x.modes.includes(state.mode);
function fieldVisible(f){
  if (!modeOk(f)) return false;
  if (f.showIf){
    const v = state.answers[f.showIf.field];
    if ('equals' in f.showIf && v !== f.showIf.equals) return false;
    if ('notEquals' in f.showIf && v === f.showIf.notEquals) return false;
  }
  return true;
}
const visibleSections = p => p.sections.filter(modeOk);
const visibleFields = s => s.fields.filter(fieldVisible);
const controllers = new Set(PHASES.flatMap(p => p.sections.flatMap(s => s.fields.filter(f => f.showIf).map(f => f.showIf.field))));

function isFilled(f){
  if (f.type === 'photo') return !!state.photos[f.id];
  if (f.type === 'timer') return true;
  const v = state.answers[f.id];
  if (f.type === 'checkbox') return Array.isArray(v) && (f.requireAll ? v.length === f.options.length : v.length > 0);
  if (f.type === 'rating') return typeof v === 'number' && v > 0;
  return typeof v === 'string' && v.trim() !== '';
}
const hasAny = f => f.type !== 'timer' && isFilled({ ...f, requireAll:false });
function sectionStatus(s){
  const fs = visibleFields(s), req = fs.filter(f => f.required);
  if (req.length) return req.every(isFilled) ? 'done' : (fs.some(hasAny) ? 'partial' : 'empty');
  return fs.some(hasAny) ? 'done' : 'empty';
}

/* ── 화면 ── */
function render(){ $('app').replaceChildren(state.started ? renderMain() : renderStart()); }
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

function renderStart(){
  const err = k => errors.has('st.' + k);
  const wrapF = (k, label, input) => h('div', { class:'field' + (err(k) ? ' err' : '') },
    h('p', { class:'label' }, label, h('span', { class:'req', text:'필수' })), input,
    err(k) && h('p', { class:'errmsg', text:'골라 주세요' }));
  const text = (k, label) => h('div', { class:'field' + (err(k) ? ' err' : '') },
    h('label', { class:'label', for:'st-' + k }, label),
    h('input', { id:'st-' + k, class:'inp', type:'text', value: state[k] || '', autocomplete:'off',
      oninput: e => { state[k] = e.target.value; saveDraft(); } }),
    err(k) && h('p', { class:'errmsg', text:'적어 주세요' }));

  return h('div', { class:'card' },
    h('h2', { text: student.name + '님, 어떻게 관람할까요?' }),
    h('p', { class:'muted', text:'관람 방법을 고르면 미션이 열려요. 쓰는 내용은 이 기기에 자동으로 임시 저장됩니다.' }),
    wrapF('mode', '관람 방법', h('div', { class:'modes' },
      Object.entries(MODES).map(([id, m]) => h('button', { type:'button', class:'mode' + (state.mode === id ? ' on' : ''),
        'aria-pressed': String(state.mode === id), onclick: () => { state.mode = id; errors.delete('st.mode'); saveDraft(); rerender(); } },
        h('strong', { text: m.label }), h('span', { text: m.desc }))))),
    state.mode === 'group' && h('div', { class:'groupbox' },
      text('group', '모둠 이름'),
      text('members', '모둠원 이름'),
      wrapF('role', '내 역할', chips(ROLES, state.role, v => { state.role = v; errors.delete('st.role'); saveDraft(); rerender(); }, false))),
    h('button', { type:'button', class:'b b-main', onclick: startApp, text:'시작하기' }));
}
function startApp(){
  errors = new Set();
  if (!state.mode) errors.add('st.mode');
  if (state.mode === 'group'){ if (!String(state.group||'').trim()) errors.add('st.group'); if (!state.role) errors.add('st.role'); }
  if (errors.size){ rerender(); return; }
  state.started = true; saveDraft(true); render(); window.scrollTo(0, 0);
}

function renderMain(){
  const phase = PHASES.find(p => p.id === state.phase) || PHASES[0];
  const how = state.mode === 'group' ? `${MODES.group.label}, ${state.group}, ${state.role}` : MODES.solo.label;
  return h('div', null,
    h('div', { class:'who' },
      h('div', null, h('strong', { text: `${student.studentId} ${student.name}` }), h('span', { text: how })),
      h('button', { type:'button', class:'link', text:'관람 방법 바꾸기', onclick: () => { state.started = false; saveDraft(); render(); } })),
    h('nav', { class:'tabs' }, PHASES.map(p => h('button', { type:'button', class:'tab' + (p.id === phase.id ? ' on' : ''),
      onclick: () => { state.phase = p.id; errors = new Set(); saveDraft(); render(); window.scrollTo(0, 0); } },
      h('span', { class:'tab-label', text: p.label }),
      h('span', { class:'tab-when' }, state.submitted[p.id] ? [ic('check', 12), '제출함'] : p.when)))),
    h('div', { class:'phase-head' }, h('h2', { text: phase.title }), h('p', { class:'muted', text: phase.intro })),
    visibleSections(phase).map(renderSection),
    renderSubmitBar(phase));
}

function renderSection(s){
  const a = state.answers, st = sectionStatus(s);
  const place = s.dynamicPlace ? s.dynamicPlace(a) : s.place;
  const note = s.dynamicNote ? s.dynamicNote(a) : '';
  const bc = { 필수:'b-must', 선택:'b-opt', 모둠:'b-group', 개인:'b-solo' }[s.badge] || '';
  return h('article', { class:'card mission ' + st },
    h('div', { class:'mhead' },
      h('span', { class:'badge ' + bc, text: s.badge }),
      place && h('span', { class:'place', text: place }),
      st === 'done' && h('span', { class:'state' }, ic('check', 12), '완료')),
    h('h3', { text: s.title }),
    note && h('p', { class:'note', text: note }),
    s.intro && h('p', { class:'muted', text: s.intro }),
    s.tip && h('p', { class:'tip', text: s.tip }),
    visibleFields(s).map(renderField));
}

function renderField(f){
  const bad = errors.has(f.id), id = 'f-' + f.id;
  const labelTag = ['text','textarea','select'].includes(f.type) ? 'label' : 'p';
  return h('div', { class:'field' + (bad ? ' err' : '') },
    f.type !== 'timer' && h(labelTag, { class:'label', for: labelTag === 'label' ? id : null }, f.label, f.required && h('span', { class:'req', text:'필수' })),
    renderInput(f, id),
    f.help && h('p', { class:'help', text: f.help }),
    bad && h('p', { class:'errmsg', text: f.requireAll ? '모두 체크해 주세요' : f.type === 'photo' ? '사진을 올려 주세요' : '적어 주세요' }));
}

function setAnswer(fid, v, redraw){
  state.answers[fid] = v;
  if (errors.has(fid)){ errors.delete(fid); redraw = true; }
  saveDraft();
  if (redraw || controllers.has(fid)) rerender();
}

function chips(options, cur, pick, multi){
  const arr = multi ? (Array.isArray(cur) ? cur : []) : null;
  return h('div', { class:'chips' }, options.map(o => {
    const on = multi ? arr.includes(o) : cur === o;
    return h('button', { type:'button', class:'chip' + (on ? ' on' : ''), 'aria-pressed': String(on), onclick: () => pick(o) },
      multi && on ? ic('check', 14) : null, o);
  }));
}

function renderInput(f, id){
  const v = state.answers[f.id];
  switch (f.type){
    case 'text':
      return h('input', { id, class:'inp', type:'text', value: v || '', placeholder: f.placeholder || null, oninput: e => setAnswer(f.id, e.target.value) });
    case 'textarea': {
      const t = h('textarea', { id, class:'inp', rows:'3', oninput: e => setAnswer(f.id, e.target.value) });
      t.value = v || ''; return t;
    }
    case 'select':
      return h('select', { id, class:'inp', onchange: e => setAnswer(f.id, e.target.value, true) },
        h('option', { value:'', text:'고르세요' }),
        f.options.map(o => h('option', { value:o, selected: v === o, text:o })));
    case 'radio':
      return chips(f.options, v, o => setAnswer(f.id, o, true), false);
    case 'checkbox':
      return chips(f.options, v, o => {
        const arr = Array.isArray(state.answers[f.id]) ? [...state.answers[f.id]] : [];
        const i = arr.indexOf(o); if (i >= 0) arr.splice(i, 1); else arr.push(o);
        setAnswer(f.id, arr, true);
      }, true);
    case 'rating':
      return h('div', { class:'stars' }, [1,2,3,4,5].map(n => h('button', { type:'button', class:'star' + (v >= n ? ' on' : ''),
        'aria-label': n + '점', onclick: () => setAnswer(f.id, n, true), html: icon('star', 26) })));
    case 'photo': return renderPhoto(f, id);
    case 'timer': return renderTimer(f);
  }
  return null;
}

function renderPhoto(f, id){
  const input = h('input', { id, type:'file', accept:'image/*', class:'vh', onchange: e => onPhoto(f, e) });
  const wrap = h('div', { class:'photo' }, input);
  if (state.photos[f.id]){
    const img = h('img', { class:'thumb', alt: f.label });
    photoGet(f.id).then(u => { if (u) img.src = u; });
    wrap.append(img, h('div', { class:'photo-acts' },
      h('label', { for:id, class:'b b-ghost', text:'다시 찍기' }),
      h('button', { type:'button', class:'b b-ghost', text:'지우기', onclick: () => { delete state.photos[f.id]; saveDraft(true); rerender(); } })));
  } else {
    wrap.append(h('label', { for:id, class:'b b-photo' }, ic('image', 18), '사진 찍기 또는 고르기'));
  }
  return wrap;
}
async function onPhoto(f, e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  showToast('사진을 줄이는 중입니다');
  try{
    const url = await compressImage(file);
    await photoSet(f.id, url);
    state.photos[f.id] = { at: Date.now(), up: false };   // up: 서버에 올렸는지
    errors.delete(f.id); saveDraft(true); rerender();
    showToast('사진을 올렸어요');
  }catch(err){ showToast('사진을 불러오지 못했어요. 다른 사진으로 해 주세요', 'error'); }
}

function renderTimer(f){
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const num = h('span', { class:'timer-num', text: fmt(f.seconds) });
  const btn = h('button', { type:'button', class:'b b-ghost' }, ic('clock', 16), f.label + ' 시작');
  let left = f.seconds, t = null;
  btn.addEventListener('click', () => {
    if (t){ clearInterval(t); t = null; left = f.seconds; num.textContent = fmt(left); btn.lastChild.textContent = f.label + ' 시작'; return; }
    btn.lastChild.textContent = '멈추기';
    t = setInterval(() => {
      left -= 1; num.textContent = fmt(left);
      if (left <= 0){ clearInterval(t); t = null; left = f.seconds; num.textContent = '끝! 발견한 것을 적어요';
        btn.lastChild.textContent = '다시 시작'; if (navigator.vibrate) navigator.vibrate([200,100,200]); }
    }, 1000);
  });
  return h('div', { class:'timer' }, btn, num);
}

/* ── 제출 ── */
function renderSubmitBar(phase){
  const done = state.submitted[phase.id];
  return h('div', { class:'submitbar' },
    done && h('p', { class:'muted', text: new Date(done).toLocaleString('ko-KR') + '에 제출했어요. 고쳐서 다시 내면 마지막에 낸 것이 남습니다.' }),
    h('button', { type:'button', class:'b b-main', id:'submit-btn', onclick: () => onSubmit(phase), text: phase.label + (done ? ' 다시 제출하기' : ' 제출하기') }));
}

async function onSubmit(phase){
  if (submitting) return;
  errors = new Set();
  for (const s of visibleSections(phase)) for (const f of visibleFields(s)) if (f.required && !isFilled(f)) errors.add(f.id);
  if (errors.size){
    rerender(); showToast('필수 칸 ' + errors.size + '개를 채워 주세요');
    requestAnimationFrame(() => { const el = document.querySelector('.field.err'); if (el) el.scrollIntoView({ behavior:'smooth', block:'center' }); });
    return;
  }
  const answers = {}, photoIds = [];
  for (const s of visibleSections(phase)) for (const f of visibleFields(s)){
    if (f.type === 'timer') continue;
    if (f.type === 'photo'){ if (state.photos[f.id]) photoIds.push(f.id); continue; }
    if (hasAny(f)) answers[f.id] = typeof state.answers[f.id] === 'string' ? state.answers[f.id].trim() : state.answers[f.id];
  }
  if (Object.values(answers).some(v => typeof v === 'string' && containsBadWord(v))){ showToast('바르지 않은 말이 섞여 있어요', 'error'); return; }

  submitting = true;
  const btn = $('submit-btn'); if (btn){ btn.disabled = true; btn.textContent = '제출하는 중입니다'; }
  try{
    /* 사진 먼저, 작품 문서 나중(목록에는 떴는데 사진이 없는 순간을 만들지 않는다) */
    for (const fid of photoIds){
      if (state.photos[fid].up) continue;
      const url = await photoGet(fid);
      if (!url) continue;
      await setDoc(doc(db, PHOTOS, photoKey(fid)), { studentId: student.studentId, fieldId: fid, image: url, updatedAt: serverTimestamp() });
      state.photos[fid].up = true;
    }
    const photos = {};
    for (const s of visibleSections(phase)) for (const f of visibleFields(s)) if (f.type === 'photo') photos[f.id] = !!state.photos[f.id];
    const now = Date.now();
    const data = {
      studentId: student.studentId, name: student.name, classNum: student.classNum,
      mode: state.mode, group: state.group || '', members: state.members || '', role: state.role || '',
      answers, photos, phases: { [phase.id]: now }, updatedAt: serverTimestamp()
    };
    if (!firstSubmitted) data.submittedAt = serverTimestamp();   // 기한 판정은 처음 낸 시각으로 한다
    await setDoc(doc(db, WORKS, student.studentId), data, { merge: true });
    firstSubmitted = true;
    state.submitted[phase.id] = now;
    saveDraft(true); rerender();
    showToast(phase.label + ' 단계를 제출했어요');
  }catch(e){
    showToast('제출하지 못했어요. 잠시 뒤에 다시 눌러 주세요', 'error');
    if (btn){ btn.disabled = false; btn.textContent = phase.label + ' 제출하기'; }
  }finally{ submitting = false; }
}

/* ── 시작 ── */
async function init(){
  student = getStudent();
  if (!student){ $('gate').style.display = 'block'; return; }
  state = { ...freshState(), ...(loadDraft() || {}) };
  try{
    const snap = await getDoc(doc(db, WORKS, student.studentId));
    if (snap.exists()){
      const d = snap.data();
      firstSubmitted = !!d.submittedAt;
      /* 다른 기기에서 냈으면 서버 것으로 채우고, 이 기기에서 고치던 글은 그 위에 둔다 */
      if (!state.mode && d.mode){ state.mode = d.mode; state.group = d.group || ''; state.members = d.members || ''; state.role = d.role || ''; state.started = true; }
      state.answers = { ...(d.answers || {}), ...state.answers };
      for (const [fid, on] of Object.entries(d.photos || {})) if (on && !state.photos[fid]) state.photos[fid] = { at: 0, up: true };
      for (const [p, t] of Object.entries(d.phases || {})) if (!state.submitted[p]) state.submitted[p] = t;
    }
  }catch(e){}
  render();
}
init();
</script>
