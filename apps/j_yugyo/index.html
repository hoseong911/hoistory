<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>유교로 나라를 다스린다는 것</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-display:swap}
/* ===== 미니멀리즘 + 라임 그린 · 폰트 위계 18/16/14/12 ===== */
.hi-preset-lime{
  --ink:#111; --canvas:#fff; --cloud:#f5f5f5; --hairline:#d5d8c8; --hairline-soft:#e6e8da;
  --charcoal:#39393b; --mute:#6f7266; --stone:#9ea08f;
  --lime:#C6FF00; --lime-deep:#B2E600; --lime-pale:#EEFCBE; --page:#F9FDEC;
  --pos:#3f7a00;
  --hi-font:'Pretendard',sans-serif;
  /* 폰트 위계 4단계 */
  --fs-lg:18px; --fs-md:16px; --fs-sm:14px; --fs-xs:12px;
  background:var(--page);color:#111;font-family:'Pretendard',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:#111;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:44px}
input,textarea,select{font-size:16px}
.hi-wrap{max-width:760px;margin:0 auto;padding:0 16px}

.hi-screen{display:none;flex-direction:column;gap:16px;padding-top:18px}
.hi-screen.active{display:flex}

/* 버튼 — 필 CTA, 라임 채움 + 검정 글자 */
.hi-btn{font-family:'Pretendard',sans-serif;font-weight:800;font-size:var(--fs-lg);line-height:1.4;border:none;border-radius:9999px;padding:15px 32px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .1s ease,opacity .1s ease}
.hi-btn:active{transform:scale(.97);opacity:.75}
.hi-btn:disabled{opacity:.35;cursor:not-allowed}
.hi-btn-primary{background:var(--lime);color:#111}
.hi-btn-outline{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.hi-btn-block{width:100%}
/* theme.css의 버튼 hover 규칙이 --hi-* 토큰을 쓰는데, 이 앱은 theme.css 프리셋 대신
   자체 라임 프리셋을 써서 그 값이 :root의 어두운 테마 기본값으로 잡힌다. 그래서
   [이전]에 hover가 걸리면 글자가 흰색(--hi-text)이 되어 흰 버튼 위에서 사라졌다.
   폰은 한 번 누르면 :hover가 그대로 붙어 있어 다른 곳을 누를 때까지 계속 안 보인다.
   [다음]도 같은 이유로 눌린 뒤 라임이 아닌 초록(--hi-accent-hover)으로 변했다.
   둘 다 앱 색 그대로 두게 덮어쓴다. */
.hi-btn-outline:hover:not(:disabled){color:#111}
.hi-btn-primary:hover:not(:disabled){background:var(--lime);transform:none}

/* ===== 로그인 안내 ===== */
.hi-gate{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:48px;padding:44px 26px;background:#fff;border-radius:20px;box-shadow:inset 0 0 0 1.5px var(--hairline)}
.hi-gate-title{font-weight:900;font-size:var(--fs-lg);margin-bottom:10px}
.hi-gate-desc{font-size:var(--fs-sm);color:var(--charcoal);line-height:1.7;word-break:keep-all}

/* ===== 앱 헤더 ===== */
.hi-apphead{padding-top:8px}
.hi-eyebrow{font-size:var(--fs-xs);font-weight:700;letter-spacing:.02em;color:var(--mute)}
.hi-appttl{font-family:'Paperlogy',sans-serif;font-weight:900;font-size:30px;letter-spacing:-.01em;line-height:1.2;margin-top:10px;display:inline-block;position:relative}
.hi-appttl::after{content:'';position:absolute;left:0;right:0;bottom:2px;height:12px;background:var(--lime);z-index:-1;border-radius:2px}

/* ===== 페이지 헤더 ===== */
.hi-phead{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1.5px solid var(--ink);padding-bottom:12px}
.hi-ptitle{font-family:'Pretendard';font-weight:900;font-size:var(--fs-md);letter-spacing:-.01em;color:#111}

/* ===== 인트로 (전체 중앙정렬) ===== */
/* 세로도 화면 가운데에 오도록. 내용이 길어 화면을 넘치면 위에서부터 흐르게 둔다. */
#screen-intro{justify-content:center;min-height:calc(100vh - 62px)}
#intro-main{text-align:center;width:100%}
.hi-intro-lead{font-size:var(--fs-md);color:var(--charcoal);line-height:2.0;word-break:keep-all}
.hi-intro-lead b{color:#111;font-weight:800;box-shadow:inset 0 -8px 0 var(--lime-pale)}
.hi-ideo-caption{font-size:var(--fs-xs);font-weight:800;letter-spacing:.04em;color:var(--mute)}
/* 네 이념 — 2x2, 양옆 뚫린 박스(위아래 구분선만) */
.hi-ideo-table{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.hi-ideo-item{padding:18px 2px}
.hi-ideo-item:nth-child(n+3){border-top:1px solid var(--hairline)}
.hi-ideo-item .n{font-weight:900;font-size:var(--fs-md);color:#111;margin-bottom:10px}
.hi-ideo-item .d{font-size:var(--fs-sm);color:var(--charcoal);line-height:1.75;word-break:keep-all}

/* ===== 분류(한 문항씩) ===== */
.hi-progress-num{font-size:var(--fs-md);font-weight:800;color:var(--charcoal)}
.hi-progress-num b{color:#111}
/* 주제 바로가기 2x4 — 어드민 학생별 분류 칸(hi-stu-cell)과 같은 모양.
   번호 칩 + 주제 이름, 분류한 칸은 라임으로 채우고 지금 보는 칸은 검은 테두리로 표시. */
.hi-topics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hi-topic{display:flex;align-items:center;gap:7px;min-width:0;padding:9px 10px;border-radius:8px;
  background:#fff;border:1px solid var(--hairline-soft);font-family:inherit;cursor:pointer;
  text-align:left;transition:.12s}
.hi-topic .tn{flex-shrink:0;width:19px;height:19px;border-radius:5px;background:var(--cloud);color:var(--mute);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.hi-topic .tt{font-size:var(--fs-sm);font-weight:700;color:var(--charcoal);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-topic.on{background:var(--lime-pale);border-color:var(--lime-deep)}
.hi-topic.on .tn{background:var(--lime-deep);color:#111}
.hi-topic.on .tt{color:#111}
.hi-topic.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media(max-width:600px){.hi-topics{grid-template-columns:repeat(2,1fr)}}

/* ===== 분류 화면 높이 고정 =====
   문항마다 설명 길이가 달라서, 그냥 두면 이념 고르는 칸과 이전/다음 버튼이 문항을
   넘길 때마다 위아래로 튄다. 화면 전체를 한 화면 높이로 못 박고 그 안에서
   [머리말 · 주제 바로가기]—[설명(늘었다 줄었다)]—[이념 선택 · 버튼]으로 나눠,
   길이가 변하는 부분은 설명 영역 안에서만 스크롤되게 한다.
   → 이념 버튼과 이전/다음은 어떤 문항에서도 늘 같은 자리에 있다. */
#screen-sort{min-height:calc(100vh - 62px)}
@supports(min-height:100dvh){#screen-sort{min-height:calc(100dvh - 62px)}}
/* min-height는 0이 아니라 바닥값을 준다. 화면이 아주 낮을 때(가로로 눕힌 폰 등)
   이 칸이 0까지 눌려 설명이 통째로 사라지는 것을 막는다. */
#card-slot{flex:1;display:flex;min-height:280px}

/* 정책 카드 — 박스 없이 일반 텍스트로 그냥 깔기 (공용 theme.css .hi-card의 그림자·모서리·배경 무력화) */
.hi-card{background:transparent;padding:6px 2px 2px;box-shadow:none;border:none;border-radius:0;
  flex:1;display:flex;flex-direction:column;min-height:0}
/* 길이가 변하는 부분(배지, 제목, 설명)만 여기에 담아 넘치면 이 안에서 스크롤 */
.hi-card-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* 잘려 있다는 걸 알 수 있게 아래를 흐리게. 끝까지 내리면 없앤다. */
.hi-card-body.scrollable{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 24px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 24px),transparent)}
.hi-card-body.scrollable.at-end{-webkit-mask-image:none;mask-image:none}
.hi-card-badge{display:inline-block;font-size:var(--fs-sm);font-weight:800;padding:4px 13px;border-radius:9999px;margin-bottom:12px}
.hi-card-badge.in{background:#111;color:#fff}
.hi-card-badge.out{background:#fff;color:#111;box-shadow:inset 0 0 0 1.5px var(--ink)}
.hi-card-title{font-weight:900;font-size:var(--fs-lg);color:#111;line-height:1.3;margin-bottom:16px}
.hi-card-desc{font-size:var(--fs-md);color:var(--charcoal);line-height:1.9;word-break:keep-all}

.hi-card-foot{flex-shrink:0}
.hi-choose-label{font-size:var(--fs-md);font-weight:800;color:#111;margin-top:6px}
/* 고르는 네 이념 — 2x2, 양옆 뚫린 박스(위아래 구분선만), 선택 시 라임 채움 */
.hi-choices{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.hi-choice{border:none;border-radius:0;padding:17px 8px;font-family:inherit;font-size:var(--fs-lg);font-weight:800;color:#111;background:transparent;cursor:pointer;transition:.12s;min-height:58px;text-align:center;line-height:1.25;word-break:keep-all}
.hi-choice:nth-child(n+3){border-top:1px solid var(--hairline)}
.hi-choice:hover{color:var(--pos)}
.hi-choice.on{background:var(--lime)}

/* 다음 버튼이 잠겨 있는 이유를 알려 주는 줄. 예전에는 버튼이 그냥 죽어 있어서
   학생이 왜 안 눌리는지 알 수 없었다 — 특히 마지막 문항에서 앞 문항이 비어 있을 때. */
/* 비어 있어도 한 줄 자리를 차지하게 둔다(:empty로 숨기면 문항마다 버튼이 위아래로 튄다). */
.hi-navhint{margin-top:10px;text-align:center;font-size:var(--fs-sm);font-weight:600;color:var(--mute);line-height:1.7;min-height:1.7em}
.hi-nav{display:flex;gap:10px}
.hi-nav .hi-btn{flex:1}

/* ===== 토스트 =====
   이 앱은 theme.css의 프리셋 대신 자체 라임 프리셋을 쓰기 때문에, 공용 .hi-toast가
   참조하는 --hi-* 토큰이 :root의 어두운 테마 기본값(흰 배경)으로 잡힌다. 연한 라임색
   페이지 위에서는 흰 알약이 거의 안 보이므로 앱 색으로 맞춘다. 영문 대문자 변환과
   자간도 한글에는 안 맞아 되돌린다. */
.hi-toast,.hi-toast.error{background:var(--ink);color:#fff;font-size:var(--fs-sm);font-weight:700;
  letter-spacing:0;text-transform:none}

/* ===== 완료 화면 ===== */
#screen-done{align-items:center;justify-content:center;min-height:calc(100vh - 30px)}
.hi-done{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:460px;padding:40px 24px}
.hi-done-ic{width:88px;height:88px;border-radius:50%;background:var(--lime);color:#111;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.hi-done-title{font-family:'Pretendard';font-weight:900;font-size:var(--fs-lg);letter-spacing:-.01em;color:#111;margin-bottom:12px}
.hi-done-sub{font-size:var(--fs-md);color:var(--charcoal);line-height:1.7;margin-bottom:30px;word-break:keep-all}
</style>
  <script src="/hoistory/pwa.js"></script>
</head>
<body class="hi-preset-lime">
<div class="hi-wrap">

  <!-- 인트로 (첫 화면 · 교사 설명용) -->
  <div class="hi-screen active" id="screen-intro">
    <div id="login-gate" class="hi-gate" style="display:none">
      <div class="hi-gate-title">로그인이 필요해요</div>
      <div class="hi-gate-desc">LMS 허브에서 로그인 후 이 페이지에 접속해 주세요.</div>
    </div>
    <div id="intro-main">
      <header class="hi-apphead">
        <div class="hi-eyebrow">생각하고 활동하고 질문하는 역사 수업</div>
        <h1 class="hi-appttl">유교로 나라를 다스린다는 것</h1>
      </header>
      <p class="hi-intro-lead" id="intro-lead" style="margin:18px 0 0"></p>
      <!-- 도입 문구와 네 이념 사이를 확실히 띄운다 -->
      <div class="hi-ideo-caption" style="margin:38px 0 10px">네 가지 유교 이념</div>
      <div class="hi-ideo-table" id="intro-ideo"></div>
      <div style="margin-top:18px">
        <button class="hi-btn hi-btn-primary hi-btn-block" id="intro-start">분류 시작하기</button>
      </div>
    </div>
  </div>

  <!-- 정책 분류 (한 문항씩) -->
  <div class="hi-screen" id="screen-sort">
    <div class="hi-phead">
      <div class="hi-ptitle">정책 분류하기</div>
      <div class="hi-progress-num"><b id="prog-cur">1</b> / <span id="prog-total">8</span></div>
    </div>
    <!-- 주제 바로가기 — 구분선 바로 아래 2x4. 눌러서 아무 문항으로나 건너뛴다(수정·되돌아보기용).
         아래 이전/다음 버튼은 그대로 한 칸씩 움직인다. -->
    <div class="hi-topics" id="prog-topics"></div>
    <div id="card-slot"></div>
    <div class="hi-nav">
      <button class="hi-btn hi-btn-outline" id="nav-prev">이전</button>
      <button class="hi-btn hi-btn-primary" id="nav-next">다음</button>
    </div>
    <!-- 다음/분류 마치기가 왜 안 눌리는지 그 자리에서 알려 주는 줄 -->
    <div class="hi-navhint" id="nav-hint"></div>
  </div>

  <!-- 완료 -->
  <div class="hi-screen" id="screen-done">
    <div class="hi-done">
      <div class="hi-done-ic" data-icon="circle-check" data-icon-size="48"></div>
      <div class="hi-done-title">분류를 마쳤어요</div>
      <div class="hi-done-sub">이제 친구들이 어떻게 분류했는지<br>선생님 화면에서 함께 살펴봐요.</div>
      <button class="hi-btn hi-btn-outline hi-btn-block" id="done-again"><span data-icon="rotate-ccw" data-icon-size="18"></span>다시 분류하기</button>
    </div>
  </div>

</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import "../../shared/offline.js";
import { firebaseConfig } from "../../shared/firebase-config.js";
import { icon } from "../../shared/icons.js";
import { showToast } from "../../shared/toast.js";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* 네 가지 유교 이념 (관리자가 이름·설명을 덮어쓸 수 있음) */
const DEFAULT_IDEOLOGIES=[
  {key:'minbon', name:'민본',
   desc:'백성을 나라의 근본으로 여기는 생각이다. 정치의 목적은 백성을 편안하고 잘 살게 하는 데 있으며, 백성의 삶과 뜻을 정치의 기준으로 삼는다.'},
  {key:'deokchi', name:'덕치와 문치',
   desc:'힘이나 형벌이 아니라 통치자의 덕과 학문으로 다스린다는 생각이다. 무력으로 억누르기보다 학문을 닦고 도덕적 모범을 보여 사람을 이끈다.'},
  {key:'ye', name:'예와 명분',
   desc:'사람과 나라 사이에는 저마다 지켜야 할 도리와 지위에 맞는 명분이 있다는 생각이다. 임금과 신하 사이에도, 나라와 나라 사이에도 마땅한 예의와 질서를 지킨다.'},
  {key:'gyohwa', name:'교화',
   desc:'백성을 가르쳐 스스로 바르게 되도록 이끈다는 생각이다. 처벌로 다스리기보다 학교와 책, 모범을 통해 사람을 좋은 방향으로 변화시킨다.'}
];
/* 인트로 도입 문구 기본값 (관리자가 덮어쓸 수 있음) */
const DEFAULT_INTRO='조선은 <b>유교</b>를 나라를 다스리는 기준으로 삼았어요. 아래 네 가지 유교 이념의 뜻을 먼저 살펴보고, 조선 초기의 여러 정책이 어떤 이념을 담고 있는지 하나씩 분류해 봅시다. 정답은 없어요.';
/* 기본 카드 — 관리자가 settings/j_yugyo_config 로 덮어쓸 수 있음. side: in(나라 안)/out(나라 밖) */
const DEFAULT_CARDS=[
  {id:'c1', side:'in',  title:'과거제',
   desc:'유교 경전(사서오경) 이해도를 시험 쳐 관리를 뽑았다. 집안이나 무력이 아니라 학문으로 사람을 등용한 것이다.'},
  {id:'c2', side:'in',  title:'집현전과 경연',
   desc:'세종은 집현전에 학식 뛰어난 문신을 모아 학문을 연구하게 하고, 경연에서 왕이 신하와 경전을 강론하였다. 임금도 늘 공부해야 한다는 뜻이 담겼다.'},
  {id:'c3', side:'in',  title:'3사',
   desc:'사헌부, 사간원, 홍문관을 두어 왕과 대신의 잘못을 비판하고 바른말을 하게 하였다. 임금도 옳지 않으면 지적받아야 한다는 간쟁 정신이 담겼다.'},
  {id:'c4', side:'in',  title:'수령의 파견',
   desc:'모든 고을에 수령을 보내 백성을 직접 보살피게 하였다. 수령이 힘써야 할 일곱 가지에 농사, 교육, 치안 등이 담겼다.'},
  {id:'c5', side:'in',  title:'성균관과 향교',
   desc:'지방 군현마다 향교를, 수도에 성균관을 세워 유교를 가르쳤다. 백성과 양반 자제를 가르쳐 바르게 이끌려는 뜻이 담겼다.'},
  {id:'c6', side:'out', title:'사대',
   desc:'큰 나라 명을 예로써 섬기고(사대), 조공을 바치고 책봉을 받아 상하 질서를 지켰다. 힘이 아니라 도리로 국제 질서를 받아들인 것이다.'},
  {id:'c7', side:'out', title:'여진의 귀순 장려',
   desc:'여진 사람에게 관직과 토지를 주어 조선의 질서 안으로 받아들이고, 국경에 무역소를 두어 교역을 허락하였다. 힘으로 누르기보다 품어 교화하려는 교린의 뜻이 담겼다.'},
  {id:'c8', side:'out', title:'3포 개항',
   desc:'왜에게 부산포, 제포, 염포 세 항구를 열어 정해진 규칙 안에서 교역을 허락하였다(계해약조, 1443). 이웃을 도리로 대하는 교린 정책이었다.'}
];
let CARDS=DEFAULT_CARDS;
let IDEOLOGIES=DEFAULT_IDEOLOGIES;
let INTRO=DEFAULT_INTRO;
const SORT_COL='j_yugyo_sorts';

let student=null;
let placements={};
let mySort=null;
let saveTimer=null;
let curIdx=0;
let lastDrawnIdx=-1;   // 방금 그린 문항 번호. 같은 문항을 다시 그릴 때만 스크롤 위치를 유지한다.

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function classNumOf(sid){sid=String(sid||'');if(sid.length<3)return null;const c=parseInt(sid.slice(1,3),10);return isNaN(c)?null:c;}
function showScreen(id){document.querySelectorAll('.hi-screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}

function getStudent(){
  const sid=localStorage.getItem('lms_autosave_sid');
  const sname=localStorage.getItem('lms_autosave_sname');
  if(!sid||!sname||String(sid).length<5)return null;
  return{studentId:String(sid),name:sname,classNum:classNumOf(sid)};
}

async function init(){
  try{
    const snap=await getDoc(doc(db,'settings','j_yugyo_config'));
    if(snap.exists()){
      const d=snap.data();
      if(Array.isArray(d.cards)&&d.cards.length)CARDS=d.cards;
      if(Array.isArray(d.ideologies)&&d.ideologies.length)IDEOLOGIES=d.ideologies;
      if(typeof d.introText==='string'&&d.introText.trim())INTRO=d.introText;
    }
  }catch(e){}
  student=getStudent();
  if(student){
    await loadMine();
    renderIntro();
    showScreen('screen-intro');
  }else{
    document.getElementById('login-gate').style.display='flex';
    document.getElementById('intro-main').style.display='none';
  }
}
async function loadMine(){
  try{
    const sSnap=await getDoc(doc(db,SORT_COL,student.studentId));
    mySort=sSnap.exists()?sSnap.data():null;
    if(mySort&&mySort.placements)placements={...mySort.placements};
  }catch(e){}
}

/* ── 인트로 ── */
function renderIntro(){
  document.getElementById('intro-lead').innerHTML=INTRO;
  document.getElementById('intro-ideo').innerHTML=IDEOLOGIES.map(io=>
    `<div class="hi-ideo-item"><div class="n">${esc(io.name)}</div><div class="d">${esc(io.desc||'')}</div></div>`).join('');
}
document.getElementById('intro-start').addEventListener('click',()=>openSort(0));

/* ── 분류 (한 문항씩) ── */
function openSort(idx){
  curIdx=Math.max(0,Math.min(idx||0,CARDS.length-1));
  document.getElementById('prog-total').textContent=CARDS.length;
  // 화면을 먼저 띄우고 나서 그린다. 순서가 반대면 아직 display:none인 상태에서 높이를
  // 재게 되어 설명 영역이 늘 "넘쳤다"고 잡히고, 학생이 처음 보는 카드의 아래쪽이
  // 잠깐 흐리게 나온다.
  showScreen('screen-sort');
  renderCard();
}
/* 상단 주제 바로가기(2x4). 어드민 학생별 분류 카드(hi-stu-cell)와 같은 모양으로,
   번호 칩 + 주제 이름을 한 칸에 담는다. 분류를 마친 칸은 채워지고 지금 보는 칸은 테두리로 표시. */
function renderTopics(){
  const wrap=document.getElementById('prog-topics');
  wrap.innerHTML=CARDS.map((c,i)=>{
    const cls=(i===curIdx?' cur':'')+(placements[c.id]?' on':'');
    return`<button type="button" class="hi-topic${cls}" data-i="${i}" title="${esc(c.title)}">
      <span class="tn">${i+1}</span><span class="tt">${esc(c.title)}</span>
    </button>`;
  }).join('');
  wrap.querySelectorAll('.hi-topic').forEach(b=>
    b.addEventListener('click',()=>{curIdx=+b.dataset.i;renderCard();window.scrollTo(0,0);}));
}
function renderCard(){
  const c=CARDS[curIdx];if(!c)return;
  document.getElementById('prog-cur').textContent=curIdx+1;
  renderTopics();
  const sel=placements[c.id];
  // 이념을 고르면 같은 카드를 다시 그리는데, 그때 설명을 읽던 위치가 맨 위로 튀지 않게
  // 기억해 둔다. 다른 문항으로 넘어간 것이면 당연히 맨 위에서 시작한다.
  const keepTop=lastDrawnIdx===curIdx?(document.querySelector('#card-slot .hi-card-body')?.scrollTop||0):0;
  lastDrawnIdx=curIdx;
  document.getElementById('card-slot').innerHTML=`
    <div class="hi-card">
      <div class="hi-card-body">
        <span class="hi-card-badge ${c.side}">${c.side==='in'?'나라 안':'나라 밖'}</span>
        <div class="hi-card-title">${esc(c.title)}</div>
        <div class="hi-card-desc">${esc(c.desc||'')}</div>
      </div>
      <div class="hi-card-foot">
        <div class="hi-choose-label" style="margin:16px 0 10px">이 정책에 담긴 유교 이념은?</div>
        <div class="hi-choices">
          ${IDEOLOGIES.map(io=>`<button class="hi-choice${sel===io.key?' on':''}" data-ideo="${io.key}">${esc(io.name)}</button>`).join('')}
        </div>
      </div>
    </div>`;
  if(keepTop)document.querySelector('#card-slot .hi-card-body').scrollTop=keepTop;
  markCardOverflow();
  document.querySelectorAll('#card-slot .hi-choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      placements[c.id]=btn.dataset.ideo;
      renderCard();scheduleSave();
    });
  });
  // 내비게이션
  const prev=document.getElementById('nav-prev');
  const next=document.getElementById('nav-next');
  prev.textContent=curIdx===0?'인트로':'이전';
  const isLast=curIdx===CARDS.length-1;
  next.textContent=isLast?'분류 마치기':'다음';
  // 마지막 문항의 [분류 마치기]는 언제나 눌린다. 안 고른 정책이 남아 있으면 누른 순간
  // 토스트로 알리고 그 문항으로 데려간다(죽은 버튼은 왜 안 눌리는지 알기 어렵다).
  next.disabled=!isLast&&!placements[c.id];
  renderNavHint(c,isLast);
}

/* [다음]이 잠겼으면 왜 잠겼는지 그 자리에 적어 준다. 마지막 문항은 버튼이 잠기지 않고
   토스트로 알려 주므로 이 줄은 비워 둔다(자리는 CSS가 늘 한 줄 확보한다). */
function renderNavHint(c,isLast){
  const el=document.getElementById('nav-hint');
  if(!el)return;
  el.textContent=(!isLast&&!placements[c.id])?'이 정책에 담긴 이념을 고르면 넘어갈 수 있어요.':'';
}

/* 설명 영역이 화면을 넘쳐 잘렸는지 표시한다. 잘렸으면 아래를 흐리게 해서 더 있다는 걸
   알리고, 끝까지 내리면 원래대로 돌린다. 화면이 커지거나 글꼴이 늦게 붙어 높이가
   달라지는 경우까지 ResizeObserver가 덮는다. */
function markCardOverflow(){
  const el=document.querySelector('#card-slot .hi-card-body');
  if(!el)return;
  const sync=()=>{
    el.classList.toggle('scrollable',el.scrollHeight>el.clientHeight+2);
    el.classList.toggle('at-end',el.scrollTop+el.clientHeight>=el.scrollHeight-2);
  };
  el.addEventListener('scroll',sync);
  if('ResizeObserver' in window)new ResizeObserver(sync).observe(el);
  sync();
}
document.getElementById('nav-prev').addEventListener('click',()=>{
  if(curIdx===0){showScreen('screen-intro');return;}
  curIdx--;renderCard();
});
document.getElementById('nav-next').addEventListener('click',async()=>{
  if(curIdx<CARDS.length-1){curIdx++;renderCard();return;}
  // 마지막 → 제출. 아직 안 고른 정책이 있으면 알리고, 그중 첫 문항으로 데려간다.
  const missing=CARDS.map((cc,i)=>placements[cc.id]?-1:i).filter(i=>i>=0);
  if(missing.length){
    showToast('나머지 '+missing.length+'개를 분류하세요');
    curIdx=missing[0];renderCard();window.scrollTo(0,0);
    return;
  }
  const btn=document.getElementById('nav-next');
  btn.disabled=true;btn.textContent='저장 중…';
  try{
    await setDoc(doc(db,SORT_COL,student.studentId),{
      studentId:student.studentId,name:student.name,classNum:student.classNum,
      placements,submitted:true,submittedAt:serverTimestamp()
    },{merge:true});
    mySort={...(mySort||{}),placements:{...placements},submitted:true};
    showScreen('screen-done');
  }catch(e){alert('저장 오류: '+e.message);}
  finally{btn.disabled=false;btn.textContent='분류 마치기';}
});
document.getElementById('done-again').addEventListener('click',()=>openSort(0));

function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveSortLive,300);}
async function saveSortLive(){
  if(!student)return;
  try{
    await setDoc(doc(db,SORT_COL,student.studentId),{
      studentId:student.studentId,name:student.name,classNum:student.classNum,
      placements,updatedAt:serverTimestamp()
    },{merge:true});
    mySort={...(mySort||{}),placements:{...placements}};
  }catch(e){}
}

document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,el.dataset.iconSize?+el.dataset.iconSize:24));
init();
</script>
</body>
</html>
