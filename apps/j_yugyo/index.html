<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>유교로 나라를 다스린다는 것</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
/* ===== Nike 디자인 시스템: 흑/백/soft-cloud, 필 CTA, 플랫 카드, 하이라인 ===== */
.hi-preset-paper{
  --ink:#111; --canvas:#fff; --cloud:#f5f5f5; --hairline:#cacacb; --hairline-soft:#e5e5e5;
  --charcoal:#39393b; --mute:#707072; --stone:#9e9ea0;
  --hi-bg-base:#fff; --hi-bg-surface:#fff; --hi-bg-mid:#f5f5f5; --hi-bg-card:#f5f5f5;
  --hi-text:#111; --hi-text-soft:#39393b; --hi-text-muted:#707072;
  --hi-border:#cacacb; --hi-border-light:#e5e5e5; --hi-border-faint:#e5e5e5;
  --hi-accent:#111; --hi-accent-strong:#111; --hi-accent-soft:#f5f5f5; --hi-on-accent:#fff;
  --hi-positive:#007d48; --hi-negative:#d30005;
  --hi-font:'Pretendard',sans-serif;
  /* 색은 대내(나라 안)/대외(나라 밖) 구분에만 쓴다. 이념은 색 없이 이름으로 구분. */
  --hi-side-in:#111; --hi-side-out:#707072;
  background:#fff;color:#111;font-family:'Pretendard',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:#111;min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:44px}
input,textarea,select{font-size:16px}
.hi-wrap{max-width:760px;margin:0 auto;padding:0 16px}

.hi-screen{display:none;flex-direction:column;gap:16px;padding-top:18px}
.hi-screen.active{display:flex}

/* 버튼 → 필(pill) + tap-collapse */
.hi-btn{font-family:'Pretendard',sans-serif;font-weight:600;font-size:17px;line-height:1.5;border:none;border-radius:9999px;padding:16px 34px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .1s ease,opacity .1s ease}
.hi-btn:active{transform:scale(.97);opacity:.65}
.hi-btn:disabled{opacity:.35;cursor:not-allowed}
.hi-btn-primary{background:#111;color:#fff}
.hi-btn-outline{background:#f5f5f5;color:#111}
.hi-btn-block{width:100%}

/* ===== 표지 = 검은 박스 + 흰 글씨, 중앙 정렬 (儒 도장 없음) ===== */
#screen-cover{align-items:center;justify-content:center;min-height:calc(100vh - 30px);padding:16px 0}
.hi-cover{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:480px;background:#111;color:#fff;border-radius:28px;padding:54px 30px;box-shadow:0 24px 60px rgba(0,0,0,.22)}
.hi-cover-eyebrow{color:#fff;opacity:.7;font-size:13.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.hi-cover-title{font-family:'Pretendard';font-weight:900;font-size:44px;line-height:1.06;letter-spacing:-.02em;color:#fff;margin-bottom:20px}
.hi-cover-sub{color:#e5e5e5;font-size:17px;line-height:1.7;margin-bottom:30px;word-break:keep-all}
.hi-chip{display:inline-flex;background:rgba(255,255,255,.14);color:#fff;border-radius:9999px;padding:8px 18px;font-size:14px;font-weight:700;margin-bottom:22px}
.hi-cover-no-login{background:rgba(255,255,255,.1);color:#e5e5e5;border-radius:14px;padding:16px 20px;font-size:14.5px;line-height:1.6}
#screen-cover .hi-btn-primary{background:#fff;color:#111}

/* ===== 페이지 헤더 ===== */
.hi-phead{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #cacacb;padding-bottom:14px}
.hi-ptitle{font-family:'Pretendard';font-weight:900;font-size:25px;letter-spacing:-.01em;color:#111}
.hi-back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;font-family:inherit;font-size:15px;font-weight:700;color:#707072;cursor:pointer;padding:8px 0;min-height:44px}
.hi-back svg{width:17px;height:17px}

/* 안내 문구 */
.hi-hint{font-size:15.5px;color:#39393b;line-height:1.7;background:#f5f5f5;border-radius:14px;padding:15px 17px;word-break:keep-all}
.hi-hint b{color:#111;font-weight:700}

/* ===== 이념 설명 표 — 좌우가 트인 느낌(세로 테두리 없이 가로줄만) ===== */
.hi-ideo-caption{font-size:13px;font-weight:800;letter-spacing:.02em;color:#707072;text-transform:uppercase}
.hi-ideo-table{width:100%;border-collapse:collapse}
.hi-ideo-table td{padding:14px 2px;border-top:1px solid #cacacb;vertical-align:top}
.hi-ideo-table tr:last-child td{border-bottom:1px solid #cacacb}
.hi-ideo-table .name{font-family:'Pretendard';font-weight:900;font-size:17px;color:#111;white-space:nowrap;padding-right:18px;width:1%}
.hi-ideo-table .desc{font-size:15px;color:#39393b;line-height:1.65;word-break:keep-all}

/* ===== 분류 ===== */
.hi-sortbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:#fff;padding:10px 0;z-index:5;box-shadow:inset 0 -1px 0 #e5e5e5}
.hi-sortbar-l{font-size:15px;font-weight:800;color:#39393b}
.hi-live{font-size:13px;color:#007d48;font-weight:700;min-height:16px;display:inline-flex;align-items:center;gap:4px}
.hi-live svg{width:14px;height:14px}
.hi-cardlist{display:flex;flex-direction:column;gap:0}
.hi-qcard{background:#fff;border:none;border-bottom:1px solid #cacacb;padding:20px 2px}
.hi-qcard-title{font-weight:800;font-size:19px;color:#111;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hi-qcard-num{font-weight:900}
.hi-qcard-badge{font-size:12.5px;font-weight:700;padding:3px 12px;border-radius:9999px;flex-shrink:0}
.hi-qcard-badge.in{background:#111;color:#fff}
.hi-qcard-badge.out{background:#fff;color:#111;box-shadow:inset 0 0 0 1px #cacacb}
.hi-qcard-done{margin-left:auto;color:#007d48;display:none}
.hi-qcard.done .hi-qcard-done{display:inline-flex}
.hi-qcard-desc{font-size:15.5px;color:#39393b;margin:9px 0 12px;line-height:1.65;word-break:keep-all}
.hi-qcard-src{background:#f5f5f5;border-radius:10px;padding:11px 13px;margin:0 0 14px;font-size:13.5px;color:#39393b;line-height:1.65;word-break:keep-all}
.hi-src-label{display:inline-block;font-size:11.5px;font-weight:800;color:#111;letter-spacing:.05em;text-transform:uppercase;margin-right:6px}
.hi-src-ref{display:block;margin-top:5px;font-size:12.5px;color:#707072;font-weight:600}
.hi-choose-label{font-size:13.5px;font-weight:700;color:#707072;margin-bottom:9px}
/* 이념 버튼 — 가로 1열 */
.hi-choices{display:flex;gap:8px}
.hi-choice{flex:1;min-width:0;border:1px solid #cacacb;border-radius:9999px;padding:13px 6px;font-family:inherit;font-size:15px;font-weight:700;color:#111;background:#fff;cursor:pointer;transition:.12s;min-height:52px;text-align:center;line-height:1.25;word-break:keep-all}
.hi-choice:hover{border-color:#111}
.hi-choice.on{background:#111;border-color:#111;color:#fff}
.hi-sort-submit-wrap{position:sticky;bottom:10px;padding-top:8px}

/* ===== 완료 화면 ===== */
#screen-done{align-items:center;justify-content:center;min-height:calc(100vh - 30px)}
.hi-done{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:460px;padding:40px 24px}
.hi-done-ic{color:#007d48;margin-bottom:20px}
.hi-done-title{font-family:'Pretendard';font-weight:900;font-size:30px;letter-spacing:-.01em;color:#111;margin-bottom:14px}
.hi-done-sub{font-size:18px;color:#39393b;line-height:1.7;margin-bottom:32px;word-break:keep-all}
</style>
</head>
<body class="hi-preset-paper">
<div class="hi-wrap">

  <!-- 표지 -->
  <div class="hi-screen active" id="screen-cover">
    <div class="hi-cover">
      <div class="hi-cover-eyebrow">생각하고 활동하고 질문하는 역사 수업</div>
      <div class="hi-cover-title">유교로 나라를<br>다스린다는 것</div>
      <div class="hi-cover-sub">조선의 여러 정책에는 어떤 유교 이념이 담겨 있을까요?<br>정책 카드를 네 가지 이념으로 분류해 봅시다.</div>
      <div id="cover-chip" class="hi-chip" style="display:none"></div>
      <div id="cover-no-login" class="hi-cover-no-login" style="display:none">LMS 허브에서 로그인 후 이 페이지에 접속해 주세요.</div>
      <button class="hi-btn hi-btn-primary" id="cover-start-btn" style="display:none">입장하기</button>
    </div>
  </div>

  <!-- 정책 분류하기 -->
  <div class="hi-screen" id="screen-sort">
    <div class="hi-phead">
      <div class="hi-ptitle">정책 분류하기</div>
      <button class="hi-back" id="sort-reset"><span data-icon="rotate-ccw" data-icon-size="17"></span>다시 하기</button>
    </div>
    <div class="hi-hint" id="sort-guide"></div>
    <div>
      <div class="hi-ideo-caption" style="margin-bottom:6px">네 가지 유교 이념</div>
      <table class="hi-ideo-table"><tbody id="ideo-table"></tbody></table>
    </div>
    <div class="hi-sortbar">
      <div class="hi-sortbar-l" id="sort-count"></div>
      <div class="hi-live" id="sort-live"></div>
    </div>
    <div class="hi-cardlist" id="sort-list"></div>
    <div class="hi-sort-submit-wrap">
      <button class="hi-btn hi-btn-primary hi-btn-block" id="sort-submit">분류 마치기</button>
    </div>
  </div>

  <!-- 완료 -->
  <div class="hi-screen" id="screen-done">
    <div class="hi-done">
      <div class="hi-done-ic" data-icon="circle-check" data-icon-size="56"></div>
      <div class="hi-done-title">분류가 다 되었습니다</div>
      <div class="hi-done-sub">친구들이 어떻게 분류했는지<br>같이 확인해 볼까요?</div>
      <button class="hi-btn hi-btn-outline hi-btn-block" id="done-again"><span data-icon="rotate-ccw" data-icon-size="18"></span>다시 분류하기</button>
    </div>
  </div>

</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import "../../shared/offline.js";
import { firebaseConfig } from "../../shared/firebase-config.js";
import { icon } from "../../shared/icons.js";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* 네 가지 유교 이념 (관리자가 이름·설명을 덮어쓸 수 있음) */
const DEFAULT_IDEOLOGIES=[
  {key:'minbon', name:'민본',
   desc:'백성을 나라의 근본으로 여기는 생각이다. 정치의 목적은 백성을 편안하고 잘 살게 하는 데 있으며, 백성의 삶과 뜻을 정치의 기준으로 삼는다.'},
  {key:'deokchi', name:'덕치와 문치',
   desc:'힘이나 형벌이 아니라 통치자의 덕과 학문으로 다스린다는 생각이다. 무력으로 억누르기보다 학문을 닦고 도덕적 모범을 보여 사람을 이끈다.'},
  {key:'ye', name:'예와 명분',
   desc:'사람과 나라 사이에는 저마다 지켜야 할 도리와 지위에 맞는 명분이 있다는 생각이다. 임금과 신하 사이에도, 나라와 나라 사이에도 마땅한 예의와 질서를 지킨다.'},
  {key:'gyohwa', name:'교화',
   desc:'백성을 가르쳐 스스로 바르게 되도록 이끈다는 생각이다. 처벌로 다스리기보다 학교와 책, 모범을 통해 사람을 좋은 방향으로 변화시킨다.'}
];
/* 안내 문구 기본값 (관리자가 덮어쓸 수 있음) */
const DEFAULT_GUIDE='각 정책 카드를 읽고, 그 정책에 담긴 유교 이념을 아래 <b>네 버튼 중 하나</b>를 눌러 골라 보세요. 아래 표에서 네 이념의 뜻을 확인할 수 있어요. 정답은 없습니다.';
/* 기본 카드 — 관리자가 settings/j_yugyo_config 로 덮어쓸 수 있음. side: in(나라 안)/out(나라 밖) */
const DEFAULT_CARDS=[
  {id:'c1', side:'in',  title:'과거제',
   desc:'유교 경전(사서오경) 이해도를 시험 쳐 관리를 뽑았다. 집안이나 무력이 아니라 학문으로 사람을 등용한 것이다.'},
  {id:'c2', side:'in',  title:'집현전과 경연',
   desc:'세종은 집현전에 학식 뛰어난 문신을 모아 학문을 연구하게 하고, 경연에서 왕이 신하와 경전을 강론하였다. 임금도 늘 공부해야 한다는 뜻이 담겼다.'},
  {id:'c3', side:'in',  title:'3사',
   desc:'사헌부, 사간원, 홍문관을 두어 왕과 대신의 잘못을 비판하고 바른말을 하게 하였다. 임금도 옳지 않으면 지적받아야 한다는 간쟁 정신이 담겼다.'},
  {id:'c4', side:'in',  title:'수령의 파견',
   desc:'모든 고을에 수령을 보내 백성을 직접 보살피게 하였다. 수령이 힘써야 할 일곱 가지에 농사, 교육, 치안 등이 담겼다.',
   src:'수령칠사(守令七事): 농사, 교육, 재판, 치안, 군정, 호구, 부역.',
   ref:'『경국대전』 이전 고과'},
  {id:'c5', side:'in',  title:'성균관과 향교',
   desc:'지방 군현마다 향교를, 수도에 성균관을 세워 유교를 가르쳤다. 백성과 양반 자제를 가르쳐 바르게 이끌려는 뜻이 담겼다.'},
  {id:'c6', side:'out', title:'사대',
   desc:'큰 나라 명을 예로써 섬기고(사대), 조공을 바치고 책봉을 받아 상하 질서를 지켰다. 힘이 아니라 도리로 국제 질서를 받아들인 것이다.'},
  {id:'c7', side:'out', title:'여진의 귀순 장려',
   desc:'여진 사람에게 관직과 토지를 주어 조선의 질서 안으로 받아들이고, 국경에 무역소를 두어 교역을 허락하였다. 힘으로 누르기보다 품어 교화하려는 교린의 뜻이 담겼다.'},
  {id:'c8', side:'out', title:'3포 개항',
   desc:'왜에게 부산포, 제포, 염포 세 항구를 열어 정해진 규칙 안에서 교역을 허락하였다(계해약조, 1443). 이웃을 도리로 대하는 교린 정책이었다.'}
];
let CARDS=DEFAULT_CARDS;
let IDEOLOGIES=DEFAULT_IDEOLOGIES;
let GUIDE=DEFAULT_GUIDE;
const SORT_COL='j_yugyo_sorts';

let student=null;
let placements={};
let mySort=null;
let saveTimer=null;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function classNumOf(sid){sid=String(sid||'');if(sid.length<3)return null;const c=parseInt(sid.slice(1,3),10);return isNaN(c)?null:c;}
function showScreen(id){document.querySelectorAll('.hi-screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}

function getStudent(){
  const sid=localStorage.getItem('lms_autosave_sid');
  const sname=localStorage.getItem('lms_autosave_sname');
  if(!sid||!sname||String(sid).length<5)return null;
  return{studentId:String(sid),name:sname,classNum:classNumOf(sid)};
}

async function init(){
  try{
    const snap=await getDoc(doc(db,'settings','j_yugyo_config'));
    if(snap.exists()){
      const d=snap.data();
      if(Array.isArray(d.cards)&&d.cards.length)CARDS=d.cards;
      if(Array.isArray(d.ideologies)&&d.ideologies.length)IDEOLOGIES=d.ideologies;
      if(typeof d.sortGuide==='string'&&d.sortGuide.trim())GUIDE=d.sortGuide;
    }
  }catch(e){}
  student=getStudent();
  if(student){
    document.getElementById('cover-chip').textContent=`${student.studentId} ${student.name}`;
    document.getElementById('cover-chip').style.display='inline-flex';
    document.getElementById('cover-start-btn').style.display='inline-flex';
    await loadMine();
  }else{
    document.getElementById('cover-no-login').style.display='block';
  }
}
async function loadMine(){
  try{
    const sSnap=await getDoc(doc(db,SORT_COL,student.studentId));
    mySort=sSnap.exists()?sSnap.data():null;
    if(mySort&&mySort.placements)placements={...mySort.placements};
  }catch(e){}
}

document.getElementById('cover-start-btn').addEventListener('click',openSort);
document.getElementById('done-again').addEventListener('click',openSort);
document.getElementById('sort-reset').addEventListener('click',()=>{
  placements={};renderSort();scheduleSave();
});

/* ── 정책 분류 (카드마다 이념 버튼, 누르는 즉시 저장) ── */
function openSort(){
  document.getElementById('sort-guide').innerHTML=GUIDE;
  renderIdeoTable();
  renderSort();
  showScreen('screen-sort');
}
function renderIdeoTable(){
  document.getElementById('ideo-table').innerHTML=IDEOLOGIES.map(io=>
    `<tr><td class="name">${esc(io.name)}</td><td class="desc">${esc(io.desc||'')}</td></tr>`).join('');
}
function scheduleSave(){
  clearTimeout(saveTimer);
  document.getElementById('sort-live').textContent='';
  saveTimer=setTimeout(saveSortLive,300);
}
async function saveSortLive(){
  if(!student)return;
  try{
    await setDoc(doc(db,SORT_COL,student.studentId),{
      studentId:student.studentId,name:student.name,classNum:student.classNum,
      placements,updatedAt:serverTimestamp()
    },{merge:true});
    mySort={...(mySort||{}),placements:{...placements}};
    const live=document.getElementById('sort-live');
    if(live)live.innerHTML=icon('check',14)+' 저장됨';
  }catch(e){}
}
function renderSort(){
  document.getElementById('sort-list').innerHTML=CARDS.map((c,i)=>{
    const sel=placements[c.id];
    return`<div class="hi-qcard${sel?' done':''}" data-card="${c.id}">
      <div class="hi-qcard-title">
        <span class="hi-qcard-num">${i+1}.</span>
        <span>${esc(c.title)}</span>
        <span class="hi-qcard-badge ${c.side}">${c.side==='in'?'나라 안':'나라 밖'}</span>
        <span class="hi-qcard-done">${icon('check',20)}</span>
      </div>
      <div class="hi-qcard-desc">${esc(c.desc||'')}</div>
      ${c.src?`<div class="hi-qcard-src"><span class="hi-src-label">참고 원문</span>${esc(c.src)}${c.ref?`<span class="hi-src-ref">— ${esc(c.ref)}</span>`:''}</div>`:''}
      <div class="hi-choose-label">이 정책에 담긴 유교 이념은?</div>
      <div class="hi-choices">
        ${IDEOLOGIES.map(io=>`<button class="hi-choice${sel===io.key?' on':''}" data-ideo="${io.key}">${esc(io.name)}</button>`).join('')}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('#sort-list .hi-choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const card=btn.closest('.hi-qcard').dataset.card;
      placements[card]=btn.dataset.ideo;
      renderSort();scheduleSave();
    });
  });
  const placedN=CARDS.filter(c=>placements[c.id]).length;
  document.getElementById('sort-count').textContent=`분류함 ${placedN} / ${CARDS.length}`;
  document.getElementById('sort-submit').disabled=placedN<CARDS.length;
}
document.getElementById('sort-submit').addEventListener('click',async()=>{
  const btn=document.getElementById('sort-submit');
  btn.disabled=true;btn.textContent='저장 중…';
  try{
    await setDoc(doc(db,SORT_COL,student.studentId),{
      studentId:student.studentId,name:student.name,classNum:student.classNum,
      placements,submitted:true,submittedAt:serverTimestamp()
    },{merge:true});
    mySort={...(mySort||{}),placements:{...placements},submitted:true};
    showScreen('screen-done');
  }catch(e){alert('저장 오류: '+e.message);}
  finally{btn.disabled=false;btn.textContent='분류 마치기';}
});

document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,el.dataset.iconSize?+el.dataset.iconSize:24));
init();
</script>
</body>
</html>
