<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전란의 도미노 - 관리자 모드</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<link rel="stylesheet" href="../../shared/admin-base.css">
<script>if(window.self!==window.top){document.documentElement.classList.add('in-iframe');document.documentElement.classList.add('has-own-back');}</script>
<style>
/* 앱 어드민끼리 톤을 맞춘다 — j_interview의 --iv-* 와 같은 값이다(오렌지 주 + 네이비 보조).
   예전에는 이 앱만 네이비+금색이라 lms 안에서 열면 혼자 다른 프로그램처럼 보였다.
   shared/admin-base.css의 --hi-accent*가 이미 오렌지라 덮어쓸 필요가 없고, 여기서는
   이 앱이 쓰는 --jw-* 만 같은 톤으로 정의한다. */
:root{
  --jw-primary:#FF6B3D;--jw-primary-soft:rgba(255,107,61,.12);--jw-primary-deep:#E24E1B;
  --jw-accent:#27384F;--jw-accent-deep:#172554;--jw-accent-l:rgba(39,56,79,.12);
  --jw-pass:#22c55e;--jw-pass-l:rgba(34,197,94,.12);
  --jw-fail:var(--hi-negative);--jw-fail-l:rgba(243,114,127,.1);
}
.section-card{background:var(--hi-bg-surface);border-radius:14px;padding:22px;margin-bottom:16px;border:1px solid var(--hi-border)}
.section-title{font-weight:700;font-size:var(--adm-title);color:var(--hi-text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-desc{font-size:12px;color:var(--hi-text-muted);line-height:1.6;margin-bottom:14px}

.btn{padding:9px 18px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--jw-primary);color:#fff}.btn-primary:hover{background:var(--jw-primary-deep)}
.btn-accent{background:var(--jw-accent-l);color:var(--jw-accent-deep);border:1.5px solid rgba(39,56,79,.3)}.btn-accent:hover{background:rgba(39,56,79,.22)}
.btn-ghost{background:none;border:1.5px solid var(--hi-border);color:var(--hi-text-muted)}.btn-ghost:hover{border-color:var(--hi-border-light);color:var(--hi-text)}
.btn-danger{background:var(--jw-fail-l);color:var(--jw-fail);border:1.5px solid rgba(243,114,127,.2)}.btn-danger:hover{background:rgba(243,114,127,.16)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:7px}

/* 사건 편집 */
.phase-group{margin-bottom:16px}
.phase-head{font-size:12px;font-weight:800;color:var(--jw-accent-deep);margin-bottom:8px;letter-spacing:.02em}
.ev-row{display:flex;gap:8px;align-items:center;background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.ev-ord{flex-shrink:0;width:24px;height:24px;border-radius:6px;background:var(--jw-primary-soft);color:var(--jw-primary);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.meta-input{padding:7px 9px;border:1px solid var(--hi-border);border-radius:7px;font-family:inherit;font-size:14px;color:var(--hi-text);background:var(--hi-bg-mid);outline:none}
.meta-input:focus{border-color:var(--hi-border-light)}
.ev-title{flex:1;min-width:0}
.ev-phase{flex-shrink:0}
.ev-ctrl{display:flex;gap:3px;flex-shrink:0}
.icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--hi-border);background:var(--hi-bg-mid);cursor:pointer;font-size:14px;color:var(--hi-text-muted);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--hi-text);border-color:var(--hi-border-light)}

/* 도미노 넘기기 문제 편집 */
.causal-row{display:flex;gap:8px;align-items:center;background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:10px;padding:8px 10px;margin-bottom:6px;flex-wrap:wrap}
.causal-lbl{font-size:12px;font-weight:800;color:var(--hi-text-muted)}
.causal-sel{flex:1;min-width:130px;padding:7px 9px;border:1px solid var(--hi-border);border-radius:7px;font-family:inherit;font-size:14px;color:var(--hi-text);background:var(--hi-bg-mid);outline:none}

.save-msg{text-align:center;font-size:12px;color:var(--hi-text-muted);min-height:16px;margin-top:10px}
.save-msg.ok{color:var(--jw-pass);font-weight:700}

/* ── ANSWER 머리줄 (j_interview와 같은 구성) ──
   반 태그와 통계 칩을 한 줄에 둔다. 폭이 모자라면 반 태그 묶음 안에서만 옆으로 밀어
   보게 하고(스크롤바는 숨김) 통계 칩은 같은 줄에 남긴다. */
.ans-head{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;margin-bottom:16px}
.ans-head .class-filter,.ans-head .stats-row{margin-bottom:0}
.ans-head .class-filter{flex:0 1 auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.ans-head .class-filter::-webkit-scrollbar{display:none}
.ans-head .class-filter .cf-btn{flex:0 0 auto}
.ans-head .stats-row{flex:0 0 auto;flex-wrap:nowrap}
@media(max-width:640px){.ans-head{flex-wrap:wrap}}
.stats-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:16px}
/* 반을 '전체'로 바꾸면 숫자가 한 자리에서 세 자리까지 늘어난다. 그때마다 칩 폭이 달라지면
   줄이 밀려 두 줄이 되므로, 숫자마다 세 자리분 폭을 미리 잡아 둔다. */
.stat-chip{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:12px;padding:10px 16px;font-size:14px;color:var(--hi-text-muted);min-width:80px;text-align:center;white-space:nowrap;flex-shrink:0}
.stat-combo .thc-o,.stat-combo .thc-g,.stat-combo .thc-r,.thc-avg{display:inline-block;min-width:2.6ch;text-align:center;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.stat-combo{display:inline-flex;align-items:baseline;justify-content:center;gap:6px}
.stat-combo .thc-o{font-size:18px;font-weight:800;color:var(--jw-primary)}
.stat-combo .thc-g{font-size:18px;font-weight:800;color:#0E9F6E}
.stat-combo .thc-r{font-size:18px;font-weight:800;color:#DC2626}
.stat-combo .thc-sep{font-size:16px;font-weight:700;color:var(--hi-border)}
.stat-avg{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.stat-avg .thc-avg{font-size:18px;font-weight:800;color:var(--hi-text);min-width:4ch}

/* 버튼 줄도 한 줄로. 문구가 길어져도 아래로 접히지 않게 하고, 정말 좁으면 옆으로 민다. */
.adm-action-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.adm-action-row::-webkit-scrollbar{display:none}
.adm-action-row>*,.ans-right-group>*{flex-shrink:0}
.adm-action-row .btn,.adm-action-row .sort-btn{white-space:nowrap}
.ans-right-group{display:flex;align-items:center;gap:8px;margin-left:auto}
.adm-action-row .ans-right-group .sort-box{margin-left:0}

/* ── 카드 상단 바 ── [학번·이름] [제출 시각 · 점수 · 상태] 를 한 줄에 */
.std-who{flex-shrink:0;display:flex;align-items:baseline;gap:6px}
.std-who .std-sid{font-size:11px;font-weight:700;color:var(--hi-text-muted);letter-spacing:.3px}
.std-who .std-name{font-size:14px;font-weight:700;color:var(--hi-text);white-space:nowrap}
.std-status{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.std-meta-time{font-size:11px;color:var(--hi-text-muted)}
.std-status .status-badge,.std-status .score-pill{display:inline-block;flex-shrink:0;white-space:nowrap;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;line-height:1.5}
.thr-box{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hi-text-muted);font-weight:700}
.thr-in{width:56px;padding:6px 8px;border:1px solid var(--hi-border);border-radius:7px;font-family:inherit;font-size:14px;background:var(--hi-bg-mid);color:var(--hi-text);text-align:center}

/* 학생 카드 */
.status-badge{flex-shrink:0;padding:4px 10px;border-radius:7px;font-size:12px;font-weight:800}
.sb-pending{background:var(--hi-bg-mid);color:var(--hi-text-muted);border:1px solid var(--hi-border)}
.sb-pass{background:var(--jw-pass-l);color:var(--jw-pass)}
.sb-fail{background:var(--jw-fail-l);color:var(--jw-fail)}
.score-pill{flex-shrink:0;padding:3px 9px;border-radius:6px;background:var(--jw-primary-soft);color:var(--jw-primary);font-size:12px;font-weight:800}
.ssb{padding:6px 16px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;border:1.5px solid transparent;cursor:pointer}
.ssb-pass{background:var(--jw-pass-l);color:var(--jw-pass);border-color:rgba(22,163,74,.2)}.ssb-pass.active,.ssb-pass:hover{background:var(--jw-pass);color:#fff}
.ssb-fail{background:var(--jw-fail-l);color:var(--jw-fail);border-color:rgba(220,38,38,.2)}.ssb-fail.active,.ssb-fail:hover{background:var(--jw-fail);color:#fff}
.cb-block{margin-bottom:14px}
.cb-h{font-size:12px;font-weight:800;color:var(--jw-accent-deep);margin-bottom:6px}
.cb-mini{font-size:12px;color:var(--hi-text-muted);margin-bottom:8px}
.chain-line{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:8px;flex-wrap:wrap;background:var(--hi-bg-mid);padding:8px 10px;border-radius:8px}
.chain-line .ok{color:var(--jw-pass);font-weight:800}
.chain-line .no{color:var(--jw-fail);font-weight:800}
.q-no{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--jw-accent-l);color:var(--jw-accent-deep);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.chain-cause{font-weight:700}
.chain-eff{font-weight:700;color:var(--jw-primary)}
.chain-reason{width:100%;font-size:12px;color:var(--hi-text);line-height:1.55;margin-top:4px;padding-left:2px}
.chain-reason .rs-none{color:var(--jw-fail);font-weight:700}
.tl-mini{font-size:12px;color:var(--hi-text-muted);line-height:1.7;background:var(--hi-bg-mid);padding:10px 12px;border-radius:8px}
.tl-mini .ok{color:var(--jw-pass);font-weight:700}.tl-mini .no{color:var(--jw-fail);font-weight:700}

.no-data{text-align:center;padding:40px 20px;color:var(--hi-text-muted);font-size:14px}

/* ── 세우기 히트맵 ──
   가로는 정답 자리 15개, 세로는 학생이다. 칸에는 글자를 넣지 않고 색만 쓴다 — 무엇을 적었는지는
   마우스를 올리면 뜬다. 이 표의 본체는 맨 아랫줄의 '자리별 정답률'이다. 학생 카드를 하나씩
   열어 보는 방식으로는 반 전체가 어느 자리에서 무너졌는지가 끝내 보이지 않았다. */
.heat-class{margin-bottom:24px}
.heat-tbl{margin:0 auto}
.heat-class-head{justify-content:center}
.heat-class-head{font-size:13px;font-weight:800;color:var(--jw-accent-deep);margin-bottom:8px;display:flex;align-items:baseline;gap:8px}
.heat-class-head .hc-sub{font-size:11px;font-weight:600;color:var(--hi-text-muted)}
.heat-scroll{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;border:1px solid var(--hi-border);border-radius:12px;background:var(--hi-bg-surface);padding:10px 12px}
.heat-scroll::-webkit-scrollbar{display:none}
.heat-tbl{border-collapse:separate;border-spacing:0;font-size:11px;white-space:nowrap}
.heat-tbl th,.heat-tbl td{padding:0;text-align:center;vertical-align:middle;font-weight:700}

/* 이름 칸은 가로로 스크롤해도 따라온다 — 15칸을 훑는 동안 누구 줄인지 놓치면 표가 쓸모없어진다. */
.heat-name{position:sticky;left:0;z-index:2;background:var(--hi-bg-surface);text-align:left;padding:0 12px 0 2px;min-width:132px}
.heat-name .hn-in{display:flex;align-items:center;gap:6px;height:24px}
.heat-name .hn-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--hi-border)}
.heat-name .hn-dot.pass{background:var(--jw-pass)}
.heat-name .hn-dot.fail{background:var(--jw-fail)}
.heat-name .hn-sid{font-size:10px;color:var(--hi-text-muted);letter-spacing:.2px}
.heat-name .hn-nm{font-size:12px;color:var(--hi-text)}
.heat-name.clickable .hn-in{cursor:pointer}
.heat-name.clickable:hover .hn-nm{color:var(--jw-primary);text-decoration:underline}
.heat-row.absent .hn-nm,.heat-row.absent .hn-sid{color:var(--hi-text-muted);opacity:.6}

/* 구간 띠 — 왜란·대내·대외·호란·이후를 눈으로 갈라 둔다. */
.heat-phase{font-size:10px;font-weight:800;color:var(--jw-accent-deep);padding:0 0 5px}
.heat-phase span{display:block;background:var(--jw-accent-l);border-radius:5px;padding:3px 0;margin:0 2px}
/* 자리 이름은 세로쓰기. 15칸을 가로로 눕히면 표가 화면을 벗어난다. */
.heat-ev{height:130px;padding-bottom:5px}
.heat-ev span{writing-mode:vertical-rl;font-size:10px;font-weight:700;color:var(--hi-text-muted);line-height:1;max-height:124px;overflow:hidden}
.heat-cell{width:26px}
.heat-cell i{display:block;width:20px;height:20px;margin:2px auto;border-radius:5px;background:var(--hi-bg-mid);border:1px solid var(--hi-border)}
.heat-cell i.ok{background:var(--jw-pass);border-color:var(--jw-pass)}
.heat-cell i.no{background:var(--jw-fail);border-color:var(--jw-fail)}
.heat-cell i.empty{background:transparent;border-style:dashed}
.heat-qcell{width:34px}
.heat-qcell b{display:block;width:30px;height:22px;line-height:22px;margin:2px auto;border-radius:5px;font-size:11px;font-weight:800;color:var(--hi-text);font-variant-numeric:tabular-nums}
.hq4{background:rgba(34,197,94,.30)}
.hq3{background:rgba(34,197,94,.15)}
.hq2{background:rgba(217,119,6,.20)}
.hq1{background:rgba(243,114,127,.20)}
.hq0{background:rgba(243,114,127,.34)}
.hqx{background:var(--hi-bg-mid);color:var(--hi-text-muted)}
.heat-name .hn-sub{font-size:10px;font-weight:600;color:var(--hi-text-muted)}
.heat-legend .lg-scale{display:inline-flex;align-items:center;gap:3px}
.heat-legend .lg-scale b{width:16px;height:12px;border-radius:3px;display:inline-block}

.heat-tail{padding-left:12px;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.heat-tail.t-pct{font-size:12px;font-weight:800;color:var(--hi-text);min-width:48px}
.heat-tail.t-ca{font-size:11px;font-weight:700;color:var(--hi-text-muted);min-width:42px}
.heat-tail.muted{color:var(--hi-text-muted);font-weight:600}
.heat-head-tail{font-size:10px;font-weight:700;color:var(--hi-text-muted);padding-left:12px;padding-bottom:5px;vertical-align:bottom}

/* 자리별 정답률 — 이 줄이 다음 수업에서 무엇을 다시 짚어야 하는지 알려 준다. */
.heat-foot td,.heat-foot th{padding-top:7px;border-top:1px solid var(--hi-border)}
.heat-foot .heat-name .hn-in{font-size:11px;font-weight:800;color:var(--hi-text-muted)}
.heat-rate{font-size:10px;font-weight:800;font-variant-numeric:tabular-nums}
.heat-rate.r-hi{color:var(--jw-pass)}
.heat-rate.r-mid{color:#D97706}
.heat-rate.r-lo{color:var(--jw-fail)}
.heat-legend{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--hi-text-muted);margin:10px 2px 0}
.heat-legend span{display:inline-flex;align-items:center;gap:5px}
.heat-legend i{width:12px;height:12px;border-radius:4px;border:1px solid var(--hi-border);display:inline-block}
.heat-legend i.ok{background:var(--jw-pass);border-color:var(--jw-pass)}
.heat-legend i.no{background:var(--jw-fail);border-color:var(--jw-fail)}
.heat-legend i.empty{background:transparent;border-style:dashed}
.heat-legend i.none{background:var(--hi-bg-mid)}

/* ── 넘기기 카드 ── 펼치지 않는다. 읽으려고 들어온 탭이라 처음부터 열려 있고,
   통과·미흡 버튼은 카드 맨 아래에 둔다. 판단은 이유 넷을 다 읽은 뒤에 서기 때문에
   버튼이 위에 있으면 누를 때쯤 이미 화면 밖으로 밀려 있다. */
.rc-card{background:var(--hi-bg-surface);border:1px solid var(--hi-border);border-radius:14px;overflow:hidden}
.rc-card.hl{animation:rcHl 1.8s ease}
@keyframes rcHl{0%{box-shadow:0 0 0 3px var(--jw-primary-soft);border-color:var(--jw-primary)}100%{box-shadow:none}}
.rc-head{display:flex;align-items:center;gap:8px;padding:11px 14px;flex-wrap:wrap;border-bottom:1px solid var(--hi-border)}
.rc-body{padding:12px 14px 2px}
.rc-foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--hi-border);background:var(--hi-bg-mid)}
.rc-foot .rc-lbl{font-size:11px;font-weight:700;color:var(--hi-text-muted);margin-right:auto}
.rc-foot .ssb{padding:7px 20px}
.rc-none{padding:14px;text-align:center;font-size:12px;color:var(--hi-text-muted)}
</style>
  <script src="/hoistory/pwa.js"></script>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">전란의 도미노</div>
    <div class="login-sub">관리자 모드</div>
    <div class="field-group" style="text-align:left;margin-bottom:14px">
      <label class="form-label">이메일</label>
      <input type="email" class="hi-input" id="gate-email" placeholder="이메일">
    </div>
    <div class="field-group" style="text-align:left;margin-bottom:14px">
      <label class="form-label">비밀번호</label>
      <input type="password" class="hi-input" id="gate-pw" placeholder="비밀번호">
    </div>
    <div class="login-err" id="gate-err"></div>
    <button class="login-btn" id="gate-login-btn">접속하기</button>
  </div>
</div>

<!-- 어드민 -->
<div id="adminApp">
  <header class="adm-header">
    <div class="adm-logo">전란의 도미노<span class="adm-badge">관리자 모드</span></div>
    <div class="adm-tabs">
      <button class="adm-tab active" data-tab="contents">CONTENTS</button>
      <button class="adm-tab" data-tab="answer">ANSWER</button>
    </div>
    <button class="adm-logout" id="logout-btn">로그아웃</button>
    <button class="adm-back" onclick="window.parent.closeAppAdmin&&window.parent.closeAppAdmin()">목록으로</button>
  </header>

  <div class="sub-tabs" id="contents-subtabs" data-panels="tab-contents" style="display:none">
    <button class="sub-tab active" data-sub="events">EVENT</button>
    <button class="sub-tab" data-sub="causal">CAUSE</button>
  </div>
  <div class="sub-tabs" id="answer-subtabs" data-panels="tab-answer" style="display:none">
    <button class="sub-tab active" data-sub="heat">세우기</button>
    <button class="sub-tab" data-sub="reason">넘기기</button>
  </div>

  <div class="adm-body">
  <div class="admin-container">

    <!-- CONTENT -->
    <div class="tab-panel active" id="tab-contents">
      <!-- EVENT -->
      <div class="panel-section active" id="sub-events">
        <div class="section-card">
          <div class="section-title">사건 목록 (도미노 세우기)
            <button class="btn btn-primary btn-sm" id="save-events-btn" style="margin-left:auto">저장</button>
          </div>
          <div class="section-desc">각 사건의 <b>구간</b>과 <b>순서</b>가 곧 정답입니다. 구간 흐름은 왜란(일직선), 대내와 대외(분기), 호란(합류), 호란 이후(일직선)입니다. 순서 번호는 구간 안에서의 정답 순서예요.</div>
          <div id="events-editor"></div>
          <div style="display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap">
            <button class="btn btn-ghost" id="add-event-btn">사건 추가</button>
            <button class="btn btn-ghost" id="reset-events-btn">기본값으로 되돌리기</button>
          </div>
          <div class="save-msg" id="events-msg"></div>
        </div>
      </div>
      <!-- CAUSE -->
      <div class="panel-section" id="sub-causal">
        <div class="section-card">
          <div class="section-title">문제 목록 (도미노 넘기기)
            <button class="btn btn-primary btn-sm" id="save-causal-btn" style="margin-left:auto">저장</button>
          </div>
          <div class="section-desc">"결과" 사건마다 정답이 되는 "원인" 사건을 지정합니다. 학생은 원인을 고르고 이유를 서술해요. (원인 선택은 자동 채점, 이유는 ANSWER 탭에서 검토)</div>
          <div id="causal-editor"></div>
          <div style="display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap">
            <button class="btn btn-ghost" id="add-causal-btn">문제 추가</button>
            <button class="btn btn-ghost" id="reset-causal-btn">기본값으로 되돌리기</button>
          </div>
          <div class="save-msg" id="causal-msg"></div>
        </div>
      </div>
    </div>

    <!-- RESULT -->
    <div class="tab-panel" id="tab-answer">
      <div class="ans-head">
        <div class="class-filter" id="class-filter"></div>
        <div class="stats-row">
          <div class="stat-chip stat-combo" title="전체 / 참여 / 통과 / 미흡">
            <span class="thc-o" id="s-total">0</span><span class="thc-sep">/</span><span class="thc-o" id="s-sub">0</span><span class="thc-sep">/</span><span class="thc-g" id="s-pass">0</span><span class="thc-sep">/</span><span class="thc-r" id="s-fail">0</span>
          </div>
          <div class="stat-chip stat-avg" title="도미노 세우기 평균"><span class="thc-avg" id="s-avg">0%</span></div>
        </div>
      </div>
      <div class="adm-action-row">
        <button class="btn btn-primary btn-sm" id="autoscore-btn">자동 채점</button>
        <div class="thr-box">도미노 세우기 <input type="number" class="thr-in" id="thr-tl" value="70" min="0" max="100">% 이상 &amp; 넘기기 이유 모두 작성 시 통과</div>
        <div class="ans-right-group" id="ans-sort-group">
          <div class="sort-box">
            <button class="sort-btn active" id="sort-newest">최신순</button>
            <button class="sort-btn" id="sort-sid">학번순</button>
          </div>
        </div>
      </div>
      <div class="panel-section active" id="sub-heat">
        <div id="heat-wrap"></div>
      </div>
      <div class="panel-section" id="sub-reason">
        <div id="result-list"></div>
      </div>
    </div>

  </div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,updateDoc,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "../../shared/firebase-config.js";
import { icon } from "../../shared/icons.js";
import { loadTestIds, isTestId } from "../../shared/testIds.js";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const rtdb=getDatabase(app);

const DEFAULT_EVENTS=[
  {id:'w1',phase:'war',order:0,title:'임진왜란 발발'},
  {id:'w2',phase:'war',order:1,title:'한산도 대첩'},
  {id:'w3',phase:'war',order:2,title:'명 참전과 평양성 탈환'},
  {id:'w4',phase:'war',order:3,title:'행주 대첩'},
  {id:'w5',phase:'war',order:4,title:'정유재란'},
  {id:'w6',phase:'war',order:5,title:'노량 해전과 왜란 종결'},
  {id:'d1',phase:'domestic',order:0,title:'광해군의 중립 외교'},
  {id:'d2',phase:'domestic',order:1,title:'인조반정과 친명배금'},
  {id:'f1',phase:'foreign',order:0,title:'명의 쇠퇴'},
  {id:'f2',phase:'foreign',order:1,title:'여진 성장과 후금 건국'},
  {id:'h1',phase:'horan',order:0,title:'정묘호란'},
  {id:'h2',phase:'horan',order:1,title:'병자호란'},
  {id:'h3',phase:'horan',order:2,title:'삼전도의 항복'},
  {id:'a1',phase:'after',order:0,title:'북벌 운동'},
  {id:'a2',phase:'after',order:1,title:'북학론'}
];
/* options = 학생 화면 드롭다운에 띄울 보기 다섯 개(정답 포함). 여기에는 편집 UI가 없고,
   문제를 고쳐 저장해도 이 필드는 그대로 실려 간다(불러올 때 통째로 복사해 두기 때문).
   보기를 손보려면 index.html의 DEFAULT_CAUSAL을 고친 뒤 [기본값으로 되돌리기]를 누른다. */
const DEFAULT_CAUSAL=[
  {id:'c1',effectId:'f1',causeId:'w3',options:['w3','w1','w2','w5','w6']},
  {id:'c2',effectId:'f2',causeId:'f1',options:['f1','w3','w1','w5','w6']},
  {id:'c3',effectId:'h1',causeId:'d2',options:['d2','d1','f2','f1','w1']},
  {id:'c4',effectId:'a1',causeId:'h3',options:['h3','h2','h1','d2','f2']}
];
const PHASES=[
  {key:'war',label:'왜란 (일직선)'},
  {key:'domestic',label:'대내 (국내 정세)'},
  {key:'foreign',label:'대외 (국제 정세)'},
  {key:'horan',label:'호란 (합류)'},
  {key:'after',label:'호란 이후 (분기)'}
];

let EVENTS=[], CAUSAL=[];
let roster=[], results=[];
let currentFilter='전체';
/* 목록 차례. 기본은 최신순 — 방금 낸 학생을 먼저 보는 일이 가장 잦다. */
let answerSort='newest';
/* ANSWER 안에서 지금 보고 있는 쪽. 세우기(반별 히트맵) / 넘기기(학생 카드) */
let answerSub='heat';
let resultsUnsub=null;
const isEmbedded=window.self!==window.top;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function classNumOf(sid){sid=String(sid||'');if(sid.length<3)return null;const c=parseInt(sid.slice(1,3),10);return isNaN(c)?null:c;}
function evById(id){return EVENTS.find(e=>e.id===id);}
/* 사건은 이름만 쓴다. 연도를 붙이면 학생이 앞뒤를 따져 보지 않고 숫자만 견주어 고르게 되어
   1단계와 2단계가 둘 다 숫자 정렬 문제로 바뀐다. 그래서 연도 칸 자체를 없앴다. */
function evLabel(id){const e=evById(id);return e?e.title:'(삭제됨)';}
function phaseEvents(p){return EVENTS.filter(e=>e.phase===p).sort((a,b)=>a.order-b.order);}

/* 진입 */
async function initAdmin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminApp').classList.add('show');
  await Promise.all([loadConfig(),loadRoster()]);
  startListener();
}
if(isEmbedded){document.documentElement.classList.add('has-own-back');initAdmin();}
else{
  onAuthStateChanged(auth,user=>{
    if(user)initAdmin();
    else{
      document.getElementById('loginScreen').style.display='';
      document.getElementById('adminApp').classList.remove('show');
      if(resultsUnsub){resultsUnsub();resultsUnsub=null;}
    }
  });
}
document.getElementById('gate-login-btn').addEventListener('click',async()=>{
  const email=document.getElementById('gate-email').value.trim();
  const pw=document.getElementById('gate-pw').value;
  const errEl=document.getElementById('gate-err');errEl.classList.remove('show');
  try{await signInWithEmailAndPassword(auth,email,pw);}
  catch(e){errEl.textContent='이메일 또는 비밀번호를 확인해 주세요.';errEl.classList.add('show');}
});
document.getElementById('gate-pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('gate-login-btn').click();});
document.getElementById('logout-btn').addEventListener('click',()=>signOut(auth));

document.querySelectorAll('.adm-tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.adm-tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  document.getElementById('contents-subtabs').style.display=btn.dataset.tab==='contents'?'flex':'none';
  document.getElementById('answer-subtabs').style.display=btn.dataset.tab==='answer'?'flex':'none';
}));
/* 서브탭은 이제 두 벌(CONTENTS·ANSWER)이라 전역으로 쓸어버리면 서로를 끈다.
   각 바가 맡은 패널 묶음(data-panels) 안에서만 갈아 끼운다. */
document.querySelectorAll('.sub-tabs').forEach(bar=>{
  const host=document.getElementById(bar.dataset.panels);
  bar.querySelectorAll('.sub-tab').forEach(btn=>btn.addEventListener('click',()=>{
    bar.querySelectorAll('.sub-tab').forEach(b=>b.classList.remove('active'));
    host.querySelectorAll(':scope > .panel-section').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sub-'+btn.dataset.sub).classList.add('active');
    if(bar.id==='answer-subtabs')setAnswerSub(btn.dataset.sub);
  }));
});

/* 설정 로드 */
async function loadConfig(){
  try{
    const snap=await getDoc(doc(db,'settings','j_wartimeline_config'));
    if(snap.exists()){
      const d=snap.data();
      /* 예전에 저장해 둔 연도(year)는 불러오면서 버린다 — 한 번 저장하면 데이터에서도 없어진다. */
      EVENTS=Array.isArray(d.events)&&d.events.length?d.events.map(({year,...e})=>e):DEFAULT_EVENTS.map(e=>({...e}));
      CAUSAL=Array.isArray(d.causal)&&d.causal.length?d.causal.map(c=>({...c})):DEFAULT_CAUSAL.map(c=>({...c}));
    }else{EVENTS=DEFAULT_EVENTS.map(e=>({...e}));CAUSAL=DEFAULT_CAUSAL.map(c=>({...c}));}
  }catch(e){EVENTS=DEFAULT_EVENTS.map(e=>({...e}));CAUSAL=DEFAULT_CAUSAL.map(c=>({...c}));}
  renderEventsEditor();renderCausalEditor();
}

/* ── 사건 편집 ── */
function renderEventsEditor(){
  const wrap=document.getElementById('events-editor');
  const phaseOpts=PHASES.map(p=>`<option value="${p.key}">${esc(p.label)}</option>`).join('');
  let html='';
  PHASES.forEach(p=>{
    const evs=phaseEvents(p.key);
    html+=`<div class="phase-group"><div class="phase-head">${esc(p.label)}</div>`;
    evs.forEach((e)=>{
      const gi=EVENTS.indexOf(e);
      html+=`<div class="ev-row" data-i="${gi}">
        <span class="ev-ord">${e.order+1}</span>
        <input class="meta-input ev-title" value="${esc(e.title||'')}" placeholder="사건 이름">
        <select class="meta-input ev-phase">${phaseOpts}</select>
        <div class="ev-ctrl">
          <button class="icon-btn ev-up" title="순서 위로">↑</button>
          <button class="icon-btn ev-down" title="순서 아래로">↓</button>
          <button class="icon-btn ev-del" title="삭제">${icon('x',16)}</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  wrap.innerHTML=html;
  wrap.querySelectorAll('.ev-row').forEach(row=>{
    const i=+row.dataset.i;
    row.querySelector('.ev-title').addEventListener('input',e=>EVENTS[i].title=e.target.value);
    const sel=row.querySelector('.ev-phase');sel.value=EVENTS[i].phase;
    sel.addEventListener('change',e=>{
      EVENTS[i].phase=e.target.value;
      EVENTS[i].order=phaseEvents(e.target.value).filter(x=>x!==EVENTS[i]).length;
      renderEventsEditor();
    });
    row.querySelector('.ev-up').addEventListener('click',()=>moveEvent(i,-1));
    row.querySelector('.ev-down').addEventListener('click',()=>moveEvent(i,1));
    row.querySelector('.ev-del').addEventListener('click',()=>{
      if(!confirm(`'${EVENTS[i].title||'이 사건'}'을(를) 삭제할까요?`))return;
      EVENTS.splice(i,1);normalizeOrders();renderEventsEditor();
    });
  });
}
function moveEvent(i,dir){
  const e=EVENTS[i];
  const sib=phaseEvents(e.phase);
  const pos=sib.indexOf(e);
  const swap=sib[pos+dir];
  if(!swap)return;
  const t=e.order;e.order=swap.order;swap.order=t;
  renderEventsEditor();
}
function normalizeOrders(){
  PHASES.forEach(p=>phaseEvents(p.key).forEach((e,i)=>e.order=i));
}
document.getElementById('add-event-btn').addEventListener('click',()=>{
  EVENTS.push({id:'e_'+Date.now().toString(36),phase:'war',order:phaseEvents('war').length,title:''});
  renderEventsEditor();
});
document.getElementById('reset-events-btn').addEventListener('click',()=>{
  if(!confirm('사건을 기본 15개로 되돌릴까요? (저장 전까지 반영 안 됨)'))return;
  EVENTS=DEFAULT_EVENTS.map(e=>({...e}));renderEventsEditor();
});
document.getElementById('save-events-btn').addEventListener('click',async()=>{
  normalizeOrders();
  EVENTS.forEach(e=>{if(!e.id)e.id='e_'+Math.random().toString(36).slice(2,8);});
  const msg=document.getElementById('events-msg');
  try{await setDoc(doc(db,'settings','j_wartimeline_config'),{events:EVENTS,causal:CAUSAL},{merge:true});
    msg.textContent='저장되었습니다. 학생 화면에 반영됩니다.';msg.className='save-msg ok';renderCausalEditor();}
  catch(e){msg.textContent='저장 실패: '+e.message;msg.className='save-msg';}
});

/* ── 도미노 넘기기 문제 편집 ── */
function renderCausalEditor(){
  const wrap=document.getElementById('causal-editor');
  const opts=EVENTS.map(e=>`<option value="${esc(e.id)}">${esc(evLabel(e.id))}</option>`).join('');
  wrap.innerHTML=CAUSAL.map((c,i)=>`
    <div class="causal-row" data-i="${i}">
      <span class="causal-lbl">원인</span>
      <select class="causal-sel c-cause">${opts}</select>
      <span class="causal-lbl" style="color:var(--jw-accent-deep)">결과</span>
      <select class="causal-sel c-effect">${opts}</select>
      <button class="icon-btn c-del" title="삭제">${icon('x',16)}</button>
    </div>`).join('')||'<div class="no-data">문제가 없습니다.</div>';
  wrap.querySelectorAll('.causal-row').forEach(row=>{
    const i=+row.dataset.i;
    const cs=row.querySelector('.c-cause');cs.value=CAUSAL[i].causeId||'';
    const ef=row.querySelector('.c-effect');ef.value=CAUSAL[i].effectId||'';
    cs.addEventListener('change',e=>CAUSAL[i].causeId=e.target.value);
    ef.addEventListener('change',e=>CAUSAL[i].effectId=e.target.value);
    row.querySelector('.c-del').addEventListener('click',()=>{CAUSAL.splice(i,1);renderCausalEditor();});
  });
}
document.getElementById('add-causal-btn').addEventListener('click',()=>{
  CAUSAL.push({id:'c_'+Date.now().toString(36),effectId:EVENTS[0]?.id||'',causeId:EVENTS[0]?.id||''});
  renderCausalEditor();
});
document.getElementById('reset-causal-btn').addEventListener('click',()=>{
  if(!confirm('도미노 넘기기 문제를 기본값으로 되돌릴까요?'))return;
  CAUSAL=DEFAULT_CAUSAL.map(c=>({...c}));renderCausalEditor();
});
document.getElementById('save-causal-btn').addEventListener('click',async()=>{
  CAUSAL.forEach(c=>{if(!c.id)c.id='c_'+Math.random().toString(36).slice(2,8);});
  const msg=document.getElementById('causal-msg');
  try{await setDoc(doc(db,'settings','j_wartimeline_config'),{events:EVENTS,causal:CAUSAL},{merge:true});
    msg.textContent='저장되었습니다.';msg.className='save-msg ok';}
  catch(e){msg.textContent='저장 실패: '+e.message;msg.className='save-msg';}
});

/* ── 명단 ── */
async function loadRoster(){
  try{
    const snap=await get(ref(rtdb,'students'));
    const data=snap.val()||{};
    roster=Object.values(data).filter(Boolean)
      .map(s=>({studentId:String(s.studentId||s.id||'').trim(),name:s.name||''}))
      .filter(s=>s.studentId).map(s=>({...s,classNum:classNumOf(s.studentId)})).filter(s=>s.classNum!==0);
  }catch(e){roster=[];}
}

/* ── 결과 리스너 ── */
async function startListener(){
  await loadTestIds(db);
  if(resultsUnsub)resultsUnsub();
  resultsUnsub=onSnapshot(collection(db,'j_wartimeline_results'),snap=>{
    results=[];snap.forEach(d=>{if(classNumOf(d.id)!==0&&!isTestId(d.id))results.push({id:d.id,...d.data()});});
    results.sort((a,b)=>(classNumOf(a.id)||0)-(classNumOf(b.id)||0)||String(a.id).localeCompare(String(b.id)));
    renderClassFilter();updateStats();renderAnswer();
  });
}
function renderClassFilter(){
  const nums=[...new Set([...roster.map(r=>r.classNum),...results.map(r=>classNumOf(r.id))])].filter(n=>n!=null).sort((a,b)=>a-b);
  const classes=['전체',...nums];
  document.getElementById('class-filter').innerHTML=classes.map(c=>`<button class="cf-btn${String(c)===currentFilter?' active':''}" data-c="${c}">${c==='전체'?'전체':c+'반'}</button>`).join('');
  document.querySelectorAll('.cf-btn').forEach(btn=>btn.addEventListener('click',()=>{
    currentFilter=btn.dataset.c;
    document.querySelectorAll('.cf-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
    updateStats();renderAnswer();
  }));
}
function inFilter(sid){return currentFilter==='전체'||String(classNumOf(sid))===currentFilter;}
function submittedMs(r){const t=r.submittedAt;return t&&t.seconds?t.seconds*1000:0;}
function filtered(){
  const list=results.filter(r=>inFilter(r.id));
  return answerSort==='newest'
    ? list.slice().sort((a,b)=>submittedMs(b)-submittedMs(a))
    : list.slice().sort((a,b)=>(classNumOf(a.id)||0)-(classNumOf(b.id)||0)||String(a.id).localeCompare(String(b.id)));
}
function setAnswerSort(kind){
  answerSort=kind;
  document.getElementById('sort-newest').classList.toggle('active',kind==='newest');
  document.getElementById('sort-sid').classList.toggle('active',kind==='sid');
  renderResultList();
}
function setAnswerSub(kind){
  answerSub=kind;
  /* 정렬 버튼은 카드 목록에만 걸린다. 표는 언제나 학번순이라 켜 두면 거짓말이 된다. */
  document.getElementById('ans-sort-group').style.display=kind==='reason'?'flex':'none';
}
function renderAnswer(){renderHeat();renderResultList();}

function updateStats(){
  const fr=filtered();
  const expected=roster.length?(currentFilter==='전체'?roster.length:roster.filter(r=>String(r.classNum)===currentFilter).length):fr.length;
  const withTl=fr.filter(r=>r.timelineTotal);
  const avg=withTl.length?Math.round(withTl.reduce((s,r)=>s+(r.timelinePct||0),0)/withTl.length):0;
  const pass=fr.filter(r=>r.status==='pass').length;
  const fail=fr.filter(r=>r.status==='fail').length;
  document.getElementById('s-total').textContent=expected||fr.length;
  document.getElementById('s-sub').textContent=fr.length;
  document.getElementById('s-avg').textContent=avg+'%';
  document.getElementById('s-pass').textContent=pass;
  document.getElementById('s-fail').textContent=fail;
}

function statusBadge(st){
  if(st==='pass')return'<span class="status-badge sb-pass">통과</span>';
  if(st==='fail')return'<span class="status-badge sb-fail">미흡</span>';
  return'<span class="status-badge sb-pending">미채점</span>';
}
/* ── 넘기기: 학생 카드 ──
   접지 않는다. 이 탭에 들어온 목적이 서술형을 읽는 것이라, 클릭 한 번이 사람 수만큼 쌓이면
   그게 곧 불편이었다. 통과·미흡은 카드 맨 아래 — 이유를 다 읽고 난 자리다. */
function renderResultList(){
  const el=document.getElementById('result-list');
  const list=filtered();
  if(!list.length){el.innerHTML='<div class="no-data">아직 참여한 학생이 없습니다.</div>';return;}
  el.className='std-list';
  el.innerHTML=list.map(r=>{
    const st=r.status||'pending';
    const tl=r.timelineTotal?`${r.timelinePct}%`:'—';
    const ca=r.causalTotal?`${r.causalCorrect}/${r.causalTotal}`:'—';
    return`<div class="rc-card" id="rc-${esc(String(r.id))}">
      <div class="rc-head">
        <div class="std-who">
          <span class="std-sid">${esc(String(r.studentId||r.id))}</span>
          <span class="std-name">${esc(r.name||'')}</span>
        </div>
        <div class="std-status">
          <span class="std-meta-time">${esc(timeLabel(r))}</span>
          <span class="score-pill">세우기 ${tl}</span><span class="score-pill">넘기기 ${ca}</span>
          ${statusBadge(st)}
        </div>
      </div>
      <div class="rc-body">${reasonRows(r)}</div>
      <div class="rc-foot">
        <span class="rc-lbl">최종 판정</span>
        <button class="ssb ssb-pass${st==='pass'?' active':''}" onclick="window.setStatus('${esc(r.id)}','pass')">통과</button>
        <button class="ssb ssb-fail${st==='fail'?' active':''}" onclick="window.setStatus('${esc(r.id)}','fail')">미흡</button>
      </div>
    </div>`;
  }).join('');
}
/* 문제 차례는 학생이 낸 순서가 아니라 CAUSAL 설정 순서로 고정한다 — 카드를 세로로 훑을 때
   1번은 늘 같은 자리에 와야 두 사람의 답을 눈으로 견줄 수 있다. 안 푼 문제도 자리를 비워 둔다. */
function reasonRows(r){
  if(!CAUSAL.length)return'<div class="rc-none">문제가 설정되어 있지 않습니다.</div>';
  const given=Array.isArray(r.causal)?r.causal:[];
  return CAUSAL.map((c,i)=>{
    const a=given.find(x=>x.effectId===c.effectId);
    if(!a)return`<div class="chain-line"><span class="q-no">${i+1}</span><span style="color:var(--hi-text-muted)">안 풀었습니다</span><span class="chain-eff">${esc(evLabel(c.effectId))}</span></div>`;
    return`<div class="chain-line">
      <span class="q-no">${i+1}</span>
      <span class="chain-cause ${a.correct?'ok':'no'}">${a.correct?icon('check',14):icon('x',14)} ${esc(evLabel(a.chosenCauseId))}</span>
      <span style="color:var(--hi-text-muted)">넘어뜨림</span>
      <span class="chain-eff">${esc(evLabel(c.effectId))}</span>
      ${a.correct?'':`<span style="font-size:12px;color:var(--hi-text-muted)">정답: ${esc(evLabel(c.causeId))}</span>`}
      <div class="chain-reason">이유: ${(a.reason||'').trim()?esc(a.reason):'<span class="rs-none">미작성</span>'}</div>
    </div>`;
  }).join('');
}

/* ── 세우기: 반별 히트맵 ── */
function heatGroups(){
  return PHASES.map(p=>({label:p.label.replace(/\s*\(.*\)\s*$/,''),key:p.key,evs:phaseEvents(p.key)})).filter(g=>g.evs.length);
}
function classNums(){
  return [...new Set([...roster.map(r=>r.classNum),...results.map(r=>classNumOf(r.id))])].filter(n=>n!=null).sort((a,b)=>a-b);
}
/* 명단이 기준이다. 안 낸 학생도 빈 줄로 남겨야 '아직 안 한 사람'이 표에서 바로 보인다. */
function classStudents(cn){
  const list=roster.filter(s=>s.classNum===cn).map(s=>({sid:String(s.studentId),name:s.name||''}));
  const seen=new Set(list.map(s=>s.sid));
  results.forEach(r=>{if(classNumOf(r.id)===cn&&!seen.has(String(r.id)))list.push({sid:String(r.id),name:r.name||''});});
  return list.sort((a,b)=>a.sid.localeCompare(b.sid));
}
function rateClass(pct){return pct>=80?'r-hi':pct>=50?'r-mid':'r-lo';}
function qBucket(pct){return pct>=80?'hq4':pct>=60?'hq3':pct>=40?'hq2':pct>=20?'hq1':'hq0';}
/* 한 반에서 실제로 세우기를 마친 사람만 추린다. 정답률의 분모는 늘 이 사람들이다 —
   안 낸 사람까지 넣으면 그 자리가 어려웠던 것인지 결석이 많았던 것인지 구분이 안 된다. */
function heatDone(studs){return studs.map(s=>results.find(x=>String(x.id)===s.sid)).filter(r=>r&&r.timelinePlaced);}
function slotRate(done,sl){
  if(!done.length)return null;
  return Math.round(done.filter(r=>r.timelinePlaced[sl.key]===sl.ev.id).length/done.length*100);
}
function avgPct(done){return done.length?Math.round(done.reduce((a,r)=>a+(r.timelinePct||0),0)/done.length):0;}
/* 넘기기 평균은 '2.8/4'처럼 푼 사람 기준으로만 낸다. */
function avgCausal(done){
  const w=done.filter(r=>r.causalTotal);
  if(!w.length)return'—';
  const c=w.reduce((a,r)=>a+(r.causalCorrect||0),0)/w.length;
  return (Math.round(c*10)/10)+'/'+w[0].causalTotal;
}
function heatHead(groups,slots){
  const lead='<th class="heat-name"></th>';
  return `<thead>
    <tr>${lead}${groups.map(g=>`<th class="heat-phase" colspan="${g.evs.length}"><span>${esc(g.label)}</span></th>`).join('')}<th class="heat-head-tail">세우기</th><th class="heat-head-tail">넘기기</th></tr>
    <tr>${lead}${slots.map(sl=>`<th class="heat-ev" title="${esc(sl.label+' '+sl.no+'번째 자리 · 정답 '+sl.ev.title)}"><span>${esc(sl.ev.title)}</span></th>`).join('')}<th></th><th></th></tr>
  </thead>`;
}
function renderHeat(){
  const wrap=document.getElementById('heat-wrap');
  const groups=heatGroups();
  const slots=groups.flatMap(g=>g.evs.map((e,i)=>({key:g.key+':'+i,ev:e,label:g.label,no:i+1})));
  const nums=classNums();
  if(!slots.length||!nums.length){wrap.innerHTML='<div class="no-data">아직 참여한 학생이 없습니다.</div>';return;}
  wrap.innerHTML=currentFilter==='전체'?heatOverview(groups,slots,nums):heatClass(groups,slots,+currentFilter);
}

/* ── 전체: 반별 통계만 ──
   반이 여럿일 때 학생 줄을 전부 쌓으면 수백 줄이 되어 아무것도 안 보인다. 전체에서는
   한 반이 한 줄이고, 칸마다 그 반의 자리별 정답률이 들어간다. 반끼리 견주는 자리다.
   한 반만 보려면 위의 반 칩을 누른다. */
function heatOverview(groups,slots,nums){
  const stats=nums.map(cn=>{const studs=classStudents(cn);return{cn,studs,done:heatDone(studs)};});
  const rows=stats.map(st=>{
    const cells=slots.map(sl=>{
      const pct=slotRate(st.done,sl);
      if(pct===null)return'<td class="heat-qcell"><b class="hqx">—</b></td>';
      return`<td class="heat-qcell" title="${esc(st.cn+'반 · '+sl.label+' '+sl.no+'번째 · 정답 '+sl.ev.title)}"><b class="${qBucket(pct)}">${pct}</b></td>`;
    }).join('');
    return `<tr class="heat-row">
      <th class="heat-name clickable" onclick="window.focusClass('${st.cn}')"><div class="hn-in" title="클릭하면 이 반의 학생별 표로 넘어갑니다">
        <span class="hn-nm">${st.cn}반</span><span class="hn-sub">제출 ${st.done.length}/${st.studs.length}</span>
      </div></th>
      ${cells}
      <td class="heat-tail t-pct">${avgPct(st.done)}%</td>
      <td class="heat-tail t-ca">${avgCausal(st.done)}</td>
    </tr>`;
  }).join('');

  const all=stats.flatMap(st=>st.done);
  const allStuds=stats.reduce((a,st)=>a+st.studs.length,0);
  const foot=slots.map(sl=>{
    const pct=slotRate(all,sl);
    return pct===null?'<td><span class="heat-rate">—</span></td>':`<td><span class="heat-rate ${rateClass(pct)}">${pct}</span></td>`;
  }).join('');

  return `<div class="heat-class">
    <div class="heat-class-head">반별 자리 정답률 <span class="hc-sub">제출 ${all.length}/${allStuds} · 평균 ${avgPct(all)}%</span></div>
    <div class="heat-scroll"><table class="heat-tbl">
      ${heatHead(groups,slots)}
      <tbody>${rows}</tbody>
      <tfoot><tr class="heat-foot"><th class="heat-name"><div class="hn-in">전체</div></th>${foot}<td class="heat-tail t-pct">${avgPct(all)}%</td><td class="heat-tail t-ca">${avgCausal(all)}</td></tr></tfoot>
    </table></div>
  </div>
  <div class="heat-legend">
    <span class="lg-scale">낮음<b class="hq0"></b><b class="hq1"></b><b class="hq2"></b><b class="hq3"></b><b class="hq4"></b>높음</span>
    <span>숫자는 그 반이 그 자리를 맞힌 비율(%)입니다.</span>
    <span>반 이름을 누르면 학생별 표로 넘어갑니다.</span>
  </div>`;
}

/* ── 한 반: 학생별 ── */
function heatClass(groups,slots,cn){
  const studs=classStudents(cn);
  const rows=studs.map(s=>{
    const r=results.find(x=>String(x.id)===s.sid);
    const placed=r&&r.timelinePlaced;
    const cells=slots.map(sl=>{
      if(!placed)return'<td class="heat-cell"><i></i></td>';
      const got=placed[sl.key];
      const cls=got===sl.ev.id?'ok':(got?'no':'empty');
      const mine=got?evLabel(got):'빈칸';
      return`<td class="heat-cell" title="${esc(sl.label+' '+sl.no+'번째 · 정답 '+sl.ev.title+' · 학생 '+mine)}"><i class="${cls}"></i></td>`;
    }).join('');
    const tl=r&&r.timelineTotal?r.timelinePct+'%':'—';
    const ca=r&&r.causalTotal?`${r.causalCorrect}/${r.causalTotal}`:'—';
    const st=(r&&r.status)||'';
    const hint=r?'클릭하면 넘기기 답안으로 이동합니다':'아직 참여하지 않았습니다';
    const onclick=r?` onclick="window.jumpToReason('${esc(s.sid)}')"`:'';
    return `<tr class="heat-row${r?'':' absent'}">
      <th class="heat-name${r?' clickable':''}"${onclick}><div class="hn-in" title="${esc(hint)}">
        <span class="hn-dot ${st}"></span><span class="hn-sid">${esc(s.sid)}</span><span class="hn-nm">${esc(s.name)}</span>
      </div></th>
      ${cells}
      <td class="heat-tail t-pct${r?'':' muted'}">${tl}</td>
      <td class="heat-tail t-ca">${ca}</td>
    </tr>`;
  }).join('');

  const done=heatDone(studs);
  const foot=slots.map(sl=>{
    const pct=slotRate(done,sl);
    return pct===null?'<td><span class="heat-rate">—</span></td>':`<td><span class="heat-rate ${rateClass(pct)}">${pct}</span></td>`;
  }).join('');
  const avg=avgPct(done);

  return `<div class="heat-class">
    <div class="heat-class-head">${cn}반 <span class="hc-sub">제출 ${done.length}/${studs.length} · 평균 ${avg}%</span></div>
    <div class="heat-scroll"><table class="heat-tbl">
      ${heatHead(groups,slots)}
      <tbody>${rows}</tbody>
      <tfoot><tr class="heat-foot"><th class="heat-name"><div class="hn-in">자리별 정답률</div></th>${foot}<td class="heat-tail t-pct">${avg}%</td><td></td></tr></tfoot>
    </table></div>
  </div>
  <div class="heat-legend">
    <span><i class="ok"></i>정답</span><span><i class="no"></i>오답</span>
    <span><i class="empty"></i>비워 둠</span><span><i class="none"></i>미참여</span>
    <span>칸에 마우스를 올리면 학생이 넣은 사건이 보입니다.</span>
  </div>`;
}
/* 전체 표에서 반 이름을 누르면 그 반 칩을 누른 것과 같게 만든다. */
window.focusClass=cn=>{
  const btn=document.querySelector('#class-filter .cf-btn[data-c="'+cn+'"]');
  if(btn)btn.click();
};
/* 표에서 이름을 누르면 그 학생의 서술형으로 건너뛴다 — 표를 보다 눈에 걸리는 줄이 있을 때. */
window.jumpToReason=sid=>{
  document.querySelector('#answer-subtabs .sub-tab[data-sub="reason"]').click();
  const card=document.getElementById('rc-'+sid);
  if(!card)return;
  card.scrollIntoView({behavior:'smooth',block:'center'});
  card.classList.remove('hl');void card.offsetWidth;card.classList.add('hl');
};
/* 제출 시각은 '9.2. 11:20'처럼 짧게. 학생 카드가 한 줄이라 연도까지 넣을 자리가 없고,
   선생님이 보는 것은 언제나 이번 학기 안의 날짜다. */
function timeLabel(r){
  const ms=submittedMs(r);
  if(!ms)return'';
  const d=new Date(ms);
  return `${d.getMonth()+1}.${d.getDate()}. ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
window.setStatus=async(id,st)=>{
  const cur=results.find(r=>r.id===id);
  const next=(cur&&cur.status===st)?null:st;
  try{await updateDoc(doc(db,'j_wartimeline_results',id),{status:next});}
  catch(e){alert('오류: '+e.message);}
};

/* 자동 채점: 도미노 세우기 정답률이 임계값 이상이고 넘기기 이유를 전부 작성하면 통과 */
setAnswerSub('heat');
document.getElementById('sort-newest').addEventListener('click',()=>setAnswerSort('newest'));
document.getElementById('sort-sid').addEventListener('click',()=>setAnswerSort('sid'));

document.getElementById('autoscore-btn').addEventListener('click',async()=>{
  const thr=parseInt(document.getElementById('thr-tl').value,10)||0;
  const list=filtered().filter(r=>r.timelineTotal);
  if(!list.length){alert('채점할 참여자가 없습니다.');return;}
  const batch=writeBatch(db);
  list.forEach(r=>{
    const tlOk=(r.timelinePct||0)>=thr;
    const reasonsOk=Array.isArray(r.causal)&&r.causal.length>0&&r.causal.every(a=>(a.reason||'').trim().length>0);
    batch.update(doc(db,'j_wartimeline_results',r.id),{status:(tlOk&&reasonsOk)?'pass':'fail'});
  });
  try{await batch.commit();alert(`${list.length}명 자동 채점 완료 (도미노 세우기 ${thr}% 이상 & 넘기기 이유 모두 작성 시 통과)`);}
  catch(e){alert('오류: '+e.message);}
});
</script>
</body>
