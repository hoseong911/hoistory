<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유교로 나라를 다스린다는 것 : 관리자 모드</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<link rel="stylesheet" href="../../shared/admin-base.css">
<script>if(window.self!==window.top){document.documentElement.classList.add('in-iframe');document.documentElement.classList.add('has-own-back');}</script>
<style>
:root{
  --jc-primary:#2B3A67;--jc-primary-soft:rgba(43,58,103,.12);
  --jc-accent:#C0873F;--jc-accent-deep:#9A6A28;--jc-accent-l:rgba(192,135,63,.16);
  --jc-pass:#16a34a;--jc-pass-l:rgba(22,163,74,.12);
  --jc-mid-l:rgba(224,164,75,.14);--jc-mid:#B57C24;
  --jc-fail:#dc2626;--jc-fail-l:rgba(220,38,38,.1);
}
.section-card{background:var(--hi-bg-surface);border-radius:14px;padding:20px;margin-bottom:16px;border:1px solid var(--hi-border)}
.section-title{font-weight:800;font-size:15px;color:var(--hi-text);margin-bottom:4px}
.section-desc{font-size:12.5px;color:var(--hi-text-muted);line-height:1.6;margin-bottom:14px}

.btn{padding:9px 18px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--jc-primary);color:#fff}.btn-primary:hover{background:#1F2B4D}
.btn-ghost{background:none;border:1.5px solid var(--hi-border);color:var(--hi-text-muted)}.btn-ghost:hover{border-color:var(--hi-border-light);color:var(--hi-text)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:7px}

/* 반 필터 */
.class-filter{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.cf-btn{border:1.5px solid var(--hi-border);background:var(--hi-bg-card);border-radius:100px;padding:6px 15px;font-size:13px;font-weight:700;color:var(--hi-text-muted);cursor:pointer}
.cf-btn.active{background:var(--jc-primary);color:#fff;border-color:var(--jc-primary)}

/* 통계 */
.stats-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.stat-chip{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:14px;padding:12px 20px;text-align:center;min-width:92px}
.stat-chip-label{font-size:12px;font-weight:700;color:var(--hi-text-muted);margin-bottom:6px}
.stat-chip-val{font-weight:900;font-size:28px;line-height:1;color:var(--hi-text)}

/* 매트릭스 */
.matrix-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
.matrix th,.matrix td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--hi-border)}
.matrix thead th{position:sticky;top:0;background:var(--hi-bg-surface);font-family:'Pretendard';font-weight:900;font-size:13.5px;z-index:1;padding-bottom:12px}
.matrix .col-card{text-align:left;min-width:190px;position:sticky;left:0;background:var(--hi-bg-surface);z-index:1}
.mx-card-t{font-weight:800;font-size:13px;color:var(--hi-text);display:flex;align-items:center;gap:6px}
.mx-tag{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px}
.mx-tag.inside{background:rgba(37,99,235,.12);color:#2563EB}
.mx-tag.outside{background:rgba(21,128,61,.12);color:#15803D}
.mx-card-d{font-size:11px;color:var(--hi-text-muted);margin-top:2px;line-height:1.4}
.mx-cell{font-weight:800;font-size:15px;border-radius:8px;color:var(--hi-text);min-width:78px}
.mx-cell.zero{color:var(--hi-border-light);font-weight:600}
.mx-cell.top{outline:2px solid var(--jc-accent);outline-offset:-2px}
.mx-pct{display:block;font-size:10px;font-weight:700;color:var(--hi-text-muted);margin-top:1px}
.mx-legend{font-size:11.5px;color:var(--hi-text-muted);margin-top:12px;line-height:1.6;text-align:center}

/* 이념 분포 바 */
.dist-row{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.dist-item{display:flex;align-items:center;gap:10px}
.dist-name{width:88px;flex-shrink:0;font-weight:800;font-size:13px}
.dist-bar-wrap{flex:1;background:var(--hi-bg-mid);border-radius:8px;height:22px;overflow:hidden}
.dist-bar{height:100%;border-radius:8px;transition:width .3s}
.dist-n{width:52px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:800;color:var(--hi-text-muted)}

/* 서술 카드 */
.essay-card{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:12px;padding:13px 15px;margin-bottom:9px;border-top:3px solid var(--ec,var(--jc-primary))}
.essay-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.essay-ideo{font-size:11px;font-weight:800;color:#fff;background:var(--ec,var(--jc-primary));border-radius:6px;padding:2px 9px}
.essay-who{font-size:12.5px;font-weight:700;color:var(--hi-text)}
.essay-sid{font-size:11px;color:var(--hi-text-muted);font-weight:600}
.essay-badge{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px}
.eb-none{background:var(--hi-bg-mid);color:var(--hi-text-muted)}
.eb-sang{background:var(--jc-pass-l);color:var(--jc-pass)}
.eb-jung{background:var(--jc-mid-l);color:var(--jc-mid)}
.eb-ha{background:var(--jc-fail-l);color:var(--jc-fail)}
.essay-text{font-size:13.5px;color:var(--hi-text);line-height:1.7;word-break:keep-all}
.essay-evi{font-size:11.5px;color:var(--hi-text-muted);margin-top:7px}
.essay-cmp{margin-top:9px;padding-top:9px;border-top:1px dashed var(--hi-border);font-size:12px;color:var(--hi-text-muted);line-height:1.6}
.essay-cmp b{color:var(--hi-text)}
.score-btns{display:flex;gap:6px;margin-top:10px}
.ssb{padding:5px 14px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;border:1.5px solid transparent;cursor:pointer;background:var(--hi-bg-mid);color:var(--hi-text-muted)}
.ssb.sang.active{background:var(--jc-pass);color:#fff}
.ssb.jung.active{background:var(--jc-mid);color:#fff}
.ssb.ha.active{background:var(--jc-fail);color:#fff}

.no-data{text-align:center;padding:40px 20px;color:var(--hi-text-muted);font-size:14px}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">유교로 나라를 다스린다는 것</div>
    <div class="login-sub">관리자 모드</div>
    <div class="field-group" style="text-align:left;margin-bottom:14px">
      <label class="form-label">이메일</label>
      <input type="email" class="hi-input" id="gate-email" placeholder="이메일">
    </div>
    <div class="field-group" style="text-align:left;margin-bottom:14px">
      <label class="form-label">비밀번호</label>
      <input type="password" class="hi-input" id="gate-pw" placeholder="비밀번호">
    </div>
    <div class="login-err" id="gate-err"></div>
    <button class="login-btn" id="gate-login-btn">접속하기</button>
  </div>
</div>

<!-- 어드민 -->
<div id="adminApp">
  <header class="adm-header">
    <div class="adm-logo">유교로 다스린다는 것<span class="adm-badge">관리자 모드</span></div>
    <div class="adm-tabs">
      <button class="adm-tab active" data-tab="matrix">MATRIX</button>
      <button class="adm-tab" data-tab="essay">ESSAY</button>
      <button class="adm-tab" data-tab="status">STATUS</button>
    </div>
    <button class="adm-logout" id="logout-btn">로그아웃</button>
    <button class="adm-back" onclick="window.parent.closeAppAdmin&&window.parent.closeAppAdmin()">목록으로</button>
  </header>

  <div class="adm-body">
  <div class="admin-container">

    <div class="class-filter" id="class-filter"></div>

    <!-- MATRIX -->
    <div class="tab-panel active" id="tab-matrix">
      <div class="section-card">
        <div class="section-title">카드 분류 실시간 집계</div>
        <div class="section-desc">학생들이 각 카드를 어떤 이념으로 분류했는지 실시간으로 모입니다. 색이 짙은 칸이 많이 몰린 곳, 여러 칸에 흩어진 카드가 <b>의견이 갈린 카드</b>입니다. 그 카드를 짚어 "왜 갈렸을까?"를 물어보세요.</div>
        <div class="stats-row" id="matrix-stats"></div>
        <div class="matrix-scroll">
          <table class="matrix" id="matrix-table"></table>
        </div>
        <div class="mx-legend" id="matrix-legend"></div>
      </div>
    </div>

    <!-- ESSAY -->
    <div class="tab-panel" id="tab-essay">
      <div class="section-card">
        <div class="section-title">고른 이념 분포</div>
        <div class="section-desc">학생들이 서술에서 중심으로 고른 이념입니다.</div>
        <div class="dist-row" id="essay-dist"></div>
      </div>
      <div class="section-card">
        <div class="section-title">학생 답변 (실시간)</div>
        <div class="section-desc">카드를 눌러 상/중/하로 채점할 수 있습니다. 좋은 답을 골라 화면에 띄워 함께 읽어 보세요.</div>
        <div id="essay-list"></div>
      </div>
    </div>

    <!-- STATUS -->
    <div class="tab-panel" id="tab-status">
      <div class="section-card">
        <div class="section-title">제출 현황</div>
        <div class="section-desc">반별 참여 현황입니다.</div>
        <div class="stats-row" id="status-stats"></div>
        <div id="status-detail"></div>
      </div>
    </div>

  </div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,collection,onSnapshot,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "../../shared/firebase-config.js";
import { icon } from "../../shared/icons.js";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const rtdb=getDatabase(app);

const IDEOLOGIES=[
  {key:'minbon', name:'민본',       sub:'백성이 나라의 근본이다',            color:'#2563EB'},
  {key:'deokchi',name:'덕치와 문치', sub:'힘이 아니라 덕과 학문으로 다스린다', color:'#7C3AED'},
  {key:'ye',     name:'예와 명분',   sub:'관계마다 지켜야 할 도리가 있다',    color:'#DB2777'},
  {key:'gyohwa', name:'교화',       sub:'백성을 가르쳐 바르게 이끈다',      color:'#0F766E'}
];
const CARDS=[
  {id:'in1', side:'in',  title:'의정부와 경연',      desc:'왕이 혼자 정하지 않고 신하와 의논해 결정'},
  {id:'in2', side:'in',  title:'3사',              desc:'왕과 대신의 잘못을 비판'},
  {id:'in3', side:'in',  title:'과거제',            desc:'유교 경전 시험으로 관리를 뽑음'},
  {id:'in4', side:'in',  title:'수령의 임무',        desc:'학교를 일으키고 백성을 가르침'},
  {id:'in5', side:'in',  title:'향교와 성균관',      desc:'유교 경전을 가르침'},
  {id:'in6', side:'in',  title:'8도와 수령 파견',    desc:'군현에 관리를 보내 백성을 살핌'},
  {id:'out1',side:'out', title:'사대',              desc:'큰 나라를 섬김을 외교 원칙으로'},
  {id:'out2',side:'out', title:'조공과 책봉',        desc:'왕의 지위를 국제적으로 인정받음'},
  {id:'out3',side:'out', title:'교린',              desc:'이웃 나라와 회유책으로 지냄'},
  {id:'out4',side:'out', title:'여진에게 관직과 토지',desc:'귀순 장려, 무역소 개설'},
  {id:'out5',side:'out', title:'약 200년간의 평화',  desc:'백성이 큰 전쟁을 겪지 않음'},
  {id:'out6',side:'out', title:'류큐, 시암, 자와와 교류',desc:'토산물을 주고받으며 어울림'}
];
const SORT_COL='j_confucian_sorts';
const ESSAY_COL='j_confucian_essays';

let roster=[];
let sorts=[], essays=[];
let currentFilter='전체';
let sortsUnsub=null, essaysUnsub=null;
const isEmbedded=window.self!==window.top;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function classNumOf(sid){sid=String(sid||'');if(sid.length<3)return null;const c=parseInt(sid.slice(1,3),10);return isNaN(c)?null:c;}
function ideoById(k){return IDEOLOGIES.find(i=>i.key===k);}

/* ── 진입 ── */
async function initAdmin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminApp').classList.add('show');
  await loadRoster();
  startListeners();
}
if(isEmbedded){document.documentElement.classList.add('has-own-back');initAdmin();}
else{
  onAuthStateChanged(auth,user=>{
    if(user){initAdmin();}
    else{
      document.getElementById('loginScreen').style.display='';
      document.getElementById('adminApp').classList.remove('show');
      if(sortsUnsub){sortsUnsub();sortsUnsub=null;}
      if(essaysUnsub){essaysUnsub();essaysUnsub=null;}
    }
  });
}
document.getElementById('gate-login-btn').addEventListener('click',async()=>{
  const email=document.getElementById('gate-email').value.trim();
  const pw=document.getElementById('gate-pw').value;
  const errEl=document.getElementById('gate-err');errEl.classList.remove('show');
  try{await signInWithEmailAndPassword(auth,email,pw);}
  catch(e){errEl.textContent='이메일 또는 비밀번호를 확인해 주세요.';errEl.classList.add('show');}
});
document.getElementById('gate-pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('gate-login-btn').click();});
document.getElementById('logout-btn').addEventListener('click',()=>signOut(auth));

/* ── 탭 ── */
document.querySelectorAll('.adm-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.adm-tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

/* ── 명단 ── */
async function loadRoster(){
  try{
    const snap=await get(ref(rtdb,'students'));
    const data=snap.val()||{};
    roster=Object.values(data).filter(Boolean)
      .map(s=>({studentId:String(s.studentId||s.id||'').trim(),name:s.name||''}))
      .filter(s=>s.studentId).map(s=>({...s,classNum:classNumOf(s.studentId)}))
      .filter(s=>s.classNum!==0);
  }catch(e){roster=[];}
}

/* ── 실시간 ── */
function startListeners(){
  if(sortsUnsub)sortsUnsub();if(essaysUnsub)essaysUnsub();
  sortsUnsub=onSnapshot(collection(db,SORT_COL),snap=>{
    sorts=[];snap.forEach(d=>{if(classNumOf(d.id)!==0)sorts.push({id:d.id,...d.data()});});
    renderAll();
  });
  essaysUnsub=onSnapshot(collection(db,ESSAY_COL),snap=>{
    essays=[];snap.forEach(d=>{if(classNumOf(d.id)!==0)essays.push({id:d.id,...d.data()});});
    renderAll();
  });
}
function renderAll(){renderClassFilter();renderMatrix();renderEssayDist();renderEssayList();renderStatus();}

function inFilter(sid){return currentFilter==='전체'||String(classNumOf(sid))===currentFilter;}
function fSorts(){return sorts.filter(s=>inFilter(s.id));}
function fEssays(){return essays.filter(e=>inFilter(e.id)&&e.text);}

function renderClassFilter(){
  const nums=[...new Set([...roster.map(r=>r.classNum),...sorts.map(s=>classNumOf(s.id)),...essays.map(e=>classNumOf(e.id))])].filter(n=>n!=null).sort((a,b)=>a-b);
  const classes=['전체',...nums];
  document.getElementById('class-filter').innerHTML=classes.map(c=>`<button class="cf-btn${String(c)===currentFilter?' active':''}" data-c="${c}">${c==='전체'?'전체':c+'반'}</button>`).join('');
  document.querySelectorAll('.cf-btn').forEach(btn=>btn.addEventListener('click',()=>{
    currentFilter=btn.dataset.c;renderAll();
  }));
}

/* ── 매트릭스 ── */
function renderMatrix(){
  const list=fSorts();
  document.getElementById('matrix-stats').innerHTML=
    `<div class="stat-chip"><div class="stat-chip-label">분류 제출</div><div class="stat-chip-val">${list.length}</div></div>`;
  let head=`<thead><tr><th class="col-card">카드</th>${IDEOLOGIES.map(io=>`<th style="color:${io.color}">${esc(io.name)}</th>`).join('')}</tr></thead>`;
  let body='<tbody>';
  CARDS.forEach(c=>{
    const counts=IDEOLOGIES.map(io=>list.filter(s=>s.placements&&s.placements[c.id]===io.key).length);
    const max=Math.max(0,...counts);
    body+=`<tr><td class="col-card">
      <div class="mx-card-t"><span class="mx-tag ${c.side==='in'?'inside':'outside'}">${c.side==='in'?'안':'밖'}</span>${esc(c.title)}</div>
      <div class="mx-card-d">${esc(c.desc)}</div>
    </td>`;
    counts.forEach((n,i)=>{
      const io=IDEOLOGIES[i];
      const alpha=list.length&&n?(0.14+0.56*(n/(max||1))):0;
      const pct=list.length?Math.round(n/list.length*100):0;
      body+=`<td><div class="mx-cell${n?'':' zero'}${n&&n===max?' top':''}" style="background:${n?hexA(io.color,alpha):'transparent'}">${n}${n?`<span class="mx-pct">${pct}%</span>`:''}</div></td>`;
    });
    body+='</tr>';
  });
  body+='</tbody>';
  document.getElementById('matrix-table').innerHTML=head+body;
  document.getElementById('matrix-legend').innerHTML= list.length
    ? '색이 짙을수록 많이 몰린 칸입니다. 한 행(카드)이 여러 열에 퍼져 있으면 학생들의 생각이 갈린 카드예요.'
    : '아직 제출된 분류가 없습니다.';
}
function hexA(hex,a){
  const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a.toFixed(2)})`;
}

/* ── 이념 분포 ── */
function renderEssayDist(){
  const list=fEssays();
  const total=list.length||1;
  document.getElementById('essay-dist').innerHTML=IDEOLOGIES.map(io=>{
    const n=list.filter(e=>e.ideology===io.key).length;
    const pct=Math.round(n/total*100);
    return`<div class="dist-item">
      <div class="dist-name" style="color:${io.color}">${esc(io.name)}</div>
      <div class="dist-bar-wrap"><div class="dist-bar" style="width:${list.length?pct:0}%;background:${io.color}"></div></div>
      <div class="dist-n">${n}명</div>
    </div>`;
  }).join('');
}

/* ── 서술 목록 ── */
function scoreBadge(st){
  if(st==='sang')return'<span class="essay-badge eb-sang">상</span>';
  if(st==='jung')return'<span class="essay-badge eb-jung">중</span>';
  if(st==='ha')return'<span class="essay-badge eb-ha">하</span>';
  return'<span class="essay-badge eb-none">미채점</span>';
}
function renderEssayList(){
  const list=fEssays().slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  const el=document.getElementById('essay-list');
  if(!list.length){el.innerHTML='<div class="no-data">아직 제출된 답변이 없습니다.</div>';return;}
  const cardT=id=>{const c=CARDS.find(x=>x.id===id);return c?c.title:'';};
  el.innerHTML=list.map(e=>{
    const io=ideoById(e.ideology);
    const st=e.score||'';
    const evi=(e.inCardId||e.outCardId)?`<div class="essay-evi">근거 — 안: ${esc(cardT(e.inCardId)||'미선택')} / 밖: ${esc(cardT(e.outCardId)||'미선택')}</div>`:'';
    const cmp=(e.firstAnswer||e.changed)?`<div class="essay-cmp"><b>처음:</b> ${esc(e.firstAnswer||'-')}<br><b>달라진 점:</b> ${esc(e.changed||'-')}</div>`:'';
    return`<div class="essay-card" style="--ec:${io?io.color:'#64748B'}">
      <div class="essay-head">
        <span class="essay-ideo">${io?esc(io.name):'이념'}</span>
        <span class="essay-who">${esc(e.name||'')}</span>
        <span class="essay-sid">${esc(String(e.studentId||e.id))}</span>
        ${scoreBadge(st)}
      </div>
      <div class="essay-text">${esc(e.text)} <span style="color:var(--hi-text-muted);font-size:11px">(${e.len||e.text.length}자)</span></div>
      ${evi}${cmp}
      <div class="score-btns">
        <button class="ssb sang${st==='sang'?' active':''}" onclick="window.setScore('${esc(e.id)}','sang')">상</button>
        <button class="ssb jung${st==='jung'?' active':''}" onclick="window.setScore('${esc(e.id)}','jung')">중</button>
        <button class="ssb ha${st==='ha'?' active':''}" onclick="window.setScore('${esc(e.id)}','ha')">하</button>
      </div>
    </div>`;
  }).join('');
}
window.setScore=async(id,st)=>{
  const cur=essays.find(e=>e.id===id);
  const next=(cur&&cur.score===st)?'':st;
  try{await updateDoc(doc(db,ESSAY_COL,id),{score:next});}
  catch(e){alert('오류: '+e.message);}
};

/* ── 현황 ── */
function renderStatus(){
  const nums=[...new Set(roster.map(r=>r.classNum))].filter(n=>n!=null).sort((a,b)=>a-b);
  const scopeRoster=currentFilter==='전체'?roster:roster.filter(r=>String(r.classNum)===currentFilter);
  const sortN=fSorts().length, essayN=fEssays().length, cmpN=fEssays().filter(e=>e.firstAnswer||e.changed).length;
  const expected=scopeRoster.length||Math.max(sortN,essayN);
  document.getElementById('status-stats').innerHTML=
    `<div class="stat-chip"><div class="stat-chip-label">대상</div><div class="stat-chip-val">${expected}</div></div>`+
    `<div class="stat-chip"><div class="stat-chip-label">분류</div><div class="stat-chip-val">${sortN}</div></div>`+
    `<div class="stat-chip"><div class="stat-chip-label">서술</div><div class="stat-chip-val">${essayN}</div></div>`+
    `<div class="stat-chip"><div class="stat-chip-label">비교</div><div class="stat-chip-val">${cmpN}</div></div>`;
  if(currentFilter==='전체'&&nums.length){
    document.getElementById('status-detail').innerHTML='<div class="dist-row" style="margin-top:6px">'+nums.map(cn=>{
      const exp=roster.filter(r=>r.classNum===cn).length||1;
      const sN=sorts.filter(s=>classNumOf(s.id)===cn).length;
      const eN=essays.filter(e=>classNumOf(e.id)===cn&&e.text).length;
      return`<div class="dist-item"><div class="dist-name">${cn}반</div>
        <div class="dist-bar-wrap"><div class="dist-bar" style="width:${Math.round(eN/exp*100)}%;background:var(--jc-primary)"></div></div>
        <div class="dist-n">${eN}/${exp}</div></div>`;
    }).join('')+'</div>';
  }else{document.getElementById('status-detail').innerHTML='';}
}
</script>
