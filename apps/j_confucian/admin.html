<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유교로 나라를 다스린다는 것 : 관리자 모드</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<link rel="stylesheet" href="../../shared/admin-base.css">
<script>if(window.self!==window.top){document.documentElement.classList.add('in-iframe');document.documentElement.classList.add('has-own-back');}</script>
<style>
.hi-preset-paper{
  --hi-ideo-minbon:#2E5A8C; --hi-ideo-deokchi:#6B4C9A; --hi-ideo-ye:#B23A3A; --hi-ideo-gyohwa:#3E7C5A;
  --hi-side-in:#2E5A8C; --hi-side-in-soft:rgba(46,90,140,.14);
  --hi-side-out:#3E7C5A; --hi-side-out-soft:rgba(62,124,90,.14);
}
.hi-sec{background:var(--hi-bg-surface);border:1px solid var(--hi-border);border-radius:var(--hi-r-card);padding:20px;margin-bottom:16px}
.hi-sec-title{font-family:var(--hi-font);font-weight:900;font-size:16px;color:var(--hi-text);margin-bottom:4px}
.hi-sec-desc{font-size:12.5px;color:var(--hi-text-muted);line-height:1.6;margin-bottom:14px;word-break:keep-all}

/* 반 필터 */
.hi-cf-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.hi-cf{border:1.5px solid var(--hi-border);background:var(--hi-bg-surface);border-radius:var(--hi-r-pill);padding:6px 15px;font-size:13px;font-weight:700;color:var(--hi-text-muted);cursor:pointer}
.hi-cf.active{background:var(--hi-text);color:var(--hi-bg-base);border-color:var(--hi-text)}

/* 4사분면 실시간 배치판 */
.hi-quad-board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.hi-quad-board{grid-template-columns:1fr}}
.hi-quad{border:1px solid var(--hi-border);border-top:5px solid var(--ic);border-radius:var(--hi-r-card);background:var(--hi-bg-surface);min-height:210px;display:flex;flex-direction:column}
.hi-quad-head{display:flex;align-items:baseline;gap:10px;padding:12px 15px 10px;border-bottom:1px solid var(--hi-border-faint)}
.hi-quad-name{font-family:var(--hi-font);font-weight:900;font-size:19px;color:var(--ic)}
.hi-quad-sub{font-size:11.5px;color:var(--hi-text-muted)}
.hi-quad-n{margin-left:auto;font-size:12px;font-weight:800;color:var(--hi-text-muted);background:var(--hi-bg-mid);border-radius:var(--hi-r-pill);padding:2px 10px}
.hi-quad-body{padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;flex:1}
.hi-tile{display:inline-flex;flex-direction:column;gap:1px;border-radius:8px;padding:5px 9px;background:var(--hi-bg-card);border:1px solid var(--hi-border-faint)}
.hi-tile.in{background:var(--hi-side-in-soft);border-color:transparent}
.hi-tile.out{background:var(--hi-side-out-soft);border-color:transparent}
.hi-tile-t{font-size:12px;font-weight:800;color:var(--hi-text);line-height:1.25}
.hi-tile-n{font-size:9.5px;color:var(--hi-text-muted);font-weight:600}
.hi-quad-empty{font-size:12px;color:var(--hi-text-muted);opacity:.7;padding:14px 2px}
.hi-board-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--hi-text-muted);margin-top:12px}
.hi-board-legend .k{display:inline-flex;align-items:center;gap:5px}
.hi-board-legend .sw{width:12px;height:12px;border-radius:3px}

/* 통계 */
.hi-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.hi-stat{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:14px;padding:12px 20px;text-align:center;min-width:92px}
.hi-stat-l{font-size:12px;font-weight:700;color:var(--hi-text-muted);margin-bottom:6px}
.hi-stat-v{font-family:var(--hi-font);font-weight:900;font-size:28px;line-height:1;color:var(--hi-text)}

/* 이념 분포 바 */
.hi-dist{display:flex;flex-direction:column;gap:7px}
.hi-dist-i{display:flex;align-items:center;gap:10px}
.hi-dist-n{width:88px;flex-shrink:0;font-weight:800;font-size:13px;color:var(--ic)}
.hi-dist-bw{flex:1;background:var(--hi-bg-mid);border-radius:7px;height:20px;overflow:hidden}
.hi-dist-b{height:100%;border-radius:7px;background:var(--ic)}
.hi-dist-c{width:48px;text-align:right;font-size:12px;font-weight:800;color:var(--hi-text-muted)}

/* 서술 카드 */
.hi-essay{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:12px;padding:13px 15px;margin-bottom:9px;border-top:3px solid var(--ic,var(--hi-accent))}
.hi-essay-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.hi-essay-ideo{font-size:11px;font-weight:800;color:#fff;background:var(--ic,var(--hi-accent));border-radius:6px;padding:2px 9px}
.hi-essay-who{font-size:12.5px;font-weight:700;color:var(--hi-text)}
.hi-essay-sid{font-size:11px;color:var(--hi-text-muted);font-weight:600}
.hi-essay-badge{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px}
.hi-eb-none{background:var(--hi-bg-mid);color:var(--hi-text-muted)}
.hi-eb-pass{background:var(--hi-positive-soft);color:var(--hi-positive)}
.hi-eb-fail{background:var(--hi-negative-soft);color:var(--hi-negative)}
.hi-essay-text{font-size:13.5px;color:var(--hi-text);line-height:1.7;word-break:keep-all}
.hi-essay-evi{font-size:11.5px;color:var(--hi-text-muted);margin-top:7px}
.hi-essay-cmp{margin-top:9px;padding-top:9px;border-top:1px dashed var(--hi-border);font-size:12px;color:var(--hi-text-muted);line-height:1.6}
.hi-essay-cmp b{color:var(--hi-text)}
.hi-score{display:flex;gap:6px;margin-top:10px}
.hi-sbtn{padding:5px 16px;border-radius:8px;font-family:inherit;font-size:12px;font-weight:700;border:1.5px solid transparent;cursor:pointer;background:var(--hi-bg-mid);color:var(--hi-text-muted)}
.hi-sbtn.pass.active{background:var(--hi-positive);color:#fff}
.hi-sbtn.fail.active{background:var(--hi-negative);color:#fff}

.hi-nodata{text-align:center;padding:40px 20px;color:var(--hi-text-muted);font-size:14px}
</style>
</head>
<body class="hi-preset-paper">

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">유교로 나라를 다스린다는 것</div>
    <div class="login-sub">관리자 모드</div>
    <div class="field-group" style="text-align:left;margin-bottom:14px">
      <label class="form-label">이메일</label>
      <input type="email" class="hi-input" id="gate-email" placeholder="이메일">
    </div>
    <div class="field-group" style="text-align:left;margin-bottom:14px">
      <label class="form-label">비밀번호</label>
      <input type="password" class="hi-input" id="gate-pw" placeholder="비밀번호">
    </div>
    <div class="login-err" id="gate-err"></div>
    <button class="login-btn" id="gate-login-btn">접속하기</button>
  </div>
</div>

<div id="adminApp">
  <header class="adm-header">
    <div class="adm-logo">유교로 다스린다는 것<span class="adm-badge">관리자 모드</span></div>
    <div class="adm-tabs">
      <button class="adm-tab active" data-tab="board">BOARD</button>
      <button class="adm-tab" data-tab="answer">ANSWER</button>
      <button class="adm-tab" data-tab="status">STATUS</button>
    </div>
    <button class="adm-logout" id="logout-btn">로그아웃</button>
    <button class="adm-back" onclick="window.parent.closeAppAdmin&&window.parent.closeAppAdmin()">목록으로</button>
  </header>

  <div class="adm-body">
  <div class="admin-container">

    <div class="hi-cf-row" id="class-filter"></div>

    <!-- BOARD (4사분면 실시간) -->
    <div class="tab-panel active" id="tab-board">
      <div class="hi-sec-title">실시간 분류판</div>
      <div class="hi-sec-desc">학생이 자기 화면에서 카드를 이념 칸에 놓는 즉시, 그 카드가 아래 사분면에 실시간으로 쌓입니다. 같은 카드가 한 칸에 몰리면 합의, 여러 칸에 흩어지면 <b>생각이 갈린 카드</b>입니다.</div>
      <div class="hi-quad-board" id="quad-board"></div>
      <div class="hi-board-legend">
        <span class="k"><span class="sw" style="background:var(--hi-side-in)"></span>나라 안 (통치 체제)</span>
        <span class="k"><span class="sw" style="background:var(--hi-side-out)"></span>나라 밖 (대외 관계)</span>
      </div>
    </div>

    <!-- ANSWER -->
    <div class="tab-panel" id="tab-answer">
      <div class="hi-sec">
        <div class="hi-sec-title">고른 이념 분포</div>
        <div class="hi-sec-desc">학생들이 서술에서 중심으로 고른 이념입니다.</div>
        <div class="hi-dist" id="ideo-dist"></div>
      </div>
      <div class="hi-sec">
        <div class="hi-sec-title">학생 답변 (실시간)</div>
        <div class="hi-sec-desc">통과 / 미흡으로 채점할 수 있습니다. 좋은 답을 골라 화면에 띄워 함께 읽어 보세요.</div>
        <div id="essay-list"></div>
      </div>
    </div>

    <!-- STATUS -->
    <div class="tab-panel" id="tab-status">
      <div class="hi-sec">
        <div class="hi-sec-title">제출 현황</div>
        <div class="hi-sec-desc">반별 참여 현황입니다.</div>
        <div class="hi-stats" id="status-stats"></div>
        <div id="status-detail"></div>
      </div>
    </div>

  </div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,collection,onSnapshot,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "../../shared/firebase-config.js";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const rtdb=getDatabase(app);

const IDEOLOGIES=[
  {key:'minbon', name:'민본',       sub:'백성이 나라의 근본이다',            v:'--hi-ideo-minbon'},
  {key:'deokchi',name:'덕치와 문치', sub:'힘이 아니라 덕과 학문으로 다스린다', v:'--hi-ideo-deokchi'},
  {key:'ye',     name:'예와 명분',   sub:'관계마다 지켜야 할 도리가 있다',    v:'--hi-ideo-ye'},
  {key:'gyohwa', name:'교화',       sub:'백성을 가르쳐 바르게 이끈다',      v:'--hi-ideo-gyohwa'}
];
const CARDS=[
  {id:'in1', side:'in',  title:'의정부와 경연'},
  {id:'in2', side:'in',  title:'3사'},
  {id:'in3', side:'in',  title:'과거제'},
  {id:'in4', side:'in',  title:'수령의 임무'},
  {id:'in5', side:'in',  title:'향교와 성균관'},
  {id:'in6', side:'in',  title:'8도와 수령 파견'},
  {id:'out1',side:'out', title:'사대'},
  {id:'out2',side:'out', title:'조공과 책봉'},
  {id:'out3',side:'out', title:'교린'},
  {id:'out4',side:'out', title:'여진에게 관직과 토지'},
  {id:'out5',side:'out', title:'약 200년간의 평화'},
  {id:'out6',side:'out', title:'류큐, 시암, 자와와 교류'}
];
const CARD_IDX={};CARDS.forEach((c,i)=>CARD_IDX[c.id]=i);
const SORT_COL='j_confucian_sorts';
const ESSAY_COL='j_confucian_essays';

let roster=[], sorts=[], essays=[];
let currentFilter='전체';
let sortsUnsub=null, essaysUnsub=null;
const isEmbedded=window.self!==window.top;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function classNumOf(sid){sid=String(sid||'');if(sid.length<3)return null;const c=parseInt(sid.slice(1,3),10);return isNaN(c)?null:c;}
function cardById(id){return CARDS.find(c=>c.id===id);}
function ideoById(k){return IDEOLOGIES.find(i=>i.key===k);}

async function initAdmin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminApp').classList.add('show');
  await loadRoster();
  startListeners();
}
if(isEmbedded){document.documentElement.classList.add('has-own-back');initAdmin();}
else{
  onAuthStateChanged(auth,user=>{
    if(user){initAdmin();}
    else{
      document.getElementById('loginScreen').style.display='';
      document.getElementById('adminApp').classList.remove('show');
      if(sortsUnsub){sortsUnsub();sortsUnsub=null;}
      if(essaysUnsub){essaysUnsub();essaysUnsub=null;}
    }
  });
}
document.getElementById('gate-login-btn').addEventListener('click',async()=>{
  const email=document.getElementById('gate-email').value.trim();
  const pw=document.getElementById('gate-pw').value;
  const errEl=document.getElementById('gate-err');errEl.classList.remove('show');
  try{await signInWithEmailAndPassword(auth,email,pw);}
  catch(e){errEl.textContent='이메일 또는 비밀번호를 확인해 주세요.';errEl.classList.add('show');}
});
document.getElementById('gate-pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('gate-login-btn').click();});
document.getElementById('logout-btn').addEventListener('click',()=>signOut(auth));

document.querySelectorAll('.adm-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.adm-tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

async function loadRoster(){
  try{
    const snap=await get(ref(rtdb,'students'));
    const data=snap.val()||{};
    roster=Object.values(data).filter(Boolean)
      .map(s=>({studentId:String(s.studentId||s.id||'').trim(),name:s.name||''}))
      .filter(s=>s.studentId).map(s=>({...s,classNum:classNumOf(s.studentId)}))
      .filter(s=>s.classNum!==0);
  }catch(e){roster=[];}
}

function startListeners(){
  if(sortsUnsub)sortsUnsub();if(essaysUnsub)essaysUnsub();
  sortsUnsub=onSnapshot(collection(db,SORT_COL),snap=>{
    sorts=[];snap.forEach(d=>{if(classNumOf(d.id)!==0)sorts.push({id:d.id,...d.data()});});
    renderAll();
  });
  essaysUnsub=onSnapshot(collection(db,ESSAY_COL),snap=>{
    essays=[];snap.forEach(d=>{if(classNumOf(d.id)!==0)essays.push({id:d.id,...d.data()});});
    renderAll();
  });
}
function renderAll(){renderClassFilter();renderBoard();renderIdeoDist();renderEssays();renderStatus();}

function inFilter(sid){return currentFilter==='전체'||String(classNumOf(sid))===currentFilter;}
function fSorts(){return sorts.filter(s=>inFilter(s.id));}
function fEssays(){return essays.filter(e=>inFilter(e.id)&&e.text);}

function renderClassFilter(){
  const nums=[...new Set([...roster.map(r=>r.classNum),...sorts.map(s=>classNumOf(s.id)),...essays.map(e=>classNumOf(e.id))])].filter(n=>n!=null).sort((a,b)=>a-b);
  const classes=['전체',...nums];
  document.getElementById('class-filter').innerHTML=classes.map(c=>`<button class="hi-cf${String(c)===currentFilter?' active':''}" data-c="${c}">${c==='전체'?'전체':c+'반'}</button>`).join('');
  document.querySelectorAll('.hi-cf').forEach(btn=>btn.addEventListener('click',()=>{currentFilter=btn.dataset.c;renderAll();}));
}

/* ── 4사분면 실시간 배치판 ── */
function renderBoard(){
  const list=fSorts();
  // 이념별 배치 타일 수집: {ideoKey: [{card, name}]}
  const byIdeo={};IDEOLOGIES.forEach(io=>byIdeo[io.key]=[]);
  list.forEach(s=>{
    const p=s.placements||{};
    Object.keys(p).forEach(cid=>{
      const card=cardById(cid);const k=p[cid];
      if(card&&byIdeo[k])byIdeo[k].push({card,name:s.name||String(s.id)});
    });
  });
  document.getElementById('quad-board').innerHTML=IDEOLOGIES.map(io=>{
    const tiles=byIdeo[io.key].sort((a,b)=>CARD_IDX[a.card.id]-CARD_IDX[b.card.id]);
    const body=tiles.length?tiles.map(t=>`
      <div class="hi-tile ${t.card.side}">
        <span class="hi-tile-t">${esc(t.card.title)}</span>
        <span class="hi-tile-n">${esc(t.name)}</span>
      </div>`).join('')
      :'<div class="hi-quad-empty">아직 이 칸에 놓인 카드가 없어요.</div>';
    return`<div class="hi-quad" style="--ic:var(${io.v})">
      <div class="hi-quad-head">
        <span class="hi-quad-name">${esc(io.name)}</span>
        <span class="hi-quad-sub">${esc(io.sub)}</span>
        <span class="hi-quad-n">${tiles.length}장</span>
      </div>
      <div class="hi-quad-body">${body}</div>
    </div>`;
  }).join('');
}

/* ── 이념 분포 ── */
function renderIdeoDist(){
  const list=fEssays();
  const total=list.length||1;
  document.getElementById('ideo-dist').innerHTML=IDEOLOGIES.map(io=>{
    const n=list.filter(e=>e.ideology===io.key).length;
    const pct=Math.round(n/total*100);
    return`<div class="hi-dist-i" style="--ic:var(${io.v})">
      <div class="hi-dist-n">${esc(io.name)}</div>
      <div class="hi-dist-bw"><div class="hi-dist-b" style="width:${list.length?pct:0}%"></div></div>
      <div class="hi-dist-c">${n}명</div>
    </div>`;
  }).join('');
}

/* ── 서술 목록 + 통과/미흡 채점 (표준 status 스키마) ── */
function statusBadge(st){
  if(st==='pass')return'<span class="hi-essay-badge hi-eb-pass">통과</span>';
  if(st==='fail')return'<span class="hi-essay-badge hi-eb-fail">미흡</span>';
  return'<span class="hi-essay-badge hi-eb-none">미채점</span>';
}
function renderEssays(){
  const list=fEssays().slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  const el=document.getElementById('essay-list');
  if(!list.length){el.innerHTML='<div class="hi-nodata">아직 제출된 답변이 없습니다.</div>';return;}
  const cardT=id=>{const c=cardById(id);return c?c.title:'';};
  el.innerHTML=list.map(e=>{
    const io=ideoById(e.ideology);
    const st=e.status||'';
    const evi=(e.inCardId||e.outCardId)?`<div class="hi-essay-evi">근거 — 안: ${esc(cardT(e.inCardId)||'미선택')} / 밖: ${esc(cardT(e.outCardId)||'미선택')}</div>`:'';
    const cmp=(e.firstAnswer||e.changed)?`<div class="hi-essay-cmp"><b>처음:</b> ${esc(e.firstAnswer||'-')}<br><b>달라진 점:</b> ${esc(e.changed||'-')}</div>`:'';
    return`<div class="hi-essay" style="--ic:var(${io?io.v:'--hi-accent'})">
      <div class="hi-essay-head">
        <span class="hi-essay-ideo">${io?esc(io.name):'이념'}</span>
        <span class="hi-essay-who">${esc(e.name||'')}</span>
        <span class="hi-essay-sid">${esc(String(e.studentId||e.id))}</span>
        ${statusBadge(st)}
      </div>
      <div class="hi-essay-text">${esc(e.text)} <span style="color:var(--hi-text-muted);font-size:11px">(${e.len||e.text.length}자)</span></div>
      ${evi}${cmp}
      <div class="hi-score">
        <button class="hi-sbtn pass${st==='pass'?' active':''}" onclick="window.setStatus('${esc(e.id)}','pass')">통과</button>
        <button class="hi-sbtn fail${st==='fail'?' active':''}" onclick="window.setStatus('${esc(e.id)}','fail')">미흡</button>
      </div>
    </div>`;
  }).join('');
}
window.setStatus=async(id,st)=>{
  const cur=essays.find(e=>e.id===id);
  const next=(cur&&cur.status===st)?null:st;
  try{await updateDoc(doc(db,ESSAY_COL,id),{status:next});}
  catch(e){alert('오류: '+e.message);}
};

/* ── 현황 ── */
function renderStatus(){
  const nums=[...new Set(roster.map(r=>r.classNum))].filter(n=>n!=null).sort((a,b)=>a-b);
  const scopeRoster=currentFilter==='전체'?roster:roster.filter(r=>String(r.classNum)===currentFilter);
  const sortN=fSorts().filter(s=>s.placements&&Object.keys(s.placements).length).length;
  const essayN=fEssays().length;
  const cmpN=fEssays().filter(e=>e.firstAnswer||e.changed).length;
  const expected=scopeRoster.length||Math.max(sortN,essayN);
  document.getElementById('status-stats').innerHTML=
    `<div class="hi-stat"><div class="hi-stat-l">대상</div><div class="hi-stat-v">${expected}</div></div>`+
    `<div class="hi-stat"><div class="hi-stat-l">분류</div><div class="hi-stat-v">${sortN}</div></div>`+
    `<div class="hi-stat"><div class="hi-stat-l">서술</div><div class="hi-stat-v">${essayN}</div></div>`+
    `<div class="hi-stat"><div class="hi-stat-l">비교</div><div class="hi-stat-v">${cmpN}</div></div>`;
  if(currentFilter==='전체'&&nums.length){
    document.getElementById('status-detail').innerHTML='<div class="hi-dist" style="margin-top:6px">'+nums.map(cn=>{
      const exp=roster.filter(r=>r.classNum===cn).length||1;
      const eN=essays.filter(e=>classNumOf(e.id)===cn&&e.text).length;
      return`<div class="hi-dist-i" style="--ic:var(--hi-accent)"><div class="hi-dist-n" style="color:var(--hi-text)">${cn}반</div>
        <div class="hi-dist-bw"><div class="hi-dist-b" style="width:${Math.round(eN/exp*100)}%"></div></div>
        <div class="hi-dist-c">${eN}/${exp}</div></div>`;
    }).join('')+'</div>';
  }else{document.getElementById('status-detail').innerHTML='';}
}
</script>
