<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생각 체크 중복 포인트 정리 - 관리자 모드</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/admin-base.css">
<style>
.mig-wrap{max-width:720px;margin:0 auto;padding:32px 20px 80px}
.mig-card{background:var(--hi-bg-card);border:1px solid var(--hi-border);border-radius:14px;padding:20px;margin-bottom:16px}
.mig-title{font-weight:800;font-size:15px;color:var(--hi-text);margin-bottom:4px}
.mig-desc{font-size:13px;color:var(--hi-text-muted);margin-bottom:14px;line-height:1.6}
.mig-result{font-size:13px;color:var(--hi-text-soft);margin-top:10px;white-space:pre-line}
.dup-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--hi-bg-soft);margin-bottom:8px;font-size:13px}
.dup-name{font-weight:700;color:var(--hi-text)}
.dup-lec{color:var(--hi-text-muted);margin-left:6px}
.dup-pt{font-weight:800;color:#DC2626}
</style>
</head>
<body class="hi-preset-admin">

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">생각 체크 중복 포인트 정리</div>
    <div class="login-sub">관리자 모드</div>
    <input type="email" class="hi-input" id="adminEmail"
           placeholder="이메일" autocomplete="username"
           onkeydown="if(event.key==='Enter') document.getElementById('adminPw').focus()"
           style="margin-bottom:10px;">
    <input type="password" class="hi-input" id="adminPw"
           placeholder="비밀번호" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') tryLogin()"
           style="text-align:center; letter-spacing:3px;">
    <div class="login-err" id="loginErr">이메일 또는 비밀번호가 올바르지 않습니다</div>
    <button class="login-btn" id="loginBtn" onclick="tryLogin()">접속하기</button>
  </div>
</div>

<div id="adminApp" style="display:none">
  <header class="adm-header">
    <div class="adm-logo">생각 체크 중복 포인트 정리</div>
    <button class="adm-logout" onclick="logoutAdmin()">로그아웃</button>
  </header>
  <div class="mig-wrap">
    <div class="mig-card">
      <div class="mig-title">같은 학생·같은 강의에 중복 제출돼 포인트가 두 번 지급된 경우 정리</div>
      <div class="mig-desc">
        학생이 같은 생각 체크 강의에 두 번 이상 제출하고 둘 다 채점·포인트 지급된 경우를 찾습니다.
        가장 먼저 제출한 것만 정상 지급으로 남기고, 나머지 제출은 지급된 포인트를 회수한 뒤
        "중복 제출(포인트 회수됨)"로 표시합니다. 먼저 "찾기"로 대상을 확인한 뒤 "포인트 회수 실행"을 눌러주세요.
      </div>
      <button class="hi-btn hi-btn-primary hi-btn-sm" id="btn-scan" onclick="scanDuplicates()">찾기</button>
      <button class="hi-btn hi-btn-primary hi-btn-sm" id="btn-fix" onclick="fixDuplicates()" style="display:none;margin-left:8px">포인트 회수 실행</button>
      <div id="dup-list" style="margin-top:16px"></div>
      <div class="mig-result" id="result-main"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get, set, push, update, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "../shared/firebase-config.js";
import { adminAddXP, loadXPConfig } from "../shared/xp.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const rtdb = getDatabase(app);
const auth = getAuth(app);
const fbFns = { ref, get, set, push, update, onValue };

window.tryLogin = async () => {
  const email = document.getElementById('adminEmail').value.trim();
  const pw = document.getElementById('adminPw').value;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.classList.remove('show');
  if (!email || !pw) { err.textContent = '이메일과 비밀번호를 입력해주세요'; err.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = '접속 중...';
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch (e) {
    err.textContent = '이메일 또는 비밀번호가 올바르지 않습니다';
    err.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = '접속하기';
  }
};
window.logoutAdmin = () => signOut(auth);

onAuthStateChanged(auth, user => {
  document.getElementById('loginScreen').style.display = user ? 'none' : 'flex';
  document.getElementById('adminApp').style.display = user ? 'block' : 'none';
});

let _dupGroups = []; // 회수 대상: [{ id, name, lectureTitle, keepSubId, refundDocs:[{subId, aiPt}] }]

// 학번 앞자리로 반 구분 없이, 학생 id + lectureDocId 조합으로 중복을 찾는다.
window.scanDuplicates = async function() {
  const btn = document.getElementById('btn-scan');
  const listEl = document.getElementById('dup-list');
  const resultEl = document.getElementById('result-main');
  btn.disabled = true; btn.textContent = '검색 중…';
  resultEl.textContent = '';
  listEl.innerHTML = '';
  try {
    const snap = await getDocs(collection(db, 'think_submissions'));
    const subs = snap.docs.map(d => ({ subId: d.id, ...d.data() }));
    const groups = {};
    subs.forEach(s => {
      const key = s.id + '|' + s.lectureDocId;
      (groups[key] = groups[key] || []).push(s);
    });
    _dupGroups = [];
    Object.values(groups).forEach(arr => {
      if (arr.length < 2) return;
      const paid = arr.filter(s => s.xpAwarded && (s.aiPt || 0) > 0);
      if (paid.length < 2) return; // 중복 제출은 있지만 실제로 두 번 이상 지급된 경우만 대상
      const sorted = paid.slice().sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
      const keep = sorted[0];
      const refund = sorted.slice(1);
      _dupGroups.push({
        id: keep.id, name: keep.name, lectureTitle: keep.lectureTitle,
        keepSubId: keep.subId,
        refundDocs: refund.map(s => ({ subId: s.subId, aiPt: s.aiPt || 0 })),
        totalRefund: refund.reduce((sum, s) => sum + (s.aiPt || 0), 0)
      });
    });
    if (!_dupGroups.length) {
      listEl.innerHTML = '<p style="font-size:13px;color:var(--hi-text-muted)">중복 지급된 건이 없습니다.</p>';
    } else {
      listEl.innerHTML = _dupGroups.map(g => `
        <div class="dup-row">
          <div><span class="dup-name">${esc(g.id)} ${esc(g.name)}</span><span class="dup-lec">${esc(stripEmph(g.lectureTitle||''))}</span></div>
          <div class="dup-pt">-${g.totalRefund}pt (${g.refundDocs.length}건 회수)</div>
        </div>`).join('');
      document.getElementById('btn-fix').style.display = 'inline-block';
    }
    resultEl.textContent = `총 ${_dupGroups.length}명 대상 발견. 아래 "포인트 회수 실행"을 눌러 반영하세요.`;
  } catch (e) {
    resultEl.textContent = '오류: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '찾기';
  }
};

window.fixDuplicates = async function() {
  if (!_dupGroups.length) return;
  if (!confirm(`${_dupGroups.length}명의 중복 지급 포인트를 회수합니다. 진행할까요?`)) return;
  const btn = document.getElementById('btn-fix');
  const resultEl = document.getElementById('result-main');
  btn.disabled = true; btn.textContent = '회수 중…';
  const cfg = await loadXPConfig(rtdb, fbFns);
  let done = 0, failed = 0;
  for (const g of _dupGroups) {
    try {
      if (g.totalRefund > 0) {
        await adminAddXP(rtdb, g.id, g.name, -g.totalRefund, `생각 체크 중복 제출 포인트 회수: ${stripEmph(g.lectureTitle||'')}`, fbFns, cfg.levels, cfg.levelFormula);
      }
      for (const rd of g.refundDocs) {
        await updateDoc(doc(db, 'think_submissions', rd.subId), {
          aiPt: 0, xpAwarded: false, aiVerdict: '중복 제출(포인트 회수됨)'
        });
      }
      done++;
    } catch (e) {
      console.warn('회수 실패:', g.id, e);
      failed++;
    }
  }
  resultEl.textContent = `완료: ${done}명 처리${failed ? `, 실패 ${failed}명` : ''}.`;
  btn.disabled = false; btn.textContent = '포인트 회수 실행';
  document.getElementById('dup-list').innerHTML = '';
  _dupGroups = [];
  document.getElementById('btn-fix').style.display = 'none';
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stripEmph(t) { return String(t || '').replace(/\*\*/g, ''); }
</script>
</body>
</html>
