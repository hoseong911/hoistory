<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>중3 사회 수행평가 문제 추첨</title>
<meta name="theme-color" content="#FF6B3D">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --hairline-soft:#ECEAE4;
  --ink-deep:#0A1317;--charcoal:#4A5568;--slate:#6B7280;
  --primary:#FF6B3D;--primary-deep:#E24E1B;--primary-l:rgba(255,107,61,0.14);
  --shadow:rgba(20,22,26,0.10) 0px 1px 4px 0px;
  --shadow-hover:rgba(20,22,26,0.16) 0px 10px 24px 0px;
}
html{background:linear-gradient(160deg,#FFF1EB 0%,#F4F3EE 50%,#EEF1F5 100%);min-height:100%}
html,body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;color:var(--ink-deep);-webkit-font-smoothing:antialiased}
body{background:transparent;overflow-x:hidden}
body::before{content:'';position:fixed;top:-160px;right:-120px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,61,0.28) 0%,rgba(255,107,61,0) 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-140px;left:-100px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(39,56,79,0.16) 0%,rgba(39,56,79,0) 70%);pointer-events:none;z-index:0}

.page{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:34px 28px 44px;
  display:flex;flex-direction:column;align-items:center;min-height:100vh}

h1{font-family:'Paperlogy',sans-serif;font-weight:700;font-size:40px;letter-spacing:.2px;line-height:1.25;text-align:center}
h1 span{color:var(--primary-deep)}
.sub{margin-top:10px;font-size:18px;color:var(--slate);text-align:center}

/* ===== 결과 카드 ===== */
.card{
  width:100%;margin-top:26px;background:rgba(255,255,255,.82);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--hairline-soft);border-radius:36px;
  box-shadow:var(--shadow);padding:40px 32px;
  display:flex;flex-direction:column;align-items:center;gap:24px;
}
.card.pop{animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{0%{transform:scale(.95);opacity:.6}60%{transform:scale(1.015)}100%{transform:scale(1);opacity:1}}

.card-label{font-size:18px;font-weight:700;letter-spacing:4px;color:var(--primary-deep)}
.q-row{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.q{
  width:170px;height:170px;border-radius:44px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Paperlogy',sans-serif;font-weight:900;font-size:96px;color:#fff;line-height:1;
  background:linear-gradient(135deg,rgba(255,107,61,.95),rgba(226,78,27,.96));
  box-shadow:0 12px 30px rgba(226,78,27,.24);
  font-variant-numeric:tabular-nums;
}
.card.idle .q,.card.rolling .q{background:#E6E4DE;color:#B6B4AE;box-shadow:none}

/* ===== 버튼 ===== */
.btn{
  border:none;cursor:pointer;font-family:'Paperlogy',sans-serif;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,rgba(255,107,61,.95),rgba(226,78,27,.96));color:#fff;
  box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.btn:active{transform:translateY(0) scale(.99)}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:var(--shadow)}
.btn-draw{margin-top:30px;width:100%;max-width:440px;font-size:28px;padding:22px 28px;border-radius:999px}

/* ===== 타이머 ===== */
.timer{
  width:100%;max-width:560px;margin-top:34px;background:rgba(255,255,255,.82);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--hairline-soft);border-radius:36px;
  box-shadow:var(--shadow);padding:32px 32px 34px;
  display:flex;flex-direction:column;align-items:center;gap:22px;
}
.timer[hidden]{display:none}
.timer.show{animation:rise .45s cubic-bezier(.2,1,.4,1)}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}

.ring-wrap{position:relative;width:300px;height:300px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#EDEBE5;stroke-width:16}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.timer.done .ring-fg{stroke:#E24E1B}
.time-text{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.time-text .val{font-family:'Paperlogy',sans-serif;font-weight:900;font-size:74px;line-height:1;color:var(--ink-deep);font-variant-numeric:tabular-nums}
.time-text .state{font-size:15px;font-weight:700;color:var(--slate);letter-spacing:1px}
.timer.done .time-text .val{color:var(--primary-deep)}
.timer.done{animation:flash 1s ease-in-out 6}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 6px var(--primary-l),0 12px 34px rgba(226,78,27,.28)}}

.presets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{
  border:1px solid var(--hairline-soft);background:rgba(255,255,255,.75);
  font-family:'Pretendard',sans-serif;font-size:17px;font-weight:700;color:var(--charcoal);
  padding:11px 20px;border-radius:999px;cursor:pointer;transition:all .15s ease;
}
.chip:hover{border-color:rgba(255,107,61,.45);color:var(--primary-deep)}
.chip.active{background:linear-gradient(135deg,rgba(255,107,61,.95),rgba(226,78,27,.96));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(226,78,27,.2)}

.timer-ctrl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-timer{font-size:21px;padding:15px 38px;border-radius:999px;min-width:150px}
.btn-ghost{background:rgba(255,255,255,.8);color:var(--charcoal);border:1px solid var(--hairline-soft);box-shadow:none}
.btn-ghost:hover{color:var(--primary-deep);border-color:rgba(255,107,61,.45);box-shadow:var(--shadow)}

.foot{margin-top:auto;padding-top:30px;font-size:13px;color:var(--slate);text-align:center}

/* 화면이 넓으면 문제·타이머를 좌우로 */
@media (min-width:1040px){
  .page{padding-top:40px}
  .stage{display:flex;align-items:stretch;gap:28px;width:100%;margin-top:26px}
  .stage .card{margin-top:0;flex:1;justify-content:center}
  .timer{margin-top:0;width:520px;max-width:520px;flex:none}
}
@media (max-width:720px){
  h1{font-size:30px}
  .q{width:120px;height:120px;font-size:68px;border-radius:34px}
  .ring-wrap{width:250px;height:250px}
  .time-text .val{font-size:60px}
}
</style>
</head>
<body>
<div class="page">
  <h1>중3 사회 <span>수행평가</span> 문제 추첨</h1>
  <p class="sub">버튼을 누르면 16개 조합 중 하나가 뽑힙니다</p>

  <div class="stage">
    <div class="card idle" id="card">
      <div class="card-label">문제 번호</div>
      <div class="q-row" id="qRow">
        <div class="q">?</div><div class="q">?</div><div class="q">?</div><div class="q">?</div>
      </div>
    </div>

    <!-- 타이머: 추첨이 끝나면 나타난다 -->
    <section class="timer" id="timer" hidden>
      <div class="ring-wrap">
        <svg viewBox="0 0 300 300">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF6B3D"/><stop offset="100%" stop-color="#E24E1B"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="150" cy="150" r="132"/>
          <circle class="ring-fg" id="ringFg" cx="150" cy="150" r="132"/>
        </svg>
        <div class="time-text">
          <div class="val" id="timeVal">05:00</div>
          <div class="state" id="timeState">대기 중</div>
        </div>
      </div>

      <div class="presets" id="presets">
        <button class="chip" data-min="1">1분</button>
        <button class="chip" data-min="3">3분</button>
        <button class="chip active" data-min="5">5분</button>
        <button class="chip" data-min="10">10분</button>
        <button class="chip" data-min="15">15분</button>
      </div>

      <div class="timer-ctrl">
        <button class="btn btn-timer" id="startBtn">시작</button>
        <button class="btn btn-timer btn-ghost" id="resetBtn">초기화</button>
      </div>
    </section>
  </div>

  <button class="btn btn-draw" id="drawBtn">추첨하기</button>

  <div class="foot">Dive into HISTORY</div>
</div>

<script>
/* ===== 조합표 (조합 1~16 → 문제 번호 4개) ===== */
var COMBOS = [
  [1,2,4,7],[1,2,4,8],[1,2,6,7],[1,2,6,8],
  [1,4,5,7],[1,4,5,8],[1,5,6,7],[1,5,6,8],
  [2,3,4,7],[2,3,4,8],[2,3,6,7],[2,3,6,8],
  [3,4,5,7],[3,4,5,8],[3,5,6,7],[3,5,6,8]
];

var card  = document.getElementById('card');
var qRow  = document.getElementById('qRow');
var btn   = document.getElementById('drawBtn');
var timerEl = document.getElementById('timer');
var rolling = false;

function render(idx){
  qRow.innerHTML = COMBOS[idx].map(function(n){ return '<div class="q">' + n + '</div>'; }).join('');
}

function draw(){
  if(rolling) return;
  rolling = true;
  btn.disabled = true;
  card.classList.remove('idle', 'pop');
  card.classList.add('rolling');

  var target = Math.floor(Math.random() * COMBOS.length);
  var start = Date.now();
  var DURATION = 1100;

  (function spin(){
    var t = Date.now() - start;
    if(t < DURATION){
      render(Math.floor(Math.random() * COMBOS.length));
      setTimeout(spin, 45 + 170 * Math.pow(t / DURATION, 3));   // 뒤로 갈수록 느려지게
    }else{
      card.classList.remove('rolling');
      render(target);
      void card.offsetWidth;
      card.classList.add('pop');
      btn.textContent = '다시 추첨';
      btn.disabled = false;
      rolling = false;
      showTimer();
    }
  })();
}
btn.addEventListener('click', draw);

/* ===== 타이머 (네이버 타이머 방식: 원형 게이지 + 프리셋 + 시작/일시정지/초기화) ===== */
var ringFg    = document.getElementById('ringFg');
var timeVal   = document.getElementById('timeVal');
var timeState = document.getElementById('timeState');
var startBtn  = document.getElementById('startBtn');
var resetBtn  = document.getElementById('resetBtn');
var presets   = document.getElementById('presets');

var R = 132, CIRC = 2 * Math.PI * R;
ringFg.style.strokeDasharray = CIRC;

var totalMs = 5 * 60 * 1000;   // 기본 5분
var remainMs = totalMs;
var endAt = 0;
var running = false;
var rafId = null;
var alarmTimer = null;

function fmt(ms){
  var s = Math.ceil(ms / 1000);
  var m = Math.floor(s / 60);
  s = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function paint(){
  timeVal.textContent = fmt(Math.max(0, remainMs));
  var ratio = totalMs > 0 ? Math.max(0, remainMs) / totalMs : 0;
  ringFg.style.strokeDashoffset = CIRC * (1 - ratio);
}

function setTotal(ms){
  stopAlarm();
  running = false;
  if(rafId) cancelAnimationFrame(rafId);
  timerEl.classList.remove('done');
  totalMs = ms;
  remainMs = ms;
  startBtn.textContent = '시작';
  timeState.textContent = '대기 중';
  paint();
}

function tick(){
  remainMs = endAt - Date.now();
  if(remainMs <= 0){
    remainMs = 0;
    running = false;
    paint();
    finish();
    return;
  }
  paint();
  rafId = requestAnimationFrame(tick);
}

function startTimer(){
  if(remainMs <= 0) setTotal(totalMs);
  running = true;
  timerEl.classList.remove('done');
  endAt = Date.now() + remainMs;
  startBtn.textContent = '일시정지';
  timeState.textContent = '진행 중';
  rafId = requestAnimationFrame(tick);
}

function pauseTimer(){
  running = false;
  if(rafId) cancelAnimationFrame(rafId);
  remainMs = Math.max(0, endAt - Date.now());
  startBtn.textContent = '이어서';
  timeState.textContent = '일시정지';
  paint();
}

function finish(){
  startBtn.textContent = '시작';
  timeState.textContent = '시간 종료';
  timerEl.classList.add('done');
  playAlarm();
}

startBtn.addEventListener('click', function(){
  if(running) pauseTimer();
  else { stopAlarm(); startTimer(); }
});
resetBtn.addEventListener('click', function(){ setTotal(totalMs); });

presets.addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if(!chip) return;
  var chips = presets.querySelectorAll('.chip');
  for(var i = 0; i < chips.length; i++) chips[i].classList.remove('active');
  chip.classList.add('active');
  setTotal(parseInt(chip.dataset.min, 10) * 60 * 1000);
});

function showTimer(){
  if(timerEl.hidden){
    timerEl.hidden = false;
    timerEl.classList.add('show');
  }
  setTotal(totalMs);   // 다시 추첨하면 타이머도 처음 상태로
}

/* ===== 알람음 (외부 파일 없이 WebAudio로) ===== */
var audioCtx = null;
function beep(at, freq){
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, at);
  gain.gain.linearRampToValueAtTime(0.35, at + 0.02);
  gain.gain.linearRampToValueAtTime(0, at + 0.28);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(at); osc.stop(at + 0.3);
}
function ringOnce(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var t = audioCtx.currentTime;
    beep(t, 880); beep(t + 0.35, 880); beep(t + 0.7, 1046);
  }catch(err){ /* 소리를 못 내도 화면 깜빡임으로 알 수 있다 */ }
}
function playAlarm(){
  stopAlarm();
  ringOnce();
  var count = 0;
  alarmTimer = setInterval(function(){
    count++;
    if(count >= 5){ stopAlarm(); return; }
    ringOnce();
  }, 1300);
}
function stopAlarm(){
  if(alarmTimer){ clearInterval(alarmTimer); alarmTimer = null; }
}

/* 스페이스/엔터: 타이머가 떠 있으면 시작·정지, 아니면 추첨 */
document.addEventListener('keydown', function(e){
  if(e.code !== 'Space' && e.code !== 'Enter') return;
  if(e.target.tagName === 'BUTTON') e.target.blur();
  e.preventDefault();
  if(timerEl.hidden) draw();
  else if(running) pauseTimer();
  else { stopAlarm(); startTimer(); }
});

paint();
</script>
</body>
</html>
