<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>중3 사회 수행평가 문제 추첨</title>
<meta name="theme-color" content="#FF6B3D">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
/* 공통 스크롤바: 화살표 없이 얇고 잘 보이지 않는 연한 회색 바(shared/theme.css와 같은 규칙).
   표준 속성(scrollbar-width/color)을 함께 걸면 Chrome 121+가 webkit 규칙을 무시하므로 표준 속성은 Firefox에만 건다. */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent;margin:10px}
html::-webkit-scrollbar-track,body::-webkit-scrollbar-track{margin:0}
*::-webkit-scrollbar-button{display:none;width:0;height:0}
*::-webkit-scrollbar-thumb{background:rgba(128,128,128,.2);border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.38)}
*::-webkit-scrollbar-corner{background:transparent}
@supports (-moz-appearance:none){*{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.22) transparent}}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --hairline-soft:#ECEAE4;
  --ink-deep:#0A1317;--charcoal:#4A5568;--slate:#6B7280;
  --primary:#FF6B3D;--primary-deep:#E24E1B;--primary-l:rgba(255,107,61,0.14);
  --shadow:rgba(20,22,26,0.10) 0px 1px 4px 0px;
  --shadow-hover:rgba(20,22,26,0.16) 0px 10px 24px 0px;
}
html{background:linear-gradient(160deg,#FFF1EB 0%,#F4F3EE 50%,#EEF1F5 100%);min-height:100%}
html,body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;color:var(--ink-deep);-webkit-font-smoothing:antialiased}
body{background:transparent;overflow-x:hidden}
body::before{content:'';position:fixed;top:-160px;right:-120px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,61,0.28) 0%,rgba(255,107,61,0) 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-140px;left:-100px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(39,56,79,0.16) 0%,rgba(39,56,79,0) 70%);pointer-events:none;z-index:0}

.page{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 24px 32px;
  display:flex;flex-direction:column;align-items:center;min-height:100vh}

h1{font-family:'Paperlogy',sans-serif;font-weight:700;font-size:34px;letter-spacing:.2px;line-height:1.25;text-align:center}
h1 span{color:var(--primary-deep)}

/* ===== 문제 번호 카드 (항상 한 줄) ===== */
.card{
  width:100%;margin-top:20px;background:rgba(255,255,255,.82);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--hairline-soft);border-radius:32px;
  box-shadow:var(--shadow);padding:26px 24px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.card.pop{animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{0%{transform:scale(.95);opacity:.6}60%{transform:scale(1.015)}100%{transform:scale(1);opacity:1}}
.card-label{font-size:16px;font-weight:700;letter-spacing:4px;color:var(--primary-deep)}
.q-row{display:flex;flex-wrap:nowrap;gap:clamp(12px,2.4vw,28px);justify-content:center;width:100%}
.q{
  flex:0 0 auto;width:clamp(96px,15vw,168px);aspect-ratio:1/1;border-radius:clamp(26px,4vw,44px);
  display:flex;align-items:center;justify-content:center;
  font-family:'Paperlogy',sans-serif;font-weight:900;font-size:clamp(56px,9vw,100px);color:#fff;line-height:1;
  background:linear-gradient(135deg,rgba(255,107,61,.95),rgba(226,78,27,.96));
  box-shadow:0 12px 30px rgba(226,78,27,.24);
  font-variant-numeric:tabular-nums;
}
.card.idle .q,.card.rolling .q{background:#E6E4DE;color:#B6B4AE;box-shadow:none}

/* ===== 버튼 ===== */
.btn{
  border:none;cursor:pointer;font-family:'Paperlogy',sans-serif;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,rgba(255,107,61,.95),rgba(226,78,27,.96));color:#fff;
  box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.btn:active{transform:translateY(0) scale(.99)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:var(--shadow)}
.btn-draw{margin-top:20px;width:100%;max-width:420px;font-size:25px;padding:18px 26px;border-radius:999px}

/* ===== 타이머 ===== */
.timer{
  width:100%;margin-top:22px;background:rgba(255,255,255,.82);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--hairline-soft);border-radius:32px;
  box-shadow:var(--shadow);padding:26px 24px 28px;
  display:flex;flex-direction:column;align-items:center;gap:18px;
}
.timer[hidden]{display:none}
.timer.show{animation:rise .45s cubic-bezier(.2,1,.4,1)}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
.timer.done{animation:flash 1s ease-in-out 6}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 6px var(--primary-l),0 12px 34px rgba(226,78,27,.28)}}

/* 시 : 분 : 초 */
.clock{display:flex;align-items:flex-start;justify-content:center;gap:clamp(6px,1.4vw,16px)}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:clamp(78px,11vw,124px)}
.unit .num{
  font-family:'Paperlogy',sans-serif;font-weight:900;font-size:clamp(54px,9vw,104px);line-height:1;
  color:var(--ink-deep);font-variant-numeric:tabular-nums;letter-spacing:-1px;
}
.unit .cap{font-size:14px;font-weight:700;color:var(--slate);letter-spacing:3px}
.colon{
  font-family:'Paperlogy',sans-serif;font-weight:900;font-size:clamp(40px,6.6vw,76px);line-height:1.15;
  color:#D8D5CE;
}
.timer.running .colon{animation:blink 1s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.timer.done .unit .num{color:var(--primary-deep)}

.bar{width:100%;max-width:620px;height:10px;border-radius:999px;background:#EDEBE5;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:999px;
  background:linear-gradient(90deg,#FF6B3D,#E24E1B);transition:width .2s linear}

.state{font-size:15px;font-weight:700;color:var(--slate);letter-spacing:1px}
.timer.done .state{color:var(--primary-deep)}

.presets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{
  border:1px solid var(--hairline-soft);background:rgba(255,255,255,.75);
  font-family:'Pretendard',sans-serif;font-size:18px;font-weight:700;color:var(--charcoal);
  padding:12px 24px;border-radius:999px;cursor:pointer;transition:all .15s ease;
}
.chip:hover{border-color:rgba(255,107,61,.5);color:var(--primary-deep);transform:translateY(-1px)}
.chip:active{transform:translateY(0) scale(.97)}

.timer-ctrl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-timer{font-size:20px;padding:14px 36px;border-radius:999px;min-width:146px}
.btn-ghost{background:rgba(255,255,255,.8);color:var(--charcoal);border:1px solid var(--hairline-soft);box-shadow:none}
.btn-ghost:hover{color:var(--primary-deep);border-color:rgba(255,107,61,.5);box-shadow:var(--shadow)}

.foot{margin-top:auto;padding-top:22px;font-size:13px;color:var(--slate);text-align:center}
</style>
</head>
<body>
<div class="page">
  <h1>중3 사회 <span>수행평가</span> 문제 추첨</h1>

  <div class="card idle" id="card">
    <div class="card-label">문제 번호</div>
    <div class="q-row" id="qRow">
      <div class="q">?</div><div class="q">?</div><div class="q">?</div><div class="q">?</div>
    </div>
  </div>

  <button class="btn btn-draw" id="drawBtn">추첨하기</button>

  <!-- 타이머: 추첨이 끝나면 나타난다 -->
  <section class="timer" id="timer" hidden>
    <div class="clock">
      <div class="unit"><div class="num" id="hh">00</div><div class="cap">시</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="mm">00</div><div class="cap">분</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="num" id="ss">00</div><div class="cap">초</div></div>
    </div>

    <div class="bar"><i id="barFill"></i></div>
    <div class="state" id="timeState">시간을 더해 주세요</div>

    <div class="presets" id="presets">
      <button class="chip" data-min="1">+1분</button>
      <button class="chip" data-min="5">+5분</button>
      <button class="chip" data-min="10">+10분</button>
      <button class="chip" data-min="30">+30분</button>
    </div>

    <div class="timer-ctrl">
      <button class="btn btn-timer" id="startBtn" disabled>시작</button>
      <button class="btn btn-timer btn-ghost" id="resetBtn">초기화</button>
    </div>
  </section>

  <div class="foot">Dive into HISTORY</div>
</div>

<script>
/* ===== 조합표 (조합 1~8 → 문제 번호 4개) ===== */
var COMBOS = [
  [1,2,6,7],[1,2,6,8],
  [1,4,5,7],[1,4,5,8],
  [2,3,6,7],[2,3,6,8],
  [3,4,5,7],[3,4,5,8]
];

var card = document.getElementById('card');
var qRow = document.getElementById('qRow');
var btn  = document.getElementById('drawBtn');
var timerEl = document.getElementById('timer');
var rolling = false;

function render(idx){
  qRow.innerHTML = COMBOS[idx].map(function(n){ return '<div class="q">' + n + '</div>'; }).join('');
}

function draw(){
  if(rolling) return;
  rolling = true;
  btn.disabled = true;
  card.classList.remove('idle', 'pop');
  card.classList.add('rolling');

  var target = Math.floor(Math.random() * COMBOS.length);
  var start = Date.now();
  var DURATION = 1100;

  (function spin(){
    var t = Date.now() - start;
    if(t < DURATION){
      render(Math.floor(Math.random() * COMBOS.length));
      setTimeout(spin, 45 + 170 * Math.pow(t / DURATION, 3));   // 뒤로 갈수록 느려지게
    }else{
      card.classList.remove('rolling');
      render(target);
      void card.offsetWidth;
      card.classList.add('pop');
      btn.textContent = '다시 추첨';
      btn.disabled = false;
      rolling = false;
      showTimer();
    }
  })();
}
btn.addEventListener('click', draw);

/* ===== 타이머: 프리셋을 누를 때마다 시간이 더해진다 ===== */
var hhEl = document.getElementById('hh');
var mmEl = document.getElementById('mm');
var ssEl = document.getElementById('ss');
var barFill   = document.getElementById('barFill');
var timeState = document.getElementById('timeState');
var startBtn  = document.getElementById('startBtn');
var resetBtn  = document.getElementById('resetBtn');
var presets   = document.getElementById('presets');

var totalMs = 0;      // 설정한 전체 시간
var remainMs = 0;     // 남은 시간
var endAt = 0;
var running = false;
var rafId = null;
var alarmTimer = null;

function pad(n){ return (n < 10 ? '0' : '') + n; }

function paint(){
  var s = Math.ceil(Math.max(0, remainMs) / 1000);
  hhEl.textContent = pad(Math.floor(s / 3600));
  mmEl.textContent = pad(Math.floor(s % 3600 / 60));
  ssEl.textContent = pad(s % 60);
  var ratio = totalMs > 0 ? Math.max(0, remainMs) / totalMs : 0;
  barFill.style.width = (ratio * 100) + '%';
  startBtn.disabled = (!running && remainMs <= 0);   // 남은 시간이 없으면 시작할 게 없다
}

function addTime(ms){
  stopAlarm();
  timerEl.classList.remove('done');
  if(running){                       // 진행 중이면 남은 시간에 바로 더한다
    endAt += ms;
    remainMs = endAt - Date.now();
    totalMs += ms;
  }else{
    if(remainMs <= 0){ totalMs = 0; }  // 끝났거나 비어 있으면 새로 쌓는다
    totalMs += ms;
    remainMs += ms;
    startBtn.textContent = (remainMs < totalMs) ? '이어서' : '시작';
    timeState.textContent = '대기 중';
  }
  paint();
}

function clearTime(){
  stopAlarm();
  running = false;
  if(rafId) cancelAnimationFrame(rafId);
  timerEl.classList.remove('done', 'running');
  totalMs = 0;
  remainMs = 0;
  startBtn.textContent = '시작';
  timeState.textContent = '시간을 더해 주세요';
  paint();
}

function tick(){
  remainMs = endAt - Date.now();
  if(remainMs <= 0){
    remainMs = 0;
    running = false;
    timerEl.classList.remove('running');
    paint();
    finish();
    return;
  }
  paint();
  rafId = requestAnimationFrame(tick);
}

function startTimer(){
  if(remainMs <= 0) return;
  running = true;
  timerEl.classList.remove('done');
  timerEl.classList.add('running');
  endAt = Date.now() + remainMs;
  startBtn.textContent = '일시정지';
  timeState.textContent = '진행 중';
  rafId = requestAnimationFrame(tick);
}

function pauseTimer(){
  running = false;
  if(rafId) cancelAnimationFrame(rafId);
  timerEl.classList.remove('running');
  remainMs = Math.max(0, endAt - Date.now());
  startBtn.textContent = '이어서';
  timeState.textContent = '일시정지';
  paint();
}

function finish(){
  startBtn.textContent = '시작';
  timeState.textContent = '시간 종료';
  timerEl.classList.add('done');
  playAlarm();
}

startBtn.addEventListener('click', function(){
  if(running) pauseTimer();
  else { stopAlarm(); startTimer(); }
});
resetBtn.addEventListener('click', clearTime);

presets.addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if(!chip) return;
  addTime(parseInt(chip.dataset.min, 10) * 60 * 1000);
});

function showTimer(){
  if(timerEl.hidden){
    timerEl.hidden = false;
    timerEl.classList.add('show');
  }
  clearTime();   // 다시 추첨하면 타이머도 처음 상태로
}

/* ===== 알람음 (외부 파일 없이 WebAudio로) ===== */
var audioCtx = null;
function beep(at, freq){
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, at);
  gain.gain.linearRampToValueAtTime(0.35, at + 0.02);
  gain.gain.linearRampToValueAtTime(0, at + 0.28);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(at); osc.stop(at + 0.3);
}
function ringOnce(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var t = audioCtx.currentTime;
    beep(t, 880); beep(t + 0.35, 880); beep(t + 0.7, 1046);
  }catch(err){ /* 소리를 못 내도 화면 깜빡임으로 알 수 있다 */ }
}
function playAlarm(){
  stopAlarm();
  ringOnce();
  var count = 0;
  alarmTimer = setInterval(function(){
    count++;
    if(count >= 5){ stopAlarm(); return; }
    ringOnce();
  }, 1300);
}
function stopAlarm(){
  if(alarmTimer){ clearInterval(alarmTimer); alarmTimer = null; }
}

/* 스페이스/엔터: 타이머가 뜨기 전엔 추첨, 뜬 뒤엔 타이머 시작·정지 */
document.addEventListener('keydown', function(e){
  if(e.code !== 'Space' && e.code !== 'Enter') return;
  if(e.target.tagName === 'BUTTON') e.target.blur();
  e.preventDefault();
  if(timerEl.hidden) draw();
  else if(running) pauseTimer();
  else if(remainMs > 0){ stopAlarm(); startTimer(); }
});

paint();
</script>
</body>
</html>
